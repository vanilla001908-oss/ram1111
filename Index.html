elist who won the Nobel Prize in Literature in 2017.","o":["Britain-Japan","British-Japan","British-Japanese","Britain-Japanese"],"a":3,"e":"โจทย์ข้อนี้เป็นการทดสอบหลักไวยากรณ์เรื่องการใช้คำคุณศัพท์บอกสัญชาติ (Proper Adjectives) เพื่อทำ หน้าที่ขยายคำนามหลักด้านหลังคือคำว่า \"novelist\" (นักเขียนนวนิยาย) Britain (ประเทศอังกฤษ) และ Japan (ประเทศญี่ปุ่น) เป็นคำนามบอกชื่อประเทศ (Proper Nouns) ไม่สามารถ นำมาวางหน้าคำนามอื่นเพื่อบอกสัญชาติโดยตรงในลักษณะนี้ได้ British (ชาวอังกฤษ/สัญชาติอังกฤษ) และ Japanese (ชาวญี่ปุ่น/สัญชาติญี่ปุ่น) เป็นคำคุณศัพท์บอกสัญชาติ (Proper Adjectives) ที่ถูกต้องตามหลักไวยากรณ์ เมื่อต้องการอธิบายลักษณะของบุคคลที่มีความเกี่ยวพันหรือถือสองสัญชาติคู่กันในฐานะคำขยายนาม จึงต้องใช้ รูปคำคุณศัพท์ประสมที่เป็นสัญชาติทั้งคู่เชื่อมกันด้วยเครื่องหมายยติภังค์ (Hyphen) เป็น British-Japanese โจทย์ : Kazuo Ishiguro is a British-Japanese novelist who won the Nobel Prize in Literature in 2017. (คาซู โอะ อิชิงูโระ เป็นนักเขียนนวนิยายชาวอังกฤษเชื้อสายญี่ปุ่นผู้ซึ่งชนะรางวัลโนเบลสาขาวรรณกรรมในปี 2017) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Britain-Japan ผิดเนื่องจากเป็นชื่อประเทศทั้งคู่ ไม่ใช่คำคุณศัพท์บอกสัญชาติ (2) British-Japan ผิดเนื่องจากคำว่า Japan เป็นชื่อประเทศ ไม่ใช่สัญชาติ (4) Britain-Japanese ผิดเนื่องจากคำว่า Britain เป็นชื่อประเทศ ไม่ใช่สัญชาติ"},{"n":70,"q":"________ I you, I would like that job offer.","o":["be","were","am","was"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ ประโยคนี้เป็นโครงสร้าง If แบบที่ 2 (Second Conditional) ในรูปลดรูป (Inversion) ซึ่งใช้สำหรับสมมติ เหตุการณ์ที่เป็นไปไม่ได้ หรือขัดแย้งกับความเป็นจริงในปัจจุบันอย่างสิ้นเชิง (ในบริบทนี้คือการสมมติว่า “ถ้าฉันเป็น คุณ” ซึ่งในความจริงไม่มีทางเป็นไปได้) โครงสร้างประโยคเต็มก่อนลดรูปคือ : If I were you, I would take/like that job offer. (ตามกฎไวยากรณ์ภาษาอังกฤษที่เป็นทางการ ในประโยค เงื่อนไขสมมติแบบที่ 2 หากใช้ Verb to be จะต้องใช้ were กับประธานทุกตัว รวมถึง I, He, She, It ด้วย) เมื่อทำการลดรูปโดยการตัดคำว่า If ออก กฎไวยากรณ์กำหนดให้ทำการสลับเอาคำกริยา were มาไว้ข้างหน้า ประธาน จึงได้รูปโครงสร้างที่สมบูรณ์คือ Were I you โครงสร้างการลดรูปแบบที่ 2 : Were + Subject + คำนาม/คุณศัพท์, Subject + would + Verb รูปฐาน โจทย์ : Were I you, I would like that job offer. (ถ้าฉันเป็นคุณ ฉันคงจะรับข้อเสนอทำงานนั้นไปแล้ว) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) be เป็นกริยารูปฐาน ไม่สามารถนำมาวางสลับที่เพื่อทำหน้าที่ในโครงสร้างลดรูปเงื่อนไขลักษณะนี้ได้ (3) am เป็นรูปปัจจุบันทั่วไป (Present Simple) ไม่ใช้ในโครงสร้างสมมติที่ขัดแย้งกับความเป็นจริง (4) was แม้ว่าในภาษาพูดทั่วไป (Informal English) จะมีคนใช้ If I was you อยู่บ้าง แต่ตามหลักไวยากรณ์ ภาษาอังกฤษระดับที่เป็นทางการ (Formal English) ที่ใช้ในห้องสอบ ถือว่าผิดกฎ และไม่สามารถนำมาใช้ในโครงสร้าง กลับหัวลดรูป (Was I you ไม่มีรูปใช้งานในข้อสอบ)"},{"n":71,"q":"I learned about Jane Fonda ______ her work for the community.","o":["through","in order to","so","yet"],"a":1,"e":"ประโยคนี้ต้องการคำเชื่อมเพื่อบอก \"ช่องทางหรือวิธีการ\" ที่ทำให้ผู้พูดได้รู้จักหรือเรียนรู้เกี่ยวกับบุคคลในโจทย์ (Jane Fonda) โดยพิจารณาจากข้อความหลังช่องว่างคือ “her work for the community” (การทำงานเพื่อชุมชนของเธอ) ซึ่งทำหน้าที่เป็น กลุ่มคำนาม (Noun Phrase) ตามหลักไวยากรณ์ภาษาอังกฤษ คำบุพบท (Preposition) ที่แปลว่า \"ผ่านทาง / ด้วย / โดยอาศัย\" และต้อง ตามหลังด้วยคำนามหรือวลีเพื่อบอกช่องทางในการรับรู้ข้อมูล คือคำว่า through โครงสร้าง : Subject + Verb + through + คำนาม/วลี (ช่องทาง/วิธีการ) โจทย์ : I learned about Jane Fonda through her work for the community. (ฉันได้รู้จักเจน ฟอนดา ผ่าน ทางการทำงานเพื่อชุมชนของเธอ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) in order to แปลว่า \"เพื่อที่จะ\" มีกฎบังคับว่าจะต้องตามหลังด้วยคำกริยารูปฐาน (Verb ช่อง 1) เสมอ ไม่ สามารถตามด้วยกลุ่มคำนามในข้อนี้ได้ (3) so แปลว่า \"ดังนั้น\" เป็นคำสันธานเชื่อมประโยคที่เป็นผลลัพธ์ และ (4) yet แปลว่า \"แต่/กระนั้นก็ตาม\" เป็น คำสันธานเชื่อมประโยคที่ขัดแย้งกัน ซึ่งทั้งสองคำนี้ต้องตามหลังด้วยประโยคสมบูรณ์ (Subject + Verb) และความหมาย ไม่เข้ากับบริบทของโจทย์"},{"n":72,"q":"There isn’t _________ time left before the submission deadline.","o":["many","much","few","some"],"a":2,"e":"ประโยคนี้พิจารณาจากประเภทของคำนามหลักที่อยู่ด้านหลังช่องว่างคือคำว่า \"time\" (เวลา) ซึ่งจัดเป็นคำนาม นับไม่ได้ (Uncountable Noun) นอกจากนี้ ประโยคนี้เป็นประโยคปฏิเสธเนื่องจากมีคำว่า “isn’t” (is not) ตามหลักไวยากรณ์ภาษาอังกฤษ คำคุณศัพท์บอกปริมาณ (Quantifier) ที่ใช้ในการบอกจำนวนว่า \"มาก\" สำหรับคำนามนับไม่ได้ในประโยคปฏิเสธหรือ ประโยคคำถาม คือคำว่า much โครงสร้าง : There is not + much + คำนามนับไม่ได้ โจทย์ : There isn’t much time left before the submission deadline. (เหลือเวลาอีกไม่มากแล้วก่อนจะถึง กำหนดการส่งงาน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) many แปลว่า \"มาก\" เช่นกัน แต่มีกฎตายตัวว่าต้องใช้คู่กับคำนามนับได้พหูพจน์เท่านั้น (เช่น many books, many days) ไม่สามารถใช้กับคำว่า time ได้ (3) few แปลว่า \"น้อยมากจนแทบไม่มี\" ใช้คู่กับคำนามนับได้พหูพจน์เท่านั้น และไม่นิยมนำมาใช้วางซ้อนหลัง โครงสร้างปฏิเสธ isn't (4) some แปลว่า \"บ้าง/จำนวนหนึ่ง\" ตามกฎไวยากรณ์จะนิยมใช้ในประโยคบอกเล่าทั่วไป ไม่ใช้ในประโยค ปฏิเสธที่มี not (หากเป็นประโยคปฏิเสธจะต้องเปลี่ยนไปใช้คำว่า any แทน)"},{"n":73,"q":"Had they listened to my advice, they _______ that mistake.","o":["didn’t make","won’t make","couldn’t make","wouldn’t have made"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 70. ประกอบ ประโยคนี้เป็นโครงสร้าง If แบบที่ 3 (Third Conditional) ในรูปลดรูป (Inversion) ซึ่งใช้สำหรับสมมติ เหตุการณ์ที่ตรงข้ามกับความเป็นจริงในอดีต เพื่อแสดงความเสียดายหรือคิดย้อนหลัง วิธีการสังเกตโครงสร้าง : ประโยคส่วน If (ด้านหน้า) : คำว่า “Had they listened...” เป็นโครงสร้างที่ลดรูปมาจากประโยคเต็มคือ “If they had listened...” (โครงสร้าง Past Perfect Tense: had + Verb ช่อง 3) เมื่อทำการลดรูปโดยตัด If ออก จะสลับเอา Had มาวางไว้หน้าประธาน ซึ่งเป็นตัวบ่งชี้ของ If-Clause แบบที่ 3 อย่างชัดเจน ประโยคส่วนผลลัพธ์ (หลัง , ) : ตามกฎไวยากรณ์สากล จะต้องใช้โครงสร้าง would / could / might + have + Verb ช่อง 3 ดังนั้น ตัวเลือก wouldn’t have made (would + have + กริยาช่อง 3 ของ make) จึงถูกต้องตามหลักไวยากรณ์ และสอดคล้องกับบริบทที่สุด โครงสร้าง If แบบที่ 3 (รูปลดรูป) : Had + Subject + Verb ช่อง 3, Subject + would have + Verb ช่อง 3 โจทย์ : Had they listened to my advice, they wouldn’t have made that mistake. (ถ้าตอนนั้นพวกเขาเชื่อ คำแนะนำของฉัน พวกเขาคงจะไม่ทำผิดพลาดแบบนั้นไปแล้ว) (ความเป็นจริงในอดีตคือ พวกเขาไม่เชื่อคำแนะนำ และได้ทำ ผิดพลาดไปแล้ว) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) didn’t make เป็นรูป Past Simple Tense ธรรมดา ไม่สามารถนำมาวางในส่วนของประโยคผลลัพธ์หลักใน โครงสร้างเงื่อนไขแบบที่ 3 ได้ (2) won’t make เป็นโครงสร้างของ If แบบที่ 1 (ใช้กับเหตุการณ์ในอนาคตที่ประโยคส่วน If เป็นกริยาช่อง 1) ซึ่ง ผิดหลักไวยากรณ์ในข้อนี้ (3) couldn’t make แม้จะเป็นรูปปฏิเสธของ can ในอดีต แต่การวางตามด้วยกริยารูปฐาน (make) จะกลายเป็น โครงสร้างของ If แบบที่ 2 (ใช้สมมติเหตุการณ์ในปัจจุบัน) ซึ่งขัดแย้งกับประโยคเงื่อนไขส่วนหน้าที่เป็นเหตุการณ์ ในอดีต"},{"n":74,"q":"Alex bought ________ for his wife on her last birthday.","o":["most the expensive watch","the watch most expensive","watch the most expensive","the most expensive watch"],"a":4,"e":"ประโยคนี้เป็นการเปรียบเทียบขั้นสูงสุด (Superlative Degree) เพื่อต้องการสื่อว่าสิ่งของชิ้นนั้นมีความเป็นที่สุด ในกลุ่ม (ในบริบทนี้คือ นาฬิกาที่แพงที่สุด) โดยมีหลักการจัดวางรูปโครงสร้างไวยากรณ์ตามลำดับดังนี้ 1. การทำคำคุณศัพท์ยาวให้เป็นขั้นสูงสุด : คำคุณศัพท์คือ \"expensive\" (แพง) เป็นคำยาว (มี 3 พยางค์ กฎไวยากรณ์ บังคับว่าการทำเป็นขั้นสูงสุดจะต้องเติมคำว่า the most ไว้ข้างหน้าคำคุณศัพท์เสมอ 2. การเรียงลำดับคำ (Word Order) : ตามหลักภาษาอังกฤษ คำคุณศัพท์ที่ทำหน้าที่ขยายคำนาม จะต้องวางไว้ ข้างหน้าคำนามหลัก เสมอ ดังนั้นคำว่า the most expensive ( Adjective ขั้นสูงสุด) จึงต้องวางไว้หน้าคำว่า watch (คำนามหลัก) โครงสร้าง : the most + คำคุณศัพท์ยาว + คำนามเอกพจน์ โจทย์ : Alex bought the most expensive watch for his wife on her last birthday. (อเล็กซ์ได้ซื้อนาฬิกาเรือนที่ แพงที่สุดให้ภรรยาของเขาเนื่องในวันเกิดปีที่ผ่านมาของเธอ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) most the expensive watch เรียงลำดับคำผิดหลักไวยากรณ์ โดยวางคำว่า the สลับตำแหน่ง (โครงสร้างที่ถูกต้อง คำว่า the ต้องอยู่หน้าสุดเป็น the most...) (2) the watch most expensive และ (3) watch the most expensive ทั้งสองข้อนี้เรียงลำดับคำผิดเนื่องจากนำคำนาม (watch) มาวางไว้ข้างหน้าคำคุณศัพท์ ซึ่งขัดต่อกฎการวางคำขยายในภาษาอังกฤษทั่วไป"},{"n":75,"q":"_______Dan _______ his MBA at UCLA next academic year?","o":["Does; furthered","Will; further","Has; been furthering","Is; furthered"],"a":2,"e":"ในประโยคมีคำบ่งบอกเวลาในอนาคต (Time Expression) คือคำว่า \"next academic year\" (ปีการศึกษาหน้า) ซึ่ง เป็นตัวชี้วัดอย่างชัดเจนว่าเหตุการณ์นี้ยังไม่ได้เกิดขึ้น แต่มีกำหนดการหรือเป็นแผนการที่จะเกิดขึ้นในอนาคต โครงสร้าง ไวยากรณ์ที่ต้องนำมาใช้จึงเป็น Future Simple Tense ในรูปประโยคคำถาม คำว่า further ในบริบทนี้ทำหน้าที่เป็นคำกริยาแท้ (Verb) แปลว่า \"ศึกษาต่อ / ส่งเสริม\" โครงสร้างประโยคคำถาม Future Simple : Will + Subject (Dan) + Verb รูปฐาน/ช่อง 1 ไม่เติมแต่ง (further) + ...? โจทย์ : Will Dan further his MBA at UCLA next academic year? (แดนจะเรียนต่อระดับปริญญาโทบริหารธุรกิจ (MBA) ที่มหาวิทยาลัย UCLA ในปีการศึกษาหน้าไหม) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Does; furthered คำว่า Does ใช้กับเหตุการณ์ปัจจุบัน (Present Simple) และกริยาตัวหลังห้ามเติม -ed เป็นรูปอดีต ขัดแย้งกับคำบอกเวลาอนาคตอย่างสิ้นเชิง (3) Has; been furthering เป็น Present Perfect Continuous Tense ใช้กับเหตุการณ์ที่เกิดขึ้นตั้งแต่อดีตและดำเนิน ต่อเนื่องมาจนถึงปัจจุบัน ไม่สอดคล้องกับข้อความที่ระบุถึงปีการศึกษาหน้า (4) Is; furthered เป็นโครงสร้างที่ไม่ถูกต้องตามหลักไวยากรณ์ หากจะใช้ Is นำหน้าเพื่อบอกอนาคตอันใกล้ (Present Continuous) กริยาตัวหลังจะต้องอยู่ในรูปเติม -ing เป็น Is Dan furthering... ไม่ใช้รูปกริยาช่อง 2/3 (furthered) ในบริบท ประโยคคำถามทั่วไปลักษณะนี้"},{"n":76,"q":"The company hired these ________ professionals.","o":["three talented young American","talented three young American","young talented three American","American three young talented"],"a":1,"e":"โจทย์ข้อนี้ทดสอบกฎ การเรียงลำดับคำคุณศัพท์ (Order of Adjectives) เมื่อมีคำคุณศัพท์หลายคำมาขยาย คำนามหลักคำเดียวกันคือคำว่า \"professionals\" (ผู้เชี่ยวชาญ) ตามหลักไวยากรณ์ภาษาอังกฤษที่เป็นทางการ มีกฎการ เรียงลำดับจากหน้าไปหลังดังนี้ : 1. Number (จำนวน) : three 2. Opinion (ความคิดเห็น) : talented (มีความสามารถ) 3. Age (อายุ) : young (คนหนุ่มสาว) 4. Origin (แหล่งกำเนด/สัญชาติ) : American เมื่อเรียงลำดับตามสูตรสากล จึงได้ข้อความที่ถูกต้องคือ three talented young American professionals ซึ่งตรงกับ ตัวเลือกข้อ 1 โจทย์ : The company hired these three talented young American professionals. (บริษัทได้ว่าจ้าง ผู้เชี่ยวชาญชาวอเมริกันรุ่นใหม่ที่มีความสามารถทั้งสามคนนี้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2), (3) และ (4) ผิดหลักการเรียงลำดับคำ (Word Order Error) เนื่องจากนำคำบอกจำนวน (three) หรือคำบอก สัญชาติ (American) ไปวางสลับตำแหน่ง ซึ่งไม่เป็นไปตามมาตรฐานการเรียงลำดับคุณศัพท์ในภาษาอังกฤษ"},{"n":77,"q":"A : I love the night air after it rains. B : Really? _______________.","o":["You like it, don’t you?","How is the night air?","When does it rain?","Why is that?"],"a":4,"e":"โจทย์ข้อนี้เป็นพาร์ทบทสนทนาในชีวิตประจำวัน (Conversation) โดยต้องพิจารณาความสัมพันธ์ของประโยค โต้ตอบเพื่อให้บริบทมีความลื่นไหลและสมเหตุสมผลที่สุด ผู้พูด A : กล่าวแสดงทัศนคติหรือความชอบส่วนตัวว่า \"I love the night air after it rains.\" (ฉันชอบอากาศ ตอนกลางคืนหลังจากฝนตกมาก) ผู้พูด B : ตอบรับด้วยคำอุทานแสดงความประหลาดใจหรือสนใจว่า \"Really?\" (จริงเหรอ?) และต้องการ ถามข้อมูลต่อเพื่อทราบเหตุผลเบื้องหลังความชอบนั้น คำปุจฉาสรรพนามหรือประโยคคำถามย่อที่ใช้เพื่อถามหา \"เหตุผล\" (ย่อมาจากประโยคเต็มว่า Why do you love the night air after it rains?) ที่สุภาพและเป็นธรรมชาติที่สุดในชีวิตประจำวันคือ Why is that? (ทำไมถึงเป็นเช่นนั้นหรือ?) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) You like it, don’t you? เป็นประโยค Question Tag ที่มีลักษณะเป็นการพูดคุยคาดคั้นหรือถามเองตอบเอง ซึ่ง ไม่สอดคล้องกับคำอุทานนำหน้าอย่าง Really? ที่แสดงความประหลาดใจและต้องการคำตอบอธิบายเพิ่ม (2) How is the night air? แปลว่า \"อากาศตอนกลางคืนเป็นอย่างไรบ้าง?\" ซึ่งผิดบริบทเนื่องจากผู้พูด A เพิ่งเจาะจง ไปว่าชอบอากาศหลังฝนตก การถามว่าอากาศเป็นอย่างไรจึงเป็นคำถามที่ซ ้าซ้อน (3) When does it rain? แปลว่า \"ฝนตกเมื่อไหร่?\" ซึ่งขัดแย้งกับสิ่งที่เป็นนามธรรมเกี่ยวกับความชอบของคู่ สนทนา และไม่ใช่ประเด็นหลักที่ผู้พูด B จะสนใจถามหลังจากอีกฝ่ายบอกว่าชอบบรรยากาศดังกล่าว"},{"n":78,"q":"A : ____________________. B : This semester I’m very happy about that.","o":["What are you doing?","You’ve taken six courses?","When are you graduating?","Are you studying quantum technology?"],"a":4,"e":"โจทย์ข้อนี้เป็นพาร์ทบทสนทนาในชีวิตประจำวัน (Conversation) โดยต้องพิจารณาความสัมพันธ์ของข้อความ โต้ตอบที่มีความสอดคล้องเชิงความหมายและบริบทไวยากรณ์มากที่สุด ผู้พูด B : กล่าวให้ข้อมูลว่า \"This semester I’m very happy about that.\" (ภาคเรียนนี้ฉันมีความสุขกับเรื่อง นั้นมาก) คำว่า \"that\" ในประโยคคำตอบทำหน้าที่เป็นคำสรรพนามเอกพจน์ชี้เฉพาะ เพื่อใช้อ้างอิงย้อนกลับไปถึงหัวข้อ หรือประเด็นที่เป็นเอกพจน์ซึ่งผู้พูด A เพิ่งกล่าวถึงในประโยคก่อนหน้าทันที เมื่อพิจารณาจากบริบทคำว่า This semester (ภาคเรียนนี้) : จะพบว่ามีความเชื่อมโยงโดยตรงกับเรื่องการเรียน ในสถาบันการศึกษา ตัวเลือกข้อ 4 ซึ่งระบุว่า \"Are you studying quantum technology?\" (คุณกำลังเรียนเทคโนโลยีควอนตัมอยู่ หรือเปล่า?) จึงสอดคล้องที่สุด เพราะเป็นการถามถึงรายวิชาหรือศาสตร์เฉพาะทางที่เป็นรูปเอกพจน์ ทำให้การอ้างอิง ของคำว่า that มีความชัดเจนและสมบูรณ์ตามหลักไวยากรณ์ เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) What are you doing? แปลว่า \"คุณกำลังทำอะไรอยู่?\" เป็นคำถามที่เจาะจงถึงการกระทำ ณ ปัจจุบันขณะ ไม่ สัมพันธ์กับคำตอบที่ระบุความรู้สึกเกี่ยวกับภาพรวมของภาคเรียน (This semester) (2) You’ve taken six courses? แปลว่า \"คุณลงทะเบียนเรียนไปถึงหกวิชาเลยหรือ?\" แม้จะเป็นเรื่องการเรียน แต่ เนื้อหามุ่งเน้นไปที่ปริมาณวิชาซึ่งเป็นพหูพจน์ (six courses) หากใช้ข้อนี้ คำสรรพนามในคำตอบของ B จะต้องเปลี่ยน จาก that เป็น those หรือ them จึงจะถูกต้องตามหลักไวยากรณ์ชี้เฉพาะ ตัวเลือกนี้จึงไม่สอดคล้องกับข้อสอบระดับที่เป็น ทางการ (3) When are you graduating? แปลว่า \"คุณจะเรียนจบเมื่อไหร่?\" ซึ่งข้อความในคำตอบของ B ที่ระบุว่ามี ความสุขเกี่ยวกับเรื่องนั้นในภาคเรียนนี้ ดูไม่สมเหตุสมผลและเป็นการตอบที่ผิดประเด็นกับการตอบรับเวลาการสำเร็จ การศึกษา"},{"n":79,"q":"A : I’m calling to ask if you want to hang out tomorrow. B : Sure, ___________?","o":["what do you want to do","are you sure","that sounds great to me","do you want it"],"a":1,"e":"โจทย์ข้อนี้เป็นพาร์ทบทสนทนาในชีวิตประจำวัน (Conversation) โดยต้องพิจารณาความสัมพันธ์ของข้อความ โต้ตอบที่มีความสอดคล้องเชิงความหมายและบริบทมากที่สุด : ผู้พูด A : กล่าวระบุวัตถุประสงค์ในการโทรศัพท์มาชวนไปเที่ยวพักผ่อนในวันพรุ่งนี้ว่า \"I’m calling to ask if you want to hang out tomorrow.\" (ฉันโทรมาถามว่าพรุ่งนี้คุณอยากออกไปเที่ยวข้างนอกด้วยกันไหม) ผู้พูด B : ตอบตกลงในทันทีด้วยคำว่า \"Sure,...\" (ได้สิ / แน่นอนอยู่แล้ว) จากนั้นจึงต้องใช้ประโยคคำถาม เพื่อสอบถามรายละเอียดหรือแผนการต่อเนื่องเกี่ยวกับการไปเที่ยวชวนกันในครั้งนี้ ตัวเลือกข้อ 1 ซึ่งระบุว่า \"what do you want to do\" (คุณอยากทำอะไรล่ะ?) จึงสอดคล้องและเป็นธรรมชาติ ที่สุดในบริบทนี้ เพื่อให้อีกฝ่ายได้เสนอแนวคิดหรือกิจกรรมที่จะทำร่วมกันในวันพรุ่งนี้ เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) are you sure แปลว่า \"คุณแน่ใจหรือเปล่า?\" ซึ่งขัดแย้งกับคำตอบรับคำชวนด้วยความเต็มใจคำว่า Sure ของ ตนเองข้างหน้า และไม่มีเหตุผลที่จะต้องถามย ้าความแน่ใจในลักษณะนี้ (3) that sounds great to me แปลว่า \"ฟังดูยอดเยี่ยมมากสำหรับฉันเลย\" แม้ความหมายจะเข้ากับการตอบรับคำ ชวน แต่โครงสร้างประโยคมีเครื่องหมายคำถาม (?) ล็อกไว้ท้ายช่องว่างอย่างชัดเจน ตัวเลือกนี้ที่เป็นประโยคบอกเล่าจึง ผิดหลักไวยากรณ์และรูปประโยค (4) do you want it แปลว่า \"คุณต้องการมันไหม?\" ซึ่งคำว่า it ในประโยคไม่มีคำนามเอกพจน์ใดๆ ข้างหน้าให้ อ้างอิงถึง และความหมายไม่สอดคล้องกับการวางแผนไปเที่ยวร่วมกัน"},{"n":80,"q":"A : ___________________. B : No, not yet.","o":["Let’s eat out tonight, shall we?","Can we go to the party tonight?","Hasn’t Bob got back from work?","What type of food do you like?"],"a":3,"e":"โจทย์ข้อนี้เป็นพาร์ทบทสนทนาในชีวิตประจำวัน (Conversation) โดยต้องพิจารณาความสัมพันธ์ของข้อความ โต้ตอบที่มีความสอดคล้องเชิงความหมายและบริบทไวยากรณ์มากที่สุด ผู้พูด B : ตอบปฏิเสธด้วยสำนวนว่า \"No, not yet.\" (ยังเลย / ยังไม่ถึงเวลา) ซึ่งคำว่า \"not yet\" มีกฎเกณฑ์ ทางภาษาที่ตายตัว คือจะใช้ตอบรับเฉพาะประโยคคำถามที่ถามถึงเหตุการณ์ที่คาดว่าจะเกิดขึ้นหรือเสร็จสิ้นแล้ว ณ ช่วงเวลานั้น (มักใช้คู่กับโครงสร้าง Present Perfect Tense หรือคำถามชวนเช็กความคืบหน้า) ตัวเลือกข้อ 3 ซึ่งระบุว่า \"Hasn’t Bob got back from work?\" (บ็อบยังไม่กลับมาจากทำงานอีกหรือ?) ซึ่งเป็น ประโยคคำถาม Present Perfect Tense ในรูปปฏิเสธ จึงสอดคล้องที่สุด เนื่องจากผู้พูด B สามารถตอบรับการคาดเดานั้น ได้ทันทีว่า \"ยังเลย (บ็อบยังมาไม่ถึง)\" เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Let’s eat out tonight, shall we? เป็นประโยคชักชวน (Suggestion) สื่อความหมายว่า \"คืนนี้พวกเราออกไปกิน ข้าวข้างนอกกันเถอะ ดีไหม?\" หากปฏิเสธจะไม่ใช้สำนวน not yet แต่จะใช้ประโยคแสดงการปฏิเสธหรือบอกเหตุผลอื่น แทน เช่น I'm afraid I can't. (2) Can we go to the party tonight? เป็นประโยคขออนุญาตหรือถามความเป็นไปได้ สื่อความหมายว่า \"คืนนี้พวก เราไปงานปาร์ตี้ได้ไหม?\" คำตอบรับควรเป็น Yes หรือ No ในเชิงการอนุญาต ไม่สัมพันธ์กับคำว่า not yet ที่ใช้บอกเรื่อง เวลาหรือความคืบหน้า (4) What type of food do you like? เป็นประโยคคำถามแบบ Wh-Question เพื่อถามข้อมูลเฉพาะเจาะจงเกี่ยวกับ ประเภทอาหารที่ชอบ การตอบรับจึงต้องระบุชื่อหรือประเภทของอาหาร ไม่สามารถตอบด้วย Yes/No หรือสำนวน not yet ได้"},{"n":81,"q":"One _______ in the classroom is that students must put their phones away during lessons.","o":["rule","goal","drawback","stress"],"a":1,"e":"rule (กฎ/ข้อบังคับ) จากบริบทของประโยคกล่าวถึงข้อปฏิบัติในห้องเรียนที่ระบุว่า \"นักเรียนจะต้องเก็บ โทรศัพท์มือถือในระหว่างการเรียน\" ซึ่งตามหลักภาษาอังกฤษและโครงสร้างประโยค สิ่งที่เป็นข้อกำหนดหรือข้อบังคับ ที่ต้องปฏิบัติตามจะใช้คำศัพท์ว่า \"rule\" ส่วนตัวเลือกอื่น เช่น goal (เป้าหมาย) drawback (ข้อเสีย) และ stress (ความเครียด) ไม่สอดคล้องกับพฤติกรรม บังคับที่ระบุไว้ในประโยคข้างต้น"},{"n":82,"q":"A tropical _________ brought heavy rain.","o":["lightning","antenna","shelter","depression"],"a":4,"e":"depression (พายุดีเปรสชัน) จาก \"tropical depression\" เป็นศัพท์เฉพาะทางอุตุนิยมวิทยา หมายถึง พายุหมุนเขต ร้อนที่มีความเร็วลมต ่า ซึ่งสอดคล้องกับประโยคที่ระบุว่าพายุนี้ได้นำพาฝนตกหนักมา (heavy rain) ส่วนตัวเลือกอื่น ได้แก่ lightning (ฟ้าผ่า) antenna (เสาอากาศ) และ shelter (ที่อยู่อาศัย/ที่หลบภัย) ไม่สามารถจับคู่ กับคำว่า tropical เพื่อสร้างความหมายที่เชื่อมโยงกับการเกิดฝนตกหนักในบริบทนี้ได้"},{"n":83,"q":"The view from the hilltop was simply _________.","o":["energetic","howling","heavenly","ordinary"],"a":3,"e":"heavenly (งดงามราวกับสวรรค์/วิเศษสุด) จากบริบทของประโยคกล่าวถึง \"ทัศนียภาพจากยอดเขา\" (The view from the hilltop) ซึ่งเป็นการพรรณนาความสวยงามของธรรมชาติ คำคุณศัพท์ว่า \"heavenly\" จึงเหมาะสมที่สุดในการสื่อ ความหมายขยายความคำว่า \"simply\" เพื่ออุทานถึงความงดงามตระการตา ส่วนตัวเลือกอื่น ได้แก่ energetic (กระปรี้กระเปร่า) howling (เห่าหอน/ส่งเสียงหวีดหวิว) และ ordinary (ธรรมดา ทั่วไป) ไม่สอดคล้องกับบริบทการชื่นชมทัศนียภาพในลักษณะนี้"},{"n":84,"q":"Many animal species are ________ because of habitat destruction.","o":["disappearing","exhausting","limited","jam-packed"],"a":1,"e":"disappearing (กำลังสูญหายไป/กำลังลดจำนวนลง) จากบริบทประโยคระบุว่า \"สัตว์หลายสายพันธุ์กำลัง... เนื่องจากการทำลายถิ่นที่อยู่อาศัย (habitat destruction)\" ซึ่งเป็นเหตุเป็นผลโดยตรงกับการลดลงหรือสูญหายไปของ สิ่งมีชีวิตตามหลักวิทยาศาสตร์และคลังคำศัพท์ภาษาอังกฤษ ส่วนตัวเลือกอื่น ได้แก่ exhausting (หมดแรง/ใช้จนหมด) limited (ถูกจำกัด) และ jam-packed (อัดแน่นจนเต็ม) ไม่สามารถอธิบายสภาวะผลกระทบโดยตรงที่เกิดจากการถูกทำลายแหล่งที่อยู่ได้เหมาะสมเท่ากับคำที่สื่อถึงการทยอย สูญหายไป"},{"n":85,"q":"The hikers built a temporary ___________ to protect themselves from the rain.","o":["dinner","ceremony","exposure","shelter"],"a":4,"e":"shelter (ที่พักชั่วคราว/ที่หลบภัย) จากประโยคกล่าวถึง \"นักเดินป่าได้สร้าง...ชั่วคราว เพื่อปกป้องตัวเองจากฝน\" ซึ่งตามหลักความหมายและการใช้งาน คำศัพท์ที่สื่อถึงสิ่งปลูกสร้างสำหรับกำบังแดดฝนได้ถูกต้องและตรงบริบทที่สุด คือ \"shelter\" ส่วนตัวเลือกอื่น ได้แก่ dinner (อาหารเย็น) ceremony (พิธีการ) และ exposure (การสัมผัส/การเปิดรับ) ไม่ สอดคล้องกับพฤติกรรมการสร้างสิ่งกำบังเพื่อป้องกันสภาพอากาศตามที่ระบุไว้ในประโยค"},{"n":86,"q":"A flash of _________ lit up the night sky during the storm.","o":["rain","lightning","wind","thunder"],"a":2,"e":"lightning (สายฟ้า/แสงฟ้าผ่า) จากโจทย์ระบุบริบทถึง \"แสงวูบวาบของ...ได้ส่องสว่างทั่วท้องฟ้ายามค ่าคืน ระหว่างเกิดพายุ\" ตามหลักคลังคำศัพท์ภาษาอังกฤษ คำว่า \"a flash of\" มักใช้คู่กับ \"lightning\" เพื่อสื่อถึงแสงฟ้าแลบหรือ ฟ้าผ่าที่มองเห็นได้อย่างชัดเจน ส่วนตัวเลือกอื่น ได้แก่ rain (ฝน) wind (ลม) และ thunder (เสียงฟ้าร้อง) เป็นปรากฏการณ์ธรรมชาติที่ไม่สามารถ ส่องแสงสว่างในลักษณะของแฟลชหรือแสงวูบวาบตามที่ประโยคระบุไว้ได้"},{"n":87,"q":"It was ________ of her to climb the highest mountain without professional training.","o":["stuck","daring","athletic","charming"],"a":2,"e":"daring (กล้าหาญ/บ้าบิ่น) เนื่องจากประโยคระบุถึงพฤติกรรมการปีนเขาที่สูงที่สุดโดยปราศจากการฝึกฝนแบบ มืออาชีพ (without professional training) ซึ่งถือเป็นการกระทำที่เสี่ยงอันตรายและต้องใช้ความกล้าเป็นอย่างมาก คำคุณศัพท์ \"daring\" จึงตรงบริบทที่สุด ส่วนตัวเลือกอื่น ได้แก่ stuck (ติดอยู่) athletic (มีร่างกายแข็งแรงเหมือนนักกีฬา) และ charming (มีเสน่ห์) ไม่ สามารถอธิบายคุณลักษณะของพฤติกรรมเสี่ยงภัยในประโยคนี้ได้อย่างสมเหตุสมผลตามหลักการแปลความหมาย"},{"n":88,"q":"The car was ________ in the mud after the heavy rain.","o":["established","proved","stuck","performed"],"a":3,"e":"stuck (ติดอยู่/ติดหล่ม) จากโครงสร้างประโยคเป็น Passive Voice (was + V.3) และบริบทระบุว่า \"รถยนต์ได้... อยู่ในโคลนหลังจากฝนตกหนัก\" ซึ่งตามหลักการสื่อสารและการใช้คำศัพท์ คำว่า \"stuck\" เป็นกริยาช่องที่ 3 ของ stick เมื่อใช้ในโครงสร้างนี้จะหมายถึงสภาวะที่รถติดหล่มจนไม่สามารถเคลื่อนที่ได้ ส่วนตัวเลือกอื่น ได้แก่ established (ก่อตั้ง) proved (พิสูจน์แล้ว) และ performed (แสดง/ปฏิบัติ) ไม่มีความหมาย ที่สอดคล้องกับสถานการณ์ติดอยู่ในโคลน"},{"n":89,"q":"The new product will ________ next month and be available at all major stores.","o":["disappear","hit the streets","bother","look after"],"a":2,"e":"hit the streets (ออกวางจำหน่าย/เริ่มวางขาย) จาก \"hit the streets\" เป็นสำนวนภาษาอังกฤษ (Idiom) ที่มี ความหมายว่า สินค้าเริ่มออกวางตลาดหรือกระจายไปตามท้องถนนเพื่อจำหน่าย ซึ่งสอดคล้องกับบริบทประโยคที่ระบุ ว่า \"สินค้าใหม่จะ...ในเดือนหน้า และมีวางจำหน่ายตามร้านค้าใหญ่ ๆ ทุกแห่ง\" ส่วนตัวเลือกอื่น ได้แก่ disappear (หายไป) bother (รบกวน) และ look after (ดูแล) ไม่สอดคล้องกับพฤติกรรมการ กระจายสินค้าสู่ร้านค้าตามที่โจทย์กำหนดไว้"},{"n":90,"q":"Tickets for the concert are ________, so buy them quickly.","o":["popular","limited","abundant","endless"],"a":2,"e":"limited (มีจำกัด) จากประโยคส่วนหลังมีตัวชี้แนะทางบริบท (Context clue) คือสำนวน \"so buy them quickly\" (ดังนั้นจงรีบซื้ออย่างรวดเร็ว) ซึ่งเป็นเหตุเป็นผลโดยตรงกับสภาวะของตั๋วคอนเสิร์ตที่มีจำนวนจำกัดตามหลักการตลาด และคลังคำศัพท์ภาษาอังกฤษ ส่วนตัวเลือกอื่น ได้แก่ popular (เป็นที่นิยม) abundant (มากมาย) และ endless (ไม่มีที่สิ้นสุด) ไม่สอดคล้องกับ พฤติกรรมที่ต้องเร่งรีบซื้อเนื่องจากกลัวตั๋วหมดตามที่โจทย์ระบุไว้"},{"n":91,"q":"Let’s ________ on the project right away before the deadline gets too close.","o":["commute","give up","bother","get started"],"a":4,"e":"get started (เริ่มต้น/ลงมือทำ) จากสำนวน \"get started on something\" หมายถึงการเริ่มลงมือปฏิบัติงานใดงาน หนึ่ง ซึ่งสอดคล้องกับโครงสร้างประโยคชักชวน \"Let's...\" และบริบทที่ระบุว่า \"ให้รีบลงมือทำโครงการนี้ทันที ก่อนที่ วันกำหนดส่ง (deadline) จะกระชั้นชิดเข้ามาเกินไป\" ส่วนตัวเลือกอื่น ได้แก่ commute (เดินทางไปกลับ), give up (ยอมแพ้/ล้มเลิก) และ bother (รบกวน) ไม่สามารถ สร้างความหมายที่เป็นเหตุเป็นผลกับเงื่อนไขเรื่องเวลาจำกัดในประโยคนี้ได้ตามหลักไวยากรณ์"},{"n":92,"q":"Although he has failed many times, he won’t _________.","o":["handle","give up","prove","look for"],"a":2,"e":"give up (ยอมแพ้/ล้มเลิก) จากประโยคนี้ใช้คำเชื่อม \"Although\" (ถึงแม้ว่า) เพื่อแสดงความขัดแย้งกันของ สองประโยค โดยประโยคแรกระบุว่า \"ถึงแม้ว่าเขาจะล้มเหลวมาหลายครั้ง\" ประโยคหลังจึงต้องขัดแย้งกันคือ \"เขาจะไม่ ยอมแพ้\" ซึ่งการใช้สำนวน \"give up\" จะทำให้ประโยคมีความหมายสมบูรณ์และถูกต้องตรงตามหลักการมากที่สุด ส่วนตัวเลือกอื่น ได้แก่ handle (รับมือ) prove (พิสูจน์) และ look for (ค้นหา) ไม่สามารถแสดงความขัดแย้งที่เป็น เหตุเป็นผลกับความล้มเหลวในประโยคแรกได้"},{"n":93,"q":"Children love being taken to a ________.","o":["conference","meeting","circus","harbor"],"a":3,"e":"circus (คณะละครสัตว์) จากบริบทของประโยคระบุว่า \"เด็ก ๆ ชอบการถูกพาไปยัง...\" ซึ่งตามหลักความ สอดคล้องทางสังคมและพฤติกรรมของเด็ก สถานที่ที่ให้ความบันเทิงและดึงดูดใจเด็กได้ดีที่สุดคือคณะละครสัตว์ ส่วนตัวเลือกอื่น ได้แก่ conference (การประชุมทางวิชาการ) meeting (การประชุม) และ harbor (ท่าเรือ) เป็นสถาน ที่ที่เป็นทางการหรือเฉพาะทางเกี่ยวกับการทำงานและการขนส่ง ซึ่งไม่สอดคล้องกับความสนใจตามธรรมชาติของเด็ก"},{"n":94,"q":"Rattiya was almost _______ by lightning. Fortunately, it was not serious.","o":["driven","convinced","pressed","struck"],"a":4,"e":"struck (ถูกชน/ถูกผ่า) จากคำกริยา \"strike\" (กริยาช่องที่ 3 คือ struck) เมื่อใช้ร่วมกับปรากฏการณ์ธรรมชาติจะเกิด เป็นวลีเฉพาะคือ \"struck by lightning\" ซึ่งแปลว่า ถูกฟ้าผ่า ตรงตามโครงสร้างประโยค Passive Voice ที่ระบุว่า \"รัตติยา เกือบถูกฟ้าผ่า แต่โชคดีที่ไม่รุนแรง\" ส่วนตัวเลือกอื่น ได้แก่ driven (ถูกขับเคลื่อน/ถูกพาไป) convinced (ถูกโน้มน้าว) และ pressed (ถูกกด/ถูกกดดัน) ไม่สามารถใช้ร่วมกับคำว่า lightning เพื่อสื่อความหมายในอุบัติเหตุจากปรากฏการณ์ธรรมชาติได้ตามหลักการใช้ ภาษาอังกฤษ"},{"n":95,"q":"Traveling abroad gave her valuable ________ about different cultures.","o":["experience","mistake","illusion","ignorance"],"a":1,"e":"experience (ประสบการณ์) จากบริบทของประโยคกล่าวถึง \"การเดินทางไปต่างประเทศทำให้เธอได้รับ... ที่มี คุณค่าเกี่ยวกับวัฒนธรรมที่แตกต่างกัน\" ซึ่งตามหลักความหมายของคำศัพท์ สิ่งที่จะได้รับจากการเดินทางและส่งเสริม การเรียนรู้คือประสบการณ์ที่มีคุณค่า (valuable experience) ส่วนตัวเลือกอื่น ได้แก่ mistake (ความผิดพลาด) illusion (ภาพลวงตา) และ ignorance (ความไม่รู้/ความเพิกเฉย) ล้วนมีความหมายในเชิงลบ ซึ่งไม่สอดคล้องกับคุณค่าที่ได้รับจากการเปิดโลกทัศน์ในต่างแดนตามที่โจทย์ระบุ"},{"n":96,"q":"You should ________ the university’s rules before applying for admission.","o":["curl up","commute","be familiar with","get started"],"a":3,"e":"be familiar with (คุ้นเคยกับ/ทำความเข้าใจให้ชิน) จากบริบทของประโยคระบุว่า \"คุณควรจะ...กฎระเบียบของ มหาวิทยาลัยก่อนที่จะสมัครเข้าเรียน\" ซึ่งตามหลักการปฎิบัติตนในการเข้าศึกษาต่อ วลีที่แสดงถึงการศึกษาข้อมูลเพื่อให้ เกิดความเข้าใจและปฎิบัติตามได้อย่างถูกต้องคือกริยา \"be familiar with\" ส่วนตัวเลือกอื่น ได้แก่ curl up (นอนขดตัว) commute (เดินทางไปกลับ) และ get started (เริ่มต้น) ไม่มี ความหมายที่สอดคล้องกับพฤติกรรมการจัดการและเตรียมตัวเรื่องกฎระเบียบก่อนการสมัครเรียน"},{"n":97,"q":"It takes time to ________ a new skill, but practice makes it easier.","o":["bother","acquire","translate","reduce"],"a":2,"e":"acquire (ได้รับมา/พัฒนาทักษะ) จากตามหลักคลังคำศัพท์ภาษาอังกฤษ คำกริยา \"acquire\" มักใช้ในระดับสากลคู่ กับคำว่า skill เป็นวลีว่า \"acquire a new skill\" หมายถึงการฝึกฝนจนเกิดทักษะใหม่ ซึ่งสอดคล้องกับประโยคส่วนหลัง ที่ว่า \"แต่การฝึกฝนจะทำให้มันง่ายขึ้น\" ส่วนตัวเลือกอื่น ได้แก่ bother (รบกวน) translate (แปล) และ reduce (ลดลง) ไม่สามารถแสดงความสัมพันธ์เชิง เหตุและผลกับการพัฒนาทักษะจากการฝึกฝนได้"},{"n":98,"q":"We must ________ the use of plastic to protect the environment.","o":["reduce","compare","inform","demand"],"a":1,"e":"reduce (ลดลง/ลดปริมาณ) จากบริบทของประโยคกล่าวถึงเป้าหมายในการรักษาและปกป้องสิ่งแวดล้อม (to protect the environment) ซึ่งตามหลักสากลและแนวคิดการอนุรักษ์ การกระทำที่เป็นเหตุเป็นผลและส่งผลดีต่อ สิ่งแวดล้อมโดยตรงคือ \"การลดการใช้พลาสติก\" (reduce the use of plastic) ส่วนตัวเลือกอื่น ได้แก่ compare (เปรียบเทียบ) inform (แจ้งให้ทราบ) และ demand (ความต้องการ/เรียกร้อง) ไม่ มีความหมายที่สอดคล้องกับแนวทางการปกป้องธรรมชาติตามที่โจทย์กำหนดไว้"},{"n":99,"q":"After exercising regularly every morning, Surawit has gained back his _______.","o":["activity","energy","wealth","payment"],"a":2,"e":"energy (พลังงาน/พละกำลัง) จากบริบทของประโยคระบุถึงพฤติกรรม \"การออกกำลังกายอย่างสม ่าเสมอทุกเช้า\" (exercising regularly every morning) ซึ่งส่งผลดีต่อร่างกายโดยตรงตามหลักสุขอนามัย ทำให้สุรวิชญ์ได้รับพละกำลัง หรือความกระปรี้กระเปร่ากลับคืนมา (gained back his energy) ส่วนตัวเลือกอื่น ได้แก่ activity (กิจกรรม) wealth (ความมั่งคั่ง) และ payment (การชำระเงิน) ไม่ใช่ผลลัพธ์โดย ตรงที่ได้จากการออกกำลังกายตามหลักการแปลความหมาย"},{"n":100,"q":"Wattaya is a ________person. She will be there whenever you need help.","o":["wealthy","sensitive","dependable","powerful"],"a":3,"e":"dependable (ที่พึ่งพาได้/ไว้ใจได้) จากประโยคส่วนหลังระบุคำใบ้บริบท (Context Clue) ว่า \"She will be there whenever you need help\" (เธอจะอยู่ตรงนั้นเสมอเมื่อใดก็ตามที่คุณต้องการความช่วยเหลือ) ซึ่งเป็นลักษณะนิสัยของคน ที่พึ่งพาได้ตรงตามความหมายของคำว่า \"dependable\" ส่วนตัวเลือกอื่น ได้แก่ wealthy (ร ่ารวย) sensitive (อ่อนไหวง่าย) และ powerful (มีอำนาจ) ไม่สอดคล้องกับ พฤติกรรมการชอบช่วยเหลือและเป็นที่พึ่งของผู้อื่นตามที่โจทย์กำหนดไว้"},{"n":101,"q":"The _________ of his working life is having been awarded Best Manager of the Year.","o":["highlight","approval","confidence","meaning"],"a":1,"e":"highlight (จุดเด่น/เหตุการณ์สำคัญที่สุด) จากบริบทของประโยคกล่าวถึงความสำเร็จสูงสุดในชีวิตการทำงาน คือ การได้รับรางวัลผู้จัดการยอดเยี่ยมแห่งปี (Best Manager of the Year) ซึ่งตามหลักภาษาอังกฤษ คำว่า \"highlight\" ใช้ระบุ ถึงส่วนที่น่าจดจำหรือประสบความสำเร็จสูงสุด ส่วนตัวเลือกอื่น ได้แก่ approval (การอนุมัติ) confidence (ความมั่นใจ) และ meaning (ความหมาย) ไม่สามารถสื่อ ถึงเหตุการณ์เด่นอันเป็นที่สุดของอาชีพการงานได้ตรงประเด็นเท่ากับข้อแรก"},{"n":102,"q":"What he said is very _______. No one believed him.","o":["interesting","informative","sensible","ridiculous"],"a":4,"e":"ridiculous (น่าขัน/ไร้สาระ) จากประโยคส่วนหลังระบุว่า \"ไม่มีใครเชื่อเขาเลย\" (No one believed him) ซึ่งตาม หลักการแสดงความสัมพันธ์เชิงเหตุและผล ข้อความข้างต้นจึงต้องสื่อถึงเรื่องที่ตลกขบขัน ขาดความน่าเชื่อถือ หรือไร้ สาระเกินกว่าจะยอมรับได้ ส่วนตัวเลือกอื่น ได้แก่ interesting (น่าสนใจ) informative (ให้ความรู้) และ sensible (สมเหตุสมผล) ล้วนเป็น คุณลักษณะเชิงบวก ซึ่งขัดแย้งกับผลลัพธ์ที่ไม่มีใครเชื่อถือตามที่โจทย์กำหนดไว้"},{"n":103,"q":"Rada _______ dropped her Chinese jade bracelet given to her by her mother.","o":["temporarily","accidentally","specifically","originally"],"a":2,"e":"accidentally (โดยบังเอิญ/ไม่ได้ตั้งใจ) จากบริบทของประโยคกล่าวถึงการทำสร้อยข้อมือหยกจีนที่แม่ให้หล่น ซึ่ง ตามธรรมชาติของพฤติกรรมและการรักษาของมีค่า การทำหล่นมักเกิดขึ้นจากความไม่ตั้งใจหรืออุบัติเหตุ คำกริยา วิเศษณ์ \"accidentally\" จึงสอดคล้องที่สุด ส่วนตัวเลือกอื่น ได้แก่ temporarily (ชั่วคราว) specifically (โดยเฉพาะเจาะจง) และ originally (ดั้งเดิม/แต่แรก) ไม่สามารถนำมาอธิบายลักษณะการทำสิ่งของสำคัญหล่นได้อย่างสมเหตุสมผลตามหลักการแปลความหมาย"},{"n":104,"q":"Don’t drive too fast on the icy road. Your car will _______.","o":["prove","release","spin","curl up"],"a":3,"e":"spin (หมุน/เสียหลัก) จากประโยคส่วนแรกเตือนว่า \"อย่าขับรถเร็วเกินไปบนถนนที่มีน ้าแข็งเกาะ\" ซึ่งผลลัพธ์ที่ เป็นเหตุเป็นผลและเป็นอันตรายโดยตรงจากการขับรถเร็วบนสภาพถนนที่ลื่นคือ รถยนต์จะเกิดการหมุนหรือเสียหลัก (Your car will spin) ส่วนตัวเลือกอื่น ได้แก่ prove (พิสูจน์) release (ปล่อย/ปลดปล่อย) และ curl up (นอนขดตัว) ไม่มีความหมายที่ สอดคล้องกับอุบัติเหตุทางรถยนต์บนถนนลื่นตามหลักสากล"},{"n":105,"q":"If you beat the red-hot iron with a hammer, it will _______.","o":["decrease","shine","reduce","expand"],"a":4,"e":"expand (ขยายตัว/แผ่ออก) จากตามหลักวิทยาศาสตร์ โลหะเมื่อได้รับความร้อนจนแดง (red-hot iron) จะมีความ อ่อนตัวลง และเมื่อถูกตีด้วยค้อน (beat with a hammer) รูปทรงของเหล็กจะแบนและแผ่ขยายพื้นที่ออกไป คำกริยา \"expand\" จึงตรงกับผลลัพธ์ในบริบทนี้มากที่สุด ส่วนตัวเลือกอื่น ได้แก่ decrease (ลดลง) shine (ส่องแสง) และ reduce (ลดปริมาณ) ไม่ใช่ปฏิกิริยาทางกายภาพที่ เกิดขึ้นจากการตีเหล็กร้อนตามหลักความจริง"},{"n":106,"q":"When the accident happened, Hatai was the only ______on the bus.","o":["customer","passer-by","passenger","reporter"],"a":3,"e":"passenger (ผู้โดยสาร) จากบริบทประโยคระบุถึงสถานที่คือ \"on the bus\" (บนรถโดยสารประจำทาง) และเกิด อุบัติเหตุขึ้น (When the accident happened) คำศัพท์ที่แสดงความสัมพันธ์กับยานพาหนะสาธารณะได้อย่างถูกต้องตรง หลักการที่สุดคือผู้โดยสาร ส่วนตัวเลือกอื่น ได้แก่ customer (ลูกค้า/ใช้กับร้านค้า) passer-by (คนเดินผ่านไปมา) และ reporter (ผู้สื่อข่าว) ไม่สอดคล้องกับตำแหน่งที่อยู่บนรถบัสในฐานะผู้ใช้บริการตามที่โจทย์กำหนดไว้"},{"n":107,"q":"Preecha’s main goal is to graduate with honors.","o":["aim","obstacle","ground","excuse"],"a":1,"e":"aim (เป้าหมาย/จุดมุ่งหมาย) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) โดยคำว่า \"goal\" แปลว่าเป้าหมาย ซึ่งมีความหมายตรงกับคำว่า \"aim\" ในตัวเลือกที่กำหนด ทำให้ประโยคสื่อความหมายได้ว่าเป้าหมาย หลักของปรีชาคือการสำเร็จการศึกษาด้วยเกียรตินิยม ส่วนตัวเลือกอื่น ได้แก่ obstacle (อุปสรรค) ground (พื้นดิน/เหตุผล) และ excuse (ข้อแก้ตัว) มีความหมายไม่ สอดคล้องกับบริบทความตั้งใจในเชิงบวกนี้"},{"n":108,"q":"Victoria is the most popular guest speaker at many conferences.","o":["unknown","cheerful","disliked","favorite"],"a":4,"e":"favorite (ที่เป็นที่ชื่นชอบ/ยอดนิยม) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) โดยคำ ว่า \"popular\" แปลว่าที่เป็นที่นิยมหรือเป็นที่ชื่นชอบของคนหมู่มาก ซึ่งสอดคล้องกับความหมายของคำว่า \"favorite\" ใน บริบทของวิทยากรรับเชิญตามงานประชุมต่าง ๆ ส่วนตัวเลือกอื่น ได้แก่ unknown (ไม่มีใครรู้จัก) cheerful (ร่าเริง) และ disliked (ไม่เป็นที่ชื่นชอบ) ไม่สามารถใช้ แทนคำว่า popular เพื่อสื่อถึงความนิยมในเชิงบวกได้"},{"n":109,"q":"The directions are so vague that she cannot put the parts of this clothes rack together.","o":["simple","unclear","precise","specific"],"a":2,"e":"unclear (ไม่ชัดเจน/คลุมเครือ) จากโจทย์เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำว่า \"vague\" แปลว่าคลุมเครือหรือไม่ชัดเจน ซึ่งมีความหมายตรงกับคำว่า \"unclear\" โดยสอดคล้องกับบริบทประโยคที่ระบุว่า คำแนะนำในการประกอบราวตากผ้านั้นไม่ชัดเจนจนเธอไม่สามารถประกอบมันได้ ส่วนตัวเลือกอื่น ได้แก่ simple (ง่าย) precise (แม่นยำ) และ specific (เฉพาะเจาะจง) มีความหมายตรงกันข้ามกับ บริบทที่กำหนด"},{"n":110,"q":"When travelling, they always search for the shortest route to their destination.","o":["trip","explanation","road","detection"],"a":3,"e":"road (เส้นทาง/ถนน) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำว่า \"route\" แปลว่า เส้นทาง หรือ ทางเดินรถ ซึ่งมีความหมายสอดคล้องและสามารถใช้แทนกันได้ดีที่สุดกับคำว่า \"road\" ในบริบทของการ เดินทางไปยังจุดหมายปลายทาง ส่วนตัวเลือกอื่น ได้แก่ trip (การเดินทาง/การท่องเที่ยว) explanation (การอธิบาย) และ detection (การตรวจจับ) ไม่สามารถสื่อถึงความหมายของเส้นทางกายภาพบนแผนที่ตามที่โจทย์ระบุไว้ได้"},{"n":111,"q":"The doctor warned that the disease could be fatal if not treated quickly.","o":["inadvisable","deadly","heavenly","daring"],"a":2,"e":"deadly (ถึงแก่ชีวิต/ร้ายแรง) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) โดยคำว่า \"fatal\" แปลว่าซึ่งทำให้ถึงแก่ความตาย มีความหมายตรงกับคำว่า \"deadly\" ซึ่งสอดคล้องกับคำเตือนของแพทย์ใน ประโยคที่ระบุว่าโรคนี้สามารถอันตรายจนถึงแก่ชีวิตได้หากไม่ได้รับการรักษาอย่างทันท่วงที ส่วนตัวเลือกอื่น ได้แก่ inadvisable (ไม่แนะนำ) heavenly (งดงามราวกับสวรรค์) และ daring (กล้าหาญ) ไม่ สามารถสื่อถึงความร้ายแรงของโรคระบาดตามที่โจทย์กำหนดไว้ได้"},{"n":112,"q":"Experts can often predict economic trends by studying data.","o":["confuse","deny","foretell","ignore"],"a":3,"e":"foretell (ทำนาย/คาดการณ์) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำว่า \"predict\" แปลว่า ทำนาย หรือ คาดเดาสิ่งที่จะเกิดขึ้นในอนาคต ซึ่งมีความหมายตรงกับคำว่า \"foretell\" โดยสอดคล้องกับบริบท ประโยคที่ระบุว่า \"ผู้เชี่ยวชาญมักจะสามารถคาดการณ์แนวโน้มทางเศรษฐกิจได้จากการศึกษาข้อมูล\" ส่วนตัวเลือกอื่น ได้แก่ confuse (ทำให้สับสน) deny (ปฏิเสธ) และ ignore (เพิกเฉย) มีความหมายไม่สอดคล้อง กับพฤติกรรมการวิเคราะห์ข้อมูลเพื่อมองอนาคต"},{"n":113,"q":"Eating vegetables and exercising regularly helps you stay healthy and robust.","o":["essential","strong","reduced","obsessed"],"a":2,"e":"strong (แข็งแรง/ทรงพลัง) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำว่า \"robust\" แปลว่าแข็งแรง กระปรี้กระเปร่า หรือมีสุขภาพดี ซึ่งมีความหมายตรงกับคำว่า \"strong\" โดยสอดคล้องกับผลลัพธ์เชิงบวก ของการรับประทานผักและการออกกำลังกายอย่างสม ่าเสมอตามบริบท ส่วนตัวเลือกอื่น ได้แก่ essential (จำเป็น) reduced (ลดลง) และ obsessed (หมกมุ่น) ไม่สามารถสื่อถึงสภาพ ร่างกายที่สมบูรณ์แข็งแรงตามที่โจทย์กำหนดไว้ได้"},{"n":114,"q":"She asked her teacher for advice on how to write a better introduction.","o":["suggestion","commute","original","translation"],"a":1,"e":"suggestion (ข้อเสนอแนะ/คำแนะนำ) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำว่า \"advice\" แปลว่า คำแนะนำ ซึ่งมีความหมายสอดคล้องและใช้แทนกันได้ดีที่สุดกับคำว่า \"suggestion\" ในบริบทของการ ที่นักเรียนขอความช่วยเหลือจากอาจารย์เพื่อพัฒนาการเขียนบทนำให้ดีขึ้น ส่วนตัวเลือกอื่น ได้แก่ commute (การเดินทางไปกลับ) original (ต้นฉบับ) และ translation (การแปล) ไม่มี ความหมายที่เกี่ยวข้องกันตามหลักการใช้ภาษา"},{"n":115,"q":"Nathan always has a logical solution for every problem he faces.","o":["reasonable","legal","understandable","invalid"],"a":1,"e":"reasonable (ที่มีเหตุผล/สมเหตุสมผล) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำคุณศัพท์ \"logical\" แปลว่า ที่มีเหตุผลหรือเป็นไปตามตรรกะ ซึ่งมีความหมายตรงกับคำว่า \"reasonable\" โดยสอดคล้อง กับบริบทที่ระบุว่านาธานมักจะมีแนวทางการแก้ปัญหาที่สมเหตุสมผลสำหรับทุกปัญหาที่เขาเผชิญ ส่วนตัวเลือกอื่น ได้แก่ legal (ที่ถูกกฎหมาย) understandable (ที่สามารถเข้าใจได้) และ invalid (ที่เป็นโมฆะ/ไม่ มีน ้าหนัก) ไม่สอดคล้องกับระบบวิธีคิดในการแก้ปัญหาตามที่โจทย์กำหนดไว้"},{"n":116,"q":"His imagination seems to be infinite. He can come up with a lot of ideas to cheer people up.","o":["limited","measurable","endless","narrow"],"a":3,"e":"endless (ไม่มีที่สิ้นสุด/ไม่จำกัด) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำคุณศัพท์ \"infinite\" แปลว่า ไม่จำกัด หรือ มหาศาล ซึ่งมีความหมายตรงกับคำว่า \"endless\" โดยสอดคล้องกับบริบทประโยคที่ระบุ ว่า \"จินตนาการของเขาดูเหมือนจะไม่มีที่สิ้นสุด เขาสามารถคิดไอเดียมากมายเพื่อทำให้ผู้คนร่าเริงขึ้นได้\" ส่วนตัวเลือกอื่น ได้แก่ limited (จำกัด) measurable (สามารถวัดได้) และ narrow (แคบ) ล้วนมีความหมายในเชิง จำกัดซึ่งตรงกันข้ามกับตัวเลือกที่ถูกต้อง"},{"n":117,"q":"It is established that Russel was the person who first saw the fire and called the fire station.","o":["confirmed","assumed","created","estimated"],"a":1,"e":"confirmed (ได้รับการยืนยัน/เป็นที่แน่ชัด) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำคุณศัพท์หรือกริยาช่องที่ 3 \"established\" ในบริบทนี้แปลว่า เป็นที่ยอมรับหรือพิสูจน์แล้วว่าเป็นจริง ซึ่งมีความหมาย ตรงกับคำว่า \"confirmed\" โดยสอดคล้องกับข้อเท็จจริงในประโยคที่ระบุว่ารัสเซลเป็นคนแรกที่เห็นไฟไหม้และโทรแจ้ง สถานีดับเพลิง ส่วนตัวเลือกอื่น ได้แก่ assumed (ถูกทึกทักเอา) created (ถูกสร้างขึ้น) และ estimated (ถูกประมาณการ) ไม่ สามารถสื่อถึงความชัดเจนของข้อเท็จจริงที่ได้รับการพิสูจน์แล้วได้"},{"n":118,"q":"This sweater has to be dry-cleaned. If not, if will shrink.","o":["become bigger","become smaller","become brighter","become rougher"],"a":2,"e":"become smaller (มีขนาดเล็กลง/หดตัว) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำกริยา \"shrink\" แปลว่า หดตัว หรือ เล็กลง ซึ่งมีความหมายตรงกับวลี \"become smaller\" โดยสอดคล้องกับธรรมชาติ ของเสื้อไหมพรม (sweater) ที่หากไม่ซักแห้ง (dry-cleaned) เนื้อผ้าจะเกิดการหดตัวลงเมื่อโดนน ้าหรือความร้อน ส่วนตัวเลือกอื่น ได้แก่ become bigger (ใหญ่ขึ้น) become brighter (สว่างขึ้น) และ become rougher (หยาบ กระด้างขึ้น) ไม่ใช่ความหมายของคำว่า shrink ในบริบทนี้"},{"n":119,"q":"He likes eating bread with thin crust.","o":["outer layer","upper layer","middle layer","hardest layer"],"a":1,"e":"outer layer (เปลือกนอก/ชั้นนอกสุด) จากคำศัพท์ \"crust\" หมายถึง เปลือกนอกของขนมปังที่มีลักษณะแห้งและ แข็งกว่าเนื้อด้านใน ซึ่งมีความหมายตรงกับวลี \"outer layer\" โดยสอดคล้องกับพฤติกรรมการรับประทานอาหารที่ระบุว่า \"เขาชอบกินขนมปังที่มีเปลือกนอกบาง ๆ\" ส่วนตัวเลือกอื่น ได้แก่ upper layer (ชั้นบน) middle layer (ชั้นกลาง) และ hardest layer (ชั้นที่แข็งที่สุด) ไม่ใช่ คำจำกัดความที่ถูกต้องและตรงประเด็นตามหลักคลังคำศัพท์ภาษาอังกฤษของคำว่า crust"},{"n":120,"q":"The Earth is spherical, similar to a ball.","o":["oval","round","triangular","square"],"a":2,"e":"round (กลม) จากโจทย์ข้อนี้เป็นการทดสอบคำศัพท์พ้องความหมาย (Synonym) คำคุณศัพท์ \"spherical\" แปลว่า ที่เป็นทรงกลม มีความหมายตรงกับคำว่า \"round\" ในบริบทนี้ โดยสอดคล้องกับประโยคที่ระบุว่า \"โลกมีลักษณะเป็น ทรงกลม คล้ายกับลูกบอล\" ส่วนตัวเลือกอื่น ได้แก่ oval (รูปไข่/วงรี) triangular (รูปสามเหลี่ยม) และ square (รูปสี่เหลี่ยมจัตุรัส) ไม่ สอดคล้องกับรูปร่างทางกายภาพของโลกและลูกบอลตามหลักความจริงและคลังคำศัพท์ภาษาอังกฤษ"}]},{"title":"ภาค 1 ปีการศึกษา 2567","items":[{"n":1,"q":"Wild animals_________ dangerous.","o":["is","are","was","were"],"a":2,"e":"ใช้ Present Simple Tense (S. + V.1 ผันตาม S.) กับเหตุการณ์ที่เป็น ข้อเท็จจริง ตัวอย่างประโยค : Wild animals are dangerous. (สัตว์ป่าเป็นสัตว์อันตราย) : The sun rises in the east. (ดวงอาทิตย์ขึ้นทางทิศตะวันออก) : Time waits for no man. (เวลาไม่เคยคอยใคร)"},{"n":2,"q":"The key you found is_________.","o":["mine","her","him","our"],"a":1,"e":"Possessive Pronouns (คำสรรพนามแสดงความเป็นเจ้าของ) ใช้แทนคำนามเพื่อแสดงความเป็นเจ้าของ ไม่ ต้องมีคำนามตามหลัง ส่วน Possessive Adjectives (คำคุณศัพท์แสดงความเป็นเจ้าของ) ตามหลังด้วยคำนามเสมอ Possessive Adjectives (คำคุณศัพท์แสดงความเป็นเจ้าของ) Possessive Pronouns (คำสรรพนามแสดงความเป็นเจ้าของ) my mine your yours our ours their theirs his his her hers its its *ไม่นิยมใช้"},{"n":3,"q":"This week, I_______ a train to work because my car is in the garage.","o":["take","took","was taking","am taking"],"a":1,"e":"ใช้ Present Simple Tense (S. + V.1 ผันตาม S.) กับเหตุการณ์หรือการกระทำที่เป็นปกติวิสัย หรือกจรกระทำที่ เกิดขึ้นเป็นประจำสม ่าเสมอ ซึ่งมักมีคำกริยาวิเศษณ์ (Adverb) ปรากฏอยู่ในประโยค เช่น always (เสมอ), often (บ่อย ๆ), usually (ตามปกติแล้ว), frequently (ตามปกติแล้ว), normally (ตามปกติแล้ว), regularly (ตามปกติแล้ว), sometimes (บางครั้ง), every/on + วัน/เวลา, once/twice + a + เวลา ตัวอย่างประโยค : I wash my hair every other day. (ผมสระผมวันเว้นวัน) : These littles girls are afraid of the big black dog. (สาวน้อยกลุ่มนี้กลัวสุนัขสีดำตัวใหญ่ตัวนั้น)"},{"n":4,"q":"We usually________together in the park.","o":["exercise","will exercise","are exercising","have exercised"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 3. ประกอบ"},{"n":5,"q":"Mark's mother makes him_________up his room once a week.","o":["to tidy","tidied","tidy","tidying"],"a":3,"e":"คำกริยาที่ตามด้วย Infinitive ที่ไม่มี to นำหน้า (Infinitive without to) ตัวอย่างประโยค : : His mother made him promise ta well behave. (แม่ของเขาให้เขาสัญญาว่าจะประพฤติหัวดี) : My boss always makes me work on the weekend. (เจ้านายของผมมักจะให้ผมทำงานในวันหยุดสุดสัปดาห์) : My boss let me leave early. (เจ้านายให้ฉันกลับบ้านเร็ว) let make + Object (กรรม) + Infinitive without to have"},{"n":6,"q":"They_________their 11th anniversary at this time last Friday.","o":["celebrate","are celebrating","have celebrated","were celebrating"],"a":4,"e":"ใช้ Past Progressive Tense (S. + was/were + V.ing) เพื่อบอกเล่าเหตุการณ์หรือการกระทำที่กำลังดำเนินอยู่ ณ ช่วงเวลาใดเวลาหนึ่งในอดีต มักจะมีคำบอกเวลา เช่น (at) this time last (night/week/month/year /term), at 10 o'clock yesterday, at 9 pm last night ตัวอย่างประโยค : What were you doing at 8 p.m. Last night? (2 ทุ่มเมื่อคืนนี้ คุณกำลังทำอะไรอยู่) : At this time last night, we were dancing. (เมื่อคืนในเวลานี้ พวกเรากำลังเต้นรำกันอยู่)"},{"n":7,"q":"If the weather clears up, we_________for a hike tomorrow.","o":["goes","will go","gone","had gone"],"a":2,"e":"ประโยค Conditional Sentences ประกอบด้วย 2 ส่วน คือ ส่วน if-Clause (ส่วนที่เป็นเงื่อนไข) และส่วน Main Clause (ส่วนที่เป็นประโยคหลัก) ในการเขียนประโยค Conditional Sentences นั้น ทั้ง 2 ส่วนสามารถสลับตำแหน่งกันได้ แบบที่ 1 - ข้อเท็จจริง / ปกติวิสัย / เป็นไปได้ในปัจจุบัน If + S. + V.1 (ผันตาม S.) , S. + V.1 (ผันตาม S.) ตัวอย่างประโยค : If you mix red and blue, you get purple. (ถ้าคุณผสมสีแดงกับสีน ้าเงิน คุณจะได้สีม่วง) : Your muscle mass decreases if you don't exercise. (ถ้าคุณไม่ออกกำลังกาย มวลกล้ามเนื้อของคุณจะลดลง) แบบที่ 2 - เป็นไปได้ในอนาคต If + S. + V.1 (ฝันตาม S.), S. + will/shall/can/may/must + V.1 (ไม่ฝัน) ตัวอย่างประโยค : If I have enough time, I will go shopping. (ถ้าฉันมีเวลาเพียงพอ ฉันจะไปซื้อของ) : We will go camping if the weather is nice this afternoon. (ถ้าบ่ายนี้อากาศดี เราจะไปตั้งแคมป์กัน) แบบที่ 3 - เป็นไปไม่ได้ในปัจจุบัน (ตรงข้ามกับความเป็นจริงในปัจจุบัน) If + S. + V.2/were, S. + would/could/should/might + V.1 (ไม่ผัน) ตัวอย่างประโยค : If I had her phone number, I would call her. (ถ้าผมมีเบอร์โทรของเธอ ผมจะโทรหา เธอ) : Pat would fly to Phuket every winter if he were a bird. (ถ้าแพทเป็นนก เขาจะบินไปภูเก็ตทุกฤดูหนาว) แบบที่ 4 - เป็นไปไม่ได้ในอดีต (ตรงข้ามกับความเป็นจริงในอดีต) If + S. + had + V.3, S. + would/could/should/might + have + V.3 ตัวอย่างประโยค : If they had taken the bus to school, they wouldn't have arrived in time. (ถ้าพวกเขาขึ้นรถเมล์ไปโรงเรียน พวกเขาคงมาไม่ทัน) : You would have arrived on time if you had left earlier. (ถ้าคุณออกเร็วกว่านี้ คุณคงมาถึงตรงเวลา)"},{"n":8,"q":"Jenny and I__________ each other for years.","o":["know","knew","have known","were knowing"],"a":3,"e":"ใช้ Present Perfect Tense (S. + has/have + V.3) กับเหตุการณ์หรือการกระทำที่เกิดติดต่อกันตั้งแต่อดีตจนถึง ปัจจุบัน แต่ไม่ได้แสดงเจตนาแน่นอนว่าจะดำเนินต่อไปในอนาคตหรือไม่ มักจะมีคำบอกเวลา since (ตั้งแต่) + วันเวลา / อนุประโยค, for (เป็นเวลา) + ระยะเวลา, so far (เรื่อยมาจนถึงตอนนี้), yet (ยัง), How long,(นานแค่ไหน) ตัวอย่างประโยค : We have been at the hotel for a week. (เราอยู่ที่โรงแรมแห่งนี้มา 1 สัปดาห์แล้ว) : She has taught at this school since 2022. (เธอสอนที่โรงเรียนนี้ตั้งแต่ปี 2022)"},{"n":9,"q":"_______that he has got a big bonus from his office, Tim couldn't help smiling all day.","o":["Known","Knowing","Know","To know"],"a":2,"e":"ใช้ Present Participle (V.ing) เป็นกริยาวิเศษณ์ เริ่มต้นวลี นำหน้าประโยคหลัก (Main Clause) เมื่อเหตุการณ์ใน ส่วนของวลีกับเหตุการณ์ในประโยคหลักเกิดขึ้นโดยประธานคนเดียวกัน ในช่วงเวลาเดียวกันหรือใกล้เคียงกัน ให้ความ เหมายเป็น Active Voice คือประธานในประโยคหลักเป็นผู้กระทำอาการนั้น ตัวอย่างประโยค : Walking on the beach, we saw many foreign tourists. (ขณะเดินเล่นชายหาด พวกเราเห็นนักท่องเที่ยวต่างชาติมากมาย) : Dropping the gun, she put her hands in the air. (เธอวางปืนลง แล้วยกมือขึ้น) : Putting on his coat, he left the house. (เขาใส่เสื้อหนาว แล้วออกจากบ้าน) ใช้ Past Participle (V. 3) เป็นกริยาวิเศษณ์ เริ่มต้นวลี นำหน้าประโยคหลัก (Main Clause) เมื่อเหตุการณ์ในส่วน ของวลีกับเหตุการณ์ในประโยคหลักเกิดขึ้นโดยประธานคนเดียวกัน ในช่วงเวลาเดียวกันหรือใกล้เคียงกัน ให้ความหมาย เป็น Passive Voice คือประธานในประโยคหลักเป็นผู้ถูกกระทำ ตัวอย่างประโยค : Battered by the wind, John fell to his knees. (ด้วยถูกปะทะจากแรงลม จอห์นล้มลงคุกเข่า) : Looked after carefully, these costly bags will last for many years. (เมื่อถูกดูแลรักษาอย่างดี กระเป๋าราคาแพงเหล่านี้จะมีอายุการใช้งานหลายปี) : Filled with pride, the outstanding actor walked towards the stage. (เต็มไปด้วยความภาคภูมิใจ นักแสดงที่โดดเด่นผู้นี้เดินไปยังเวที)"},{"n":10,"q":"Albert ________ it before 6 o’clock. We’d better leave without him.","o":["don’t finish","won’t finish","didn’t finish","haven’t finished"],"a":2,"e":"ใช้ Future Simple Tense (S. + will/shall/be going to + V.1 ไม่ผัน) กับเหตุการณ์หรือการกระทำที่จะเกิดขึ้นใน อนาคต อาจจะมีคำกริยาวิเศษณ์บอกเวลา เช่น tomorrow, soon, next (week/month/year), tonight, in (the future /a few minutes / half an hour), this afternoon/evening, at the end of this month, later (หมายเหตุ : รูปปฏิเสธ will not = won't) ตัวอย่างประโยค : We will travel around the world next year. (พวกเราจะไปเที่ยวรอบโลกปีหน้า) : I will go to the beach at the end of this month. (ผมจะไปทะเลปลายเดือนนี้) : Look at that dark cloud! It's going to rain. (ดูเมฆดำนั่นสิ! ฝนกำลังจะตก)"},{"n":11,"q":"_________ United States of America is a very big country.","o":["A","An","The","(Blank)"],"a":3,"e":"หลักการใช้Article “The” นา หน้าคำนามต่อไปนี้ 1. the + คำนามเฉพาะ 2. ใช้ the กับชื่อตระกูล เช่น The Smiths (ตระกูลสมิธ) 3. ใช้ the นำ หน้าชื่อประเทศที่มีคำว่า United, Republic เช่น The United States, The Union, The Republic of China 4. ใช้ the นำหน้าคำนามที่มีส่วนขยายชี้เฉพาะตามหลังคำนาม เช่น เป็นบุพบท (in, on, at, under) หรืออนุประโยค ขยายที่มี that, which, who, whom เป็นต้น สำหรับข้อนี้ใช้ The นำหน้าชื่อประเทศที่มีคำว่า United จึงตอบ The United States of America"},{"n":12,"q":"My brother will have his jeans _________ about 2 inches.","o":["shorten","Shortening","Shortened","to shorten"],"a":3,"e":"ใช้ have เพื่อเน้นว่า \"ประธานให้คนใดคนหนึ่งกระทำอาการ\" (Active Voice) have/has + someone + V.1 (ไม่ผัน) + something ตัวอย่างประโยค : I'll have my secretary pick you up at the airport. (ผมจะให้เลขาของผมไปรับคุณที่สนามบิน) : I have the secretary take care or everything. (ผมให้เลขาคอยดูแลทุกอย่าง) ใช้ have เพื่อเน้นว่า \"ประธานให้สิ่งใดสิ่งหนึ่งถูกกระทำ\" (Passive Voice) have/has + something + V.3 ตัวอย่างประโยค : I'm going to have my laptop fixed. (ฉันจะเอาแล็บท็อปไปซ่อม) : Ann will have her house cleaned tomorrow. (แอนจะทำความสะอาดบ้านในวันพรุ่งนี้)"},{"n":13,"q":"_______ we _______ up the house next weekend?","o":["Do; clean","Have; cleaned","Are; cleaned","Shall: clean"],"a":4,"e":"ท้ายประโยคมีคำบอกเวลา next weekend (เสาร์อาทิตย์หน้า) เป็นการบ่งบอกถึงอนาคต ใช้รูป Present Simple Tense (S + will/shall + V1) ตรงกับตัวเลือกข้อ 4 ที่มี shall ทำเป็นประโยคคำถามยก Shall ไว้หน้าประธาน we นั่นเอง"},{"n":14,"q":"________ turn is it to choose the movie for movie night?","o":["Who","Whom","Whose","Which"],"a":3,"e":"คำถามประเภท Wh-Questions คือ คำถามที่ต้องการรายละเอียดข้อมูลในเรื่องราวหรือเหตุการณ์ต่างๆ มากกว่า การตั้งคำถามที่ต้องการค่าตอบ Yes (ใช่) หรือ No (ไม่ใช่) ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม Which, What which (คนไหน, ตัวไหน, สิ่งไหน) Which sweater did you buy? (คุณซื้อเสื้อกันหนาวตัวไหน) Which hand do you write with? (คุณเขียนด้วยมือข้างไหน) what (อะไร) What will you do in next holiday? (วันหยุดครั้งหน้าคุณจะทำอะไร) What makes you come here? (อะไรทำให้คุณมาที่นี่) ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม Who, Whom, Whose who (ใคร) Who makes the decisions here? (ที่นี่ใครเป็นคนตัดสินใจ) Who is the best footballer in the world? (ใครคือนักฟุตบอลที่เก่งที่สุดใน โลก) whom (ใคร) Whom ore we waiting for? (พากเรากำลังรอใครอยู่) Whom are you going to invite? (คุณจะเชิญใคร) whose (ของใคร) Whose car is parked in front of the house? (รถของใครจอดอยู่หน้าบ้าน) Whose are these gloves? (ถุงมือนี้เป็นของใคร) ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม When, Where, why when (เมื่อไร) When are we going to finish? (เราจะเสร็จเมื่อไหร่) When is the next meeting scheduled? (กำหนดการประชุมครั้งต่อไป เมื่อใด) where (ที่ไหน) Where will you go for your holiday? (วันหยุดพักผ่อนคุณจะไปไหน) Where does this story take place? (เรื่องนี้เกิดขึ้นที่ไหน) why (ทำไม) Why does he complain all the time? (ทำไมเขาบ่นตลอดเวลา) Why did you choose to study engineering? (ทำไมคุณถึงเลือกเรียนวิศวะ)"},{"n":15,"q":"Henry is _______ chef in town.","o":["good","better","as good","the best"],"a":4,"e":"ต้องการให้ตอบการเปรียบเทียบคำคุณศัพท์ (Adj.) ซึ่งมีหลักอยู่ 3 ขั้น คือ 1. ขั้นธรรมดา เปรียบเทียบเท่ากัน ใช้ as_____as ตรงกลางต้องใส่ขั้นธรรมดา 2. ขั้นกว่า เปรียบเทียบของ 2 อย่าง / คน / สิ่ง เช่น เจอคำว่า of the two หรือ ____than (ออกทุกเทอม) เห็น than ให้ ตอบข้างหน้าขั้นกว่า 3. ขั้นสุด เป็นการเปรียบเทียบของ 3 สิ่ง / อย่าง / คน หรือมากกว่า 3 ขึ้นไป ให้สังเกตคำว่า of all (ของทั้งหมด) , in + สถานที่ เช่น in town (ในเมือง) , in the world (ในโลก) , in the family (ในครอบครัว) , of the three , หรือคำว่า I’ve ever seen (เท่าที่เคยเห็น) ให้ตอบขั้นสุด ขั้นธรรมดา ขั้นกว่า ขั้นสุด good (ดี) better (ดีกว่า) best (ดีที่สุด) bad (เลว/แย่) worse (แย่กว่า) worst (แย่ที่สุด) little (น้อย) less (น้อยกว่า) least (น้อยที่สุด) much/many (มาก) more (มากกว่า) most (มากที่สุด) Far (ไกล) further/farther (ไกลกว่า) furthest/farthest (ไกลที่สุด) เมื่อเห็น in town ตอบขั้นสุด จาก good better best และใส่ the หน้าขั้นสุดเป็น the best"},{"n":16,"q":"I forgot to turn off the light, is _______ still on?","o":["them","it","him","itself"],"a":2,"e":"ส่วนหลังให้ตอบเป็นคำถามและต้องการถามโดยใช้คำสรรพนาม (Pronoun) และใช้เป็นประธานของประโยค คำถาม? โดยคำที่ให้เติมกล่าวซ ้าคำนามที่เอ่ยในประโยคหน้านั่น คือ the light (ไฟ) เป็นสิ่งของจึงใช้สรรพนาม it แทน และเป็นประธาน จึงตอบ it จากประโยคว่า “ฉันลืมปิดไฟมันยังเปิดอยู่ใช่ไหม? บุรุษสรรพนาม (Personal Pronoun) รูปประธาน รูปกรรม Possessive adjective Possessive Pronoun สะท้อนตัวเอง I you he she they we it me you him her them us it my your his her มีคำนามตามหลัง their our its mine yours his hers ไม่มีคำนามตามหลัง theirs ours its myself yourself himself herself themselves ourselves itself"},{"n":17,"q":"That is _______ movie I’ve ever seen.","o":["bad","worse","the worst","more worse"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ เมื่อเห็นคำว่า I’ve ever seen (เท่าที่เคยเห็น) ให้ตอบขั้นสุด จาก bad ขั้นสุดเปลี่ยนรูปเป็น worst และใส่ the นำหน้าเป็น the worst (แย่ที่สุด เลวร้ายที่สุด)"},{"n":18,"q":"Not __________ the president of the association, Doug was very disappointed.","o":["electing","elected","elect","having elected"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 9. ประกอบ ใช้ Perfect participle (Having + V3 ถ้าปฏิเสธใส่ Not having +V3) เป็นคุณศัพท์มักยกขึ้นต้น ประโยคแล้วมี (,) ให้ใช้ Ving หรือ Having + V3 หลัง (,) จะเป็นคนหรือชื่อคนที่แสดงอาการกระทำกริยาในประโยคต้น ตัวอย่างประโยค : Having finished her report before the due date, Nora is very proud of herself. (หลังจากทำรายงานเสร็จก่อนกำหนด โนราก็ภูมิใจในตัวเองมาก)"},{"n":19,"q":"Natalie ____________ scared of being left alone at night.","o":["stays","feels","tastes","wounds"],"a":2,"e":"คำกริยาที่บอกสภาพของประธาน (Linking Verb) เป็น Verb ที่ตามด้วยคำคุณศัพท์ (Adjective : คำที่ขยาย คำนามหรือบอกลักษณะของคำนาม) Linking Verb สามารถใช้แทน Verb to be ได้เพื่อความหมายที่ดีขึ้น 1. seem, look (ดูเหมือนว่า, ดูเหมือนจะ) ตัวอย่างประโยค : The children seem tired. (เด็กๆ ดูเหมือนจะเหนื่อย) : The children look tired. (เด็กๆ ดูเหนื่อย) 2. sound (ฟังดู) ตัวอย่างประโยค : This price sounds reasonable. (ราคานี้ฟังดูสมเหตุสมผล) : His idea sounds good. (ความคิดของเขาฟังดูดี) 3. remain, appear (อยู่ในสภาพ) ตัวอย่างประโยค : Everybody remains quiet. (ทุกคนอยู่ในสภาพเงียบ) : Everybody appears quiet. (ทุกคนอยู่ในสภาพเงียบ) 4. smell (มีกลิ่น) และ taste (มีรสชาติ) ตัวอย่างประโยค : The eggs smell rotten. (ไข่ส่งกลิ่นเน่า) : Coffee tastes awesome. (กาแฟรสชาติสุดยอด) 5. feel (รู้สึก) ตัวอย่างประโยค : I feel very bad today. (วันนี้ฉันรู้สึกแย่มาก) : She says she feels tired all the time. (เธอบอกว่าเธอรู้สึกเหนื่อยตลอดเวลา) 6. turn (กล่ายสภาพเป็น) และ become (กลายเป็น) ตัวอย่างประโยค : The leaves are beginning to turn red. (ใบไม้กำลังจะเริ่มเปลี่ยนเป็นสีแดง) : Now, my dream becomes true. (ตอนนี้ฝันของฉันกลายเป็นจริง)."},{"n":20,"q":"Right now, Tony ___________ by his father for causing a big dent on his new car.","o":["scolds","is scolding","scolded","is being scolded"],"a":4,"e":"ใช้ Present Progressive Tense (S. + is/am/are + V.ing) กับเหตุการณ์ที่กำลังเกิดขึ้นหรือกำลังกระทำอยู่ใน ขณะที่พูด มักจะมีคำกริยาวิเศษณ์ (Adverb) บอกเวลาที่แสดงว่ากำลังกระทำ อยู่ในขณะที่พูดปรากฏอยู่ในประโยค เช่น now, right now, at present, at (the/this) time, at (the/this) moment ตัวอย่างประโยค : We are preparing for the exam. (พวกเรากำลังเตรียมตัวสอบ) : At this moment, I am not joking with you. (ตอนนี้ฉันไม่ได้กำลังล้อเล่นกับคุณ) โครงสร้างประโยค Passive voice (ประโยคที่ประธานเป็นผู้ถูกกระทำ) คือ S. + V. to be + V.3 โครงสร้าง Passive voice ใน Present Progressive Terse คือ S. + is/am/are + being + V.3 ตัวอย่างประโยค : The car is being washed by my father. (พ่อของผมกำลังล้างรถอยู่) : The cows are being milked by my uncle. (ลุงของฉันกำลังรีดนมวัวอยู่) The flowers are being watered by my younger sister. (น้องสาวของฉันกำลังรดน ้าดอกไม้อยู่)"},{"n":21,"q":"________ you please repeat what you just said, Wendy?","o":["Could","Should","May","Shall"],"a":1,"e":"เป็นประโยคคา ถามในกริยาช่วยแสดงการขอร้อง สังเกตจากคำว่า please (โปรด กรุณา) ให้ใช้ 1. การขอร้อง ใช้ Could you / Would you please + V1_____? 2. การขออนุญาต ใช้ May I, Can I/ Shall I + V1_____? 3. การให้คำเสนอแนะใช้ Should you / Ought you to + V1_____? จึงตอบ Could หรือไม่ก็ Would"},{"n":22,"q":"We’re considering ___________ a new air-conditioner.","o":["buy","bought","buying","to buy"],"a":3,"e":"กริยาที่ตามมาจะเป็น Gerund และตามด้วย Ving ได้แก่ admit dread fancy practice risk allow dislike forgive postpone resent appreciate enjoy imagine prefer stop avoid endure involve prevent suggest consider encourage keep permit require delay escape like prevent hate defer excuse miss quit forgive deny finish mind resist advise"},{"n":23,"q":"If I had known about the flood problems, I _________ a different route.","o":["might have taken","shall take","must have taken","should take"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ ตัวอย่างประโยค : If I had worked harder I might have passed the exam. (หากฉันเรียนหนักกว่านี้ ฉันคงสอบผ่านได้) : If I had known about the traffic problems, I might have taken a different route. (หากฉันรู้ถึงปัญหาจราจร ฉันคงจะเลือกเส้นทางอื่น)"},{"n":24,"q":"Anne is __________ intelligent student.","o":["a","an","the","(Blank)"],"a":3,"e":"ใส่ article มีหลัก ดังนี้ 1. ใช้ “a” นำหน้าคำนามทั่วไปที่ขึ้นต้นด้วยพยัญชนะ กล่าวถึง สิ่งหนึ่ง อย่างหนึ่ง โดยทั่วไปไม่เจาะจง เช่น a man (ผู้ชายคนหนึ่ง) หรือ “a” นำหน้าคำนามอาชีพ เช่น a teacher, a doctor, a student 2. ใช้ “an” นำหน้าคำนามที่มีสระนำหน้า (a, e, i, o, u) เช่น an ant, an elephant, an egg และถ้ามีคุณศัพท์ (adj.) มา ขยายให้ผันตามคำคุณศัพท์นั้น เช่น an important person, an intelligent student ตัวอย่างประโยค : My father is a UN officer. (พ่อของฉันเป็นเจ้าหน้าที่สหประชาชาติ) : The smile is a universal sign of pleasure. (รอยยิ้มเป็นสัญลักษณ์สากลแห่งความสุข : His daughter is an honest girl. (ลูกสาวของเขาเป็นเด็กที่ซื่อสัตย์) : Her son is an amazing boy. (ลูกชายของเธอเป็นเด็กชายมหัศจรรย์)"},{"n":25,"q":"_______ young man who is singing is my friend’s brother.","o":["a","an","the","(Blank)"],"a":3,"e":"ใช้ Article \"the\" นำหน้าคำนามเอกพจน์ คำนามพหูพจน์ คำนามนับไม่ได้ ที่ได้กล่าวถึงไปแล้วครั้งหนึ่ง หรือใน สถานการณ์ที่ผู้พูดและผู้ฟังต่างเข้าใจว่าหมายถึงสิ่งใดหรือนำหน้าคำนามที่ชี้เฉพาะเจาะจงว่าเป็นคนใด ตัวใดหรือสิ่งใด (ใช้ the เมื่อต้องการชี้เฉพาะเจาะจง เมื่อเทียบกับ a/an ที่ไม่ชี้เฉพาะเจาะจง) ตัวอย่างประโยค : The boy sitting next to him raised his hand. (เด็กผู้ชายที่นั่งข้างเขายกมือขึ้น) : Dr. Tony is the doctor I like best. (นายแพทย์โทนี่เป็นหมอที่ฉันชอบที่สุด) : The girls over there are my classmates. (พวกเด็กผู้หญิงที่อยู่ตรงนั้นเป็นเพื่อนเรียนห้องเดียวกับผม) : Thank you for the advice you gave me. (ขอบคุณสำหรับคำแนะนำที่คุณให้ผม)"},{"n":26,"q":"________I to get a raise, I would renovate my parents' house.","o":["Am","Were","Will","Did"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ ตัวอย่างประโยค : If she were a bird, she would fly to a beautiful place. (หากเธอเป็นนก เธอจะบินไปยังสถานที่ที่สวยงาม) : If I were to get a higher salary, I would buy a house. (ถ้าฉันได้เงินเดือนสูง ฉันจะซื้อบ้าน) ในประโยค Conditional Sentences แสดงเงื่อนไขเป็นไปไม่ได้ในปัจจุบัน (ตรงข้ามกับความเป็นจริงในปัจจุบัน) สามารถละ \"I\" ออกได้ แล้วใช้ 'were\" ขึ้นต้นประโยค แต่ให้ความหมายเหมือนเดิม ตัวอย่างประโยค : If she were a bird, she would fly to a beautiful place. : Were she a bird, she would fly to a beautiful place. (หากเธอเป็นนก เธอจะบินไปยังสถานที่ที่สวยงาม) : If I were to get a higher salary, I would buy a house. : Were I to get a higher salary, I would buy a house. (ถ้าฉันได้เงินเดือนสูง ฉันจะซื้อบ้าน)"},{"n":27,"q":"Lan’s shoes need __________.","o":["replace","replaces","replacing","replaced"],"a":3,"e":"ใช้ need มีความหมายว่า \"จำเป็นต้อง\" เพื่อบอกว่าประธานของประโยคจำเป็นต้องทำอะไรบางอย่าง ตามด้วย V. infinitive with to (to + V.1 ไม่ผัน) S. + need + to V. ตัวอย่างประโยค : We need to demonstrate how wrong they are. (เราจำเป็นต้องแสดงให้เห็นว่าพวกเขาผิดอย่างไร) : Dolphins need to eat considerable quantities of food. (โลมาจำเป็นต้องกินอาหารในปริมาณมาก) เมื่อใช้กับ need (จำเป็นต้อง) ในโครงสร้าง Passive Voice (ประธานถูกกระทำ) (1) S. + need + V.ing ตัวอย่างประโยค : My house needs repainting. (บ้านของฉันจำเป็นต้องได้รับการทาสีใหม่) : The bushes need trimming. (พุ่มไม้จำเป็นต้องได้รับการตัดแต่ง) : This studio needs tidying. (สตูดิโอนี้จำเป็นต้องได้รับการจัดระเบียบ) (2) S. + need + to be + V. 3 ตัวอย่างประโยค : My house needs to be repainted. (บ้านของฉันจำเป็นต้องทาสีใหม่) : The dishes need to be washed. (จานพวกนี้จำเป็นต้องล้าง) : The carpet needs to be cleaned. (พรมนี้จำเป็นต้องทำความสะอาด)"},{"n":28,"q":"_________ we call on Amily this afternoon?","o":["May","Would","Could","Shall"],"a":1,"e":"ใช้ may + V.1 ไม่ผัน) เพื่อขออนุญาต (Perrission) ตัวอย่างประโยค : May I ask you a question? (ผมขออนุญาตเรียนถามท่านหน่อยได้ไหมครับ) : May I have your full name, please? (ฉันขอทราบชื่อเต็มของคุณได้ไหม)"},{"n":29,"q":"It’s no use ________ Sam for help.","o":["ask","to ask","asked","asking"],"a":4,"e":"สำนวนต่อไปนี้ให้ตามด้วย Ving ได้แก่ can’t bear look forward to be accustomed to can’t stand object to be opposed to can’t resist adjust to be /get used to can’t help devote to be subjected to have a good time it’s no good it’ no use have a hard time it’s worth have a difficult time ตัวอย่างประโยค : My mother is used to getting up early. (แม่ฉันเคยชินกับการตื่นแต่เช้า) : I can't help falling in love with him. (ช่วยไม่ได้ที่ฉันตกหลุมรักเขา) : It's worth investing in gold. (มันคุ้มค่าที่จะลงทุนในทองคำ) : Would you mind turning that ventilator on, please? (คุณจะรังเกียจไหมที่จะเปิดเครื่องระบายอากาศนั้น)"},{"n":30,"q":"I made the cake __________.","o":["itself","themselves","myself","herself"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 16. ประกอบ คำสรรพนามที่สะท้อนตัวเอง - I สะท้อนตัวเองเป็น myself - Mary สะท้อนตัวเองเป็น herself (เพศหญิง) - They สะท้อนตัวเองเป็น themselves"},{"n":31,"q":"I have two cats. One is black, and ________ is white.","o":["neither","such","a little","the other"],"a":4,"e":"another อีกหนึ่ง แทนคำนามเอกพจน์ (Singular Noun) the other ที่เหลืออยู่อีกหนึ่ง others อื่น ๆ แทนคำนามพหูพจน์ (Plural Noun) the others ที่เหลืออยู่ทั้งหมด ตัวอย่างประโยค : One of my friends lives in Rome. The other lives in Paris. (เพื่อนของฉันคนหนึ่งอยู่กรุงโรม อีกคนอยู่ในกรุงปารีส) : He has two brothers. One is tall, and the other is short. (เขามีพี่ชายสองคน คนหนึ่งสูงและอีกคนหนึ่งเตี้ย)"},{"n":32,"q":"Dan can play _______ piano beautifully.","o":["a","an","the","(Blank)"],"a":3,"e":"การใช้ Article 'the' นำหน้าคำนามที่เป็นชื่อเครื่องดนตรี the guitar the piano the saxophone the flute the violin the trumpet the xylophone the organ ตัวอย่างประโยค : I have the piano at home. (ผมมีเปียโนที่บ้าน) : We need space to play the trombone. (เราต้องการพื้นที่ในการเล่นทรอมโบน : Mastering the violin takes years of study. (การจะเชี่ยวชาญไวโอลินต้องใช้เวลาเรียนหลายปี)"},{"n":33,"q":"__________ is your proudest accomplishment?","o":["What","Where","When","Why"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 14. ประกอบ อยู่ในรูปคำถามประเภท Wh-question เมื่อต้องการถามถึงสิ่งของ ใช้ What มาตั้งคำถาม? ว่า “อะไรคือ ความสำเร็จที่ภาคภูมิใจมากที่สุดของคุณ? ”"},{"n":34,"q":"I’m eligible for the sum of 10,000, _________?","o":["do I","am I","aren’t I","don’t I"],"a":3,"e":"ในประโยค Tag Questions ถ้าส่วนหน้าเป็นประโยคบอกเล่า (Positive Sentence) ส่วนต่อท้ายประโยคต้องเป็น กริยาช่วยรูปย่อแบบปฏิเสธ และในส่วนต่อท้ายประโยคต้องใช้คำสรรพนามรูปประธาน (Subject Pronoun) ตัวอย่างประโยค : She's a programmer, isn't she? (เธอเป็นโปรแกรมเมอร์ไม่ใช่เหรอ) : Yesterday's party was so much fun, wasn't it? (ปาร์ตี้เมื่อวานสนุกมากไม่ใช่เหรอ) : Has your sister seen your new car, hasn't she? (น้องสาวของคุณเห็นรถคันใหม่ของคุณแล้วไม่ใช่เหรอ) ในประโยค Tag Questions ถ้าส่วนหน้าเป็นประโยคปฏิเสธ (Negative Sentence) ส่วนต่อท้ายประโยคต้องเป็น กริยาช่วยรูปย่อแบบบอกเล่า และในส่วนต่อท้ายประโยคต้องใช้คำสรรพนามรูปประธาน (Subject Pronoun) ตัวอย่างประโยค : Her son can't drive, can he? (ลูกชายของเธอขับรถไม่ได้ใช่ไหม) : You don't need to finish this today, do you? (วันนี้คุณไม่ต้องทำให้เสร็จใช่ไหม) : They won't report us, will they? (พวกเขาจะไม่รายงานให้พวกเราทราบใช่ไหม) ในประโยค Tag Questions ถ้าส่วนหน้าเป็นประโยคบอกเล่า (Positive sentence) ขึ้นต้นด้วย I am ส่วนต่อท้าย ประโยคต้องเป็นกริยาช่วยรูปย่อแบบปฏิเสธ(Negative tag) ใช้ aren't I ตัวอย่างประโยค : I'm going to get an email with the details, aren't I? (ฉันจะได้รับอีเมล์พร้อมรายละเอียดใช่ไหม) : I'm giving the next presentation, aren't I? (ฉันจะนำเสนอคนต่อไปใช้ไหม)"},{"n":35,"q":"If I ________ more free time, I would do some outdoor activities.","o":["have","had","would have","will have"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ If S + V2 , S + would/could + V1 ตัวอย่างประโยค : If we bought our own car, we would drive you to Chiang Mai. (ถ้าเราซื้อรถเอง เราจะขับรถไปส่งคุณที่เชียงใหม่) : I would buy you a new smartphone if I got a raise. (ฉันจะซื้อสมาร์ทโฟนใหม่ให้คุณถ้าฉันได้ขึ้นเงินเดือน)"},{"n":36,"q":"A: _________ I keep this pen? B: Sure.","o":["May","Need","Must","Will"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 28. ประกอบ"},{"n":37,"q":"The iPad _________ to Linda as a birthday present.","o":["gave","is giving","was given","has given"],"a":3,"e":"โครงสร้าง Passive voice (ประโยคที่ประธานเป็นผู้ถูกกระทำ) S. + was/were + V.3 ถ้าถูกกระทำกริยาที่จะตอบ ต้องลงท้ายด้วยกริยาช่องที่ 3 เสมอไม่ว่าจะในรูปกาล Tense ใดก็ตาม จึงใช้รูป verb to be + V3 = was given ส่วน has given เป็นรูป Present Perfect Tense ไม่ใช่รูปถูกกระทำ (ถ้าถูกกระทำของ Tense นี้จะเป็น has been given) ตัวอย่างประโยค : The prize was won by the great competitor. (ผู้เข้าแข่งขันยอดเยี่ยมคว้ารางวัลไปครอง) : Their beds were made neatly by the maid. (สาวใช้จัดเตียงของพวกเขาอย่างเรียบร้อย)"},{"n":38,"q":"His three dogs _________ care of by his uncle for about two weeks.","o":["take","have been taken","could be taken","are taking"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 8. ประกอบ โครงสร้าง Passive voice (ประโยคที่ประธานเป็นผู้ถูกกระทำ) ใน Present Perfect Tense (S. + has/have + V.3) คือ S. + has/have + been + V.3 ตัวอย่างประโยค : A hamburger has been eaten by my son. (ลูกชายของฉันกินแฮมเบอร์เกอร์แล้ว) : The parcels have been sent by post officers. (พัสดุถูกส่งโดยพนักงานไปรษณีย์แล้ว)"},{"n":39,"q":"It rained heavily; __________, the streets were flooded.","o":["thus","so","for","because"],"a":1,"e":"การใช้คำเชื่อมในประโยคความรวม (Compound Sentence) ความหมาย ใช้เครื่องหมาย ,_____ ใช้เครื่องหมาย ;______, 1. แสดงความคล้อยตามกัน and, nor moreover, furthermore, also, meanwhile, besides, similarly 2. แสดงความขัดแย้ง but, yet, or however, instead, otherwise, nevertheless, indeed, still 3. แสดงผลหรือสรุปความ so accordingly, finally, thus, consequently, therefore 4. แสดงเหตุ (เพราะ) for - ใช้ so เป็นคำเชื่อม (Conjunction) มีความหมายว่า \"ดังนั้น\" ตามด้วยประธานและคำกริยา หน้า so ต้องมี เครื่องหมาย Comma (,) เสมอ ตัวอย่างประโยค : We were so tired, so we went to bed early last night. (พวกเรารู้สึกอ่อนเพลียมาก ดังนั้นเมื่อคืนนี้พวกเราจึงเข้านอนแต่หัวค ่า) : I didn't eat anything, so I'm very hungry now. (ผมไม่ได้กินอะไรมาเลย ดังนั้นตอนนี้ผมจึงหิวมาก) ใช้ for เป็นคำเชื่อม (Conjunction) มีความหมายว่า \"เพราะว่า\" ตามด้วยประธานและคำกริยา หน้า for ต้องมี เครื่องหมาย Comma (,) เสมอ ตัวอย่างประโยค : I left early, for I was very tired. (ฉันกลับเร็วเพราะเหนื่อยมาก) : We went on a picnic, for it was a nice day. (เราไปปิกนิกกัน เพราะอากาศดี) ใช้ because เป็นคำขึ้นต้น Adverb Clause of Reason (อนุประโยคแสดงเหตุผล) มีความหมายว่า \"เพราะ เพราะว่า เนื่องจาก\" หลัง because ตามด้วยประธานและคำกริยา ตัวอย่างประโยค : He crashed his car because he was driving too fast. (เขาขับรถชน เพราะเขาขับเร็วเกินไป) : I left early because I was very tiled. (ฉันกลับเร็ว เพราะฉันเหนื่อยมาก)"},{"n":40,"q":"You __________ if you don’t want to.","o":["mightn’t go","mustn’t have gone","needn’t go","couldn’t go"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ ใช้ needn't + V.1 มีความหมายว่า \"ไม่จำเป็นต้อง\" สำหรับการใช้ need เป็นกริยาช่วย มักจะใช้ในรูปปฏิเสธ ตัวอย่างประโยค You needn't finish your meal if you don't like it. (คุณไม่จำเป็นต้องทานอาหารให้หมดหรอกถ้าคุณไม่ชอบมัน) You needn't drive so quickly because we have plenty of time. (คุณไม่จำเป็นต้องขับเร็วมากหรอกเรายังมีเวลาอีกเยอะ)"},{"n":41,"q":"If you _________ sugar to tea, it becomes sweet.","o":["add","added","will add","had added"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ ตัวอย่างประโยค : If you walk in the rain, you get wet. (หากเดินตากฝนก็จะเปียก) : If you are under 18, drinking alcohol is illegal. (หากคุณอายุต ่ากว่า 18 ปี การดื่มแอลกอฮอล์เป็นสิ่งผิดกฎหมาย)"},{"n":42,"q":"The man _________ on the stage is my classmate at RU.","o":["sings","sang","is singing","singing"],"a":4,"e":"Present Participle (V.ing) เป็นคำคุณศัพท์ (คำที่ขยายคำนามหรือบอก ลักษณะของคำนาม) วางไว้หลังคำนาม ให้ความหมายเป็น Active Voice คือ นามนั้นเป็น ผู้กระทำอาการ ตัวอย่างประโยค : I saw the child standing in the middle of the road. (ฉันเห็นเด็กคนนั้นกำลังยืนอยู่กลางถนน) : The lady sitting next to the boy wearing the green shirt is my mother. (ผู้หญิงที่นั่งข้างเด็กชายใส่เสื้อสีเขียวคือแม่ของฉัน)"},{"n":43,"q":"The book is ________ than the move we saw.","o":["funnier","the funny","the funniest","funniest"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ ขั้นกว่า เปรียบเทียบของ 2 อย่าง / คน / สิ่ง เช่น เจอคำว่า of the two หรือ ____than (ออกทุกเทอม) เห็น than ให้ ตอบข้างหน้าขั้นกว่า funny เมื่อเป็นขั้นกว่าต้องเปลี่ยน y เป็น i ก่อนแล้วจึงเติม - er ดังนั้น เมื่อจะเป็น funny funnier funniest ขั้นกว่าจึงเป็น funnier"},{"n":44,"q":"Ought I to ________ a bouquet of flowers to her?","o":["sends","send","sent","sending"],"a":2,"e":"ใช้ ought to + V.1 (ไม่ผัน) มีความหมายว่า \"ควร, ควรจะ\" เพื่อเป็นการให้คำแนะนำหรือข้อเสนอแนะ ตัวอย่างประโยค : She ought to work hard. (เธอควรทำงานให้หนัก) : He ought to buy a car. (เขาควรจะซื้อรถยนต์) ใช้ ought to + V.1 (ไม่ผัน) ในโครงสร้างประโยคคำถาม ตัวอย่างประโยค : She ought to work hard. → Ought she to work hard? : He ought to buy a car. → Ought he to buy a car?"},{"n":45,"q":"Dan had made some big mistakes; _______, the entire team had to work overtime to meet the project deadline.","o":["since","for","owing to","as a result"],"a":4,"e":"ใช้ as a result เป็นวลีบอกเหตุผล มักจะใช้เพื่ออ้างถึงความสัมพันธ์ระหว่างเหตุกับผล ตัวอย่างประโยค : Jackson misbehaved with his boss as a result, he lost the job. (แจ็กสันประพฤติตัวไม่ดีกับเจ้านายขอฯเขา ส่งผลให้เขาต้องถูกไล่ออก) : The water evaporated and; as a result, the seat became dry. (น ้าระเหยออกไปจนทำให้เบาะนั่งแห้ง) since = ตั้งแต่ เพราะว่า ใช้ตัวเชื่อมนี้จะไม่มีเครื่องหมายคั่น for = ถ้าใช้ความหมายเพราะว่า มีเครื่องหมาย (,) คั่นหน้า owing to = เนื่องจาก ตามด้วยกลุ่มคำหรือวลีไม่ใช่ประโยค เช่น ตามคำนาม (คือวลี)"},{"n":46,"q":"If he ________ his work early, he’ll join us for dinner.","o":["finished","would finish","finishes","would have finished"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ If S + V1 , S + will V1 ตัวอย่างประโยค : I'll give Tim my old cellphone if I buy a new one. (ฉันจะให้มือถือเครื่องเก่าของฉันแก่ทิมถ้าฉันซื้อเครื่องใหม่) : If it rains, we will cancel the trip to Pattaya next weekend. (หากฝนตกเราจะยกเลิกการเดินทางไปพัทยาในสัปดาห์หน้า)"},{"n":47,"q":"_______you _______ able to work late next week?","o":["Can; are","Do; have to be","Must; been","Will; be"],"a":4,"e":"ประโยคมีคำว่า able to ต้องหากริยาที่สามารถนำหน้า able to + V1 ได้นั้นคือ will be + able to ได้เมื่อทำเป็น ประโยคคำถาม จึงยก Will ไว้หน้าประธาน (you) และ be อยู่หลังประธาน จึงเป็น Will you be able to work"},{"n":48,"q":"Leonardo DiCaprio is ________ actor in Hollywood.","o":["handsome","the most handsome","the more handsome","more handsome"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ ขั้นสุด เป็นการเปรียบเทียบของ 3 สิ่ง / อย่าง / คน หรือมากกว่า 3 ขึ้นไป ให้สังเกตคำว่า of all (ของทั้งหมด) , in + สถานที่ เช่น in town (ในเมือง) , in the world (ในโลก) , in the family (ในครอบครัว) , of the three , หรือคำว่า I’ve ever seen (เท่าที่เคยเห็น) ให้ตอบขั้นสุด"},{"n":49,"q":"This drawing is _______one I’ve ever seen.","o":["fine","finer","the fine","the finest"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ ขั้นสุด เป็นการเปรียบเทียบของ 3 สิ่ง / อย่าง / คน หรือมากกว่า 3 ขึ้นไป ให้สังเกตคำว่า of all (ของทั้งหมด) , in + สถานที่ เช่น in town (ในเมือง) , in the world (ในโลก) , in the family (ในครอบครัว) , of the three , หรือคำว่า I’ve ever seen (เท่าที่เคยเห็น) ให้ตอบขั้นสุด"},{"n":50,"q":"She’s made many friends since _________ moved to the new neighborhood.","o":["her","hers","she","herself"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 16. ประกอบ"},{"n":51,"q":"When I was young, all my clothes ________by my mother.","o":["were sewed","sewed","sew","were sewing"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ โครงสร้าง Passive voice (ประโยคที่ประธานเป็นผู้ถูกกระทำ) S. + was/were + V.3 ถ้าถูกกระทำกริยาที่จะตอบ ต้องลงท้ายด้วยกริยาช่องที่ 3 เสมอ ใช้โครงสร้าง verb to be + V3 = were sewed"},{"n":52,"q":"People cut down trees, _______ the natural habitats of many animals are destroyed.","o":["for","so","or","but"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 39. ประกอบ"},{"n":53,"q":"I asked for volunteers, but ______ didn’t respond.","o":["yourselves","one","them","many"],"a":4,"e":"ใช้ many เป็นคำสรรพนาม (Pronoun) แทนคำนามพหูพจน์ (Plural Noun)มีความหมายว่า \"จำนวนมาก\" ตัวอย่างประโยค A : Would you like some cheese? (คุณต้องการชีสไหม)* B : Yes, please but not too much. (ค่ะ แต่อย่ามากเกินไป) : I'm very busy today. I haven't got many to do. (วันนี้ฉันยุ่งมาก ฉันมีอะไรทำมากมาย) ใช้ one เป็นคำสรรพนาม (Pronoun) แทนคำนามเอกพจน์ (Singular Noun) ทั่วไปที่กล่าวถึงมาแล้ว ถ้าเป็นคำนาม พหูพจน์ (Plural Noun) ใช้ ones เพื่อแทนที่หรือเพื่อเลี่ยงการกล่าวซ ้าคำนามเดิม ตัวอย่างประโยค : I'm looking for a flat. I'd really like one with a garden. (one = a flat) (ผมกำลังมองหาแฟลตอยู่ ผมอยากได้แฟลตที่มีสวนอยู่ด้วย) : I like bronze cars and black ones. (ones = cars) (ฉันชอบรถสีบรอนซ์และสีดำ)"},{"n":54,"q":"In Sweden, all workers must adjust to _________ in all kinds of weather.","o":["worked","working","work","be working"],"a":2,"e":"Gerunds เป็นรูปแบบของคำกริยาที่ลงท้ายด้วย - ing ซึ่งใช้เป็นคำนามคำนาม คือ คำที่เราใช้เพื่ออ้างถึงบุคคล สถานที่ สิ่งของ และความคิด Gerunds ดูเหมือนคำกริยา แต่ทำหน้าที่เป็นคำนาม 1. เป็นประธานของประโยค ตัวอย่างประโยค : Jogging daily will enable you to stay in good shape. (การวิ่งจ๊อกกิ้งทุกวันจะช่วยให้คุณมีรูปร่างดี) : Sleeping is hard if you suffer from anxiety. (การนอนหลับเป็นเรื่องยากหากคุณมีความวิตกกังวล) : Apologizing to me isn't enough this time. (การขอโทษฉันในครั้งนี้ไม่เพียงพอ) 2. เป็นกรรมของคำกริยา ตัวอย่างประโยค : I love reading books to the children at the orphanage. (ฉันชอบอ่านหนังสือให้เด็กในสถานเลี้ยงเด็กกำพร้าฟัง) : She prefers playing with kittens to raising them. (เธอชอบเล่นกับลูกแมวมากกว่าเลี้ยงมัน) : He hates mowing the lawn on Sundays. (เขาเกลียดการตัดหญ้าในวันอาทิตย์) 3. เป็นกรรมของคำบุพบท ตัวอย่างประโยค : Students are more focused on passing the class than on. (นักศึกษาให้ความสำคัญกับการสอบผ่านมากกว่าการเรียนรู้) : Holidays are perfect for visiting family. (วันหยุดเหมาะสำหรับการไปเยี่ยมครอบครัว) : My close friend is brilliant at solving sums. (เพื่อนสนิทของฉันเก่งในการแก้โจทย์ผลบวก) 4. เป็นส่วนเติมเต็ม ตัวอย่างประโยค : Her favorite activity is reading Japanese novels. (กิจกรรมโปรดของเธอคือการอ่านนวนิยายญี่ปุ่น) : One of my responsibilities is cleaning the dishes. (หน้าที่ความรับผิดชอบอย่างหนึ่งของฉันคือการล้างจาน) 5. เป็นคำคุณศัพท์ขยายคำนาม ตัวอย่างประโยค : He is giving me a driving lesson. (เขากำลังสอนฉันขับรถ) : They have a swimming pool in their back yard. (พวกเขามีสระว่ายน ้าที่สนามหลังบ้าน)"},{"n":55,"q":"David offered ________ the lawn for Cranny Smith, living next door.","o":["to mow","mow","mowed","mowing"],"a":1,"e":"กริยาที่ตามด้วย to + V1 ได้แก่กริยาต่อไปนี้ afford care happen need refuse agree choose help neglect seem appear consent hesitate offer swear arrange dare hope prepare want ask decide intend pretend wish attempt expect manage promise beg fail mean propose ตัวอย่างประโยค : My aunt agreed to give me a ride. (ป้าตกลงที่จะไปส่งฉัน) : We intended to leave early. (เราตั้งใจจะออกแต่เช้า) : He seemed to know the fact. (ดูเหมือนเขาจะรู้ความจริง)"},{"n":56,"q":"Lack of communication ________ misunderstandings.","o":["results of","asks of","leads to","looks for"],"a":3,"e":"คำกริยาที่เติมเข้าไปให้ได้ใจความสมบูรณ์กับประโยคที่ให้มา “การขาดการสื่อสารก่อให้เกิดการเข้าใจผิด” กริยา leads to = ก่อให้เกิด / นำไปสู่ / เป็นผล"},{"n":57,"q":"John hates __________ at school.","o":["to bully","bullied","bullying","being bullied"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ โดยทั่วไปแล้วคำกริยา hate, love, like และ prefer (ชอบมากกว่า) มักจะถูกตามด้วย Ving เมื่อต้องการอธิบาย ความหมายทั่ว ๆ ไป ตัวอย่างประโยค : He loves swimming. (เขาชอบการว่ายน ้า ) ดังนั้นข้อนี้ กริยา hate + Ving จึงตอบ bullying"},{"n":58,"q":"The music is as __________ as a starry night sky, where each notes twinkles like a distant star.","o":["beautiful","beautiful that","more beautiful","most beautiful"],"a":1,"e":"ขั้นธรรมดา เปรียบเทียบเท่ากัน ใช้ as_____as ตรงกลางต้องใส่ขั้นธรรมดา ตัวอย่างประโยค : The weather this summer is as bad as last year. (อากาศในช่วงฤดูร้อนนี้แย่พอ ๆ กับในปีที่แล้ว) : These new shoes are not as comfortable as my old ones. (รองเท้าคู่ใหม่ไม่สะดวกสบายเหมือนกับคู่เก่า)"},{"n":59,"q":"The tree houses ________by his father.","o":["made","was made","makes","has made"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ"},{"n":60,"q":"To finish her degree this semester is ________ Sue’s been studying very hard.","o":["the outcome of","the cause of","the reason why","the result of"],"a":3,"e":": การจะเรียนให้ได้รับปริญญาในเทอมนี้ เป็น ________ ซูจึงตั้งใจเรียนมาก (1) เหตุผลว่าทำไม (2) สาเหตุของ (3) ผลลัพธ์ของ (4) ผลลัพธ์ของ ใช้ reason why มีความหมายว่า \"เหตุผลว่าทำไม, สาเหตุว่าทำไม\" หลัง reason why ตามด้วยประธานและคำกริยา ตัวอย่างประโยค : The reason why he left the job was that he got a better offer. (เหตุผลที่ทำไม่เขาลาออกจากงานก็คือเขาได้รับข้อเสนอที่ดีกว่า) : There are many reasons why Jack failed the test. (มีสาเหตุหลายประการว่าทำไมแจ็คไม่ผ่านการทดสอบ)"},{"n":61,"q":"If you drop something, it ___________ to the ground.","o":["falls","fell","had fallen","would fall"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ If S + V1 , S + V1 ตัวอย่างประโยค : If there are fewer products than demand, prices of the products go up. (หากสินค้ามีน้อยกว่าความต้องการ ราคาสินค้าจะสูงขึ้น) : Drinking alcohol is illegal if you are under 18. (การดื่มแอลกอฮอล์เป็นสิ่งผิดกฎหมาย หากคุณมีอายุต ่ากว่า 18 ปี)"},{"n":62,"q":"_________ were you born, Max?","o":["What","Who","Whom","Where"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 14. ประกอบ เป็นประโยคคำถามประเภท Wh-question ใช้ Where ตั้งคำถามเพื่อถามถึงสถานที่ว่า “คุณเกิดที่ไหน,แม็กซ์?"},{"n":63,"q":"Derek invited ____________ close friends to his wedding reception.","o":["little","a lot","a few","the most"],"a":3,"e":"a few เล็กน้อย พอมีอยู่บ้าง ขยายคำนามพหูพจน์ (Plural Noun) few เล็กน้อยมากๆ จนแทบไม่มีเลย a little เล็กน้อย พอมีอยู่บ้าง ขยายคำนามเอกพจน์นับไม่ได้ (Uncountable noun) little เล็กน้อยมากๆ จนแทบไม่มีเลย ตัวอย่างประโยค : I have a few good friends. I'm not lonely. (ฉันมีเพื่อนดี ๆ อยู่บ้าง ฉันไม่เหงา) : She's lucky. She has few problems. (เธอโชคดี เธอแทบไม่มีปัญหาเลย) : They had little money to spend. (พวกเขาแทบไม่มีเงินใช้จ่าย) : I didn't buy that purse because I had a little money. (ฉันไม่ได้ซื้อกระเป๋าสตางค์ใบนั้นเพราะมี่เงินอยู่นิดเดียว)"},{"n":64,"q":"Paul goes to Phuket every year _________ its beautiful beaches.","o":["because of","because","consequently","a consequence of"],"a":1,"e":"ใช้ because เป็นคำขึ้นต้น Adverb Clause of Reason (อนุประโยคแสดง-เหตุผล) มีความหมายว่า \"เพราะ เพราะว่า เนื่องจาก\" หลัง because ตามด้วยประธานและคำกริยา ส่วน because of เป็นคำบุพบท (Preposition) มี ความหมายเช่นเดียวกับ because หลัง because of ตามด้วยคำนาม (Noun) หรือกลุ่มคำนาม (Noun Phrase) หรือถ้าหาก เป็นคำกริยาต้องเป็นคำกริยาที่อยู่ในรูป V.ing because + Subject + Verb because of + Noun / Pronoun/ V.ing ตัวอย่างประโยค : He crashed his car because he was driving too fast. (เขาขับรถชน เพราะเขาขับเร็วเกินไป) : We had to cancel the party because of bad weather. (เราต้องยกเลิกงานปาร์ตี้ เนื่องจากสภาพอากาศไม่ค่อยดี)"},{"n":65,"q":"The book on the left is mine, and the one on the right is ________.","o":["your","his","them","her"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 2. ประกอบ"},{"n":66,"q":"________you like seafood, Dan?","o":["Do","Are","Why","What"],"a":1,"e":"คำถามประเภท Yes-No Questions คือ ประโยคคำถามที่ต้องการคำตอบว่า Yes (ใช่) หรือ No (ไม่ใช่) ตัวอย่างประโยค คำถาม Yes-No Questions ที่ขึ้นต้นด้วย Verb to be : Is your daughter going to the zoo? (ลูกสาวของคุณไปสวนสัตว์ไหม) : Are they your kids? (พวกเขาเป็นลูกของคุณหรือเปล่า) : Was he waiting for me at the bus stop? (เขากำลังรอฉันอยู่ที่ป้ายรถเมล์เหรอ) ตัวอย่างประโยค คำถาม Yes-No Questions ที่ขึ้นต้นด้วย Verb to do : Do you speak French? (คุณพูดภาษาฝรั่งเศสหรือเปล่า) : Does she know h
