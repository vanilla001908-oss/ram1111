<!DOCTYPE html>

<head>

<title>ฝึกทำข้อสอบ RAM1111</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f6f3;--sf:#fff;--tx:#1f2328;--mu:#656d76;--bd:#e1ded8;--ac:#2f6f5e;--act:#fff;--okb:#e3f4e8;--ok:#1d7a3e;--badb:#fbe5e3;--bad:#b3261e;--seb:#e7f0ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--sf:#202325;--tx:#e8eaec;--mu:#9aa3ab;--bd:#33383c;--ac:#5fb59d;--act:#10201b;--okb:#17301f;--ok:#6fd08c;--badb:#3a1c1a;--bad:#ff8a80;--seb:#1d2f2a}}
:root[data-theme="dark"]{--bg:#16181a;--sf:#202325;--tx:#e8eaec;--mu:#9aa3ab;--bd:#33383c;--ac:#5fb59d;--act:#10201b;--okb:#17301f;--ok:#6fd08c;--badb:#3a1c1a;--bad:#ff8a80;--seb:#1d2f2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 "Sarabun",system-ui,"Noto Sans Thai",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.35rem;margin:8px 0 2px}h2{font-size:1.1rem;margin:20px 0 8px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 14px}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:var(--act);font-weight:600}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--bd);font-weight:400}
.btn[disabled]{opacity:.4;cursor:default}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.ctx{background:var(--seb);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.95rem}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 13px;margin:8px 0}
.opt b{min-width:1.6em;color:var(--mu)}
.opt.sel{border-color:var(--ac);background:var(--seb)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.ex{background:var(--sf);border-left:4px solid var(--ac);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.res{font-weight:600}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.score{font-size:2.6rem;font-weight:700;text-align:center;margin:8px 0 0}
details{margin-top:6px}summary{cursor:pointer;color:var(--ac)}
footer{margin-top:28px;text-align:center}
</style>
</head>

<main id="app"></main>
<script>
const D=[{"title":"ภาค S ปีการศึกษา 2568","items":[{"n":1,"q":"These books __________ very interesting.","o":["was","are","is","be"],"a":2,"e":"ประธานของประโยคคือ \"These books\" (หนังสือเหล่านี้) ซึ่งเป็นคำนามพหูพจน์ (มีหนังสือหลายเล่ม สังเกต จากการใช้ These และการเติม -s ที่คำว่า books) ดังนั้น กริยา (Verb to be) ที่นำมาใช้ร่วมกันในประโยคบอกเล่า เหตุการณ์ปัจจุบัน จึงต้องเป็นรูปพหูพจน์ ซึ่งก็คือ are เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) was เป็นรูปอดีตของกริยาเอกพจน์ (ใช้กับประธานที่เป็นเอกพจน์ เช่น He, She, It, I ในรูปอดีต) (3) is เป็นรูปปัจจุบันของกริยาเอกพจน์ (ใช้กับประธานที่มีสิ่งเดียว เช่น This book is...) (4) be เป็นรูปฐาน (Infinitive) จะไม่นำมาวางตามหลังประธานโดยตรงในประโยคบอกเล่าทั่วไปแบบนี้ หากไม่มี คำกริยาช่วยอื่นนำหน้า (เช่น will be)"},{"n":2,"q":"__________ you lend me your pen for a moment?","o":["Could","Must","Shall","Need"],"a":1,"e":"ประโยคนี้เป็นประโยคขอร้องอย่างสุภาพ (Polite Request) ในสถานการณ์ชีวิตประจำวัน เพื่อขอยืมปากกาจาก คู่สนทนาชั่วคราว การใช้ Could นำหน้าประโยคคำถาม ถือเป็นโครงสร้างที่เป็นทางการ มีความสุภาพ และเหมาะสม ที่สุดในบริบทนี้ Could you + กริยาช่อง 1 (ไม่เติมอะไรเลย) + ...? ใช้สำหรับการขอความช่วยเหลือหรือขอร้องบุคคลอื่นด้วย ความนอบน้อม เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) Must แปลว่า \"ต้อง\" (แสดงความจำเป็นหรือคำสั่ง) หากใช้จะกลายเป็นการบังคับ เช่น Must you lend me... (เธอจำเป็นต้องให้ฉันยืมปากกาไหม) ซึ่งไม่เหมาะกับบริบทการขอความช่วยเหลือ (3) Shall มักใช้ในประโยคเสนอแนะ ประโยคชักชวน หรือแสดงเจตนาในอนาคต โดยนิยมใช้กับประธาน I หรือ We เท่านั้น (เช่น Shall we go?) ไม่นิยมใช้ Shall you... ในกรณีนี้ (4) Need แปลว่า \"จำเป็นต้อง\" มักใช้เพื่อถามความจำเป็นในการทำสิ่งใดสิ่งหนึ่ง ไม่ใช่โครงสร้างสำหรับการ ขอร้องอย่างสุภาพ ตัวอย่างประโยคเพิ่มเติมเพื่อความเข้าใจ - การใช้ Could เพื่อขอร้องอย่างสุภาพ : Could you lend me your pen for a moment? (คุณพอจะให้ฉันยืม ปากกาสักครู่ได้ไหม) - การใช้ Could ในสถานการณ์อื่นๆ ในชีวิตประจำวัน : Could you please open the door? (คุณช่วยกรุณาเปิด ประตูให้หน่อยได้ไหม)"},{"n":3,"q":"Amanda likes to play ________ chess with her grandfather every evening.","o":["a","an","the","(blank)"],"a":4,"e":"ในหลักไวยากรณ์ภาษาอังกฤษ จะไม่ใช้ Article (a, an, the) นำหน้าชื่อกีฬา เกม หรือกิจกรรมนันทนาการ ทุก ประเภท เช่น chess (หมากรุก), football (ฟุตบอล), tennis (เทนนิส) หรือ cards (ไพ่) ดังนั้น หน้าคำว่า chess จึงไม่ต้อง เติมสิ่งใดลงในช่องว่าง โครงสร้าง : Subject + play + ชื่อกีฬา/เกม (ไม่มี Article) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) a และ (2) an เป็น Indefinite Article ใช้สำหรับนำหน้าคำนามนับได้เอกพจน์ทั่วไป ไม่ใช้กับชื่อเฉพาะของ กีฬาหรือเกม (3) the เป็น Definite Article ใช้สำหรับชี้เฉพาะเจาะจง หรือนำหน้าเครื่องดนตรี (เช่น play the piano) แต่จะไม่ใช้ นำหน้าชื่อกีฬาหรือเกมในบริบททั่วไป"},{"n":4,"q":"Dad __________ the lawn now. He should finish in an hour.","o":["mows","mowed","is mowing","was mowing"],"a":3,"e":"ในประโยคมีคำบ่งบอกเวลา (Time Expression) คือคำว่า \"now\" (ตอนนี้/ขณะนี้) ซึ่งเป็นตัวบ่งชี้อย่างชัดเจนว่า เหตุการณ์นี้กำลังดำเนินอยู่ ณ ปัจจุบัน จึงต้องใช้โครงสร้างไวยากรณ์ Present Continuous Tense โครงสร้าง : Subject (Dad) + is/am/are (is) + Verb-ing (mowing) โจทย์ : Dad is mowing the lawn now. (คุณพ่อกำลังตัดหญ้าอยู่ที่สนามในตอนนี้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) mows เป็น Present Simple Tense ใช้กับเหตุการณ์ที่เป็นข้อเท็จจริงทั่วไป หรือตารางเวลาที่เกิดขึ้นเป็นประจำ ไม่เหมาะกับคำว่า \"now\" ในบริบทนี้ (2) mowed เป็น Past Simple Tense (กริยาช่อง 2) ใช้กับเหตุการณ์ที่จบลงไปแล้วในอดีต ขัดแย้งกับคำว่า \"now\" และประโยคถัดไปที่บอกว่าควรจะเสร็จในอีก 1 ชั่วโมง (4) was mowing เป็น Past Continuous Tense ใช้ระบุถึงเหตุการณ์ที่กำลังเกิดขึ้น ณ ช่วงเวลาใดช่วงเวลาหนึ่งใน อดีต ไม่ใช่ปัจจุบัน"},{"n":5,"q":"The cruise is _________ than the flight.","o":["as relaxing","more relaxing","the more relaxing","the most relaxing"],"a":2,"e":"ประโยคนี้เป็นการเปรียบเทียบขั้นกว่า (Comparative Degree) ระหว่างสิ่งสองสิ่ง คือ \"The cruise\" (การล่องเรือ สำราญ) และ \"the flight\" (การเดินทางด้วยเครื่องบิน) โดยมีคำเชื่อมคือ \"than\" (กว่า) เป็นตัวบ่งชี้ชัดเจนว่าต้องใช้ โครงสร้างคำคุณศัพท์ (Adjective) ในรูปขั้นกว่า คำคุณศัพท์ คือ \"relaxing\" เป็นคำยาว (มี 3 พยางค์) การทำเป็นขั้นกว่าจึงต้องเติมคำว่า more ไว้ข้างหน้า โครงสร้าง : Subject + V. to be + more + Adjective (คำยาว) + than + Object โจทย์ : The cruise is more relaxing than the flight. (การล่องเรือสำราญให้ความรู้สึกผ่อนคลายมากกว่าการ เดินทางด้วยเครื่องบิน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) as relaxing เป็นโครงสร้างของการเปรียบเทียบขั้นเท่า (Positive Degree) ซึ่งต้องใช้ในรูป as...as (เช่น as relaxing as) ไม่ใช้ร่วมกับคำว่า than (3) the more relaxing โดยทั่วไปโครงสร้างขั้นกว่าจะไม่ใส่ article \"the\" นำหน้า more (ยกเว้นโครงสร้างพิเศษ เช่น The more..., the more... ซึ่งไม่เข้ากับบริบทนี้) (4) the most relaxing เป็นการเปรียบเทียบขั้นสูงสุด (Superlative Degree) ใช้เปรียบเทียบสิ่งของตั้งแต่ 3 สิ่งขึ้นไป และไม่ใช้คู่กับคำว่า than"},{"n":6,"q":"You __________ forget to lock the door when you leave.","o":["might not","couldn’t","wouldn’t","shouldn’t"],"a":4,"e":"ประโยคนี้เป็นการให้คำแนะนำ (Advice) หรือข้อเตือนใจในชีวิตประจำวัน เพื่อไม่ให้ละเลยการล็อกประตูเมื่อ ออกจากบ้าน คำกริยานุเคราะห์ (Modal Verb) ที่เหมาะสมที่สุดในการให้คำแนะนำเชิงตักเตือนว่า \"ไม่ควรทำ\" คือ shouldn't (should not) โครงสร้าง : Subject + shouldn't + กริยาช่อง 1 (ไม่เติมอะไรเลย) โจทย์ : You shouldn’t forget to lock the door when you leave. (คุณไม่ควรลืมล็อกประตูเมื่อคุณออกไป) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) might not แปลว่า \"อาจจะไม่\" ใช้แสดงความไม่แน่นอนในอนาคต (เช่น You might not see him... คุณอาจจะไม่ เจอเขา) ไม่เหมาะกับบริบทการเตือนให้ทำหน้าที่สำคัญ (2) couldn’t แปลว่า \"ไม่สามารถ\" ใช้บอกความสามารถในอดีต หรือเหตุการณ์ที่เป็นไปไม่ได้ (เช่น I couldn't open the window. ฉันไม่สามารถเปิดหน้าต่างได้ในตอนนั้น) (3) wouldn’t แปลว่า \"จะไม่\" มักใช้ในโครงสร้างเงื่อนไข (Conditional Clause) หรือบอกความตั้งใจในอดีต ไม่ได้ ใช้ในการให้คำแนะนำทั่วไป"},{"n":7,"q":"You __________ wear formal clothes. It’s a casual event.","o":["won’t","may not","needn’t","mustn’t"],"a":3,"e":"ประโยคด้านหลังระบุบริบทอย่างชัดเจนว่า \"It’s a casual event.\" (มันเป็นงานแบบสบายๆ ไม่เป็นทางการ) แสดงว่างานนี้ไม่มีกฎเกณฑ์บังคับ ผู้เข้าร่วมงานไม่มีความจำเป็นต้องแต่งกายด้วยชุดสุภาพเป็นทางการ คำกริยานุ เคราะห์ (Modal Verb) ที่ใช้บอกว่า \"ไม่มีความจำเป็นต้องทำ\" คือ needn't (need not) โครงสร้าง : Subject + needn't + กริยาช่อง 1 (ไม่เติมอะไรเลย) โจทย์ : You needn’t wear formal clothes. (คุณไม่จำเป็นต้องสวมเสื้อผ้าเป็นทางการ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) won’t แปลว่า \"จะไม่\" เป็นการบอกอนาคตหรือปฏิเสธการกระทำ ซึ่งไม่ตรงกับบริบทการบอกเงื่อนไขของงาน (2) may not แปลว่า \"อาจจะไม่\" (แสดงความไม่แน่นอน) หรือ \"ไม่อนุญาตให้\" (การปฏิเสธการขออนุญาตอย่าง สุภาพ) ซึ่งไม่ตรงกับความหมายของการไม่มีความจำเป็น (4) mustn’t แปลว่า \"ต้องไม่\" ใช้ในกรณีที่เป็น ข้อห้ามเด็ดขาด หรือผิดกฎหมาย (Prohibition) หากใช้ในประโยคนี้ จะหมายความว่า \"ห้ามใส่ชุดทางการเด็ดขาด ใครใส่มาจะมีความผิด\" ซึ่งรุนแรงเกินไปสำหรับงานสไตล์ casual ที่เพียง แค่ไม่จำเป็นต้องแต่งทางการเท่านั้น"},{"n":8,"q":"RU’s main campus _______ in Bangkok.","o":["situates","situated","has situated","is situated"],"a":4,"e":"ในหลักภาษาอังกฤษ คำว่า situate เป็นคำกริยาที่แปลว่า \"ตั้งรกราก\" หรือ \"นำไปตั้งไว้\" หากประธานของ ประโยคเป็นสถานที่ (เช่น วิทยาเขต, อาคาร, เมือง) สถานที่เหล่านั้นจะไม่สามารถตั้งตัวเองได้ แต่จะต้อง \"ถูกจัดตั้งอยู่\" จึงจำเป็นต้องใช้โครงสร้าง Passive Voice (ประธานถูกกระทำ/ถูกกำหนดให้ตั้งอยู่) โครงสร้าง : Subject + Verb to be + situated (กริยาช่อง 3) + in/at... โจทย์ : RU’s main campus is situated in Bangkok. (วิทยาเขตหลักของ RU ตั้งอยู่ในกรุงเทพฯ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) situates และ (3) has situated เป็นรูป Active Voice (ประธานเป็นผู้กระทำกริยาเอง) หากเลือกข้อนี้จะแปล ความหมายผิดเพี้ยนเป็น \"วิทยาเขตหลักทำหน้าที่ไปตั้งสิ่งอื่น\" ซึ่งไม่ถูกต้องตามหลักความจริง (2) situated หากวางเดี่ยวๆ หลังประธาน จะทำหน้าที่เป็น Past Simple Tense (กริยาช่อง 2) ซึ่งเป็นรูป Active Voice ในอดีต หรือหากมองเป็นกริยาช่อง 3 ก็จะขาด Verb to be ทำให้โครงสร้างประโยคไม่สมบูรณ์"},{"n":9,"q":"The man _________ lives next door is a doctor.","o":["who","whose","whom","which"],"a":1,"e":"ประโยคนี้เป็นโครงสร้าง Relative Clause (ประโยคคุณศัพท์ที่ทำหน้าที่ขยายคำนาม) โดยมีช่องว่างเพื่อใส่ Relative Pronoun (คำสรรพนามเชื่อมประโยค) เพื่อขอยายคำนามข้างหน้าคือ \"The man\" (ผู้ชายคนนั้น) ซึ่งเป็นบุคคล เมื่อพิจารณาส่วนที่ตามมาข้างหลังช่องว่าง คือคำว่า \"lives\" (เป็นคำกริยา) แสดงว่าสรรพนามเชื่อมที่นำมาเติมนี้ ต้องทำหน้าที่เป็นประธานของประโยคย่อยด้วย ตามกฎไวยากรณ์จึงต้องใช้ who โครงสร้าง : คำนามที่เป็นคน + who + คำกริยา (Verb) โจทย์ : The man who lives next door is a doctor. (ผู้ชายคนที่อาศัยอยู่บ้านข้างๆ เป็นหมอ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) whose ใช้เพื่อแสดงความเป็นเจ้าของ จะต้องตามหลังด้วยคำนามเสมอ (เช่น The man whose car... ผู้ชายคนที่ รถของเขา...) (3) whom ใช้แทนบุคคลเช่นกัน แต่ทำหน้าที่เป็น กรรม ของประโยคย่อย ด้านหลังจึงต้องตามด้วยประธานและ กริยา (เช่น The man whom I met... ผู้ชายคนคี่ฉันเจอ...) (4) which ใช้แทนสิ่งของ สัตว์ หรือสถานที่ ไม่ใช้แทนบุคคล"},{"n":10,"q":"_________ a second language opens many career opportunities.","o":["Learn","Learned","Learning","To learned"],"a":3,"e":"ประโยคนี้ขาด \"ประธาน (Subject)\" เนื่องจากคำที่อยู่ถัดจากช่องว่างคือคำว่า opens ซึ่งทำหน้าที่เป็นคำ กริยาหลักของประโยค ตามหลักไวยากรณ์ภาษาอังกฤษ เมื่อต้องการนำคำกริยามาทำหน้าที่เป็นคำนามเพื่อเป็นประธานของประโยค จะต้องเปลี่ยนรูปให้อยู่ในรูปของ Gerund (กริยาเติม -ing) ซึ่งทำหน้าที่เหมือนคำนาม แปลว่า \"การ...\" หรือ \"ความ...\" โครงสร้าง : Gerund (Verb-ing) + Singular Verb (กริยาเอกพจน์) + ..... โจทย์ : Learning a second language opens many career opportunities. (การเรียนภาษาที่สองช่วยเปิดโอกาส ทางอาชีพมากมาย) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Learn เป็นคำกริยารูปฐาน (Infinitive) ไม่สามารถนำมาวางเดี่ยวๆ เป็นประธานของประโยคในลักษณะนี้ได้ (หากต้องการใช้ในรูปกริยาฐาน ต้องมี To นำหน้าเป็น To learn ซึ่งคำว่า To learn สามารถเป็นประธานได้ แต่ไม่มีใน ตัวเลือก) (2) Learned เป็นกริยาช่อง 2 หรือช่อง 3 ไม่สามารถทำหน้าที่เป็นประธานของประโยคได้ (4) To learned เป็นโครงสร้างที่ผิดหลักไวยากรณ์อย่างสิ้นเชิง เนื่องจากหลังคำว่า To (ในกรณีที่เป็น Infinitive) จะต้องตามด้วยคำกริยารูปฐานที่ไม่เติมแต่งใดๆ เท่านั้น (ต้องเป็น To learn ไม่ใช่ To learned)"},{"n":11,"q":"Judy ________ two job interviews last week.","o":["has","had","have","will have"],"a":2,"e":"ในประโยคมีคำบ่งบอกเวลาในอดีต (Time Expression) คือคำว่า \"last week\" (สัปดาห์ที่แล้ว) ซึ่งเป็นตัวชี้วัด อย่างชัดเจนว่าเหตุการณ์นี้ได้เกิดขึ้นและสิ้นสุดลงไปแล้วในอดีต โครงสร้างไวยากรณ์ที่ต้องนำมาใช้จึงเป็น Past Simple Tense โครงสร้าง : Subject + Verb ช่อง 2 คำกริยาในข้อนี้คือประธานมี (have/has) ซึ่งรูปช่องที่ 2 ของกริยากลุ่มนี้คือคำว่า had (ใช้ได้กับประธานทุกพจน์ ในรูปอดีต) โจทย์ : Judy had two job interviews last week. (จูดี้มีการสัมภาษณ์งานสองที่เมื่อสัปดาห์ที่แล้ว) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) has เป็นกริยาช่องที่ 1 ใช้กับประธานเอกพจน์ในเหตุการณ์ที่เป็นปัจจุบัน ขัดแย้งกับคำว่า \"last week\" (3) have เป็นกริยาช่องที่ 1 ใช้กับประธานพหูพจน์หรือ I/You ในเหตุการณ์ที่เป็นปัจจุบัน (4) will have เป็น Future Simple Tense ใช้กับเหตุการณ์ที่จะเกิดขึ้นในอนาคต ไม่สามารถใช้กับอดีตได้"},{"n":12,"q":"Paris is ________ city in the tour package.","o":["romantic","more romantic","most romantic","the most romantic"],"a":4,"e":"เป็นการเปรียบเทียบคำคุณศัพท์(Adj.) ซึ่งมีหลักอยู่3ขั้นคือ 1. ขั้นธรรมดา เปรียบเทียบเท่ากันใช้ as...........as ตรงกลางต้องใส่ขั้นธรรมดา 2. ขั้นกว่า เปรียบเทียบของ 2 อย่าง/คน/สิ่ง เช่นเจอคำว่า of the two หรือ......than (ออกทุกเทอมนะ) เห็น than ให้ตอบ ข้างหน้าขั้นกว่าได้เลย 3. ขั้นสุด เป็นการเปรียบเทียบของ 3 สิ่ง/อย่าง/คนหรือมากกว่า3ขึ้นไป มีให้สังเกต เช่นเจอคำว่า of all (ของทั้งหมด), in + สถานที่ เช่น in the village (ในหมู่บ้าน เปรียบเทียบกับกลุ่มคนทั้งหมู่บ้าน) in the world (ในโลก) in the family (ใน ครอบครัว), of the three, หรือคำว่า I’ve ever seen (เท่าที่ฉันเคยเห็น) I’ve ever met (เท่าที่ฉันเคยเจอ) I know (ที่ฉันรู้) of the decade (ในรอบ 10 ปี) in the tour packages (ในกลุ่มทัวร์) จากคำคุณศัพท์ romantic หลายพยางค์ใส่ most และมี the ด้วยเป็น the most romantic"},{"n":13,"q":"________ is Harris? He’s like a telephone pole to me.","o":["Why","What","How tall","Where"],"a":3,"e":"ประโยคที่สองระบุการเปรียบเทียบ ว่า \"He’s like a telephone pole to me.\" (เขาเหมือนเสาไฟฟ้าสำหรับฉันเลย) ซึ่งเป็นการเปรียบเปรยถึงเรื่อง \"ความสูง\" ของบุคคล คำปุจฉาสรรพนาม (Question Word) ที่ใช้ในการถามเกี่ยวกับ ส่วนสูงของคนหรือความสูงของสิ่งก่อสร้างคือ How tall โครงสร้าง : How tall + verb to be + Subject? โจทย์ : How tall is Harris? (แฮร์ริสสูงเท่าไร) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Why แปลว่า \"ทำไม\" ใช้ถามหาเหตุผล (คำตอบมักขึ้นต้นด้วย Because) ไม่สัมพันธ์กับการเปรียบเทียบเรื่อง เสาไฟฟ้า (2) What แปลว่า \"อะไร\" ใช้ถามเกี่ยวกับสิ่งของ อาชีพ หรือลักษณะทั่วไป (เช่น What is Harris like? แฮร์ริสมี นิสัย/ลักษณะอย่างไร) แต่คำตอบในโจทย์เน้นที่ความสูงชัดเจน (4) Where แปลว่า \"ที่ไหน\" ใช้ถามเกี่ยวกับสถานที่หรือตำแหน่งที่อยู่"},{"n":14,"q":"This castle _________ to the public since 1957.","o":["opened","is opening","has opened","has been opened"],"a":4,"e":"ในประโยคมีคำชี้กลุ่มเวลา คือ \"since 1957\" (ตั้งแต่ปี ค.ศ. 1957) ซึ่งเป็นตัวบ่งชี้ของ Present Perfect Tense (เหตุการณ์ที่เกิดขึ้นตั้งแต่อดีตและดำเนินต่อเนื่องมาจนถึงปัจจุบัน) นอกจากนี้ ประธานของประโยคคือ \"This castle\" (ปราสาทแห่งนี้) เป็นสิ่งก่อสร้างที่ไม่สามารถทำกริยาเปิดตัว เองได้ แต่จะต้อง \"ถูกเปิด\" ให้สาธารณชนเข้าชม จึงต้องใช้โครงสร้าง Present Perfect ในรูป Passive Voice (ประธานถูก กระทำ) โครงสร้าง : Subject + has/have + been + Verb ช่อง 3 โจทย์ : This castle has been opened to the public since 1957. (ปราสาทแห่งนี้ถูกเปิดให้สาธารณชนเข้าชม มาตั้งแต่ปี 1957) (และปัจจุบันก็ยังเปิดอยู่) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) opened เป็น Past Simple Tense ในรูป Active Voice ใช้กับเหตุการณ์ที่จบลงไปแล้วในอดีต และไม่ได้แสดง ความหมายว่าถูกเปิด (2) is opening เป็น Present Continuous Tense ใช้กับเหตุการณ์ที่กำลังเกิดขึ้น ณ ตอนนี้ ไม่ใช้คู่กับคำว่า since เพื่อ บอกช่วงเวลายาวนานแบบนี้ (3) has opened แม้จะเป็น Present Perfect Tense แต่เป็นรูป Active Voice (ประธานทำเอง) หากเลือกข้อนี้จะ แปลว่า ปราสาททำหน้าที่เดินไปเปิดสิ่งอื่น ซึ่งผิดความหมายและผิดหลักความจริง"},{"n":15,"q":"It was a long journey from Birmingham to London, _______ I’m really tired now.","o":["since","so","however","for"],"a":2,"e":"ประโยคนี้ประกอบด้วยประโยคย่อย 2 ประโยคที่มีความสัมพันธ์เชิง \"เป็นเหตุเป็นผลกัน\" (Cause and Effect) ประโยคเหตุ : It was a long journey from Birmingham to London (มันเป็นการเดินทางที่ยาวนานจากเบอร์มิ งแฮมไปลอนดอน) ประโยคผล : I’m really tired now (ตอนนี้ฉันเหนื่อยมาก) คำเชื่อม (Conjunction) ที่ใช้สำหรับนำหน้าประโยคที่เป็นผลลัพธ์เพื่อแสดงความหมายว่า \"ดังนั้น\" คือคำว่า so โครงสร้าง : ประโยคเหตุ, so + ประโยคผล โจทย์ : It was a long journey from Birmingham to London, so I’m really tired now. (มันเป็นการเดินทางที่ ยาวนานจากเบอร์มิงแฮมไปลอนดอน ดังนั้นตอนนี้ฉันจึงเหนื่อยมาก) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) since และ (4) for ในบริบทของการเชื่อมประโยค ทั้งสองคำนี้ทำหน้าที่คล้ายคำว่า because ซึ่งแปลว่า \"เพราะว่า/เนื่องจาก\" ใช้สำหรับนำหน้าประโยคที่เป็น เหตุ (เช่น I’m really tired now since/for it was a long journey...) จึงไม่สามารถนำมาใช้นำหน้าประโยคผลในข้อนี้ได้ (3) however แปลว่า \"อย่างไรก็ตาม\" ใช้เชื่อมประโยคที่มีเนื้อหา ขัดแย้งกัน (Concession/Contrast) ซึ่งขัดกับบริบท ที่เป็นเหตุเป็นผลของโจทย์ข้อนี้"},{"n":16,"q":"Be careful! You ______ fall if you’re not careful.","o":["might","have to","should","would"],"a":1,"e":"ประโยคนี้เป็นการแจ้งเตือนให้ระมัดระวังเกี่ยวกับอุบัติเหตุ หรือเหตุการณ์ที่ \"อาจจะ\" เกิดขึ้นได้ในอนาคตอัน ใกล้ คำกริยานุเคราะห์ (Modal Verb) ที่ใช้เพื่อแสดงความไม่แน่นอน ความเป็นไปได้ หรือการคาดการณ์เหตุการณ์ ล่วงหน้า คือคำว่า might (หรือ may) โครงสร้าง : Subject + might + กริยาช่อง 1 (ไม่เติมอะไรเลย) โจทย์ : You might fall if you’re not careful. (คุณอาจจะตกลงมาได้นะถ้าคุณไม่ระวัง) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) have to แปลว่า \"ต้อง\" (แสดงความจำเป็นหรือการบังคับตามกฎเกณฑ์) หากใช้ในประโยคนี้จะความหมาย ผิดเพี้ยนเป็น \"คุณจำเป็นต้องตกลงมาถ้าคุณไม่ระวัง\" ซึ่งไม่ถูกต้อง (3) should แปลว่า \"ควรจะ\" ใช้สำหรับการให้คำแนะนำหรือตักเตือนในสิ่งที่เป็นประโยชน์ หากใช้ในประโยคนี้ จะกลายเป็นการแนะนำว่าควรจะตกลงมา ซึ่งผิดบริบท (4) would แปลว่า \"จะ\" มักใช้ในโครงสร้างประโยคเงื่อนไขที่เป็นการสมมติเหตุการณ์ที่เป็นไปไม่ได้ในปัจจุบัน (If-Clause Type 2) แต่ประโยคนี้ใช้โครงสร้าง if you're not careful (Present Simple) ซึ่งเป็นเงื่อนไขที่มีโอกาสเกิดขึ้น จริงในปัจจุบัน/อนาคต (If-Clause Type 1) จึงไม่ใช้คู่กับ would"},{"n":17,"q":"The lights went out while we _______ TV.","o":["watch","will watch","watched","were watching"],"a":4,"e":"ประโยคนี้เป็นโครงสร้างการเกิดร่วมกันของ 2 เหตุการณ์ในอดีต (Past Actions) โดยมีคำเชื่อมคือ \"while\" (ในขณะที่) เป็นตัวเชื่อมโยง เหตุการณ์ที่ 1 (กำลังดำเนินอยู่) : เป็นเหตุการณ์ที่เกิดขึ้นอย่างต่อเนื่องในอดีต ต้องใช้ Past Continuous Tense (Subject + was/were + Verb-ing) เหตุการณ์ที่ 2 (เข้ามาแทรก) : เป็นเหตุการณ์ที่เกิดขึ้นสั้นๆ และเข้ามาแทรกขัดจังหวะ ต้องใช้ Past Simple Tense (Subject + Verb ช่อง 2) ในโจทย์นี้ เหตุการณ์ที่เข้ามาแทรกคือ The lights went out (ไฟดับ - ใช้กริยาช่อง 2 คือ went) ดังนั้น เหตุการณ์ที่ กำลังดำเนินอยู่ก่อนหน้านั้นคือการดูโทรทัศน์ จึงต้องเลือก were watching ให้สอดคล้องกับประธานพหูพจน์ \"we\" โครงสร้างพบบ่อย : Past Simple + while + Past Continuous โจทย์ : The lights went out while we were watching TV. (ไฟได้ดับลงในขณะที่พวกเรากำลังดูโทรทัศน์อยู่) สูตร : ตรงกับสูตรที่ 1 เพราะ went เป็น V2 1. S + V2 while/as S + was/were Ving 2. S + was/were Ving while/as S + was/were Ving 3. S + is/am/are +Ving while/as S + is/am/are Ving 4. While S + was/were Ving , S + was/were Ving"},{"n":18,"q":"Bill let his sister ________ his iPad yesterday.","o":["use","to use","using","used"],"a":1,"e":"ประโยคนี้ใช้คำกริยาพิเศษ คือคำว่า \"let\" ซึ่งจัดอยู่ในกลุ่ม Causative Verb (กริยาสั่งการหรืออนุญาต) ตาม กฎไวยากรณ์ภาษาอังกฤษ เมื่อใช้คำว่า let ในความหมายว่า \"อนุญาตให้ใครทำบางสิ่ง\" โครงสร้างประโยคจะต้องตาม ด้วย Infinitive without to (คำกริยารูปฐานที่ไม่เติมแต่งและไม่มี to นำหน้า) เสมอ โดยไม่ต้องคำนึงถึงประธานหรือตัว บ่งชี้เวลา (แม้ในโจทย์จะมีคำว่า yesterday ก็ตาม) โครงสร้าง : Subject + let + Someone + Verb รูปฐาน (ช่อง 1 ไม่เติมอะไรเลย) โจทย์ : Bill let his sister use his iPad yesterday. (บิลอนุญาตให้น้องสาวของเขาใช้ไอแพดของเขาเมื่อวานนี้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) to use ผิดหลักไวยากรณ์ เนื่องจากคำว่า let จะไม่ใช้คู่กับกริยาที่มี to นำหน้า (ต่างจากคำว่า allow เช่น Bill allowed his sister to use...) (3) using เป็นรูป Gerund/Participle ไม่สามารถวางตามหลังโครงสร้างของคำว่า let ในลักษณะนี้ได้ (4) used แม้ประโยคจะมีคำว่า yesterday ที่บอกความเป็นอดีต (ซึ่งคำว่า let ในโจทย์ก็เป็นกริยาช่อง 2 อยู่แล้ว) แต่ กริยาตัวที่สองที่ตามหลังโครงสร้าง let + someone จะต้องคงรูปฐานไว้เสมอ ห้ามเปลี่ยนเป็นกริยาช่อง 2 หรือช่อง 3"},{"n":19,"q":"The ________of too much exposure to PM 2.5 can be asthma and heart disease.","o":["cause","due","reason","result"],"a":4,"e":"ประโยคนี้เป็นการระบุความสัมพันธ์เชิงเหตุและผล โดยพิจารณาจากบริบทและตัวเชื่อมความหมายดังนี้ เหตุ : too much exposure to PM 2.5 (การได้รับฝุ่น PM 2.5 มากเกินไป) ผล : asthma and heart disease (โรคหอบหืดและโรคหัวใจ) เมื่อประโยคระบุว่า \"โรคหอบหืดและโรคหัวใจ\" คือสิ่งที่จะเกิดขึ้นตามมาหลังจากการได้รับฝุ่น PM 2.5 คำศัพท์ ที่ถูกต้องและเหมาะสมที่สุดในการทำหน้าที่เป็นประธานเพื่อแสดงความหมายว่า \"ผลลัพธ์ / ผลที่ตามมา\" คือคำว่า result โครงสร้าง : The result of + [สาเหตุ] + is/can be + [ผลลัพธ์ที่ตามมา] โจทย์ : The result of too much exposure to PM 2.5 can be asthma and heart disease. (ผลของการได้รับฝุ่น PM 2.5 มากเกินไปอาจก่อให้เกิดโรคหอบหืดและโรคหัวใจได้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) cause แปลว่า \"สาเหตุ\" หากเลือกข้อนี้ ความหมายจะกลับกันเป็น \"สาเหตุของการได้รับฝุ่น PM 2.5 คือโรคหอบ หืด\" ซึ่งผิดหลักความจริง (2) due มักใช้ในโครงสร้าง due to ซึ่งทำหน้าที่เป็นคำบุพบทแปลว่า \"เนื่องมาจาก\" ไม่สามารถนำมาใช้วางเดี่ยวๆ หลัง article \"The\" ในบริบทนี้ได้ (3) reason แปลว่า \"เหตุผล\" ใช้เพื่ออธิบายเจตนาหรือที่มาของเหตุการณ์ มักใช้คู่กับคำเชื่อม for (เช่น reason for...) และมีความหมายขัดแย้งกับบริบทที่ต้องการสื่อถึงผลลัพธ์ทางสุขภาพ"},{"n":20,"q":"Tony’s 15-year-old fence _________ next week by his sons.","o":["will be replaced","will replace","is replacing","replaces"],"a":1,"e":"ประโยคนี้มีตัวชี้วัดสองส่วนสำคัญที่ช่วยในการเลือกคำตอบที่ถูกต้อง 1. ตัวชี้บอกเวลา (Time Expression) : คำว่า \"next week\" (สัปดาห์หน้า) ระบุชัดเจนว่าเหตุการณ์นี้จะเกิดขึ้นใน อนาคต จึงต้องใช้โครงสร้าง Future Tense (มีคำว่า will) 2.โครงสร้างประธานถูกกระทำ (Passive Voice) : ประธานของประโยคคือ \"Tony’s 15-year-old fence\" (รั้วอายุ 15 ปี ของโทนี่) ซึ่งเป็นสิ่งของ ไม่สามารถซ่อมแซมหรือเปลี่ยนใหม่ด้วยตัวเองได้ ประกอบกับมีส่วนขยายด้านหลังคือ \"by his sons\" (โดยลูกชายของเขา) แสดงให้เห็นชัดเจนว่ารั้วนี้ต้องถูกเปลี่ยน โครงสร้าง Future Passive Voice : Subject + will be + Verb ช่อง 3 โจทย์ : Tony’s 15-year-old fence will be replaced next week by his sons. (รั้วอายุ 15 ปีของโทนี่จะถูก เปลี่ยนใหม่ในสัปดาห์หน้าโดยลูกชายของเขา) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) will replace แม้จะเป็นรูปอนาคต แต่เป็น Active Voice (ประธานทำกริยาเอง) หากเลือกข้อนี้จะแปลว่า รั้วจะ เดินไปทำการเปลี่ยนสิ่งอื่น ซึ่งผิดความหมาย (3) is replacing เป็น Present Continuous Tense และ (4) replaces เป็น Present Simple Tense ซึ่งทั้งคู่เป็นรูป ปัจจุบัน ไม่สอดคล้องกับคำระบุเวลาอนาคต \"next week\" ในโจทย์"},{"n":21,"q":"Floyd’s hair needs _______. It’s too long and out of shape!","o":["to trim","trims","to be trimmed","trimmed"],"a":3,"e":"ประโยคนี้ใช้กริยาพิเศษ คือคำว่า \"need\" (ต้องการ/จำเป็นต้อง) และมีประธานของประโยคคือ \"Floyd’s hair\" (เส้นผมของฟลอยด์) ซึ่งเป็นสิ่งไม่มีชีวิต ไม่สามารถลุกขึ้นมาเล็มหรือตัดแต่งตัวเองได้ ผมของเขาจึงต้อง \"ถูกเล็ม\" ตามหลักไวยากรณ์ภาษาอังกฤษ เมื่อประธานเป็นสิ่งของหรือสิ่งที่ไม่สามารถทำกริยานั้นได้เอง และใช้ร่วมกับ คำว่า need จะมีโครงสร้างแสดงความหมายว่า \"จำเป็นต้องถูกกระทำ\" 2 รูปแบบที่เป็นที่ยอมรับ 1. need + to be + Verb ช่อง 3 (โครงสร้าง Passive Infinitive) 2. need + Verb-ing (โครงสร้าง Gerund ในความหมาย Passive) โครงสร้าง : Subject (สิ่งของ) + need(s) + to be + Verb ช่อง 3 โจทย์ : Floyd’s hair needs to be trimmed. (ผมของฟลอยด์จำเป็นต้องถูกเล็ม) (เพราะมันยาวและเสียทรงแล้ว) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) to trim เป็นรูป Active (ประธานทำเอง) ถ้าใช้ข้อนี้จะมีความหมายว่า ผมของฟลอยด์จำเป็นต้องไปเล็มสิ่งอื่น ซึ่งผิดความหมายอย่างสิ้นเชิง (2) trims เป็นการเติม -s ที่คำกริยาธรรมดา ไม่สามารถนำมาวางซ้อนหลังคำว่า needs ได้โดยตรง (4) trimmed เป็นกริยาช่อง 2 หรือช่อง 3 โดดๆ ไม่สามารถตามหลังคำว่า needs ได้ทันทีโดยไม่มีคำเชื่อมหรือรูป โครงสร้าง Passive ที่สมบูรณ์ (เช่น ลืมใส่ to be)"},{"n":22,"q":"If we lived closer to each other, we ________up more often.","o":["will meet","could meet","had met","could have meet"],"a":2,"e":"สูตรการใช้ If มี 4 แบบ 1. If S + V1 , S + V1 2. If S + V1 , S + will V1 3. If S + V2 , S + would/could + V1 4. If S + had V3 , S + would have V3 ประโยคนี้เป็นโครงสร้าง If แบบที่ 2 (Second Conditional) ซึ่งใช้สำหรับการสมมติเหตุการณ์ที่เป็นไปไม่ได้ หรือขัดแย้งกับความเป็นจริงในปัจจุบัน วิธีการสังเกตโครงสร้าง ประโยคส่วน If : If we lived closer... คำว่า lived เป็นกริยาช่อง 2 (Past Simple) แสดงชัดเจนว่าเป็น If แบบที่ 2 ประโยคส่วนผลลัพธ์ : ตามกฎไวยากรณ์จะต้องใช้โครงสร้าง would / could / might + กริยาช่อง 1 (รูปฐาน) เมื่อพิจารณาตัวเลือกที่มี คำว่า could meet (could + กริยาช่อง 1) จึงเป็นคำตอบที่ถูกต้องตามโครงสร้างและมีความหมาย สอดคล้องที่สุด โครงสร้าง If แบบที่ 2 : If + Subject + Verb ช่อง 2, Subject + would / could + Verb รูปฐาน โจทย์ : If we lived closer to each other, we could meet up more often. (ถ้าพวกเราอาศัยอยู่ใกล้กันมากกว่านี้ พวกเราคงจะสามารถพบกันได้บ่อยขึ้น) (ความเป็นจริงในปัจจุบันคือ ไม่ได้อยู่ใกล้กัน และไม่ได้เจอกันบ่อย) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) will meet เป็นโครงสร้างของ If แบบที่ 1 (ใช้กับเหตุการณ์ที่เป็นเหตุเป็นผลและมีโอกาสเกิดขึ้นจริงใน ปัจจุบันหรืออนาคต โดยประโยคส่วน If ต้องเป็นกริยาช่อง 1) (3) had met เป็นอดีตสมบูรณ์ (Past Perfect) ไม่ใช่กริยาช่วยสำหรับประโยคแสดงผลลัพธ์ในเงื่อนไข (4) could have meet ผิดหลักไวยากรณ์เนื่องจากคำว่า meet เป็นกริยาช่อง 1 (โครงสร้างที่ถูกต้องของรูปแบบนี้คือ could have met ซึ่งเป็น If แบบที่ 3 ที่ใช้สมมติเหตุการณ์ในอดีต จึงไม่เข้ากับโครงสร้างส่วน If ในโจทย์)"},{"n":23,"q":"________ I help you, sir?","o":["Would","What","How","Can"],"a":4,"e":"ประโยคนี้เป็นประโยคเสนอความช่วยเหลือ (Offering Help) ในสถานการณ์ชีวิตประจำวันหรือการบริการ โดย สังเกตจากการมีคำสรรพนามลงท้ายแสดงความเคารพว่า \"sir\" (ท่าน/คุณผู้ชาย) โครงสร้างมาตรฐานที่เป็นทางการ สุภาพ และนิยมใช้มากที่สุดในบริบทนี้คือการใช้ Can นำหน้าประโยค โจทย์ : Can I help you, sir? (มีอะไรให้ฉันช่วยไหมครับ/ค่ะ หรือ ให้ฉันช่วยคุณไหมครับท่าน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Would มักใช้ในโครงสร้างเสนอสิ่งของหรือชักชวน เช่น Would you like some coffee? หรือหากจะเสนอความ ช่วยเหลือจะนิยมใช้รูป Would you like me to help you? จะไม่ใช้ Would I help you... ในลักษณะนี้ (2) What แปลว่า \"อะไร\" และ (3) How แปลว่า \"อย่างไร\" ทั้งสองคำนี้เป็นคำปุจฉาสรรพนาม (Wh-Questions) หากต้องการนำมาใช้เสนอความช่วยเหลือ จะต้องปรับโครงสร้างประโยคใหม่ เช่น How can I help you? หรือ What can I do for you? ไม่สามารถวางโดดๆ หน้าคำว่า I help you, sir? ได้ เนื่องจากจะทำให้ประโยคผิดหลักไวยากรณ์"},{"n":24,"q":"The ending of the movie was _______ to many viewers.","o":["disappoint","disappointed","to disappoint","disappointing"],"a":4,"e":"ประโยคนี้ต้องการคำคุณศัพท์ (Adjective) มาทำหน้าที่ขยายและบอกลักษณะของประธานคือ \"The ending of the movie\" (ตอนจบของภาพยนตร์) ตามหลักไวยากรณ์ภาษาอังกฤษ คำกริยาที่แสดงความรู้สึก (เช่น disappoint - ทำให้ ผิดหวัง) สามารถเปลี่ยนเป็นคำคุณศัพท์ได้ 2 รูปแบบหลักที่มีความหมายต่างกัน 1. Verb-ing (เติม -ing) : แปลว่า \"น่า...\" ใช้ขยายสิ่งของ สถานการณ์ หรือสิ่งที่เป็นตัวการทำให้เกิดความรู้สึกนั้น 2. Verb-ed (เติม -ed) : แปลว่า \"รู้สึก...\" ใช้ขยายคนหรือสิ่งมีชีวิตที่มีความรู้สึก เนื่องจากประธานในโจทย์คือ \"ตอนจบของภาพยนตร์\" ซึ่งเป็นสิ่งไม่มีชีวิต จึงต้องใช้รูปคำคุณศัพท์ที่แปลว่า \"น่าผิดหวัง\" ซึ่งก็คือ disappointing โครงสร้าง : Subject (สิ่งของ/สถานการณ์) + Verb to be + Adjective-ing (น่า...) โจทย์ : The ending of the movie was disappointing to many viewers. (ตอนจบของภาพยนตร์เรื่องนี้ค่อนข้าง น่าผิดหวังสำหรับผู้ชมจำนวนมาก) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) disappoint เป็นคำกริยารูปฐาน แปลว่า \"ทำให้ผิดหวัง\" ไม่สามารถวางตามหลัง Verb to be (was) เพื่อทำหน้าที่ ขยายประธานในลักษณะนี้ได้ (2) disappointed แปลว่า \"รู้สึกผิดหวัง\" จะใช้กับประธานที่เป็นบุคคลหรือสิ่งมีชีวิตที่มีความรู้สึกเท่านั้น เช่น Many viewers were disappointed by the ending. (ผู้ชมจำนวนมากรู้สึกผิดหวังกับตอนจบ) (3) to disappoint เป็นรูป Infinitive with to ไม่เข้าโครงสร้างการบอกลักษณะของประธานในประโยคนี้"},{"n":25,"q":"A romantic boat ride along _______ Seine River in Paris is truly unforgettable.","o":["a","an","the","(blank)"],"a":3,"e":"ประโยคนี้เกี่ยวกับหลักการใช้คำนำหน้านาม (Articles) โดยคำนามในช่องว่างคือ \"Seine River\" (แม่น ้าแซน) ซึ่งเป็นชื่อเฉพาะของแม่น ้า ตามกฎไวยากรณ์ภาษาอังกฤษ มีข้อบังคับตายตัวว่าจะต้องใช้ Definite Article \"the\" นำหน้าชื่อทางภูมิศาสตร์ ประเภทแม่น ้า (Rivers) มหาสมุทร (Oceans) ทะเล (Seas) และเทือกเขา (Mountain ranges) เสมอ เพื่อแสดงความชี้ เฉพาะเจาะจงทางภูมิศาสตร์ โครงสร้าง : the + ชื่อแม่น ้า + River โจทย์ : A romantic boat ride along the Seine River in Paris is truly unforgettable. (การนั่งเรือสุดโรแมนติก ไปตามแม่น ้าแซนในปารีสนั้นเป็นสิ่งที่ลืมไม่ลงอย่างแท้จริง) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) a และ (2) an เป็นคำนำหน้านามที่ไม่ชี้เฉพาะเจาะจง (Indefinite Articles) ใช้กับคำนามนับได้เอกพจน์ทั่วไป ไม่สามารถนำมาใช้กับชื่อเฉพาะของภูมิศาสตร์หรือชื่อแม่น ้าได้ (4) (blank) หรือการไม่เติม Article จะใช้กับชื่อประเทศส่วนใหญ่ ชื่อเมือง หรือชื่อทะเลสาบเดี่ยวๆ (Lakes) แต่ หากเป็นแม่น ้า จำเป็นต้องมี \"the\" นำหน้าเสมอตามกฎไวยากรณ์"},{"n":26,"q":"__________ show you the way. This way, please.","o":["I’m","I’ll","I mustn’t","I needn’t"],"a":2,"e":"ประโยคด้านหลังระบุบริบทว่า \"This way, please.\" (เชิญทางนี้ครับ/ค่ะ) ซึ่งแสดงถึงสถานการณ์ที่ผู้พูดกำลัง เสนอตัวเพื่อช่วยนำทางให้กับคู่สนทนาในทันที ตามหลักไวยากรณ์ภาษาอังกฤษ การเสนอตัวทำสิ่งใดสิ่งหนึ่งให้ผู้อื่น หรือการตัดสินใจทำบางอย่างในขณะที่ พูดทันที จะใช้โครงสร้าง Future Simple Tense โดยย่อรูปจาก I will เป็น I'll โครงสร้าง : I'll (I will) + กริยาช่อง 1 (ไม่เติมอะไรเลย) โจทย์ : I’ll show you the way. (ฉันจะนำทางให้คุณเองค่ะ/ครับ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) I’m (I am) เป็นกริยาช่วย (Verb to be) หากนำมาวางหน้าคำกริยาแท้รูปฐานอย่าง show จะผิดหลักไวยากรณ์ ทันที (เนื่องจากประโยคบอกเล่าปัจจุบันทั่วไปไม่สามารถนำ Verb to be มาวางหน้ากริยาช่อง 1 โดดๆ ได้) (3) I mustn’t แปลว่า \"ฉันต้องไม่\" (แสดงข้อห้ามเด็ดขาด) ขัดแย้งกับประโยคด้านหลังที่เชิญชวนให้เดินตามมา (4) I needn’t แปลว่า \"ฉันไม่จำเป็นต้อง\" ขัดแย้งกับบริบทที่ผู้พูดเต็มใจและกำลังจะนำทางให้"},{"n":27,"q":"Nancy is ________ than Jimmy, her friend.","o":["intelligent","more intelligent","most intelligent","the intelligent"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 5. ประกอบ ลักษณะเดียวกับข้อ 5. เมื่อเห็น than ตอบขั้นกว่า และ intelligent หลายพยางค์ใส่ more นำหน้า"},{"n":28,"q":"My parents ________ in this house since 1999.","o":["are","were","have lived","will live"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 14. ประกอบ เห็นคำบอกเวลา since ตอบ Present Perfect และประธานเป็นคนแสดงการกระทำได้เองจึงตอบ have V3 = have lived"},{"n":29,"q":"If you don’t hurry, you ________ the bus.","o":["will miss","had to miss","missed","would have missed"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ ประโยคนี้เป็นโครงสร้าง If แบบที่ 1 (First Conditional) ซึ่งใช้กับเงื่อนไขที่เป็นเหตุเป็นผลกัน และมีโอกาส เกิดขึ้นจริงได้มากในปัจจุบันหรืออนาคต ดังนั้น ตัวเลือก will miss จึงถูกต้องตามสูตรไวยากรณ์และได้ความหมายที่สมบูรณ์ที่สุด โครงสร้าง If แบบที่ 1 : If + Subject + Verb ช่อง 1, Subject + will + Verb รูปฐาน โจทย์ : If you don’t hurry, you will miss the bus. (ถ้าคุณไม่รีบ คุณจะตกรถบัส) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) had to miss (ต้องตก) และ (3) missed (กริยาช่อง 2) เป็นรูปอดีต ไม่สอดคล้องกับประโยคส่วนเงื่อนไขที่เป็น รูปปัจจุบัน (don't) (4) would have missed เป็นโครงสร้างของ If แบบที่ 3 ซึ่งใช้สมมติเหตุการณ์ที่ตรงข้ามกับความจริงในอดีต (ประโยคส่วน If ต้องเป็นรูป Past Perfect เช่น If you had not hurried...) จึงผิดหลักไวยากรณ์ในข้อนี้"},{"n":30,"q":"We might think that “brain freeze” happens simply ______ the cold ice cream hurts our mouth.","o":["because of","because","consequently","owing to"],"a":2,"e":"ประโยคนี้เป็นการเชื่อมข้อความที่เป็น \"เหตุและผล\" โดยพิจารณาโครงสร้างไวยากรณ์จากสิ่งที่ตามหลังช่องว่าง ข้อความหลังช่องว่าง คือ “the cold ice cream (ประธาน) + hurts (คำกริยา) + our mouth” ซึ่งมีโครงสร้างเป็น ประโยคสมบูรณ์ (Clause) ตามหลักไวยากรณ์อังกฤษ คำเชื่อมที่แปลว่า \"เพราะว่า\" ที่ใช้สำหรับนำหน้าประโยค คือคำว่า because โครงสร้าง : ผลลัพธ์ + because + ประโยค (Subject + Verb) โจทย์ : We might think that “brain freeze” happens simply because the cold ice cream hurts our mouth. (พวกเราอาจจะคิดว่าอาการสมองแข็ง (Brain Freeze) เกิดขึ้นเพียงเพราะว่าไอศกรีมที่เย็นจัดนั้นทำให้ปากของเราเจ็บ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) because of และ (4) owing to ทั้งสองคำนี้แปลว่า \"เนื่องจาก/เพราะว่า\" เช่นกัน แต่ตามกฎไวยากรณ์จะต้อง ตามหลังด้วย คำนาม (Noun) หรือวลี (Phrase) เท่านั้น ไม่สามารถตามด้วยประโยคที่มีกริยาแท้อย่าง hurts ได้ (3) consequently เป็นคำกริยาวิเศษณ์เชื่อมประโยค (Conjunctive Adverb) แปลว่า \"ผลที่ตามมาคือ/ดังนั้น\" ใช้ สำหรับนำหน้าข้อความที่เป็น ผลลัพธ์ ไม่ใช่การบอกสาเหตุ และมักต้องมีเครื่องหมายจุลภาค (Comma) ตามหลัง"},{"n":31,"q":"The car needs ________. It’s covered with muddy sand!","o":["to clean","cleaned","to be cleaned","be cleaning"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 21. ประกอบ ประธานของประโยค คือ \"The car\" (รถยนต์) ซึ่งเป็นสิ่งไม่มีชีวิต ไม่สามารถลุกขึ้นมาทำความสะอาดตัวเองได้ บริบทด้านหลังระบุว่า It’s covered with muddy sand! (มันถูกปกคลุมไปด้วยทรายที่เป็นโคลน) รถยนต์จึงอยู่ในสถานะ ที่ \"จำเป็นต้องถูกทำความสะอาด\" ตามหลักไวยากรณ์ เมื่อใช้คำกริยา need คู่กับประธานที่เป็นสิ่งของหรือผู้ถูกกระทำ จะใช้โครงสร้าง Passive Infinitive เพื่อสื่อความหมายว่า \"จำเป็นต้องถูกกระทำ\" โครงสร้าง : Subject (สิ่งของ) + need(s) + to be + Verb ช่อง 3 โจทย์ : The car needs to be cleaned. (รถยนต์จำเป็นต้องถูกทำความสะอาด) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) to clean เป็นรูป Active (ประธานทำกริยาเอง) หากเลือกข้อนี้จะแปลว่า รถยนต์มีความจำเป็นต้องไปทำความ สะอาดสิ่งอื่น ซึ่งผิดความหมายอย่างสิ้นเชิง (2) cleaned เป็นกริยาช่อง 2 หรือช่อง 3 โดดๆ ไม่สามารถตามหลังคำว่า needs ได้ทันทีโดยไม่มี to be นำหน้าตาม หลักไวยากรณ์สากล (4) be cleaning เป็นโครงสร้างที่ผิดรูปไวยากรณ์ ไม่นิยมนำมาต่อหลังคำว่า needs ในลักษณะนี้"},{"n":32,"q":"Bob is having his hair ________ at present.","o":["cut","to cut","cutting","cuts"],"a":1,"e":"ประโยคนี้ใช้โครงสร้างไวยากรณ์เรื่อง Causative Verb (กริยาสั่งการ/วานให้ผู้อื่นทำ) ในรูปประธานถูกกระทำ (Passive Causative) ซึ่งใช้เมื่อต้องการอธิบายว่า \"เราไม่ได้ลงมือทำสิ่งนั้นด้วยตัวเอง แต่จัดแจงหรือจ้างวานให้ผู้อื่นทำสิ่ง นั้นให้\" (ในบริบทนี้คือ บ็อบไปร้านตัดผมเพื่อให้ช่างตัดผมให้ ไม่ได้ตัดเอง) โครงสร้าง : Subject + have/get (ปรับตาม Tense) + Something (สิ่งของ/กรรม) + Verb ช่อง 3 (Past Participle) ในโจทย์ใช้รูป is having (กำลังทำอยู่ ณ ตอนนี้) ตามด้วยกรรมคือ his hair (เส้นผมของเขา) ดังนั้น คำกริยาใน ช่องว่างจึงต้องอยู่ในรูปกริยาช่อง 3 เสมอ คำว่า cut มีการผันกริยา 3 ช่องที่เหมือนกันทุกช่อง คือ cut - cut - cut ดังนั้น cut ในข้อนี้จึงทำหน้าที่เป็นกริยาช่อง 3 โจทย์ : Bob is having his hair cut at present. (บ็อบกำลังรับบริการตัดผมอยู่ในตอนนี้) (ช่างกำลังตัดให้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) to cut เป็นรูป Infinitive with to ซึ่งไม่ตรงกับสูตรโครงสร้างแบบ Passive ของกริยา have (3) cutting เป็นรูป Verb-ing จะใช้ในกรณีโครงสร้างนี้ไม่ได้ เนื่องจากเส้นผมไม่สามารถทำกริยาตัดตัวเองได้ (4) cuts เป็นรูปกริยาช่อง 1 ที่เติม -s ซึ่งจะใช้ต่อท้ายคำว่า his hair ในลักษณะโครงสร้างวานให้ทำแบบนี้ไม่ได้"},{"n":33,"q":"Tom avoids _______ spicy food because of his stomach condition.","o":["eat","ate","to eat","eating"],"a":4,"e":"ประโยคนี้มีกริยาหลักคือคำว่า \"avoids\" (หลีกเลี่ยง) ซึ่งเป็นหนึ่งในคำกริยากลุ่มพิเศษ (Specific Verbs) ใน ภาษาอังกฤษที่มีกฎบังคับตายตัวว่า จะต้องตามหลังด้วย Gerund (กริยาเติม -ing) เสมอ เพื่อทำหน้าที่เป็นกรรมของ ประโยค ไม่สามารถตามด้วยกริยารูป Infinitive (to + กริยาช่อง 1) ได้ โครงสร้าง : Subject + avoid + Verb-ing กริยาที่ตามมาจะเป็น Gerund และตามด้วย Ving ได้แก่ admit dread fancy practice risk allow dislike forgive postpone resent appreciate enjoy imagine prefer stop avoid endure involve prevent suggest consider encourage keep permit require delay escape like prevent hate defer excuse miss quit forgive deny finish mind resist advise โจทย์ : Tom avoids eating spicy food because of his stomach condition. (ทอมหลีกเลี่ยงการรับประทาน อาหารรสจัดเนื่องจากปัญหาสุขภาพกระเพาะอาหารของเขา) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) eat เป็นกริยารูปฐาน และ (2) ate เป็นกริยาช่อง 2 ไม่สามารถนำมาวางต่อท้ายคำกริยาแท้ avoids ได้โดยตรง ตามหลักไวยากรณ์ (3) to eat แม้จะแปลว่า \"ที่จะกิน\" แต่ขัดต่อกฎไวยากรณ์เฉพาะของคำว่า avoid ที่ไม่สามารถใช้ควบคู่กับกริยาที่มี to นำหน้าได้ (ต่างจากคำว่า decide to eat หรือ want to eat)"},{"n":34,"q":"The store _______ at 9 a.m. every day.","o":["opens","would open","opened","has opened"],"a":1,"e":"ในประโยคมีข้อความบ่งบอกความถี่ของเหตุการณ์คือ \"every day\" (ทุกวัน) ซึ่งแสดงถึงตารางเวลาที่แน่นอน พฤติกรรม หรือกิจกรรมที่เกิดขึ้นเป็นประจำจนเป็นกิจวัตรในปัจจุบัน ตามหลักไวยากรณ์ภาษาอังกฤษจะต้องใช้ โครงสร้าง Present Simple Tense โครงสร้าง : Subject + Verb ช่อง 1 (เติม s/es หากประธานเป็นเอกพจน์) ประธานในข้อนี้คือ \"The store\" (ร้านค้า) ซึ่งเป็นคำนามเอกพจน์ คำกริยาคำว่า open จึงต้องผันโดยการเติม -s เป็น opens โจทย์ : The store opens at 9 a.m. every day. (ร้านค้าเปิดเวลา 09.00 น. ในทุกๆ วัน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) would open มักใช้ในโครงสร้างสมมติ (If) หรือการบอกเล่าเรื่องราวในอดีต ไม่เข้ากับคำว่า \"every day\" ที่บอก กิจวัตรปัจจุบัน (3) opened เป็น Past Simple Tense (กริยาช่อง 2) ใช้กับเหตุการณ์ที่จบลงไปแล้วในอดีต ขัดแย้งกับการเป็นกิจวัตร ที่ยังทำอยู่ทุกวันในปัจจุบัน (4) has opened เป็น Present Perfect Tense ใช้เน้นย ้าเหตุการณ์ที่เกิดขึ้นตั้งแต่อดีตและส่งผลถึงปัจจุบัน หรือเพิ่ง เกิดขึ้นเสร็จสิ้นไป ไม่นิยมใช้ร่วมกับคำระบุเวลาที่เป็นตารางประจำชัดเจนอย่าง at 9 a.m. every day"},{"n":35,"q":"Suda and Teera are living in ________ United States now.","o":["a","an","the","(blank)"],"a":3,"e":"ประโยคนี้เกี่ยวกับหลักการใช้คำนำหน้านาม (Articles) นำหน้าชื่อประเทศ โดยคำนามในช่องว่างคือ \"United States\" (สหรัฐอเมริกา) ตามกฎไวยากรณ์ภาษาอังกฤษ แม้ว่าชื่อประเทศส่วนใหญ่จะไม่มีคำนำหน้านาม (เช่น Thailand, Japan) แต่ สำหรับประเทศที่มีลักษณะการปกครองแบบรวมรัฐ, เป็นเกาะกลุ่ม, หรือมีคำระบุประเภทการปกครองอยู่ในชื่อ เช่น United, Kingdom, Republic, States จะมีข้อบังคับตายตัวว่าต้องใช้ Definite Article \"the\" นำหน้าเสมอ โครงสร้าง : the + United States / United Kingdom / Republic of... โจทย์ : Suda and Teera are living in the United States now. (สุดาและธีระกำลังอาศัยอยู่ในสหรัฐอเมริกา ในตอนนี้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) a และ (2) an เป็นคำนำหน้านามที่ไม่ชี้เฉพาะเจาะจง (Indefinite Articles) ใช้กับคำนามนับได้ทั่วไป ไม่ สามารถนำมาใช้กับชื่อประเทศที่เป็นชื่อเฉพาะได้ (4) (blank) หรือการไม่เติม Article จะใช้กับชื่อประเทศทั่วไปที่เป็นคำเดี่ยวๆ หรือไม่มีคำกลุ่มพิเศษประกอบ เช่น They live in France. หรือ They live in Thailand. แต่ไม่สามารถใช้กับ United States ได้"},{"n":36,"q":"I _________ the doctor this afternoon.","o":["sees","have seen","am seeing","was seeing"],"a":3,"e":"ประโยคนี้ระบุเวลาคือ \"this afternoon\" (บ่ายวันนี้) ซึ่งเป็นการแสดงถึงเหตุการณ์ที่จะเกิดขึ้นในอนาคตอัน ใกล้ ตามหลักไวยากรณ์ภาษาอังกฤษ เมื่อต้องการพูดถึงการนัดหมาย แผนการ หรือสิ่งที่มีการเตรียมการไว้ล่วงหน้าอย่าง แน่นอนแล้วในอนาคตอันใกล้ นิยมใช้โครงสร้าง Present Continuous Tense (is/am/are + Verb-ing) ในการสื่อสาร โครงสร้าง : Subject (I) + am + Verb-ing (seeing) + ข้อความบอกอนาคตอันใกล้ คำว่า see ในบริบทนี้ไม่ได้แปลว่า \"มองเห็น\" แต่แปลว่า \"ไปพบ/ไปหา (เพื่อปรึกษาหรือตรวจโรค)\" ซึ่ง สามารถเติม -ing ได้ตามปกติ โจทย์ : I am seeing the doctor this afternoon. (ฉันมีนัดไปพบแพทย์บ่ายวันนี้) (มีการนัดหมายไว้แล้วแน่นอน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) sees เป็น Present Simple Tense ใช้กับประธานเอกพจน์ (เช่น He, She, It) แต่ในโจทย์ประธานคือ \"I\" ซึ่งห้าม เติม s ที่กริยา นอกจากนี้โครงสร้างนี้มักใช้กับกิจวัตรประจำวัน ไม่สอดคล้องกับเวลานัดหมายเฉพาะเจาะจงอย่างบ่าย วันนี้ (2) have seen เป็น Present Perfect Tense ใช้กับเหตุการณ์ที่ทำเสร็จสิ้นไปแล้ว หรือเกิดตั้งแต่อดีตถึงปัจจุบัน ไม่ ใช้บอกแผนการอนาคตในบ่ายวันนี้ (4) was seeing เป็น Past Continuous Tense ใช้ระบุถึงเหตุการณ์ที่กำลังเกิดขึ้นในอดีต ขัดแย้งกับบริบทที่เป็นการ บอกแผนการของวันนี้"},{"n":37,"q":"Is this your bag or _________?","o":["your","mine","her","him"],"a":2,"e":"ประโยคนี้เป็นคำถาม เพื่อถามหาความเป็นเจ้าของของกระเป๋าใบหนึ่ง โดยโครงสร้างประโยคมีการระบุคำนาม หลักไปแล้วในส่วนแรกคือคำว่า \"your bag\" (กระเป๋าของคุณ) ดังนั้น ในส่วนหลังของประโยคเปรียบเทียบคำถาม (หลัง คำว่า or) จึงจำเป็นต้องใช้ Possessive Pronoun (สรรพนามแสดงความเป็นเจ้าของที่ทำหน้าที่แทนคำนามได้เลย) เพื่อ ไม่ให้เกิดการเขียนคำนามคำว่า bag ซ ้าซ้อน โครงสร้าง : Is this your bag or + Possessive Pronoun? คำว่า mine มีความหมายเท่ากับ my bag (กระเป๋าของฉัน) โจทย์ : Is this your bag or mine? แปลว่า นี่คือกระเป๋าของคุณหรือของฉัน? บุรุษสรรพนาม (Personal Pronoun) รูปประธาน รูปกรรม Possessive adjective Possessive Pronoun สะท้อนตัวเอง I you he she they we it me you him her them us it my your his her มีคำนามตามหลัง their our its mine yours his hers ไม่มีคำนามตามหลัง theirs ours its myself yourself himself herself themselves ourselves itself เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) your และ (3) her เป็น Possessive Adjective (คำคุณศัพท์แสดงความเป็นเจ้าของ) กฎไวยากรณ์บังคับว่าจะต้อง มีคำนามตามหลังเสมอ (เช่น your bag, her bag) ไม่สามารถวางโดดๆ ปิดท้ายประโยคแบบนี้ได้ (หากต้องการทำเป็น สรรพนามปิดประโยคต้องใช้รูป yours หรือ hers) (4) him เป็น Object Pronoun (สรรพนามทำหน้าที่เป็นกรรม) แปลว่า \"เขา (ผู้ชาย)\" ไม่ได้แสดงความเป็นเจ้าของ จึงผิดบริบทอย่างสิ้นเชิง"},{"n":38,"q":"A new package is here. It _______ be mine. I ordered something online.","o":["would","shall","need","must"],"a":4,"e":"ประโยคด้านหลังให้ข้อมูลสนับสนุนที่จงใจให้เกิดความมั่นใจอย่างเต็มเปี่ยม คือ \"I ordered something online.\" (ฉันสั่งของบางอย่างทางออนไลน์) เมื่อพิจารณาประกอบกับประโยคแรกที่บอกว่ามีพัสดุมาส่ง การคาดเดาเหตุการณ์นี้จึง เป็นการคาดเดาที่ผู้พูดมั่นใจมากที่สุดว่าต้องเป็นเช่นนั้นอย่างแน่นอน ตามหลักไวยากรณ์ภาษาอังกฤษ คำกริยานุเคราะห์ (Modal Verb) ที่ใช้เพื่อแสดงความมั่นใจในการคาดคะเน หรือข้อสรุปที่แทบจะไม่มีความผิดพลาด (Logical Deduction) แปลว่า \"ต้อง...อย่างแน่นอน\" คือคำว่า must โครงสร้าง : Subject + must + กริยาช่อง 1 (ไม่เติมอะไรเลย) โจทย์ : It must be mine. แปลว่า มันต้องเป็นของฉันอย่างแน่นอน เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) would แปลว่า \"จะ\" ใช้ในโครงสร้างเงื่อนไขสมมติ (If-Clause) หรือการบอกอนาคตในอดีต ไม่ได้ใช้เน้นย ้า ความมั่นใจจากหลักฐานที่มีในปัจจุบัน (2) shall แปลว่า \"จะ\" มักใช้ในการเสนอแนะหรือแสดงเจตนา และนิยมใช้กับประธาน I หรือ We เท่านั้น ไม่ใช้ ในการคาดเดาเหตุการณ์ทั่วไปกับประธาน It (3) need แปลว่า \"จำเป็นต้อง\" รูปไวยากรณ์ในข้อนี้ขาดคำว่า to (หากจะใช้ต้องเป็น It needs to be mine) และ ความหมายเกี่ยวกับการบังคับ/ความจำเป็น ซึ่งไม่ตรงกับบริบทการคาดเดาจากหลักฐานการสั่งของ"},{"n":39,"q":"If it ________ tonight, we can build a snowman tomorrow.","o":["snows","will snow","would snow","would have snowed"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ ประโยคนี้เป็นโครงสร้าง If แบบที่ 1 (First Conditional) ซึ่งใช้กับเงื่อนไขที่เป็นเหตุเป็นผลกัน และมีโอกาส เกิดขึ้นจริงได้ในปัจจุบันหรืออนาคต โดยสังเกตจากประโยคแสดงผลลัพธ์ด้านหลังที่ใช้โครงสร้าง “we can build (can + กริยาช่อง 1)” ตามกฎไวยากรณ์ของ If แบบที่ 1 ประโยคส่วน If (เงื่อนไข) : ต้องใช้โครงสร้าง Present Simple Tense (Subject + Verb ช่อง 1) เสมอ ห้ามใช้ will หรือ would ในส่วนนี้เด็ดขาด ประธานในประโยคย่อย คือ \"it\" ซึ่งเป็นเอกพจน์ คำกริยาคำว่า snow จึงต้องผันโดยการเติม -s เป็น snows โครงสร้าง If แบบที่ 1 : If + Subject + Verb ช่อง 1 (เติม s/es), Subject + can/will + Verb รูปฐาน โจทย์ : If it snows tonight, we can build a snowman tomorrow. (ถ้าคืนนี้หิมะตก พรุ่งนี้พวกเราจะสามารถ สร้างตุ๊กตาหิมะได้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) will snow ผิดหลักไวยากรณ์อย่างสิ้นเชิง เนื่องจากกฎของภาษาอังกฤษกำหนดห้ามใส่คำบอกอนาคตอย่าง will ไว้ในประโยคย่อยที่ตามหลังคำว่า If ในโครงสร้างเงื่อนไขลักษณะนี้ (3) would snow เป็นโครงสร้างของ If แบบที่ 2 (ประโยคส่วน If ต้องเป็นกริยาช่อง 2 และส่วนผลลัพธ์ต้องใช้ would/could) ซึ่งขัดกับโครงสร้างของประโยคผลลัพธ์ในโจทย์ที่ใช้คำว่า can (4) would have snowed เป็นโครงสร้างของ If แบบที่ 3 ซึ่งใช้สมมติเหตุการณ์ในอดีต (ประโยคส่วน If ต้องเป็น รูป Past Perfect เช่น had snowed) ไม่เข้ากับข้อนี้"},{"n":40,"q":"Julie is accustomed to ________ up early for her morning yoga.","o":["wake","waking","woke","woken"],"a":2,"e":"ประโยคนี้ใช้สำนวนกริยากลุ่มพิเศษ คือคำว่า \"be accustomed to\" ซึ่งแปลว่า \"เคยชินกับ / คุ้นเคยกับ\" ตามกฎไวยากรณ์ภาษาอังกฤษ คำว่า to ที่อยู่ในสำนวนนี้ทำหน้าที่เป็นคำบุพบท (Preposition) ไม่ใช่ to ที่นำหน้า กริยารูปฐาน ดังนั้น กฎบังคับทางไวยากรณ์จึงกำหนดว่าคำที่ตามหลังสำนวนนี้จะต้องเป็น คำนาม (Noun) หรือ Gerund (กริยาเติม -ing) เสมอ ห้ามตามด้วยกริยาช่อง 1 โดดๆ โครงสร้าง : Subject + Verb to be + accustomed to + Verb-ing สำนวนต่อไปนี้ให้ตามด้วย Ving ได้แก่ can’t bear look forward to be accustomed to can’t stand object to be opposed to can’t resist adjust to be /get used to can’t help devote to be subjected to have a good time it’s no good it’ no use have a hard time it’s worth have a difficult time โจทย์ : Julie is accustomed to waking up early for her morning yoga. (จูลี่เคยชินกับการตื่นนอนแต่เช้าเพื่อเล่น โยคะในตอนเช้าของเธอ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) wake เป็นกริยารูปฐาน (Infinitive) ข้อนี้เป็นตัวเลือกที่ข้อสอบจงใจนำมาหลอกเนื่องจากผู้สอบมักเข้าใจผิดว่า หลังคำว่า to ต้องตามด้วยกริยาช่อง 1 เสมอ ซึ่งใช้ไม่ได้กับสำนวนนี้ (3) woke เป็นกริยาช่อง 2 และ (4) woken เป็นกริยาช่อง 3 ไม่สามารถนำมาวางตามหลังคำบุพบท to ในรูปสำนวน บอกความคุ้นเคยได้"},{"n":41,"q":"Jack _______ swim, so he doesn’t like to travel by boat.","o":["may not","ought not to","shouldn’t","can’t"],"a":4,"e":"ประโยคด้านหลังระบุเหตุผล ว่า \"so he doesn’t like to travel by boat.\" (ดังนั้นเขาจึงไม่ชอบเดินทางด้วยเรือ) ซึ่ง แสดงให้เห็นถึงข้อจำกัดทางด้านความสามารถหรือทักษะส่วนตัว การบอกว่าบุคคลใด \"ไม่สามารถ\" ทำสิ่งใดสิ่งหนึ่งได้ ในชีวิตประจำวัน จะใช้คำกริยานุเคราะห์ (Modal Verb) คือ can’t (cannot) โครงสร้าง : Subject + can’t + กริยาช่อง 1 (ไม่เติมอะไรเลย) โจทย์ : Jack can’t swim, so he doesn’t like to travel by boat. (แจ็คว่ายน ้าไม่เป็น ดังนั้นเขาจึงไม่ชอบเดินทาง ด้วยเรือ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) may not แปลว่า \"อาจจะไม่\" (แสดงความไม่แน่นอน) หรือ \"ไม่อนุญาตให้\" ไม่ตรงกับบริบทเรื่องทักษะการว่าย น ้าที่ส่งผลต่อการกลัวการนั่งเรือ (2) ought not to แปลว่า \"ไม่ควรจะ\" (เป็นการให้คำแนะนำเชิงศีลธรรมหรือข้อพึงกระทำ มีความหมายเหมือน shouldn't) ซึ่งผิดบริบทอย่างสิ้นเชิง (3) shouldn’t แปลว่า \"ไม่ควรจะ\" (เป็นการให้คำแนะนำ) หากใช้จะแปลว่าแจ็คไม่ควรว่ายน ้า ซึ่งขัดแย้งกับผลลัพธ์ที่ บอกว่าไม่ชอบนั่งเรือเพราะว่ายน ้าไม่เป็น"},{"n":42,"q":"Sylvia often ________ out with friends after work.","o":["will have gone","goes","has gone","is going"],"a":2,"e":"ในประโยคมีคำวิเศษณ์บอกความถี่ (Adverb of Frequency) คือคำว่า \"often\" (บ่อยๆ) ซึ่งเป็นคำบ่งชี้หลักของ Present Simple Tense เพื่อใช้อธิบายถึงเหตุการณ์ที่เป็นพฤติกรรม นิสัย หรือกิจกรรมที่เกิดขึ้นอยู่เป็นประจำใน ชีวิตประจำวัน โครงสร้าง : Subject + Verb ช่อง 1 (เติม s/es หากประธานเป็นเอกพจน์) ประธานของประโยค คือ \"Sylvia\" ซึ่งเป็นประธานบุรุษที่ 3 เอกพจน์ (คนเดียว) คำกริยาคำว่า go จึงต้องผันตาม กฎไวยากรณ์ด้วยการเติม -es เปลี่ยนรูปเป็น goes โจทย์ : Sylvia often goes out with friends after work. แปลว่า ซิลเวียมักจะออกไปเที่ยวข้างนอกกับเพื่อนๆ หลัง เลิกงานอยู่บ่อยครั้ง เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) will have gone เป็น Future Perfect Tense ใช้กับเหตุการณ์ที่จะเสร็จสิ้นสมบูรณ์ในอนาคต ไม่สอดคล้องกับ การบอกกิจวัตรประจำวันที่มีคำว่า often (3) has gone เป็น Present Perfect Tense ใช้แสดงถึงเหตุการณ์ที่เพิ่งเสร็จสิ้น หรือเน้นประสบการณ์ที่เกิดขึ้นตั้งแต่ อดีตถึงปัจจุบัน ไม่ใช้ระบุพฤติกรรมที่เป็นความถี่ทั่วไปในลักษณะนี้ (4) is going เป็น Present Continuous Tense ใช้กับเหตุการณ์ที่กำลังเกิดขึ้น ณ ขณะที่พูด หรือใช้อธิบายแผนการ อนาคตอันใกล้ที่เตรียมการไว้แล้ว ซึ่งขัดกับคำว่า often ที่เน้นความถี่ของนิสัยประจำวัน"},{"n":43,"q":"__________ the Lord be with you.","o":["May","Should","Need","Could"],"a":1,"e":"ประโยคนี้เป็นประโยคอวยพร (Blessing / Expression of Wish) ในชีวิตประจำวันและวัฒนธรรมตะวันตก ตาม หลักไวยากรณ์ภาษาอังกฤษ การขึ้นต้นประโยคเพื่อแสดงความปรารถนาดี การอวยพร หรือการขอพรจากสิ่งศักดิ์สิทธิ์ จะใช้คำกริยานุเคราะห์ May นำหน้าประโยคเสมอ โครงสร้าง : May + Subject + Verb รูปฐาน (ช่อง 1 ไม่เติมอะไรเลย) + ... โจทย์ : May the Lord be with you. (ขอให้พระผู้เป็นเจ้าสถิตอยู่กับท่าน) (คำว่า be คงรูปฐานเดิม ไม่ผันเป็น is/am/are) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) Should แปลว่า \"ควรจะ\" ใช้สำหรับการให้คำแนะนำหรือตักเตือน (3) Need แปลว่า \"จำเป็นต้อง\" ใช้ถามหาความจำเป็นในการทำสิ่งใดสิ่งหนึ่ง (4) Could มักใช้ในประโยคขอร้องอย่างสุภาพ หรือบอกความสามารถในอดีต ไม่ได้ใช้ในโครงสร้างประโยคอวย พรสำเร็จรูปในลักษณะนี้"},{"n":44,"q":"Uncle Joe has his shopping _______ by his younger daughter every weekend.","o":["do","done","doing","be done"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 32. ประกอบ ประโยคนี้ใช้โครงสร้างไวยากรณ์เรื่อง Causative Verb (กริยาวานให้ผู้อื่นทำ) ในรูปประธานถูกกระทำ (Passive Causative) โครงสร้าง : Subject + have/has + Something (สิ่งของ/กรรม) + Verb ช่อง 3 (Past Participle) ในโจทย์มีการใช้คำว่า has ตามด้วยกรรมคือ \"his shopping\" (การซื้อของ/กิจกรรมซื้อของ) ซึ่งเป็นสิ่งของ ไม่ สามารถลุกขึ้นมาทำตัวเองได้ แต่ต้องถูกจัดการหรือทำให้เสร็จสิ้น ดังนั้น คำกริยาในช่องว่างจึงต้องอยู่ในรูปกริยาช่อง 3 คำกริยาหลักในข้อนี้คือประธานทำ (do) ซึ่งมีการผันกริยา 3 ช่องคือ do - did - done รูปช่องที่ 3 จึงคือคำว่า done โจทย์ : Uncle Joe has his shopping done by his younger daughter every weekend. (ลุงโจวให้ลูกสาวคนเล็ก เป็นคนจัดการเรื่องการซื้อของให้ในทุกๆ วันหยุดสุดสัปดาห์) (ลูกสาวเป็นคนไปซื้อให้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) do เป็นรูปกริยาช่อง 1 (Infinitive) จะใช้ในกรณีโครงสร้าง Active เมื่อผู้ลงมือทำตามหลังกริยา have ทันที (เช่น Uncle Joe has his daughter do the shopping...) ซึ่งไม่ตรงกับกรรมที่เป็นสิ่งของในข้อนี้ (3) doing เป็นรูป Verb-ing ไม่เข้ากับโครงสร้างของการที่กรรม (his shopping) เป็นผู้ถูกกระทำ (4) be done เป็นโครงสร้างที่ใส่คำว่า be ซ ้าซ้อน เนื่องจากในโครงสร้าง Causative Passive หลังสิ่งของจะใช้กริยา ช่อง 3 (done) โดดๆ ได้ทันทีโดยไม่ต้องมี be นำหน้าอีก"},{"n":45,"q":"Judy is ________ than Brenda, I think.","o":["active","the most active","less active","as active"],"a":3,"e":"ประโยคนี้เป็นการเปรียบเทียบขั้นกว่า (Comparative Degree) ระหว่างบุคคลสองคน คือ \"Judy\" และ \"Brenda\" โดยมีคำเชื่อมคือ \"than\" (กว่า) เป็นตัวบ่งชี้ชัดเจนว่าต้องใช้โครงสร้างคำคุณศัพท์ (Adjective) ในรูปขั้นกว่า คำคุณศัพท์คือ \"active\" (กระตือรือร้น) เป็นคำยาว (มี 2 พยางค์ขึ้นไปและออกเสียงหนักยาว) การทำเป็นขั้นกว่า สามารถทำได้ 2 รูปแบบ คือ การเพิ่มขึ้น (more active) หรือการลดลง (less active) เมื่อพิจารณาจากตัวเลือก มีเพียงตัวเลือกเดียวที่อยู่ในรูปโครงสร้างขั้นกว่าที่ใช้คู่กับ than ได้อย่างถูกต้องตาม หลักไวยากรณ์ คือ less active (กระตือรือร้นน้อยกว่า) โครงสร้าง : Subject + V. to be + less + Adjective (คำยาว) + than + Object โจทย์ : Judy is less active than Brenda, I think. (ฉันคิดว่าจูลี่มีความกระตือรือร้นน้อยกว่าเบรนด้า) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) active เป็นคำคุณศัพท์รูปปกติ (Positive Degree) ไม่สามารถนำมาวางหน้าคำว่า than โดยตรงได้ (2) the most active เป็นการเปรียบเทียบขั้นสูงสุด (Superlative Degree) ใช้เปรียบเทียบสิ่งของหรือบุคคลตั้งแต่ 3 สิ่งขึ้นไป และไม่ใช้คู่กับคำว่า than ในลักษณะนี้ (4) as active เป็นโครงสร้างของการเปรียบเทียบขั้นเท่า ซึ่งต้องใช้ในรูป as...as (เช่น as active as) เพื่อบอกว่า เท่ากัน ไม่ใช้ร่วมกับคำว่า than"},{"n":46,"q":"Everyone enjoyed ________ at the party.","o":["himself","yourself","myself","ourselves"],"a":1,"e":"ประโยคนี้ใช้คำสรรพนามสะท้อน (Reflexive Pronoun) เพื่อบอกว่า \"ทุกคนสนุกสนานกับตัวเองในงานปาร์ตี้\" (มีความหมายว่า ทุกคนสนุกสนานกันมาก) ตามกฎไวยากรณ์ภาษาอังกฤษ คำว่า \"Everyone\" (ทุกคน) จัดเป็นสรรพนามไม่ชี้เฉพาะเจาะจง (Indefinite Pronoun) ที่มีรูปเป็นเอกพจน์เสมอ ดังนั้น เมื่อต้องใช้คำสรรพนามสะท้อนมารองรับประธานคำว่า Everyone ตามหลัก ไวยากรณ์สากลที่เป็นทางการ จึงต้องใช้รูปเอกพจน์บุรุษที่ 3 ซึ่งคำสากลที่ใช้แทนคือ himself (หรือในตำรายุคใหม่บาง เล่มอาจยอมรับรูปพหูพจน์ themselves ในภาษาพูด แต่ในตัวเลือกนี้ไม่มี และรูปที่เป็นทางการที่สุดสำหรับข้อสอบคือ himself) โครงสร้าง : Everyone (ประธานเอกพจน์) + enjoyed + himself (Reflexive Pronoun รูปเอกพจน์) โจทย์ : Everyone enjoyed himself at the party. (ทุกคนสนุกสนานกันมากในงานปาร์ตี้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) yourself (ตัวคุณเอง) จะใช้ก็ต่อเมื่อประธานของประโยคคือคำว่า You (3) myself (ตัวฉันเอง) จะใช้ก็ต่อเมื่อประธานของประโยคคือคำว่า I (4) ourselves (ตัวพวกเราเอง) จะใช้ก็ต่อเมื่อประธานของประโยคคือคำว่า We"},{"n":47,"q":"Something very cold can ______ the blood vessels in the roof of your mouth to shrink.","o":["cause","result with","show","bring out"],"a":1,"e":"ประโยคนี้พิจารณาจากโครงสร้างไวยากรณ์หลักที่อยู่ถัดจากกลุ่มคำนามที่เป็นกรรม (the blood vessels in the roof of your mouth) นั่นคือโครงสร้าง \"to + Verb รูปฐาน (to shrink)\" ตามหลักไวยากรณ์ภาษาอังกฤษ คำกริยาที่แปลว่า \"ทำให้เกิด / เป็นสาเหตุให้\" และมีกฎบังคับว่าต้องใช้ใน โครงสร้างตามด้วยกริยาที่มี to นำหน้า คือคำว่า cause โครงสร้าง : Subject + cause + Someone/Something + to + Verb ช่อง 1 โจทย์ : Something very cold can cause the blood vessels in the roof of your mouth to shrink. (สิ่งที่เย็นจัด สามารถเป็นสาเหตุทำให้หลอดเลือดบริเวณเพดานปากเกิดการหดตัว) (ซึ่งเป็นกลไกที่ทำให้เกิดอาการ Brain Freeze) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) result with เป็นสำนวนที่ไม่ถูกต้องตามหลักภาษา หากต้องการใช้คำว่า result ในความหมายที่เป็นเหตุเป็นผล จะใช้สำนวน result in (ส่งผลให้เกิด) ซึ่งต้องตามด้วยคำนามหรือกริยาเติม -ing ทันที ไม่ใช้กับโครงสร้างที่มี to shrink แบบในโจทย์ (3) show แปลว่า \"แสดงให้เห็น\" ซึ่งไม่เข้ากับบริบทที่เป็นเหตุและผลของการเปลี่ยนแปลงทางร่างกายในข้อนี้ (4) bring out เป็นกริยาวลี (Phrasal Verb) แปลว่า \"เผยให้เห็น / ผลิตออกมา\" ซึ่งผิดความหมายจากสิ่งที่โจทย์ ต้องการสื่อสาร"},{"n":48,"q":"The girl’s smile is as _________as the morning sun.","o":["bright","brighter","more bright","brightest"],"a":1,"e":"เมื่อเราเห็น as ...............as เป็นการเปรียบเทียบเท่ากัน ตรงกลางระหว่าง as ......as ต้องตอบเป็นคุณศัพท์ธรรมดา เช่น as good as, as nice as, as beautiful as ตรงกลางไม่ต้องใส่ -er -est หรือ more most อะไรเลย ต้องเป็นขั้นธรรมดาข้อ นี้จึงตอบ bright"},{"n":49,"q":"I remember the time _______ we attended Mark’s wedding.","o":["what","who","when","where"],"a":3,"e":"ประโยคนี้เป็นโครงสร้าง Relative Clause (ประโยคคุณศัพท์ที่ทำหน้าที่ขยายคำนาม) โดยมีช่องว่างเพื่อใส่ Relative Adverb (คำกริยาวิเศษณ์เชื่อมประโยค) เพื่อขยายคำนามข้างหน้าคือ \"the time\" (เวลา / ช่วงเวลา) ซึ่งระบุถึงเวลา ชัดเจน ตามกฎไวยากรณ์จึงต้องใช้ when มารับเพื่อเชื่อมประโยคย่อย โครงสร้าง : คำนามบอกเวลา (the time / the day / the year) + when + ประโยค (Subject + Verb) โจทย์ : I remember the time when we attended Mark’s wedding. (ฉันจำช่วงเวลาที่พวกเราได้ไปร่วมงาน แต่งงานของมาร์กได้) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) what ไม่ใช่คำเชื่อมที่ใช้ขยายคำนามข้างหน้าในลักษณะ Relative Clause (what จะใช้ในรูป Noun Clause ที่ไม่มี คำนามอยู่ข้างหน้า เช่น I remember what you said.) (2) who ใช้ขยายคำนามที่เป็นบุคคล ไม่ใช้ขยายเวลา (4) where ใช้ขยายคำนามที่เป็นสถานที่ (เช่น the place, the house) ไม่ใช้ขยายเวลา"},{"n":50,"q":"It is necessary that everyone _______ all safety rules before entering the laboratory.","o":["follow","following","followed","to follow"],"a":1,"e":"เป็นเรื่องกลุ่มคำที่ยกเว้น ให้ตอบส่วนหลังเป็นกริยาช่องที่ 1 ไม่ผัน (ไม่เติม s, es, ed, ing) ได้แก่ S + is/was important that S + V1 essential necessary imperative ฉะนั้นขึ้นต้น It is necessary that ตอบ follow = V1 ไม่ผัน"},{"n":51,"q":"The doctor told her _______ plenty of rest after the surgery.","o":["get","got","getting","to get"],"a":4,"e":"ประโยคนี้ใช้คำกริยาหลักคือคำว่า \"told\" (บอก/สั่ง - ซึ่งเป็นรูปอดีตของ tell) โดยโครงสร้างตามหลักไวยากรณ์ ภาษาอังกฤษ เมื่อใช้กริยา tell เพื่อบอกหรือสั่งให้ใครทำบางสิ่งบางอย่าง (Indirect Command/Advice) จะมีกฎบังคับว่า จะต้องใช้โครงสร้าง Infinitive with to (to + กริยาช่อง 1) มารองรับกรรมของประโยคเสมอ โครงสร้าง : Subject + tell/told + Someone + to + Verb รูปฐาน (ช่อง 1 ไม่เติมอะไรเลย) ในโจทย์คือ told (กริยาหลัก) + her (กรรม) + to get (Infinitive with to) โจทย์ : The doctor told her to get plenty of rest after the surgery. (แพทย์บอกให้เธอพักผ่อนให้มากๆ หลังการ ผ่าตัด) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) get เป็นคำกริยารูปฐาน (Infinitive without to) จะไม่ใช้ตามหลังโครงสร้างของคำว่า tell (โครงสร้างนี้มักใช้กับ กริยาประเภทสั่งการกลุ่มอื่น เช่น make, let หรือ help) (2) got เป็นกริยาช่อง 2 หรือช่อง 3 ไม่สามารถนำมาใช้เป็นส่วนขยายเพื่อบอกการกระทำของกรรมต่อท้ายคำว่า told her ได้โดยตรง (3) getting เป็นรูป Verb-ing (Gerund/Participle) ผิดหลักไวยากรณ์เฉพาะของคำว่า tell ที่ไม่รองรับโครงสร้างนี้ ในบริบทของการสั่งหรือบอกให้ทำ"},{"n":52,"q":"Sorry, madam. The service has been dropped ______ lack of funding.","o":["therefore","for","because","due to"],"a":4,"e":"ประโยคนี้เป็นการเชื่อมข้อความที่เป็น \"เหตุและผล\" โดยข้อความส่วนหน้าคือผลลัพธ์ และส่วนหลังคือสาเหตุ ให้พิจารณาโครงสร้างไวยากรณ์จากสิ่งที่อยู่หลังช่องว่าง: ข้อความหลังช่องว่าง คือ “lack of funding” (การขาดแคลนเงินทุน) ซึ่งมีโครงสร้างเป็น กลุ่มคำนาม/วลี (Noun Phrase) ไม่ใช่ประโยคสมบูรณ์ (ไม่มีคำกริยาแท้) ตามกฎไวยากรณ์ภาษาอังกฤษ คำเชื่อมที่แปลว่า \"เนื่องจาก / เพราะว่า\" ที่มีข้อบังคับว่าต้องตามหลังด้วยคำนาม หรือวลี คือคำว่า due to โครงสร้าง : ผลลัพธ์ + due to + คำนาม/วลี (Noun/Phrase) โจทย์ : The service has been dropped due to lack of funding. (ขออภัยค่ะ/ครับท่านผู้หญิง บริการนี้ได้ถูก ยกเลิกเนื่องจากการขาดแคลนเงินทุน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) therefore เป็นคำกริยาวิเศษณ์เชื่อมประโยค แปลว่า \"ดังนั้น\" ใช้สำหรับนำหน้าข้อความที่เป็น ผลลัพธ์ ไม่ใช่ การบอกสาเหตุ และมักต้องขึ้นประโยคใหม่ (2) for ในบริบทที่เป็นคำเชื่อมบอกสาเหตุ (แปลว่า เพราะว่า) และ (3) because ทั้งสองคำนี้ตามกฎไวยากรณ์จะต้อง ตามหลังด้วยประโยคสมบูรณ์ (Subject + Verb) เสมอ จึงไม่สามารถนำมาใช้นำหน้ากลุ่มคำนามเดี่ยวๆ ในข้อนี้ได้"},{"n":53,"q":"I saw Tom yesterday. Did you see _______ too?","o":["him","he","his","himself"],"a":1,"e":"ประโยคนี้พิจารณาจากหน้าที่ของคำสรรพนาม (Pronouns) ในตำแหน่งด้านหลังคำกริยาคือ \"see\" (เห็น/พบ) ซึ่งคำที่วางอยู่หลังคำกริยาแท้จะทำหน้าที่เป็น \"กรรม (Object)\" ของประโยค ในประโยคแรกระบุว่าประธานพูดถึง \"Tom\" (ทอม ซึ่งเป็นผู้ชายหนึ่งคน) ดังนั้น ในประโยคคำถามถัดมาเมื่อ ต้องการใช้สรรพนามแทนทอมในฐานะผู้ถูกกระทำหรือผู้ที่ถูกมองเห็น จึงต้องเลือกใช้สรรพนามรูปกรรม (Object Pronoun) สำหรับเพศชายเอกพจน์ คือคำว่า him โครงสร้าง : Subject + Verb + Object Pronoun (him) โจทย์ : Did you see him too? แปลว่า คุณเห็นเขาด้วยหรือเปล่า เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) he เป็นสรรพนามรูปประธาน (Subject Pronoun) จะวางหน้าคำกริยาเพื่อเป็นผู้กระทำ ไม่สามารถวางท้าย ประโยคหลังคำกริยาเพื่อเป็นกรรมได้ (3) his เป็นสรรพนามแสดงความเป็นเจ้าของ (Possessive) หากใช้ต้องมีคำนามตามหลังหรือใช้แทนสิ่งของของเขา ขัดต่อบริบทที่ต้องการขยายตัวบุคคล (4) himself เป็นสรรพนามสะท้อน (Reflexive Pronoun) จะใช้ก็ต่อเมื่อประธานและกรรมเป็นบุคคลเดียวกัน (เช่น He saw himself in the mirror. เขาเห็นตัวเองในกระจก) ซึ่งในโจทย์นี้ประธานคือ you แต่กรรมคือ Tom จึงไม่สามารถ ใช้ได้"},{"n":54,"q":"The short story ________ by that celebrated writer has been studied in schools across the country.","o":["to write","writing","having written","written"],"a":4,"e":"ประโยคนี้มีกริยาแท้หลักของประโยคอยู่แล้วคือ \"has been studied\" (ได้ถูกนำมาศึกษา) ส่วนข้อความด้านหน้า ตั้งแต่ช่องว่างไปจนถึงคำว่า writer จึงทำหน้าที่เป็นเพียง \"ส่วนขยายประธาน (Participle Clause)\" เพื่อบอกรายละเอียด ของประธานหลักคือ \"The short story\" (เรื่องสั้น) ตามหลักไวยากรณ์ภาษาอังกฤษ เมื่อต้องการลดรูปส่วนขยายประธาน มีกฎพิจารณาดังนี้ 1. หากคำนามที่เป็นประธาน ลงมือทำกริยานั้นเอง จะใช้รูป Verb-ing (Present Participle) 2. หากคำนามที่เป็นประธาน ถูกกระทำโดยสิ่งอื่น จะใช้รูป Verb ช่อง 3 (Past Participle) เนื่องจากประธานคือ \"The short story\" (เรื่องสั้น) ไม่สามารถลุกขึ้นมาเขียนตัวเองได้ แต่เป็นสิ่งที่ \"ถูกเขียน ขึ้น\" โดยนักเขียนชื่อดังคนนั้น (by that celebrated writer) จึงต้องเลือกคำกริยาช่อง 3 ซึ่งก็คือ written (มาจากผันสาม ช่อง: write - wrote - written) โครงสร้างลดรูป : Subject (ผู้ถูกกระทำ) + Verb ช่อง 3 (ขยาย) + ... + กริยาแท้ โจทย์ : The short story written by that celebrated writer has been studied in schools across the country. (เรื่องสั้นที่ถูกเขียนขึ้นโดยนักเขียนชื่อดังคนนั้นได้รับการศึกษาในโรงเรียนต่างๆ ทั่วประเทศ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) to write เป็นรูป Infinitive with to ไม่ตรงตามโครงสร้างการลดรูปประโยคคุณศัพท์เพื่อบอกลักษณะการถูก กระทำของประธาน (2) writing เป็นรูป Verb-ing (Present Participle) หากเลือกข้อนี้จะมีความหมายผิดเพี้ยนเป็น \"เรื่องสั้นเป็นผู้ลงมือ ถือปากกาเขียนสิ่งอื่นเอง\" ซึ่งขัดกับหลักความจริง (3) having written เป็นรูป Perfect Participle ในเชิง Active Voice (ประธานเป็นผู้ทำเสร็จสิ้นไปก่อนหน้า) ซึ่งผิด บริบทเช่นกันเนื่องจากเรื่องสั้นไม่สามารถทำกริยาเขียนเองได้"},{"n":55,"q":"Bob didn’t go to the concert, _______ he didn’t feel well.","o":["since","for","due to","in accordance with"],"a":2,"e":"ในบริบทของประโยคนี้ คำว่า \"for\" ทำหน้าที่เป็นคำสันธานเชื่อมประโยค (Coordinating Conjunction) ในกลุ่ม FANBOYS ซึ่งเมื่อนำมาใช้เชื่อมประโยคย่อยที่เป็นเหตุและผลกัน จะมีความหมายเหมือนกับคำว่า because หรือ since ที่ แปลว่า \"เพราะว่า / เนื่องจาก\" และต้องตามหลังด้วยประโยคสมบูรณ์ (Subject + Verb) เสมอ โครงสร้าง : ประโยคผล, for + ประโยคเหตุ (Subject + Verb) โจทย์ : Bob didn’t go to the concert, for he didn’t feel well. (บ็อบไม่ได้ไปคอนเสิร์ต เพราะว่าเขารู้สึกไม่สบาย) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) since แม้จะแปลว่า \"เพราะว่า/เนื่องจาก\" และตามด้วยประโยคได้เช่นกัน แต่ในเชิงไวยากรณ์และการเขียนที่เป็น ทางการ (Formal English) since มักใช้เชื่อมประโยคโดยไม่ต้องมีเครื่องหมาย Comma คั่นข้างหน้า หรือนิยมวางไว้ต้น ประโยคมากกว่า เมื่อโจทย์ระบุ Comma มาให้ ตัวเลือก for จึงมีความถูกต้องสละสลวยตามกฎเฉพาะมากกว่า (3) due to แปลว่า \"เนื่องจาก\" แต่ตามกฎไวยากรณ์ต้องตามหลังด้วยคำนามหรือวลี (Noun/Phrase) เท่านั้น ไม่ สามารถตามหลังด้วยประโยคสมบูรณ์ที่มีประธานและกริยาแท้อย่าง he didn’t feel well ได้ (4) in accordance with เป็นสำนวนที่เป็นทางการมาก แปลว่า \"สอดคล้องกับ / เป็นไปตาม\" (เช่น เป็นไปตาม กฎหมายหรือข้อบังคับ) ซึ่งผิดทั้งโครงสร้างไวยากรณ์ (ต้องตามด้วยคำนาม) และผิดทั้งความหมายในบริบทนี้"},{"n":56,"q":"We _________ home if it had rained.","o":["would have stayed","had stayed","would stay","will stay"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ ประโยคนี้เป็นโครงสร้าง If แบบที่ 3 (Third Conditional) ซึ่งใช้สำหรับการสมมติเหตุการณ์ที่ตรงข้ามกับความ เป็นจริงในอดีต หรือแสดงความเสียดายในสิ่งที่ผ่านมาแล้ว วิธีการสังเกตโครงสร้าง ประโยคส่วน If : If it had rained... โครงสร้างคือ had + Verb ช่อง 3 (had rained) เป็น Past Perfect Tense ซึ่งเป็นตัวชี้วัดของ If แบบที่ 3 ประโยคส่วนผลลัพธ์ : ตามกฎไวยากรณ์สากล จะต้องใช้โครงสร้าง would / could / might + have + Verb ช่อง 3 ดังนั้น ตัวเลือก would have stayed จึงถูกต้องตามสูตรไวยากรณ์และสอดคล้องกับบริบทที่สุด โครงสร้าง If แบบที่ 3 : Subject + would have + Verb ช่อง 3, if + Subject + had + Verb ช่อง 3 โจทย์ : We would have stayed home if it had rained. (พวกเราคงจะอยู่บ้านไปแล้วถ้าฝนตก) (ความเป็นจริงใน อดีตคือ ฝนไม่ได้ตก และพวกเราไม่ได้อยู่บ้าน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) had stayed เป็นรูป Past Perfect Tense ไม่สามารถนำมาใช้วางในส่วนของประโยคผลลัพธ์หลัก (Main Clause) ได้ตามโครงสร้างเงื่อนไข (3) would stay เป็นโครงสร้างของ If แบบที่ 2 (ใช้สมมติเหตุการณ์ที่เป็นไปไม่ได้ในปัจจุบัน โดยประโยคส่วน If ต้องเป็นกริยาช่อง 2 เช่น if it rained) (4) will stay เป็นโครงสร้างของ If แบบที่ 1 (ใช้กับเหตุการณ์ที่มีโอกาสเกิดขึ้นจริงในปัจจุบันหรืออนาคต โดย ประโยคส่วน If ต้องเป็นกริยาช่อง 1 เช่น if it rains)"},{"n":57,"q":"________ is 4:50 p.m. Let’s go home!","o":["This","Such","It","One"],"a":3,"e":"ประโยคนี้เป็นการระบุ \"เวลา\" (4:50 p.m.) ตามหลักไวยากรณ์ภาษาอังกฤษ เมื่อต้องการพูดถึง เวลา (Time), สภาพอากาศ (Weather), ระยะทาง (Distance) หรือสถานการณ์ทั่วไป จะต้องใช้คำสรรพนาม \"It\" ทำหน้าที่เป็นประธาน สมมติ (Dummy Subject) ของประโยคเสมอ ซึ่งในบริบทนี้จะแปลความหมายรวมๆ ได้ว่า \"ตอนนี้เป็นเวลา...\" โครงสร้าง : It + is + [เวลา / สภาพอากาศ / ระยะทาง] โจทย์ : It is 4:50 p.m. Let’s go home! (ตอนนี้เป็นเวลา 16.50 น. แล้ว กลับบ้านกันเถอะ!) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) This แปลว่า \"นี่\" ใช้สำหรับชี้เฉพาะเจาะจงสิ่งของหรือเหตุการณ์ที่อยู่ใกล้ตัว ไม่นิยมนำมาใช้เป็นประธานใน การบอกเวลาลอยๆ ในลักษณะนี้ (2) Such แปลว่า \"เช่นนั้น / มากขนาดนั้น\" มักใช้เพื่อเน้นย ้าลักษณะของคำนาม (เช่น such a beautiful day) ไม่ สามารถนำมาใช้นำหน้ากริยา is เพื่อบอกเวลาได้ (4) One แปลว่า \"หนึ่ง / คนเรา\" ใช้แทนตัวบุคคลทั่วไปหรือสิ่งของสิ่งเดียวในประโยค ไม่สอดคล้องกับบริบท การบอกเวลา"},{"n":58,"q":"The two colleagues helped _______ prepare for the important presentation.","o":["one another","either","many","each other"],"a":4,"e":"ประโยคนี้ใช้คำสรรพนามแสดงความสัมพันธ์ซึ่งกันและกัน (Reciprocal Pronoun) เพื่ออธิบายว่าประธานใน ประโยคทำการช่วยเหลือซึ่งกันและกัน โดยมีหลักการพิจารณาเลือกใช้จากจำนวนของประธานดังนี้ each other ใช้เมื่อประธานมีจำนวน 2 คน หรือ 2 สิ่ง one another ใช้เมื่อประธานมีจำนวน ตั้งแต่ 3 คน หรือ 3 สิ่งขึ้นไป ในโจทย์ประธาน คือ \"The two colleagues\" (เพื่อนร่วมงาน 2 คน) ซึ่งระบุจำนวนเลขสองไว้อย่างชัดเจน ตาม กฎไวยากรณ์จึงต้องใช้สำนวน each other โจทย์ : The two colleagues helped each other prepare for the important presentation. (เพื่อนร่วมงานทั้งสอง คนช่วยซึ่งกันและกันในการเตรียมตัวสำหรับการนำเสนอผลงานที่สำคัญ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) one another แม้จะแปลว่า \"ซึ่งกันและกัน\" เหมือนกัน แต่ตามกฎดั้งเดิมที่เป็นทางการจะใช้กับคนจำนวน 3 คน ขึ้นไป (เช่น The three colleagues helped one another...) (2) either แปลว่า \"อย่างใดอย่างหนึ่งในสองสิ่ง\" มักใช้ในโครงสร้าง either... or... ไม่เข้ากับบริบทของการช่วยกัน (3) many แปลว่า \"จำนวนมาก\" เป็นคำคุณศัพท์บอกปริมาณ ไม่สอดคล้องกับโครงสร้างและใจความของประโยคนี้"},{"n":59,"q":"The research team published a(n) _______ report on the effects of climate change.","o":["to-date-up","up-to-date","date-up-to","to-up-date"],"a":2,"e":"ประโยคนี้ต้องการคำคุณศัพท์ (Adjective) มาทำหน้าที่ขยายคำนามหลักที่อยู่ด้านหลังช่องว่างคือคำว่า \"report\" (รายงาน) ในภาษาอังกฤษ คำว่า \"up-to-date\" เป็นคำคุณศัพท์ประสม (Compound Adjective) ที่มีความหมายว่า \"ทันสมัย / ล่าสุด / เป็นปัจจุบัน\" โดยมีกฎเกณฑ์การเขียนที่ถูกต้องตามหลักไวยากรณ์คือ ต้องเรียงลำดับคำว่า up ตาม ด้วย to และลงท้ายด้วย date พร้อมทั้งมีเครื่องหมายยติภังค์ (Hyphen) เชื่อมระหว่างคำเสมอเมื่อทำหน้าที่วางไว้หน้า คำนามเพื่อขยายลักษณะของนามนั้น โครงสร้าง : a(n) + Compound Adjective (up-to-date) + Noun (report) โจทย์ : The research team published an up-to-date report on the effects of climate change. (ทีมวิจัยได้ ตีพิมพ์รายงานที่ทันสมัยล่าสุดเกี่ยวกับผลกระทบของการเปลี่ยนแปลงสภาพภูมิอากาศ) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) to-date-up, (3) date-up-to และ (4) to-up-date ทั้งหมดนี้เป็นเพียงการสลับตำแหน่งของคำอย่างผิดหลักภาษา (Word Order Error) ซึ่งไม่มีความหมายและไม่มีการใช้งานจริงในพจนานุกรมภาษาอังกฤษ"},{"n":60,"q":"__________ at the back of the classroom, the shy student rarely participated in discussions.","o":["Sit","Sat","Sitting","To sit"],"a":3,"e":"ประโยคนี้ใช้โครงสร้าง Participle Clause (การลดรูปประโยคย่อยเพื่อขยายประธาน) โดยข้อความส่วนหน้า คอมมา (,) ทำหน้าที่ขยายลักษณะพฤติกรรมของประธานหลักของประโยคคือ \"the shy student\" (นักเรียนที่ขี้อายคนนั้น) ตามหลักไวยากรณ์ภาษาอังกฤษ เมื่อต้องการลดรูปข้อความเพื่อขยายประธาน มีกฎพิจารณาดังนี้ หากประธานเป็นผู้ลงมือทำ กริยานั้นเอง จะลดรูปโดยใช้ Verb-ing (Present Participle) หากประธานเป็นผู้ถูกกระทำ จะลดรูปโดยใช้ Verb ช่อง 3 (Past Participle) เนื่องจากประธาน คือ \"นักเรียนที่ขี้อาย\" เป็นผู้ลงมือทำกริยานั่งด้วยตัวเอง ไม่ได้ถูกใครจับไปตั้งวางไว้ จึงต้อง ใช้รูปกริยาที่เติม -ing ซึ่งก็คือ Sitting โครงสร้างลดรูป : Verb-ing (ส่วนขยาย), Subject + Verb แท้ + ... โจทย์ : Sitting at the back of the classroom, the shy student rarely participated in discussions. ((เนื่องจาก) นั่งอยู่แถวหลังสุดของห้องเรียน นักเรียนที่ขี้อายคนนั้นจึงแทบจะไม่เข้าร่วมการอภิปรายเลย) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) Sit เป็นคำกริยารูปฐาน ไม่สามารถนำมาใช้วางขึ้นต้นประโยคเพื่อเป็นส่วนขยายที่ลดรูปในลักษณะนี้ได้ (2) Sat เป็นกริยาช่อง 2 หรือ 3 หากเป็นช่อง 2 จะทำให้ประโยคมีกริยาแท้ซ้อนกันสองตัวโดยไม่มีคำเชื่อม ส่วนถ้า มองเป็นช่อง 3 (ถูกกระทำ) จะได้ความหมายที่ผิดเพี้ยนว่า \"นักเรียนถูกนำไปนั่ง\" ซึ่งไม่ใช่วิธีการใช้คำว่า sit ขยายบุคคล ในสถานการณ์ทั่วไป (4) to sit เป็นรูป Infinitive with to มักใช้เพื่อบอกวัตถุประสงค์ (แปลว่า เพื่อที่จะนั่ง) ซึ่งไม่สอดคล้องกับบริบทที่ ต้องการบอกพฤติกรรมหลักของนักเรียนคนนี้"},{"n":61,"q":"It’s _______ food I’ve ever had.","o":["bad","the worst","worse","worst"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 12. ประกอบ เห็น I’ve ever had. (ที่ฉันเคยเจอมา) ตอบการเปรียบเทียบขั้นสุดที่สุด ดูจากตัวเลือกคุณศัพท์มาจาก bad ทำเป็น ขั้นกว่าและขั้นสุดเปลี่ยนรูปเป็น worse, worst จึงตอบ the worst คุณศัพท์ที่เปลี่ยนรูปเมื่อทำเป็นขั้นกว่าหรือขั้นสุด ออก สอบบ่อย ๆ เช่น ขั้นธรรมดา ขั้นกว่า ขั้นสุด good (ดี) better (ดีกว่า) best (ดีที่สุด) bad (เลว/แย่) worse (แย่กว่า) worst (แย่ที่สุด) little (น้อย) less (น้อยกว่า) least (น้อยที่สุด) much/many (มาก) more (มากกว่า) most (มากที่สุด) Far (ไกล) further/farther (ไกลกว่า) furthest/farthest (ไกลที่สุด)"},{"n":62,"q":"If the lesson is _______, the students are________.","o":["confusing, confused","confused, confusing","confusing, confusing","confused, confused"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 24. ประกอบ ประโยคนี้เป็นการเลือกใช้คำคุณศัพท์ (Adjective) ที่เปลี่ยนรูปมาจากคำกริยาแสดงความรู้สึกคือคำว่า confuse (ทำให้สับสน) โดยมีกฎเกณฑ์แยกพิจารณาสองส่วนดังนี้ 1. ช่องว่างที่ 1 : ประธานคือ \"The lesson\" (บทเรียน) ซึ่งเป็นสิ่งไม่มีชีวิตและเป็นตัวการที่ทำให้เกิด ความรู้สึก ตามหลักไวยากรณ์จึงต้องใช้รูป Verb-ing (confusing) มีความหมายว่า \"น่าสับสน\" 2. ช่องว่างที่ 2 : ประธานคือ \"The students\" (นักเรียน) ซึ่งเป็นสิ่งมีชีวิตที่มีระบบประสาทรับรู้และเป็นผู้ที่ ได้รับหรือรู้สึกถึงความรู้สึกนั้น ตามหลักไวยากรณ์จึงต้องใช้รูป Verb-ed (confused) มีความหมายว่า \"รู้สึกสับสน\" เมื่อนำมารวมกันตามโครงสร้างเงื่อนไข : โจทย์ : If the lesson is confusing, the students are confused. (ถ้าบทเรียนนั้นน่าสับสน นักเรียนก็จะรู้สึก สับสน) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) confused, confusing สลับตำแหน่งความหมาย ทำให้แปลว่า \"ถ้าบทเรียนรู้สึกสับสน นักเรียนก็น่าสับสน\" ซึ่ง ผิดหลักความจริงและหลักไวยากรณ์ (3) confusing, confusing หากใช้รูปเติม -ing ทั้งคู่ จะแปลว่านักเรียนเป็นฝ่ายที่ \"น่าสับสน\" ซึ่งไม่ตรงกับบริบทที่ ต้องการบอกผลกระทบจากการเรียน (4) confused, confused หากใช้รูปเติม -ed ทั้งคู่ จะทำให้ส่วนแรกผิดไวยากรณ์เนื่องจากบทเรียนไม่สามารถมี ความรู้สึกสับสนเองได้"},{"n":63,"q":"Let’s try to get this work _______ by 5 p.m., shall we?","o":["do","does","done","did"],"a":3,"e":"ประโยคนี้ใช้โครงสร้างไวยากรณ์เรื่อง Causative Verb (กริยาวานหรือสั่งให้ทำ) ในรูปประธานถูกกระทำ (Passive Causative) โดยมีกริยาหลักคือคำว่า \"get\" โครงสร้าง : Subject + get + Something (สิ่งของ/กรรม) + Verb ช่อง 3 ในโจทย์มีการใช้กริยา get ตามด้วยกรรมคือ \"this work\" (งานชิ้นนี้) ซึ่งเป็นสิ่งไม่มีชีวิต ไม่สามารถลุกขึ้นมา ทำตัวเองได้ แต่ต้อง \"ถูกทำให้เสร็จ\" ดังนั้น คำกริยาที่นำมาเติมในช่องว่างจึงต้องอยู่ในรูปกริยาช่อง 3 คำกริยาในตัวเลือกคือคำว่า do ซึ่งผัน 3 ช่องได้เป็น do - did - done รูปกริยาช่อง 3 จึงคือคำว่า done โจทย์ : Let’s try to get this work done by 5 p.m., shall we? (พวกเราลองมาช่วยกันทำทำงานชิ้นนี้ให้เสร็จ ภายในเวลา 17.00 น. กันเถอะ ดีไหม) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) do เป็นกริยารูปฐาน (Infinitive) และ (2) does เป็นกริยาช่อง 1 ที่เติม s ไม่สามารถนำมาใช้วางตามหลังกรรมที่ เป็นสิ่งของในโครงสร้าง get + something ได้ (หากกรรมเป็นบุคคลที่ลงมือทำเอง โครงสร้าง get จะต้องใช้คู่กับ to + v.1 เช่น get someone to do) (4) did เป็นกริยาช่อง 2 ใช้สำหรับบอกเหตุการณ์ในอดีต ผิดหลักโครงสร้างไวยากรณ์ข้อนี้อย่างสิ้นเชิง"},{"n":64,"q":"If Tim _________ a lot of money, he would travel around the world.","o":["had","having","will have","would have"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 22. ประกอบ ประโยคนี้เป็นโครงสร้าง If แบบที่ 2 (Second Conditional) ซึ่งใช้สำหรับการสมมติเหตุการณ์ที่เป็นไปไม่ได้ หรือขัดแย้งกับความเป็นจริงในปัจจุบัน วิธีการสังเกตโครงสร้าง ประโยคส่วนผลลัพธ์ (หลัง , ) : คือ “he would travel (would + กริยารูปฐาน)” ซึ่งเป็นโครงสร้างบังคับ ของเงื่อนไขแบบที่ 2 ประโยคส่วน If (เงื่อนไข) : ตามกฎไวยากรณ์จะต้องใช้โครงสร้าง Past Simple Tense (Subject + Verb ช่อง 2) เสมอ ดังนั้น คำกริยาแสดงความเป็นเจ้าของ (have/has) ในช่องว่าง จึงต้องเปลี่ยนเป็นรูปกริยาช่อง 2 ซึ่งก็คือ had โครงสร้าง If แบบที่ 2 : If + Subject + Verb ช่อง 2, Subject + would + Verb รูปฐาน โจทย์ : If Tim had a lot of money, he would travel around the world. (ถ้าทิมมีเงินมากมาย เขาคงจะเดินทาง ท่องเที่ยวรอบโลก) (ความเป็นจริงในปัจจุบันคือ ทิมไม่ได้มีเงินมากขนาดนั้น และไม่ได้ไปเที่ยวรอบโลก) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) having เป็นรูป Verb-ing ไม่สามารถทำหน้าที่เป็นกริยาแท้ในประโยคเงื่อนไขหลังประธานได้โดยตรง (3) will have เป็นโครงสร้างของ If แบบที่ 1 (ประโยคส่วน If ต้องเป็นกริยาช่อง 1 และส่วนผลลัพธ์ใช้ will) ซึ่ง ขัดแย้งกับข้อนี้ที่ประโยคผลลัพธ์ใช้คำว่า would ไปแล้ว (4) would have ผิดหลักไวยากรณ์อย่างสิ้นเชิง เนื่องจากกฎเหล็กของภาษาอังกฤษกำหนดว่าห้ามใส่คำว่า would ไว้ในประโยคย่อยส่วนที่อยู่หลังคำว่า If เด็ดขาด (would จะต้องอยู่เฉพาะในส่วนประโยคผลลัพธ์เท่านั้น)"},{"n":65,"q":"Everyone ______ why Jane didn’t further her study in Japan.","o":["know","knows","have known","will know"],"a":2,"e":"ประโยคนี้เป็นการระบุข้อเท็จจริงทั่วไปในปัจจุบัน โดยพิจารณาจากประธานของประโยคคือ \"Everyone\" (ทุก คน) ซึ่งในทางไวยากรณ์ภาษาอังกฤษจัดเป็นสรรพนามไม่ชี้เฉพาะเจาะจง (Indefinite Pronoun) ที่มีรูปเป็นเอกพจน์เสมอ เมื่อประธานเป็นเอกพจน์และประโยคเป็นการบอกเล่าเรื่องราวทั่วไป (Present Simple Tense) คำกริยาหลักในช่องว่างคือ คำว่า know จึงต้องผันตามกฎไวยากรณ์โดยการเติม -s เปลี่ยนรูปเป็น knows โครงสร้าง : Everyone (ประธานเอกพจน์) + Verb ช่อง 1 เติม s/es (knows) + ... โจทย์ : Everyone knows why Jane didn’t further her study in Japan. (ทุกคนรู้ว่าทำไมเจนถึงไม่เรียนต่อที่ ประเทศญี่ปุ่น) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) know เป็นกริยาช่อง 1 รูปฐานที่ยังไม่ได้เติม s จะใช้กับประธานที่เป็นพหูพจน์ (เช่น They know, We know) ไม่สามารถใช้กับ Everyone ในภาษาที่เป็นทางการได้ (3) have known เป็น Present Perfect Tense และใช้กริยาช่วย have ซึ่งเป็นรูปพหูพจน์ จึงผิดทั้งโครงสร้างที่ขัด กับประธานเอกพจน์ และผิดบริบทการบอกข้อเท็จจริงทั่วไป (4) will know เป็น Future Simple Tense แปลว่า \"จะรู้\" ซึ่งขัดแย้งกับบริบทของประโยคที่ต้องการสื่อว่า ทุกคน ในปัจจุบันทราบเรื่องนี้อยู่แล้ว"},{"n":66,"q":"It’s much cheaper with that airline; _______, I’ll get all the tickets for all of us.","o":["owing to","so","thus","because"],"a":3,"e":"ประโยคนี้ประกอบด้วยข้อความ 2 ส่วนที่มีเครื่องหมายอัฒภาค (Semicolon: ;) และเครื่องหมายจุลภาค (Comma: ,) คั่นกลางช่องว่างอย่างชัดเจน โครงสร้างลักษณะนี้ต้องการคำประเภท คำกริยาวิเศษณ์เชื่อมประโยค (Conjunctive Adverb) มาทำหน้าที่เชื่อมความสัมพันธ์เชิง \"เป็นเหตุเป็นผลกัน\" ประโยคเหตุ : It’s much cheaper with that airline (มันถูกกว่ามากเมื่อบินกับสายการบินนั้น) ประโยคผล : I’ll get all the tickets for all of us (ฉันจะซื้อตั๋วทั้งหมดให้พวกเราทุกคนเอง) คำเชื่อมที่แปลว่า \"ดังนั้น / ด้วยเหตุนี้\" ที่ทำหน้าที่เป็น Conjunctive Adverb และวางในตำแหน่งโครงสร้าง ; ______ , ได้ถูกต้องตามหลักไวยากรณ์ที่เป็นทางการที่สุดคือ thus (หรือคำอื่นในกลุ่มเดียวกันเช่น therefore, furthermore) โครงสร้าง : ประโยคเหตุ ; thus , ประโยคผล โจทย์ : It’s much cheaper with that airline; thus, I’ll get all the tickets for all of us. (มันถูกกว่ามากเมื่อบิน กับสายการบินนั้น ด้วยเหตุนี้ฉันจึงจะซื้อตั๋วทั้งหมดให้พวกเราทุกคนเอง) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) owing to แปลว่า \"เนื่องจาก\" เป็นคำบุพบท ต้องตามหลังด้วยคำนามหรือวลี ไม่ใช่ประโยค และไม่วางคั่นด้วย เครื่องหมายรูปแบบนี้ (2) so แม้จะแปลว่า \"ดังนั้น\" และบอกผลลัพธ์เหมือนกัน แต่ตามหลักไวยากรณ์ so เป็นคำสันธาน (Coordinating Conjunction) จะใช้เชื่อมประโยคโดยใช้เพียงเครื่องหมายจุลภาคธรรมดาคั่น (เช่น ..., so I'll get...) จะไม่ใช้โครงสร้าง ร่วมกับเครื่องหมาย Semicolon และ Comma ซ้อนกันในลักษณะแบบนี้ (4) because แปลว่า \"เพราะว่า\" เป็นคำเชื่อมที่ใช้สำหรับนำหน้าประโยคที่เป็น เหตุ เท่านั้น ไม่ใช่นำหน้าประโยค ที่เป็นผลลัพธ์"},{"n":67,"q":"I’m responsible for setting up the room with you, _______I?","o":["am not","don’t","shall not","aren’t"],"a":4,"e":"ประโยคนี้เป็นโครงสร้าง Question Tag (ประโยคคำถามท้ายประโยคบอกเล่า) เพื่อเป็นการถามย ้าเพื่อความ มั่นใจ โดยมีกฎพื้นฐานคือ \"หน้าบอกเล่า หลังปฏิเสธ\" หรือ \"หน้าปฏิเสธ หลังบอกเล่า\" ประโยคส่วนหน้าเป็นประโยคบอกเล่าคือ \"I’m responsible...\" (I am) ตามหลักไวยากรณ์ภาษาอังกฤษ มีข้อยกเว้นพิเศษรูปปฏิเสธเฉพาะตัวสำหรับประธาน I ที่ใช้คู่กับ am ใน ประโยค Question Tag ว่า ห้ามใช้ am not I เด็ดขาด แต่จะต้องเปลี่ยนรูปไปใช้ aren't I แทนเสมอ เพื่อความสะดวกและ สละสลวยในการออกเสียงในภาษาที่เป็นทางการ โครงสร้างข้อยกเว้น : I am..., aren’t I? โจทย์ : I’m responsible for setting up the room with you, aren’t I? (ฉันมีหน้าที่รับผิดชอบในการจัดห้อง ร่วมกับคุณ ใช่ไหม) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (1) am not ผิดหลักกฎยกเว้นของ Question Tag เนื่องจากในภาษาอังกฤษดั้งเดิมไม่มีการรวบคำว่า am not ให้สั้น ลงเพื่อใช้ท้ายประโยคคำถามแบบนี้ (คำว่า amn't I ไม่มีรูปใช้งานจริง จึงต้องยืมคำว่า aren't มาใช้แทน) (2) don’t และ (3) shall not ผิดหลักโครงสร้าง เนื่องจากประโยคส่วนหน้าใช้กริยาช่วยกลุ่ม Verb to be (am) ประโยคส่วนท้ายที่เป็น Question Tag จึงต้องใช้กริยาในกลุ่ม Verb to be เช่นเดียวกัน ห้ามนำกริยาช่วยกลุ่มอื่น (do / shall) มาใช้"},{"n":68,"q":"A : Did Max go to _______ college after finishing high school? B : Yes, he attended ________ college near his hometown.","o":["(blank); a","a; a","the; a","a; (blank)"],"a":1,"e":"โจทย์ข้อนี้เป็นการทดสอบหลักไวยากรณ์เรื่องการใช้คำนำหน้านาม (Articles) นำหน้าคำนามที่เป็นสถานที่ สาธารณะ (เช่น college, school, hospital, prison, bed) ซึ่งมีกฎเกณฑ์แยกตามบริบทการใช้งานสองส่วนอย่างชัดเจน 1. ช่องว่างที่ 1 (ประโยค A) : คำนามคือ \"college\" (วิทยาลัย) ในบริบทคำถาม “Did Max go to college...?” สื่อ ความหมายถึง \"การไปเรียนหนังสือ/ไปศึกษาต่อในระดับอุดมศึกษา\" ซึ่งเป็นการมุ่งเน้นไปที่วัตถุประสงค์หลักของ สถานที่นั้น ตามกฎไวยากรณ์สากลระบุว่า ห้ามเติม Article ใดๆ (Zero Article หรือ blank) นำหน้าคำนามประเภทนี้ 2. ช่องว่างที่ 2 (ประโยค B) : ในประโยคคำตอบมีการระบุขยายสถานที่เพิ่มเติมว่า “...college near his hometown” (วิทยาลัยแห่งหนึ่งที่อยู่ใกล้บ้านเกิดของเขา) บริบทนี้ไม่ได้พูดถึงตัวสถาบันหรือการไปเรียนเป็นนามธรรม แล้ว แต่เป็นการกล่าวถึง \"ตัวอาคารหรือสถานที่ที่เป็นสิ่งก่อสร้างเป็นรูปธรรมแห่งหนึ่ง\" (เป็นคำนามนับได้เอกพจน์ ทั่วไปที่กล่าวขึ้นมาเป็นครั้งแรกและไม่ได้ชี้เฉพาะเจาะจงว่าเป็นวิทยาลัยชื่ออะไร) ตามหลักไวยากรณ์จึงต้องใช้ Indefinite Article \"a\" นำหน้า เมื่อนำมารวมกันตามโครงสร้างประโยคสนทนา A : Did Max go to college after finishing high school? (แมกซ์ได้ไปเรียนต่อระดับวิทยาลัยหลังจากจบมัธยม ปลายไหม) B : Yes, he attended a college near his hometown. (ใช่ เขาเข้าเรียนที่วิทยาลัยแห่งหนึ่งใกล้บ้านเกิดของเขา) เหตุผลที่ตัวเลือกอื่นไม่ถูกต้อง (2) a; a ผิดในช่องว่างแรก เนื่องจากสำนวนการไปเรียนหนังสือในระดับวิทยาลัยจะใช้รูป go to college เสมอ (ไม่มี การใส่ a นำหน้าในความหมายของการไปเรียน) (3) the; a ผิดในช่องว่างแรก เนื่องจากประโยค A เป็นการถามลอยๆ ทั่วไป ไม่ได้ชี้เฉพาะเจาะจงว่าเป็นวิทยาลัยแห่ง ใดแห่งหนึ่ง จึงห้ามใช้ the (4) a; (blank) ผิดโครงสร้างสลับตำแหน่งกันอย่างสิ้นเชิง"},{"n":69,"q":"Kazuo Ishiguro is a ________ nov
