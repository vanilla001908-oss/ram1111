1) เปลือกโลก (2) เป้าหมาย (3) คืนเงิน (4) กลยุทธ์"},{"n":100,"q":"Just by _______, Amy unexpectedly met her old schoolmate 40 years later.","o":["shelter","coincidence","refund","bunch"],"a":2,"e":"แค่ _______ เอมี่ก็ได้พบกับเพื่อนร่วมชั้นเรียนเก่าอย่างไม่คาดคิดหลังจากผ่านไป 40 ปี (1) ที่พักพิง (2) ความบังเอิญ (3) การคืนเงิน (4) ช่อดอกไม้"},{"n":101,"q":"Lily went around the island by riding a(n) _________ she had rented.","o":["experience","blink","moped","passenger"],"a":3,"e":"ลิลลี่เที่ยวรอบเกาะโดยขี่_________ที่เธอเช่ามา (1) ประสบการณ์ (2) กะพริบตา (3) รถมอเตอร์ไซค์ (4) ผู้โดยสาร"},{"n":102,"q":"This body lotion can cause ________ to sensitive skin.","o":["mortality","irritation","condition","tract"],"a":2,"e":"โลชั่นทาตัวนี้อาจก่อให้เกิด ________ ต่อผิวแพ้ง่าย (1) อัตราการเสียชีวิต (2) การระคายเคือง (3) สภาพร่างกาย (4) ทางเดินอาหาร"},{"n":103,"q":"A lot of _______ to sunlight may lead to heatstroke and skin cancer.","o":["exposure","energy","depression","regret"],"a":1,"e":"_______ ที่ได้รับแสงแดดมากเกินไปอาจทำให้เกิดอาการโรคลมแดดและมะเร็งผิวหนัง (1) การสัมผัส (2) พลังงาน (3) ภาวะซึมเศร้า (4) ความเสียใจ"},{"n":104,"q":"We’ve selected two possible _______ for our next vacation.","o":["goals","drawbacks","bunches","locations"],"a":4,"e":"เราได้เลือก _______ ที่เป็นไปได้สองอย่างสำหรับวันหยุดพักผ่อนครั้งต่อไปของเรา (1) เป้าหมาย (2) ข้อเสีย (3) ช่อดอกไม้ (4) สถานที่"},{"n":105,"q":"The brown cat was _______ up on the sofa, sleeping happily.","o":["curled","dropped","looked","grown"],"a":1,"e":"แมวสีน ้าตาลตัวนั้น _______ อยู่บนโซฟา นอนหลับอย่างมีความสุข (1) ขดตัว (2) ตก / หล่น / ร่วง (3) ดู (4) เติบโต"},{"n":106,"q":"It’s _________to take a shower or bath during a lightning storm.","o":["popular","inadvisable","charming","disappearing"],"a":2,"e":"การอาบน ้าฝักบัวหรือแช่น ้าในช่วงพายุฝนฟ้าคะนองถือเป็นเรื่อง _________ (1) เป็นที่นิยม (2) ไม่แนะนำ (3) มีเสน่ห์ (4) หายตัวไป"},{"n":107,"q":"Allowing Derek to move out of town was a(n) _______ error!","o":["essential","limited","fatal","sudden"],"a":3,"e":"การอนุญาตให้เดเร็คย้ายออกนอกเมืองเป็นความผิดพลาด _______! (1) จำเป็น (2) จำกัด (3) ร้ายแรง (4) ฉับพลัน"},{"n":108,"q":"Mark’s grandfather is a true _______. He keeps complaining a lot.","o":["passenger","grumbler","clown","shelter"],"a":2,"e":"ปู่ของมาร์คเป็นคน _______ ตัวจริง เขาชอบบ่นอยู่เรื่อย (1) ผู้โดยสาร (2) คนขี้บ่น (3) ตัวตลก (4) ที่พักพิง"},{"n":109,"q":"The result of the votes is still in _______. We need to re-check it.","o":["audience","vessel","doubt","circus"],"a":3,"e":"ผลการโหวตยังคงอยู่ที่ _______ เราต้องตรวจสอบอีกครั้ง (1) ผู้ชม (2) เรือ (3) ความสงสัย (4) ละครสัตว์"},{"n":110,"q":"Though I was in Minnesota, the coldest state in the US. I didn’t have a(n) _____with skiing.","o":["grumbler","experience","bunch","doubt"],"a":2,"e":"ถึงแม้ว่าฉันจะอยู่ที่มินนิโซตา รัฐที่หนาวที่สุดในสหรัฐอเมริกา แต่ฉันก็ไม่ได้ _____ กับการเล่นสกีเลย (1) คนบ่น (2) ประสบการณ์ (3) เป็นกลุ่ม (4) สงสัย"},{"n":111,"q":"You certainly are not supposed to be envious of others who have a bigger house.","o":["essential","caring","athletic","jealous"],"a":4,"e":"คุณไม่ควรอิจฉาคนที่มีบ้านใหญ่กว่านี้แน่นอน (1) จำเป็น (2) เอาใจใส่ (3) นักกีฬา (4) อิจฉา"},{"n":112,"q":"The man claimed that he could predict future events.","o":["anticipate","anticipate","handle","release"],"a":1,"e":"ชายคนนี้อ้างว่าเขาสามารถทำนายเหตุการณ์ในอนาคตได้ (1) คาดการณ์ล่วงหน้า (2) คาดการณ์ล่วงหน้า (3) จัดการ (4) ปล่อย"},{"n":113,"q":"People with limited incomes are hit very hard by inflation, so they’re looking forward to the digital money project.","o":["charming","Jam-packed","fatal","restricted"],"a":4,"e":"คนที่มีรายได้จำกัดได้รับผลกระทบจากภาวะเงินเฟ้ออย่างหนัก พวกเขาจึงตั้งตารอโครงการเงินดิจิทัล (1) มีเสน่ห์ (2) อัดแน่น (3) อันตราย (4) จำกัด"},{"n":114,"q":"There’s depression in the sand where Tony’s been lying.","o":["route","crust","ditch","nerve"],"a":3,"e":"มีหลุมบ่ออยู่ในทรายที่โทนี่นอนอยู่ (1) เส้นทาง (2) เปลือกโลก (3) หลุมบ่อ (4) เส้นประสาท"},{"n":115,"q":"With this, one can determine whether Iceland is worth visiting or not.","o":["achieve","decide","reduce","perform"],"a":2,"e":"ด้วยวิธีนี้ เราสามารถตัดสินได้ว่าไอซ์แลนด์น่าเที่ยวหรือไม่ (1) บรรลุ (2) ตัดสิน (3) ลด (4) ดำเนินการ"},{"n":116,"q":"The winner is likely to come from outside the company.","o":["essentially","dependably","probably","exactly"],"a":3,"e":"ผู้ชนะน่าจะมาจากภายนอกบริษัท (1) โดยพื้นฐานแล้ว (2) เชื่อถือได้ (3) น่าจะ (4) อย่างแน่นอน"},{"n":117,"q":"Could chronic back pain be cured with a simple course of antibiotics?","o":["dependable","fatal","charming","persisting"],"a":4,"e":"อาการปวดหลังเรื้อรังสามารถรักษาให้หายได้ด้วยยาปฏิชีวนะแบบง่ายๆ หรือไม่? (1) เชื่อถือได้ (2) เป็นอันตรายถึงชีวิต (3) มีเสน่ห์ (4) เรื้อรัง"},{"n":118,"q":"The two rooms are exactly the same size.","o":["precisely","daringly","temporarily","normally"],"a":1,"e":"ห้องทั้งสองมีขนาดเท่ากันพอดี (1) พอดี / แม่นยำ (2) กล้า (3) ชั่วคราว (4) ปกติ"},{"n":119,"q":"I imagine it’ll rain again this evening.","o":["expand","mention","hurt","think"],"a":4,"e":"ฉันคิดว่าเย็นนี้ฝนคงจะตกอีก (1) ขยาย (2) พูดถึง (3) เจ็บ (4) คิด"},{"n":120,"q":"They think it’s an easy job, when in fact, it’s a lot of hard work.","o":["actually","fatally","essentially","logically"],"a":1,"e":"พวกเขาคิดว่ามันเป็นงานง่าย แต่จริงๆ แล้วมันเป็นงานหนักมาก (1) จริงๆ แล้ว (2) อย่างร้ายแรง (3) โดยพื้นฐาน (4) อย่างมีเหตุผล"}]},{"title":"ภาค 2 ปีการศึกษา 2566","items":[{"n":1,"q":"The book that is on the table is ________.","o":["mine","him","mine","her"],"a":1,"e":"ประโยคท้ายไม่มีคำนามตามหลังและต้องการแสดงความเป็นเจ้าของ เช่น mine, yours, his, hers, theirs, ours บุรุษสรรพนาม (Personal Pronoun) รูปประธาน รูปกรรม Possessive adjective Possessive Pronoun สะท้อนตัวเอง I you he she they we it me you him her them us it my your his her มีคำนามตามหลัง their our its mine yours his hers ไม่มีคำนามตามหลัง theirs ours its myself yourself himself herself themselves ourselves itself ตัวอย่างประโยค : You go your way, and I go mine. (คุณไปตามทางของคุณ และฉันไปตามทางของฉัน) : He played his part as she played hers. (เขาแสดงบทบาทของเขาในขณะที่เธอแสดงบทบาทของเธอ) : They go their way, and we go ours. (พวกเขาไปตามทางของเขา และเราก็ไปตามทางของเรา)"},{"n":2,"q":"Cindy _________ a tough day today. She had to attend three meetings!","o":["have","had","has","will have"],"a":2,"e":"ใช้ Past Simple Tense (S. + V.2) กับเหตุการณ์หรือการกระทำที่เกิดขึ้นและ สิ้นสุดลงแล้วในอดีตโดยไม่จำกัดเวลา หรือบอกความจริงที่เกิดขึ้นในอดีต มักจะมีคำกริยาวิเศษณ์บอกเวลา เช่น yesterday (เมื่อวานนี้), ago (ก่อนหน้านี้ ที่ผ่าน มา), once (ก่อนหน้านี้ ที่ผ่านมา) this morning (เมื่อเช้านี้), in '+ ค.ศ., last (night/week /month/year/term) หรือมีอนุ ประโยคบอกเวลาที่เกิดขึ้นและสิ้นสุดลงแล้วในอดีต ตัวอย่างประโยค : My parents called me yesterday. (พ่อแม่โทรหาฉันเมื่อวานนี้) : They were at her birthday party last night. (พวกเขาอยู่ที่งานเลี้ยงวันเกิดของเธอเมื่อคืนนี้) : When I was young, I walked to school every day. (ตอนเด็กฉันเดินไปโรงเรียนทุกวัน)"},{"n":3,"q":"________ movie is perfect.","o":["A","An","The","(Blank)"],"a":3,"e":"ใช้ Article \"the\" นำหน้าคำนามเอกพจน์ คำนามพหูพจน์ คำนามนับไม่ได้ที่ได้กล่าวถึงไปแล้วครั้งหนึ่ง หรือใน สถานการณ์ที่ผู้พูดและผู้ฟังต่างเข้าใจว่าหมายถึงสิ่งใดหรือนำหน้าคำนามที่ชี้เฉพาะเจาะจงว่าเป็นคนใด ตัวใดหรือสิ่งใด (ใช้ the เมื่อต้องการ ชี้เฉพาะเจาะจง เมื่อเทียบกับ a/an ที่ไม่ชี้เฉพาะเจาะจง) ตัวอย่างประโยค : The boy sitting next to him raised his hand. (เด็กผู้ชายที่นั่งข้างเขายกมือขึ้น) : Dr. Tony is the doctor I like best. (นายแพทย์โทนี้เป็นหมอที่ฉันชอบที่สุด) : The girls over there are my classmates. (พวกเด็กผู้หญิงที่อยู่ตรงนั้นเป็นเพื่อนเรียนห้องเดียวกับผม)"},{"n":4,"q":"Jenny’s dirty clothes need ________.","o":["washed","washing","be washed","to wash"],"a":2,"e":"การใช้กริยา want/need ถ้าใช้ในรูปถูกกระทำจะตอบได้ 2 รูปแบบ คือ S. + want/need + Ving หรือ S. + want/need + to be + V3 ข้อนี้ ประธานคือ clothes (เสื้อผ้า) เป็นสิ่งของ ตอบ need + Ving = washing"},{"n":5,"q":"Mary’s car broke down when she ________the house yesterday.","o":["will leave","leave","leaves","was leaving"],"a":4,"e":"ใช้ Past Progressive Tense (S. + was/were + V.ing) คู่กับ Past Simple Tense (S. + V.2) แสดงความสัมพันธ์ ของเหตุการณ์ 2 เหตุการณ์ที่เกิดขึ้นคาบเกี่ยวกันในอดีตโดยมีเหตุการณ์หนึ่งกำลังดำเนินอยู่ก่อนแล้ว (Past Progressive Tense) และมีอีกเหตุการณ์หนึ่งเกิดซ้อนขึ้นมา (Past Simple Tense) มักมีคำเชื่อมบอกเวลา when, while, as ปรากฏด้วย ตัวอย่างประโยค : As I was jogging, I saw my girlfriend driving by. (ขณะที่ผมกำลังวิ่งอยู่ ผมเห็นแฟนของผมกำลังขับรถผ่านไป) : My mother was cooking when I arrived. (แม่ของฉันกำลังทำกับข้าวตอนที่ฉันมาถึง)"},{"n":6,"q":"_______idea was it to have a picnic?","o":["Who","Which","Whose","When"],"a":3,"e":"คำถามประเภท Wh-Questions คือ คำถามที่ต้องการรายละเอียดข้อมูลในเรื่องราวหรือเหตุการณ์ต่างๆ มากกว่า การตั้งคำถามที่ต้องการค่าตอบ Yes (ใช่) หรือ No (ไม่ใช่) ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม Which, What which (คนไหน, ตัวไหน, สิ่งไหน) Which sweater did you buy? (คุณซื้อเสื้อกันหนาวตัวไหน) Which hand do you write with? (คุณเขียนด้วยมือข้างไหน) what (อะไร) What will you do in next holiday? (วันหยุดครั้งหน้าคุณจะทำอะไร) What makes you come here? (อะไรทำให้คุณมาที่นี่) ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม Who, Whom, Whose who (ใคร) Who makes the decisions here? (ที่นี่ใครเป็นคนตัดสินใจ) Who is the best footballer in the world? (ใครคือนักฟุตบอลที่เก่งที่สุดใน โลก) whom (ใคร) Whom ore we waiting for? (พากเรากำลังรอใครอยู่) Whom are you going to invite? (คุณจะเชิญใคร) whose (ของใคร) Whose car is parked in front of the house? (รถของใครจอดอยู่หน้าบ้าน) Whose are these gloves? (ถุงมือนี้เป็นของใคร) ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม When, Where, why when (เมื่อไร) When are we going to finish? (เราจะเสร็จเมื่อไหร่) When is the next meeting scheduled? (กำหนดการประชุมครั้งต่อไป เมื่อใด) where (ที่ไหน) Where will you go for your holiday? (วันหยุดพักผ่อนคุณจะไปไหน) Where does this story take place? (เรื่องนี้เกิดขึ้นที่ไหน) why (ทำไม) Why does he complain all the time? (ทำไมเขาบ่นตลอดเวลา) Why did you choose to study engineering? (ทำไมคุณถึงเลือกเรียนวิศวะ)"},{"n":7,"q":"Jim was always late for work, _______ his boss fired him.","o":["but","for","or","so"],"a":4,"e":"การใช้คำเชื่อมในประโยคความรวม (Compound Sentence) ความหมาย ใช้เครื่องหมาย ,_____ ใช้เครื่องหมาย ;______, 1. แสดงความคล้อยตามกัน and, nor moreover, furthermore, also, meanwhile, besides, similarly 2. แสดงความขัดแย้ง but, yet, or however, instead, otherwise, nevertheless, indeed, still 3. แสดงผลหรือสรุปความ so accordingly, finally, thus, consequently, therefore 4. แสดงเหตุ (เพราะ) for - ใช้ so เป็นคำเชื่อม (Conjunction) มีความหมายว่า \"ดังนั้น\" ตามด้วยประธานและคำกริยา หน้า so ต้องมี เครื่องหมาย Comma (,) เสมอ ตัวอย่างประโยค : We were so tired, so we went to bed early last night. (พวกเรารู้สึกอ่อนเพลียมาก ดังนั้นเมื่อคืนนี้พวกเราจึงเข้านอนแต่หัวค ่า) : I didn't eat anything, so I'm very hungry now. (ผมไม่ได้กินอะไรมาเลย ดังนั้นตอนนี้ผมจึงหิวมาก)"},{"n":8,"q":"If she ______ a car, she could drive to work.","o":["had","has","would have","had had"],"a":1,"e":"ประโยค Conditional Sentences ประกอบด้วย 2 ส่วน คือ ส่วน if-Clause (ส่วนที่เป็นเงื่อนไข) และส่วน Main Clause (ส่วนที่เป็นประโยคหลัก) ในการเขียนประโยค Conditional Sentences นั้น ทั้ง 2 ส่วนสามารถสลับตำแหน่งกันได้ แบบที่ 1 - ข้อเท็จจริง / ปกติวิสัย / เป็นไปได้ในปัจจุบัน If + S. + V.1 (ผันตาม S.) , S. + V.1 (ผันตาม S.) ตัวอย่างประโยค : If you mix red and blue, you get purple. (ถ้าคุณผสมสีแดงกับสีน ้าเงิน คุณจะได้สีม่วง) : Your muscle mass decreases if you don't exercise. (ถ้าคุณไม่ออกกำลังกาย มวลกล้ามเนื้อของคุณจะลดลง) แบบที่ 2 - เป็นไปได้ในอนาคต If + S. + V.1 (ฝันตาม S.), S. + will/shall/can/may/must + V.1 (ไม่ฝัน) ตัวอย่างประโยค : If I have enough time, I will go shopping. (ถ้าฉันมีเวลาเพียงพอ ฉันจะไปซื้อของ) : We will go camping if the weather is nice this afternoon. (ถ้าบ่ายนี้อากาศดี เราจะไปตั้งแคมป์กัน) แบบที่ 3 - เป็นไปไม่ได้ในปัจจุบัน (ตรงข้ามกับความเป็นจริงในปัจจุบัน) If + S. + V.2/were, S. + would/could/should/might + V.1 (ไม่ผัน) ตัวอย่างประโยค : If I had her phone number, I would call her. (ถ้าผมมีเบอร์โทรของเธอ ผมจะโทรหาเธอ) : Pat would fly to Phuket every winter if he were a bird. (ถ้าแพทเป็นนก เขาจะบินไปภูเก็ตทุกฤดูหนาว) แบบที่ 4 - เป็นไปไม่ได้ในอดีต (ตรงข้ามกับความเป็นจริงในอดีต) If + S. + had + V.3, S. + would/could/should/might + have + V.3 ตัวอย่างประโยค : If they had taken the bus to school, they wouldn't have arrived in time. (ถ้าพวกเขาขึ้นรถเมล์ไปโรงเรียน พวกเขาคงมาไม่ทัน) : You would have arrived on time if you had left earlier. (ถ้าคุณออกเร็วกว่านี้ คุณคงมาถึงตรงเวลา) ข้อนี้ใช้สูตรที่ 3. If S + V2 , S + would/could + V1"},{"n":9,"q":"Tony __________ me. He was looking at the other side of the street.","o":["mustn’t have seen","wouldn’t have seen","couldn’t have seen","shall not have seen had had"],"a":1,"e":"ใช้ must + have + V.3 เพื่อแสดงเหตุการณ์ที่เกิดขึ้นในอดีต ที่เราเชื่อมั่นว่า มันต้องเป็นอย่างนั้นอย่างแน่นอน เพราะอาจจะมีหลักฐานบางอย่างหรือข้อมูลบางอย่างที่ทำให้เราเชื่อเช่นนั้น ตัวอย่างประโยค : He mustn't have seen me as he was looking at the other side of the street. (เขาต้องไม่เห็นฉัน เพราะเขากำลังมองไปอีกฝั่งของถนน) : Your English is really good. You must have studied aboard. (ภาษาอังกฤษของคุณดีมาก คุณต้องเคยไปเรียนที่ต่างประเทศมาแล้วแน่ๆ) ข้อนี้เป็นเรื่องกริยาช่วยในรูปอดีตเพราะมี was looking แสดงว่าส่วนหน้าต้องใช้เป็นอดีต สำหรับกริยาช่วยรูปอดีต จะลงท้าย have V3 กริยาช่วยที่เข้ากับประโยคได้คือ mustn’t have V3 = mustn’t have seen = “ต้องไม่เห็น”"},{"n":10,"q":"It was _______ of all.","o":["the more bad","bad","the worst","worse"],"a":3,"e":"การเปรียบเทียบขั้นสุด (Superlative Degree of Comparison) เพื่อเปรียบเทียบคำนามที่มีจำนวนตั้งแต่ 3 คำขึ้นไป โครง สร้างของคำจะเกิดจากการเติม \"-est\" ที่ท้ายคำคุณศัพท์ 1 หรือ 2 พยางค์ (แต่ถ้าคำนั้นลงท้ายด้วย \"-e\" จะเติมเพียง \"-st\" ท้ายคำ)หรือเติม \"most\" หน้าคำคุณศัพท์ที่มีตั้งแต่ 3 พยางค์ขึ้นไปและต้องมี Article \"the\" นำหน้าคำคุณศัพท์ขั้นสุดเสมอ the + Adj. + est หรือ most + Adj. ตัวอย่างประโยค : My house is the largest one in our neighborhood. (บ้านของฉันใหญ่ที่สุดในละแวกบ้านของเรา) : He is the most romantic guy I have ever met. (เขาคือผู้ชายที่โรแมนติกที่สุดเท่าที่ฉันเคยเจอมา) คำคุณศัพท์เปลี่ยนรูปแบบผิดปกติ Positive Comparative Superlative good (ดี) better best bad (ไม่ดี) worse worst little (เล็กน้อย) less least much/many (มาก) more most far (ไกล) farther farthest further furthest ตัวอย่างประโยค : Today is the worst day I've ever had. (วันนี้เป็นวันที่เลวร้ายที่สุดที่ฉันเคยมีมา) : This is the best sandwich I've ever eaten. (นี่เป็นแซนวิชที่ดีที่สุดที่ฉันเคยกิน)"},{"n":11,"q":"If he ________ here, we would have a great time together.","o":["am","will be","were","have been"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 8. ประกอบ If S + V2 , S + would/could + V1"},{"n":12,"q":"Laura and Gale ________ friends since high school.","o":["were","are","will be","have been"],"a":4,"e":"ใช้ Present Perfect (S + has/have + V3) หรือจะตอบ Present Perfect Continuous Tense (S + has/have been + Ving) แสดงเหตุการณ์ที่เกิดติดต่อกันตั้งแต่อดีตจนถึงปัจจุบันและจะดำเนินต่อไปในอนาคต ให้จำคำบอกเวลา เช่น for (เป็นเวลา), since (ตั้งแต่), just (เพิ่งจะ), recently (เร็ว ๆนี้), lately, yet, already, ever, never, how long , all day (ตลอด วัน), all evening (ตลอดเย็น) ข้อนี้มีคำบอกเวลา คือ since จึงตอบ have been"},{"n":13,"q":"That’s ________ excellent pencil.","o":["a","an","the","(blank)"],"a":2,"e":"ใส่ article มีหลัก ดังนี้ 1. ใช้ “a” นำหน้าคำนามทั่วไปที่ขึ้นต้นด้วยพยัญชนะ กล่าวถึง สิ่งหนึ่ง อย่างหนึ่ง โดยทั่วไปไม่เจาะจง เช่น a man (ผู้ชายคนหนึ่ง) หรือ “a” นำหน้าคำนามอาชีพ เช่น a teacher, a doctor, a student 2. ใช้ “an” นำหน้าคำนามที่มีสระนำหน้า (a, e, i, o, u) เช่น an ant, an elephant, an egg และถ้ามีคุณศัพท์ (adj.) มา ขยายให้ผันตามคำคุณศัพท์นั้น เช่น an important person, an intelligent student ตัวอย่างประโยค : My father is a UN officer. (พ่อของฉันเป็นเจ้าหน้าที่สหประชาชาติ) : The smile is a universal sign of pleasure. (รอยยิ้มเป็นสัญลักษณ์สากลแห่งความสุข : His daughter is an honest girl. (ลูกสาวของเขาเป็นเด็กที่ซื่อสัตย์) : Her son is an amazing boy. (ลูกชายของเธอเป็นเด็กชายมหัศจรรย์)"},{"n":14,"q":"The make-up on Cheryl’s face wants _______ up.","o":["to be touched","be touching","touched","be touching"],"a":1,"e":"โครงสร้าง Passive Voice ของกริยา want ซึ่งเราเห็น want + สิ่งของ (her bedroom) ใช้โครงสร้าง want + สิ่งของ+ to be V3 = want to be touched ตัวอย่างประโยค : Mom wants the room to be cleaned. = แม่อยากให้ห้องสะอาด"},{"n":15,"q":"The cat licked its paws to clean ________.","o":["he","it","itself","those"],"a":3,"e":"จากประโยคมีประธานคือ The cat (แมว) และให้ตอบหลังกริยา clean ใช้รูปสะท้อนตัวเองว่า ทำความสะอาดตัว มันเอง คือ itself รูปประธาน สะท้อนตัวเอง I myself You (เอกพจน์) yourself You (พหูพจน์) yourselves he himself she herself they themselves we ourselves it itself"},{"n":16,"q":"A: ____________. B: My name is John William Smith.","o":["Who are you?","May I have your full name, please?","What is your father’s name?","Are you John Smith?"],"a":2,"e":"ใช้ may + V.1 (ไม่ผัน) เพื่อขออนุญาต (Permission) ตัวอย่างประโยค A : May I have your full name, please? (ฉันขอทราบชื่อเต็มของคุณได้ไหม) B : My name is John William Smith. (ชื่อฉันคือจอห์น วิลเลียม สมิธ)"},{"n":17,"q":"Betty is _______ person I’ve ever known.","o":["the more wonderful","more wonderful","wonderful","the most wonderful"],"a":4,"e":"เมื่อเห็นส่วนหลังว่า I’ve ever known. (เท่าที่ฉันเคยเห็น) แสดงถึงที่สุดเท่าที่เคยเห็น ตอบขั้นสุด จากตัวเลือกให้ คุณศัพท์ wonderful ขั้นสุดใช้ most นำหน้าและมี the นำหน้ารวมกันเป็น the most wonderful"},{"n":18,"q":"We’ll _______ our trip tomorrow.","o":["start","started","would start","have started"],"a":1,"e":"ใช้ Future Simple Tense (S. + will/shall/be going to + V.1 ไม่ผัน) กับเหตุการณ์หรือการกระทำที่จะเกิดขึ้นใน อนาคต อาจจะมีคำกริยาวิเศษณ์บอกเวลา เช่น tomorrow, soon, next (week/month/year), tonight, in (the future/a few minutes/half an hour), this afternoon/evening, at the end of this month, later เป็นต้น ตัวอย่างประโยค : We will travel around the world next year. (พวกเราจะไปเที่ยวรอบโลกปีหน้า) : I will go to the beach at the end of this month. (ผมจะไปทะเลปลายเดือนนี้)"},{"n":19,"q":"They always go _________ during their summer vacation.","o":["fish","fishes","fishing","to fish"],"a":3,"e":"ใช้ go + Ving โดย Ving ทำหน้าที่เป็นคำนาม เพื่อบอกว่าไปทำกิจกรรมนั้น ๆ มักเป็นกิจกรรมและกีฬา เช่น go shopping (ไปชอปปิ้ง), go running, go skiing, go dancing, go fishing (ไปตกปลา), gocamping, go drinking เป็นต้น"},{"n":20,"q":"_______ closing the door, Max?","o":["May I","Will be","Can we","Would you mind"],"a":4,"e":"สำนวนที่ตามด้วย Gerunds be accustomed to can't bear it's no good be opposed to can't help it's no use be tired of can't resist it's worth be/get used to can't stand Do/Would you mind..? ตัวอย่างประโยค : My mother is used to getting up early. (แม่ฉันเคยชินกับการตื่นแต่เช้า) : I can't help falling in love with him. (ช่วยไม่ได้ที่ฉันตกหลุมรักเขา) : It's worth investing in gold. (มันคุ้มค่าที่จะลงทุนในทองคำ) : Would you mind turning that ventilator on, please? (คุณจะรังเกียจไหมที่จะเปิดเครื่องระบายอากาศนั้น)"},{"n":21,"q":"They _______ by the teacher because they cheated on the exam.","o":["punished","have punished","are punishing","were punished"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 2. ประกอบ โครงสร้าง Passive voice ใน Past Simple Tense คือ S. + was/were + V.3 ตัวอย่างประโยค : The prize was won by the great competitor. (ผู้เข้าแข่งขันยอดเยี่ยมคว้ารางวัลไปครอง) : Their beds were made neatly by the maid. (แม่บ้านจัดเตียงของพวกเขาอย่างเรียบร้อย)"},{"n":22,"q":"__________ you come early tomorrow? A visitor is arriving at 8 a.m.","o":["Can","Shall","Must","Need"],"a":1,"e":"ใช้ can + V.1 (ไม่ผัน) เพื่อขอร้อง (Request) ตัวอย่างประโยค : Can you forward Liza's email to me? (คุณช่วยส่งอีเมล์ของลิซาให้ฉันได้ไหม) : Can you help me with these exercises? (คุณช่วยฉันทำแบบฝึกหัดนี้ได้ไหม)"},{"n":23,"q":"_______ blamed herself for the mistake.","o":["His","Our","She","It"],"a":3,"e":"เมื่อเห็นคำว่า herself เป็นสรรพนามที่สะท้อนตัวเธอเองแสดงประธานต้องเป็น She ตัวอย่างประโยค : She blamed herself for the accident. (เธอโทษตัวเองที่ทำให้เกิดอุบัติเหตุ) : You are not yourself today. (วันนี้ดูไม่เหมือนตัวเธอเลย)"},{"n":24,"q":"It’s a bit warmer today. Still, it __________snow later this evening.","o":["should","might","had to","would"],"a":2,"e":"หมายเหตุ: ไฟล์ต้นฉบับพิมพ์เลขเฉลยเป็น 3 แต่ข้อความเฉลยคือ “might” (ข้อ 2) จึงใช้ข้อ 2. ใช้ may/might + V.1 (ไม่ผัน) มีความหมายว่า \"อาจจะ, น่าจะ, บางที\" เพื่อแสดงถึงความเป็นไปได้ (Possiblity) ทั้ง ในปัจจุบันหรือในอนาคต (may มีโอกาสที่จะเป็นไปได้แต่ might พอมีโอกาสเป็นไปได้บ้าง แต่น้อยมาก แสดงให้เห็นว่า ผู้พูดไม่มีความมั่นใจ) ตัวอย่างประโยค : She may come tomorrow. (เธออาจจะมาพรุ่งนี้) : He might get a job soon. (เขาน่าจะได้งานเร็วๆ นี้)"},{"n":25,"q":"Would you like _______ glass of milk?","o":["a","an","the","(blank) + Ving"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 13. ประกอบ ใช้ “a” นำหน้าคำนาม แสดงถึงจำนวนหนึ่ง เช่น a glass of milk (นมแก้วหนึ่ง)"},{"n":26,"q":"They are accustomed to _______ to bed late and ______ up early.","o":["go; get","going; getting","going; to get","to go; getting"],"a":2,"e":"สำนวนต่อไปนี้ให้ตามด้วย Ving ได้แก่ be accustomed to can’t bear It’s no good be opposed to can’t help It’s no use be subjected to can’t resist It’s worth be / get used to can’t stand Do / Would you mind..? ตัวอย่างประโยค : My mother is used to getting up early. (แม่ฉันเคยชินกับการตื่นแต่เช้า) : I can't help falling in love with him. (ช่วยไม่ได้ที่ฉันตกหลุมรักเขา) : It's worth investing in gold. (มันคุ้มค่าที่จะลงทุนในทองคำ) : Would you mind turning that ventilator on, please? (คุณจะรังเกียจไหมที่จะเปิดเครื่องระบายอากาศนั้น) ฉะนั้น are accustomed to + Ving จึงตอบ going และหลัง and ใช้ Ving ด้วย = getting"},{"n":27,"q":"When the teacher is ________, the students are________.","o":["boring; bored","boring; boring","bored; boring","bored, bored"],"a":1,"e":"คุณศัพท์ที่ลงท้ายด้วย -ed แสดงรู้สึกเช่น bored (รู้สึกเบื่อ), interested (รู้สึกสนใจ), surprised (รู้สึกประหลาดใจ) และลงท้ายด้วย -ing เช่น boring (น่าเบื่อ), interesting (น่าสนใจ), surprising (น่าประหลาดใจ) ตัวอย่างประโยค : When the teacher is boring, the students are bored. (เมื่อครูเบื่อ นักเรียนก็เบื่อ) : I am interested in science because it is interesting. (ฉันสนใจวิทยาศาสตร์ เพราะมันน่าสนใจ)"},{"n":28,"q":"Ann : ______ are you off to, Dan? Dan : To the library. I have a final exam next week.","o":["Who","What","Where","When"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 6. ประกอบ ตัวอย่างประโยค Wh-Questions ที่ใช้คำแสดงคำถาม When, Where, why : when (เมื่อไร) : When are we going to finish? (เราจะเสร็จเมื่อไหร่) : When is the next meeting scheduled? (กำหนดการประชุมครั้งต่อไปเมื่อใด) where (ที่ไหน) : Where will you go for your holiday? (วันหยุดพักผ่อนคุณจะไปไหน) : Where does this story take place? (เรื่องนี้เกิดขึ้นที่ไหน) why (ทำไม) : Why does he complain all the time? (ทำไมเขาบ่นตลอดเวลา) : Why did you choose to study engineering? (ทำไมคุณถึงเลือกเรียนวิศวะ)"},{"n":29,"q":"He wants a notebook computer ________on.","o":["working","works","be worked","to work"],"a":4,"e":"หน้าที่ของ Infinitive ที่มี to นำหน้า คือ ทำหน้าที่เป็นคำคุณศัพท์ขยายคำนาม เช่น : She gave the kitten something to eat. (เธอให้ลูกแมวกินอะไรบางอย่าง) : He wants a book to write on. คือกริยา want + กรรม + to V1 เช่นเดียวกับข้อนี้ กริยา want + กรรม (a notebook computer) + to V1 จึงตอบ to work"},{"n":30,"q":"Bob didn’t change his field of study ______ the new report on future career trends.","o":["because of","since","for","through"],"a":1,"e":"ใช้ because เป็นคำขึ้นต้น Adverb Clause of Reason (อนุประโยคแสดง-เหตุผล) มีความหมายว่า \"เพราะ, เพราะว่า , เนื่องจาก\" หลัง because ตามด้วยประธานและคำกริยา ส่วน because of เป็นคำบุพบท (Preposition) มีความหมาย เช่นเดียวกับ because หลัง because of ตามด้วยคำนาม (Noun) หรือกลุ่มคำนาม (Noun Phrase) หรือถ้าหากเป็นคำกริยา ต้องเป็นคำกริยาที่อยู่ในรูป V.ing = because + Subject + Verb because of + Noun / Pronoun / V.ing ตัวอย่างประโยค : He crashed his car because he was driving too fast. (เขาขับรถชน เพราะเขาขับเร็วเกินไป) : We had to cancel the party because of bad weather. (เราต้องยกเลิกงานปาร์ตี้ เนื่องจากสภาพอากาศไม่ค่อยดี)"},{"n":31,"q":"Jane looks as sweet as Candy in __________.","o":["lovely pink this dress","this lovely pink dress","lovely this pink dress","this lovely dress pink"],"a":2,"e":"ในกรณีที่ใช้คำคุณศัพท์ (Adjective) หลายตัวหน้าคำนามที่ต้องการขยายจะมีการเรียงลำดับคำคุณศัพท์ก่อนหลังดังนี้ คำนำหน้านาม - ลักษณะ - ขนาด - รูปร่าง - อาย - สี - แหล่งที่มา - วัสดุ - นามขยาย - นามหลัก ตัวอย่างประโยค : My grandmother lives in the little blue house on the corner. (คุณยายของฉันอาศัยอยู่ในบ้านหลังเล็กตรงหัวมุม) : It was made of a strange, green, metallic material. (มันทำจากวัสดุโลหะสีเขียวแปลกตา) : My younger brother loves that big old green antique car. (น้องชายของฉันชอบรถโบราณสีเขียวคันใหญ่คันนั้น) : She is a beautiful, tall, thin, young, black-haired, Thai woman. (เธอเป็นหญิงสาวชาวไทยผมดำ สวย สูง ผอม)"},{"n":32,"q":"Tomorrow, Criseyde ___ care of by her grandparents because her parents won’t be available.","o":["will take","is taking","takes","will be taken"],"a":2,"e":"คำบอกเวลา tomorrow (พรุ่งนี้) เป็นอนาคตใช้โครงสร้าง will + V1 แต่จากโจทย์มี by (โดย) จะทำให้เรารู้ว่าเป็น ประโยค passive voice (รูปถูกกระทำ) ต้องใช้ลงท้ายด้วยกริยาช่องที่ 3 นั่น คือ Criseyde เป็นชื่อคน จะได้รับการดูแลโดย ปู่ย่าของเธอจึงใช้โครงสร้าง will be + V3 = will be taken care of by ....."},{"n":33,"q":"Pamela told us _________ she left her last job at ABC Co., Ltd.","o":["the result","the consequences","the cause","the reason why"],"a":4,"e":"ให้ตอบคำเชื่อม “พาเมล่าเล่าถึงเหตุผลที่เธอลาออกจากงานสุดท้ายที่บริษัท เอบีซีจำกัด” the result = the consequences = ผลลัพธ์ ส่วน the reason why = เหตุผล และthe cause =สาเหตุ ควรใช้เป็น the cause of why = สาเหตุ จึงจะถูกกว่า เช่น : Bill told us the reason why he had left the house without telling anyone. (บิลบอกเราถึงเหตุผลที่เขาออกจากบ้านโดยไม่บอกใคร)"},{"n":34,"q":"That handbag _________ beautiful.","o":["smells","looks","turns","tastes"],"a":2,"e":"ในตัวเลือกเป็นกริยาประเภท linking verb (look, feel, seem, keep, taste, smell, turn, appear, become) ตามด้วย adj. (beautiful) กริยาที่เข้ากับโจทย์ คือ looks (มองดู) สวย = looks beautiful ส่วน tastes, smell มักใช้กับโจทย์อาหารการ กิน และ turns เช่น His face turns red. (ใบหน้าแดง) เป็นต้น"},{"n":35,"q":"Which way _______ I to go? This way or that way?","o":["will","shall","ought","might"],"a":3,"e":"ใช้ ought to + V.1 (ไม่ผัน) มีความหมายว่า \"ควร, ควรจะ\" เพื่อเป็นการให้คำแนะนำหรือข้อเสนอแนะ ตัวอย่างประโยค : She ought to work hard. (เธอควรทำงานให้หนัก) : He ought to buy a new car. (เขาควรจะซื้อรถคันใหม่)"},{"n":36,"q":"Demi is playing ________ tennis.","o":["a","an","the","(blank)"],"a":4,"e":"ไม่ใช้ Article กับคำนามที่เป็นชื่อกีฬา เกม และกิจกรรมต่างๆ football basketball cricket swimming tennis volleyball hockey singing table tennis chess yoga dancing badminton golf boxing skiing ตัวอย่างประโยค : They play football with their friends every day. (พวกเขาเล่นฟุตบอลกับเพื่อนๆ ทุกวัน) : The girls of this school pay attention to tennis. (นักเรียนหญิงของโรงเรียนแห่งนี้สนใจกีฬาเทนนิส) : I think volleyball is a very good sport. (ผมคิดว่าวอลเลย์บอลเป็นกีฬาที่ดีมาก)"},{"n":37,"q":"Blue-collar workers in the future will not have much education and skill, _______their pay will be low.","o":["so","because","since","because"],"a":1,"e":"“คนทำงานปกน ้าเงิน (คนที่ใช้แรงงาน) ในอนาคตจะไม่ค่อยมีการศึกษาและทักษะมากนัก ดังนั้นค่าจ้างของพวก เขาจะต ่า” คำเชื่อม so = ดังนั้น ส่วน since, for, because = เพราะว่า"},{"n":38,"q":"The police made the gunman ________ the gun down and step back.","o":["put","puts","putting","to put"],"a":1,"e":"คำกริยาที่ตามด้วย Infinitive ที่ไม่มี to นำหน้า (Infinitive without to) let make + Object (กรรม) + Infinitive without to have ตัวอย่างประโยค : His mother made him promise to well behave. (แม่ของเขาให้เขาสัญญาว่าจะประพฤติตัวดี) : My boss let me leave early. (เจ้านายให้ฉันกลับบ้านเร็ว)"},{"n":39,"q":"The black and white cat is Tony’s, _________?","o":["is it","isn’t he","is not it","isn’t it"],"a":4,"e":"เป็นเรื่อง tag ส่วนหาง มีหลักดังนี้กำหนดว่าถ้าข้างหน้าเป็นประโยคบอกเล่าข้าง หลังจะต้องเป็นรูปปฏิเสธรูปย่อ มี 2 จุด ที่ต้องดูนั่น คือ 1. เรื่องกริยากับ เรื่องคำสรรพนาม เราเห็นประโยคให้ข้อนี้มี don’t like เป็นปฏิเสธรูปย่อ ทำ tag ต้องเป็นบอกเล่า คือ do และ 2. ดูประธานถ้าให้คำนามมาเป็นเพศชาย เช่น ชื่อ John เปลี่ยนเป็นสรรพนาม he แต่ถ้าให้ สรรพนามมาตัวไหนก็ยกตัวนั้นมาเลยในรูปประธาน ตัวอย่างประโยค : Jane will be here soon, won’t she? (เจนจะมาถึงเร็วๆ นี้ ใช่ไหม?) : There was a lot of rain, wasn’t there? (ฝนตกหนักมากเลยใช่ไหม?) : Maggi won’t be late, will she? (แม็กกี้คงไม่มาสายใช่มั้ยล่ะ?) : I am late, aren’t I? ( ฉันมาสายใช่มั้ยล่ะ?) **(กรณีถ้าเป็น am ทำเป็นปฏิเสธส่วนหลังต้องใช้ aren’t I) : I am not late, am I? (ฉันไม่ได้สายนะใช่ไหม?) กรณียกเว้น ถ้าขั้นต้น ประโยคมี 2 กรณีนะคะให้ตอบส่วนหลังคงที่ : Let’s go home, shall we? ขึ้นต้นด้วย Let’s ให้ตอบ shall we : Clean the table, will you? ขึ้นต้นด้วยกริยาช่องที่ 1 ให้ตอบ will you ข้อนี้มีกริยา is ทำส่วนหางเป็นปฏิเสธรูปย่อ คือ isn’t และประธานคือ The black and white cat (แมวขาวดำ) เป็น สัตว์เอกพจน์ใช้คำสรรพนามแทนคือ it จึงตอบ isn’t it"},{"n":40,"q":"The house is rather _______ than we thought.","o":["bigger","the bigger","biggest","the biggest"],"a":1,"e":"การเปรียบเทียบขั้นกว่า (Comparative Degree of Comparison) เพื่อเปรียบเทียบคำนามที่มีจำนวน 2 คนหรือ 2 สิ่ง โครงสร้างของคำจะเกิดจากการเติม \"-er\" ท้ายคำคุณศัพท์ 1 หรือ 2 พยางค์ (แต่ถ้าคำนั้นลงท้ายด้วย \"-e\" จะเติมเพียง \"-\" ท้ายคำ) หรือเติม \"more\" หน้าคำคุณศัพท์ที่มีตั้งแต่ 3 พยางค์ขึ้นไป โดยมักจะมี \"than\" หลังคำคุณศัพท์ขั้นกว่าเสมอ Adj. + er หรือ more + Adj. + than ตัวอย่างประโยค : My younger brother is taller than me. (น้องชายของฉันสูงกว่าฉัน) : Learning Chinese is easier than learning English (เรียนภาษาจีนง่ายกว่าเรียนภาษาอังกฤษ) : This book is more interesting than the other books. I have ever read. (หนังสือเล่มนี้น่าสนใจกว่าเล่มอื่นๆ ที่ฉันเคยอ่าน)"},{"n":41,"q":"We should do what we can _______ help reduce global warming.","o":["owing to","in order to","due to","for"],"a":2,"e":"ใช้ in order to เป็นวลี (Phrase) บอกจุดประสงค์ มีความหมายว่า \"เพื่อที่จะ\" ตามด้วย V.1 (ไม่ผัน) ตัวอย่างประโยค : He got up early in order to catch the plane. (เขาตื่นแต่เช้า เพื่อไปขึ้นเครื่องบินให้ทัน) : We will save money in order to buy a new house. (เราจะเก็บเงิน เพื่อซื้อบ้านใหม่)"},{"n":42,"q":"Bob _________ last night. The kitchen is still smelly.","o":["could cook","may cook","should have cooked","must have cooked"],"a":4,"e":"เป็นเรื่องกริยาช่วยและต้องใช้รูปอดีตเพราะมี last night ใช้ must have + V3 บอกสิ่งที่เชื่อว่าน่าจะเกิดขึ้นในอดีต “บ๊อบน่าจะทำอาหารไว้เมื่อคืนนี้ห้องครัวยังคงมีกลิ่นเหม็นอยู่” ตัวเลือกที่ 1 และ 2 เป็นปัจจุบันและ 3 should have cooked ในกรณี should have V3 ใช้บอกสิ่งที่ควรจะได้ทำแต่ไม่ได้ทำในอดีต จึงตอบข้อ 4."},{"n":43,"q":"Unless they ________, I won’t forgive them.","o":["apologize","has apologized","apologized","would apologize"],"a":1,"e":"การใช้ unless เป็นคำเชื่อมในประโยค Conditional Sentences มีความหมายว่า \"ถ้า...ไม่\"เช่นเดียวกับ if…not If S + V1 , S + will (won’t ) V1 ตัวอย่างประโยค : If you don't pay now, we can't guarantee you a ticket. = Unless you pay now, we can't guarantee you a ticket. (ถ้าคุณไม่จ่ายเงินตอนนี้ พวกเราไม่รับประกันว่าคุณจะได้ตั๋ว) : She would be here by now if she wasn't stuck in traffic. = She would be here by now unless she was stuck in traffic. (เธอคงมาถึงแล้ว ถ้าเธอไม่ติดอยู่ในสภาพการจราจร)"},{"n":44,"q":"She regrets _______ at him to public. Now, he won’t talk to her anymore.","o":["being yelling","yell","yelling","to yell"],"a":3,"e":"คำกริยาที่ตามด้วย Ving ได้แก่ admit dread fancy practice risk allow dislike forgive postpone regrets appreciate enjoy imagine prefer stop avoid endure involve prevent suggest consider encourage keep permit require delay escape like prevent hate defer excuse miss quit forgive deny finish mind resist advise กริยา regret + Ving จึงตอบ yelling"},{"n":45,"q":"I’m _________ English teacher.","o":["a","an","the","(blank)"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 13. ประกอบ English ใช้ an นำหน้า an English teacher"},{"n":46,"q":"A: Excuse me. ______________. B: The dress was on sale yesterday, madam.","o":["Is this dress on sale?","Who bought the blue dress?","When was the sale over?","Where is the dress?"],"a":1,"e":"A : ขอโทษคะ___________ B : ชุดนี้ลดราคาไปแล้วเมื่อวานครับ คุณผู้หญิง? (1) ชุดนี้ลดราคาไหม (2) ใครซื้อชุดสีฟ้าไป (3) การลดราคานี้หมดเมื่อไหร่ (4) ชุดอยู่ที่ไหน หมายหตุ : ตัวเลือกที่ 2. ใครซื้อชุดสีฟ้าไป จะต้องตอบ ชื่อคนซื้อ ตัวเลือกที่ 3. ลดราคาเสร็จเมื่อไหร่ จะต้องตอบ เป็นเวลา ตัวเลือกที่ 4. ชุดอยู่ที่ไหน จะต้องตอบ สถานที่ ดังนั้นตัวเลือกที่ 1. จึงถูกต้องที่สุดและเข้ากับบทสนทนา A : ขอโทษคะ ชุดนี้ลดราคาไหม B : ชุดนี้ลดราคาไปแล้วเมื่อวานครับ คุณผู้หญิง?"},{"n":47,"q":"This is _______ part of the story.","o":["the most important","the most important","most important","more important"],"a":2,"e":"คุณศัพท์ขยายหน้าคำนามและมีคำว่า of the story (ของเรื่อง) ตอบขั้น สุดว่าเป็นส่วนสำคัญที่สุดใช้ขั้นสุดจะมี the นำหน้าคุณศัพท์ขั้นสุดด้วยจึงเป็น the most important"},{"n":48,"q":"The principal is getting the auditorium _________.","o":["to repaint","repaint","repainting","repainted"],"a":4,"e":"ใช้ get เมื่อประธานของประโยคไม่ได้ทำสิ่งใดสิ่งหนึ่งด้วยตัวเอง แต่ให้คนอื่นทำให้ คือ ต้องการเส้นว่าสิ่งใดสิ่ง หนึ่งถูกกระทำ (Passive Voice) โดยคนใดคนหนึ่งที่ไม่ใช่ประธานของประโยค get + something + V.3 ตัวอย่างประโยค : She will get her hair cut next Sunday. (เธอจะตัดผมในวันอาทิตย์หน้า) : I got the carpets cleaned yesterday. (อันทำความสะอาดพรมแล้วเมื่อวานนี้)"},{"n":49,"q":"Mary illnesses are _________ by poor diet and lack of exercise.","o":["brought about","because of","resulted","due to"],"a":1,"e":"ใช้ cause / produce / bring about / result in เป็นคำกริยา (Verb) มีความหมายว่า \"ทำให้เกิด, เป็นสาเหตุให้เกิด, ก่อให้เกิด, ส่งผลให้เกิด\" ตามด้วยคำนาม (Noun) หรือกลุ่มคำนาม (Noun Phrase) ตัวอย่างประโยค : They can bring about political changes. (พวกเขาสามารถทำให้เกิดการเปลี่ยนแปลงทางการเมือง) : The fire resulted in damage to their property. (เพลิงไหม้ส่งผลให้เกิดความเสียหายต่อทรัพย์สินของพวกเขา)"},{"n":50,"q":"Augustin loves to play ________ guitar.","o":["a","an","the","(blank)"],"a":3,"e":"ใช้ “the” กับชื่อเครื่องดนตรี เช่น the guitar, the piano, the violin, the saxophone, the drum, the trumpet เป็นต้น"},{"n":51,"q":"Sound travels _________ than light.","o":["slowest","slower","slow","the slower"],"a":2,"e":"เห็น than ตอบขั้นกว่าได้เลยจาก slow เป็น slower ไม่ต้องมี the"},{"n":52,"q":"The food at the restaurant _________heavenly. Let’s go there next Monday.","o":["smells","sounds","appears","feels"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 34. ประกอบ ประธาน The food (อาหาร) คาดเดาว่าตอบกริยา smells (กลิ่น) ได้เลย นอกนั้นไม่เข้ากับประโยค เช่น appear = ปรากฏออกมา sounds = เสียง และ feels = รู้สึก"},{"n":53,"q":"If Thomas had bought the tickets earlier, he _______ better seats.","o":["got","would get","will get","would have gotten"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 8. ประกอบ If S + had V3 , S + would have V3"},{"n":54,"q":"You _______ Jack if you go to the campus today.","o":["will see","sees","would have seen","saw"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 8. ประกอบ S + will/can V1 if/unless S + V1"},{"n":55,"q":"The scarf ________ by Joan is very beautiful.","o":["knitting","knitted","having knitted","knits"],"a":2,"e":"Past Participle (V.3) เป็นคำคุณศัพท์ (คำที่ขยายคำนามหรือบอกลักษณะของคำนาม) วางไว้หลังคำนาม ให้ ความหมายเป็น Passive Voice คือ คำนามนั้นเป็นผู้ถูกกระทำ ตัวอย่างประโยค : The boy taken to hospital has recovered. (เด็กผู้ชายที่ถูกนำตัวส่งโรงพยาบาลฟื้นตัวแล้ว) : The house painted last week is very beautiful. (บ้านที่ทาสีเมื่อสัปดาห์ที่แล้วสวยงามมาก)"},{"n":56,"q":"Your office is not in that brick building, _______?","o":["is not the office","is it not","is it","is your office"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 39. ประกอบ เป็นเรื่องส่วนหาง (tag) กริยาให้is not ปฏิเสธ ส่วนหางทา เป็นบอกเล่าคือ is และประธานคือ Your office (สำนักงานของคุณ) ใช้สรรพนาม it เพราะเป็นสิ่งของ"},{"n":57,"q":"_________her report before the due date. Nora is very proud of herself.","o":["Finish","Having finished","Being finished","Finished"],"a":2,"e":"Perfect Participle (Having + V.3) เป็นกริยาวิเศษณ์ เริ่มต้นวลี นำหน้าประโยคหลัก (Main Clause) เมื่อ เหตุการณ์ที่เกิดจากประธานคนเดียวกัน ในส่วนของวลีกับเหตุการณ์ในประโยคหลักเกิดขึ้นไม่พร้อมกัน กล่าวคือ เหตุการณ์หนึ่งเกิดขึ้นก่อนและจบลงไปแล้ว (Perfect Participle) เหตุการณ์ที่สองจงเกิดขึ้น ให้ความหมายเป็น Active Voice คือ ประธานในประโยคหลักเป็นผู้กระทำอาการนั้น"},{"n":58,"q":"________ on the beach, we saw many foreign tourists.","o":["Walking","Being walk","Walked","To be walked"],"a":1,"e":"Present Participle (V.ing) เป็นกริยาวิเศษณ์ เริ่มต้นวลี นำหน้าประโยคหลัก (Main Clause) เมื่อเหตุการณ์ใน ส่วนของวลีกับเหตุการณ์ในประโยคหลักเกิดขึ้นโดยประธานคนเดียวกัน ในช่วงเวลาเดียวกันหรือใกล้เคียงกัน ให้ ความหมายเป็น Active Voice คือ ประธานในประโยคหลักเป็นผู้กระทำอาการนั้น ตัวอย่างประโยค : Dropping the gun, she put her hands in the air. (เธอวางปืนลงแล้วยกมือขึ้น) : Putting on his coat, he left the house. (เขาใส่เสื้อหนาวแล้วออกจากบ้าน)"},{"n":59,"q":"Maria has two job offers. ________ hasn’t decided which jobs to accept.","o":["Herself","Hers","She","Her"],"a":3,"e":"คำสรรพนามประเภทไหนที่ใส่ในช่องว่างได้ให้เติมขั้นต้น ประโยคือรูปประธาน She เพราะตามด้วยกริยา (hasn’t...) ได้เลย ถ้าเป็นตัวอื่น เช่น hers, her แสดงความเป็นเจ้าของและ herself เป็นสรรพนามสะท้อนตัวเอง"},{"n":60,"q":"We _______ leave the door unlocked before leaving the house.","o":["couldn’t","wouldn’t","might not","shouldn’t"],"a":4,"e":"ใช้ shouldn't + V.1 (ไม่ผัน) มีความหมายว่า \"ไม่ควร, ไม่ควรจะ\" เพื่อเป็นการให้คำแนะนำหรือข้อเสนอแนะ ตัวอย่างประโยค : He shouldn't buy a new car. (เขาไม่ควรซื้อรถยนต์คันใหม่) : We shouldn't leave the door unlocked before leaving the house. (เราไม่ควรไม่ล็อกประตูก่อนออกจากบ้าน)"},{"n":61,"q":"You can go first, as you’re ________.","o":["oldest","most old","more old","the oldest"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 10. ประกอบ คำคุณศัพท์ old สามารถทำเป็นขั้นสุดได้คือ oldest ที่ถูกต้องและมี the นำหน้าขั้นสุดด้วยจึงเป็น the oldest (แก่/ อายุมากที่สุด)"},{"n":62,"q":"We should always believe in _________.","o":["ourselves","themselves","oneself","herself"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ คำสรรพนามที่แสดงสะท้อนตัวเอง ให้ดูประธานว่าเป็นคำไหนก็สะท้อนตัวนั้น เช่น She เป็น herself, I เป็น myself, He เป็น himself ในโจทย์เป็น We ก็คือ ourselves"},{"n":63,"q":"That was ________ day in my life.","o":["a best","good","the best","better"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 10. ประกอบ ถ้ามี in my life (ตลอดชีวิตของฉัน) การตอบจะเป็นขั้นสุด คือ ที่สุดในนั้น คำคุณศัพท์ในโจทย์คือ good ทำเป็นขั้น กว่า (better) ขั้นสุด (best) จึงตอบ best และใส่ the นำหน้าขั้นสุดด้วยจึงเป็น the best"},{"n":64,"q":"The by-election was set up immediately ________ the representative died in a car accident.","o":["hence","because","for","consequently"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 30. ประกอบ ใช้ for เป็นคำเชื่อม (Conjunction) มีความหมายว่า \"เพราะว่า\" ตามด้วยประธานและคำกริยา หน้า for ต้องมี เครื่องหมาย Comma (,) เสมอ ตัวอย่างประโยค : I left early, for I was very tired. (ฉันกลับเร็วเพราะเหนื่อยมาก) : We went on a picnic, for it was a nice day. (เราไปปิกนิกกัน เพราะอากาศดี)"},{"n":65,"q":"Whitney’s documents ________ before she could get into the exam room.","o":["had been checked","had checked","checked","were checking"],"a":1,"e":"ประธาน documents (เอกสาร) เป็นสิ่งของและสิ่งของถูกตรวจสอบ ใช้รูป passive voice รูปถูกกระทำจะลงท้าย ด้วยกริยาช่องที่ 3 เสมอ ดูตัวเลือกที่มี V3 คือตัวเลือก 1 และ 2 แต่ตัวเลือกที่ 2 ไม่ใช้ passive เป็น Past Perfect Tense = had V3 = had checked ถ้าทำเป็นรูปถูกกระทำจะเป็น had been V3 = had been checked ดังนั้นจึงตอบข้อ 1"},{"n":66,"q":"You _______ take the umbrella. It’s not going to rain this afternoon.","o":["won’t","mustn’t","needn’t","may not"],"a":3,"e":"ใช้ needn't + V.1 (ไม่ผัน) มีความหมายว่า \"ไม่จำเป็นต้อง\"สำหรับการใช้ need เป็นกริยาช่วยมักจะใช้ในรูปปฏิเสธ ตัวอย่างประโยค : You needn't finish your meal if you don't like it. (คุณไม่จำเป็นต้องทานอาหารให้หมด ถ้าคุณไม่ชอบ) : You needn't drive so quickly because we have plenty of time. (คุณไม่จำเป็นต้องขับเร็วมากเกินไป เรายังมีเวลาอีกมาก)"},{"n":67,"q":"The movie is ________ the book.","o":["funny as","not funny","not as funny as","as funny not as"],"a":3,"e":"ใช้ \"as + adjective/adverb + as\" ใช้เปรียบเทียบสิ่งสองสิ่งที่เท่ากันหรือเหมือนกันใช้ \"not as + adjective/adverb + as\" ใช้เปรียบเทียบสิ่งสองสิ่งที่ไม่เท่ากันหรือไม่เหมือนกัน ตัวอย่างประโยค : The weather this summer is as bad as last year. (อากาศในช่วงฤดูร้อนนี้แย่พอ ๆ กับในปีที่แล้ว) : These new shoes are not as comfortable as my old ones. (รองเท้าคู่ใหม่ไม่สะดวกสบายเหมือนกับคู่เก่า)"},{"n":68,"q":"Wilson’s car _______ at Hack’s automatic shop right now.","o":["is servicing","is being serviced","services","is serviced"],"a":2,"e":"คำบอกเวลา right now (ตอนนี้ / เดี๋ยวนี้) ให้ใช้ Present Continuous Tense (S + is/am/are + Ving) คือ is servicing แต่ยังมีข้อสังเกตอีกว่าประธานมี car (รถ) เป็นสิ่งของ จะต้องกำลังถูกบริการ จึงใช้รูป passive (ถูกกระทำ) กลายเป็น is being + V3 = is being serviced"},{"n":69,"q":"She’s eating ________ apple that you brought.","o":["a","the","the","(blank)"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 3. ประกอบ มีส่วนขยาย that you brought (ที่คุณเอามา) หรือมีวลีตัวอื่นเช่น who.....which....หรือ in.... บุพบทวลีว่าอยู่ไหน แสดงถึงการชี้เฉพาะเจาะจง ต้องใช้ “the” นำหน้าคำนาม"},{"n":70,"q":"If you heat ice, it _________.","o":["melted","melts","melt","would melt"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 8. ประกอบ If S + V1 , S + V1"},{"n":71,"q":"You won’t cause any problem, ________ you’re informed the manager ahead of time.","o":["so","if","for","consequently"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 64. ประกอบ “คุณจะไม่ก่อปัญหาใด ๆ เพราะคุณแจ้งผู้จัดการล่วงหน้า” คำเชื่อมสอดคล้องกับ ประโยคคือ for = because หมายถึง “เพราะว่า” และหน้า for มีเครื่องหมายคอมม่าคั่น (,) ถ้าเป็นตัวเลือกอื่น เช่น so = ดังนั้น , consequently = ผลที่ ตามมา และ if = ถ้าหากว่า (ตัวเลือก if ใช้ได้เหมือนกันแต่ว่าถ้าอยู่กลางประโยคจะไม่มีเครื่องหมายคอมม่าคั่น )"},{"n":72,"q":"Actually, the weather in Switzerland __________ very nice of this time of year.","o":["will be","is","are","was"],"a":2,"e":"ใช้ Present Simple Tense กับเหตุการณ์หรือการกระทำที่เป็นปกติวิสัย หรือการกระทำที่เกิดขึ้นเป็นประจำ สม ่าเสมอ ซึ่งมักมีคำกริยาวิเศษณ์ (Adverb) ปรากฏอยู่ในประโยค เช่น always (เสมอ), often (บ่อย ๆ), usually (ตามปกติ แล้ว), frequently (ตามปกติแล้ว), normally (ตามปกติแล้ว), regularly (ตามปกติแล้ว), sometimes (บางครั้ง), every/on + วัน/เวลา, once/twice + a + เวลา ตัวอย่างประโยค : I wash my hair every other day. (ผมสระผมวันเว้นวัน) : These littles girls are afraid of the big black dog. (สาวน้อยกลุ่มนี้กลัวสุนัขสีดำตัวใหญ่ตัวนั้น)"},{"n":73,"q":"The new glass-bridge project ________ by next month.","o":["will finish","will have finished","will be finishing","will have been finished"],"a":2,"e":"คำบอกเวลาที่มี by + ช่วงเวลา (อย่าสับสนกับ by (โดย) ที่ผ่านมานั้น ใช้ passive ) ข้อนี้ by next month ให้ตอบ Future Perfect Tense (S + will have V3) และประธานเป็นสิ่งของคือ project (โครงการ)จะต้องถูกทำให้เสร็จ (ราวเดือน หน้า) ต้องทำเป็น passive ถูกกระทำจาก will have V3 เป็น passive คือ will have been V3 = will have been finished"},{"n":74,"q":"If I ________ you were coming, I would have baked a cake.","o":["know","had known","knew","would know"],"a":2,"e":"1. knew 2. had known 3. know 4. would know ดูบรรยายเพิ่มเติมข้อ 8. ประกอบ If S + had V3 , S + would have V3"},{"n":75,"q":"Please answer the phone for me. It _______be John, for he said he would call me back.","o":["ought to","would","need","must"],"a":4,"e":"ใช้ must + V.1 (ไม่ผัน) มีความหมายว่า \"ต้อง\" เพื่อการเน้นย ้าสิ่งหนึ่งสิ่งใดในปัจจุบันหรืออนาคต ตัวอย่างประโยค : I must do my homework now. (ฉันต้องทำการบ้านตอนนี้) : You must eat more vegetables and do some exercises. (คุณต้องกินผักให้มากขึ้นและออกกำลังกายบ้าง)"},{"n":76,"q":"The first step is always _______ hardest.","o":["a","the","the","(blank)"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 10. ประกอบ hardest เป็นขั้น สุด ตอบ the ได้เลย ซึ่งปกติ the นำหน้าขั้นสุด เช่น the longest, the best, the biggest, the most beautiful, the hardest เป็นต้น"},{"n":77,"q":"The classmates helped _______ prepare for the exam.","o":["yourselves","ones","them","one another"],"a":4,"e":"Reciprocal Pronouns (สัมพันธสรรพนาม) คือ คำสรรพนาม (Pronoun) ที่แสดงความสัมพันธ์ต่อกันและกัน หมายความว่าคำนามมีความรู้สึกหรือกระทำต่อกันอย่างไร each other ซึ่งกันและกัน ระหว่างคำนามจำนวน 2 one another ซึ่งกันและกัน ระหว่างคำนามจำนวน 2 ขึ้นไป ตัวอย่างประโยค : They kept looking at each other and smiling. (พวกเขามองหน้ากันแล้วยิ้ม) : They are suspicious of one another. (พวกเขามีความสงสัยซึ่งกันและกัน)"},{"n":78,"q":"When the sun sets, it ________ very dark.","o":["gets","got","had gotten","would get"],"a":1,"e":"หมายเหตุ: ไฟล์ต้นฉบับพิมพ์เลขเฉลยเป็น 4 แต่ข้อความเฉลยคือ “gets” (ข้อ 1) จึงใช้ข้อ 1. ใช้ Present Simple Tense (S. + V.1 ผันตาม S.) กับเหตุการณ์ที่เป็น ข้อเท็จจริง ตัวอย่างประโยค : Time waits for no man. (เวลาไม่เคยคอยใคร) : The sun rises in the east. (ดวงอาทิตย์ขึ้นทางทิศตะวันออก)"},{"n":79,"q":"Dang ________ the door now. It’s difficult to close.","o":["fixes","was fixing","is fixing","fixed"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 68. ประกอบ ใช้ Present Continuous Tense (S + is/am/are Ving) กับเหตุการณ์หรือการกระทำที่กำลังเกิดขึ้นในขณะที่พูด มักเป็นคำบอกเวลา เช่น now, right now, at the/this moment , at present ที่โจทย์มีคำบอกเวลาคือ now จึงตอบ is fixing"},{"n":80,"q":"I have two pens, a blue one and a red one. You can borrow ______if you need.","o":["other","either","another","such"],"a":2,"e":"“ฉันมีปากกา 2 ด้าม มีสีน ้าเงินและสีแดงคุณสามารถยืมอันใดอันหนึ่งได้ถ้าคุณต้องการ” ใช้คำสรรพนามที่เจาะจง either = อย่างใดอย่างหนึ่ง ให้เลือกเอา"},{"n":81,"q":"No one ________ her ability.","o":["doubted","stopped","thought","worried"],"a":1,"e":"ไม่มีใคร ________ ความสามารถของเธอ (1) สงสัย (2) หยุด (3) คิด (4) กังวล"},{"n":82,"q":"A tiger was accidentally _______this morning. Be careful, everyone!","o":["classified","released","overacted","destroyed"],"a":2,"e":"เช้านี้เสือ_______โดยไม่ได้ตั้งใจ ระวังกันด้วยนะครับทุกคน! (1) จัดประเภท (2) ปล่อยตัว (3) มากเกินไป (4) ถูกทำลาย"},{"n":83,"q":"I kept my _______ so take the kids to the amusement park over the weekend.","o":["promise","repaired","finished","went"],"a":1,"e":"ฉันรักษา ________ ดังนั้นจะพาเด็ก ๆ ไปสวนสนุกในช่วงสุดสัปดาห์กัน (1) สัญญา (2) ซ่อมแซม (3) เสร็จแล้ว (4) ไป"},{"n":84,"q":"The crisis had a negative _______ on trade.","o":["form","effect","diet","gain"],"a":2,"e":"วิกฤตการณ์ดังกล่าวส่ง _______ ต่อการค้า (1) รูปแบบ (2) ผลกระทบ (3) อาหาร (4) กำไร"},{"n":85,"q":"He had a(n) ________ to heroin.","o":["addiction","attention","control","habit"],"a":1,"e":"เขามีอาการ ________ เฮโรอีน (1) การเสพติด (2) ความสนใจ (3) การควบคุม (4) นิสัย"},{"n":86,"q":"My mother had a very strict _________.","o":["spread","poet","diet","mind"],"a":3,"e":"แม่ของฉันควบคุม ________ที่เข้มงวดมาก (1) แพร่กระจาย (2) กวี (3) อาหาร (4) จิตใจ"},{"n":87,"q":"I want an immediate _________.","o":["effect","reply","anxiety","pretend"],"a":2,"e":"ฉันต้องการ _________ ทันที (1) ผลกระทบ (2) การตอบรับ (3) ความวิตกกังวล (4) แกล้งทำ"},{"n":88,"q":"Don’t _______ with your mother.","o":["argue","notice","normal","highlight"],"a":1,"e":"อย่า _______ กับแม่ของคุณ (1) เถียง (2) สังเกต (3) ปกติ (4) เน้น"},{"n":89,"q":"She doesn’t know what _______ happened that night.","o":["purposely","normally","actually","personally"],"a":3,"e":"เธอไม่รู้ว่า _______ เกิดอะไรขึ้นในคืนนั้น (1) จงใจ (2) ปกติ (3) จริงๆ (4) เป็นการส่วนตัว"},{"n":90,"q":"Ann, stop being a(n) _______. You’ve been complaining a lot lately?","o":["applicant","think-tank","passenger","grumbler"],"a":4,"e":"แอน หยุดเป็น ________ได้แล้วคุณได้บ่นมากหมู่นี้? (1) ผู้สมัคร (2) สถาบันวิจัย (3) ผู้โดยสาร (4) คนขี้บ่น"},{"n":91,"q":"You need to _______ yourself for a long wait. It’s business as usual","o":["determine","prepare","explore","complete"],"a":2,"e":"คุณต้อง________ สำหรับการรอที่ยาวนาน มันเป็นธุรกิจตามปกติ (1) กำหนด (2) เตรียมพร้อม (3) สำรวจ (4) เสร็จสิ้น"},{"n":92,"q":"It’s _______ to expect a two-year-old to be able to write!","o":["ridiculous","spinning","worth","spherical"],"a":1,"e":"มัน _________ ที่คาดหวังว่าเด็กอายุ 2 ขวบจะเขียนได้! (1) ไร้สาระ (2) หมุน (3) คุ้มค่า (4) ทรงกลม"},{"n":93,"q":"The _______ handwritten copy of Vincent’s bestselling novel has been found in his attic.","o":["extreme","popular","brief","original"],"a":4,"e":"พบสำเนา ________ ของนวนิยายขายดีของวินเซ็นต์ที่เขียนด้วยลายมือในห้องใต้หลังคาของเขา (1) สุดขั้ว (2) เป็นที่นิยม (3) สั้นๆ (4) ดั้งเดิม / ต้นฉบับ"},{"n":94,"q":"Wisunu was ____ from prison after the police found that he has nothing to do with the murder.","o":["captured","released","informed","treated"],"a":2,"e":"วิษณุได้รับการ ________ จากเรือนจำแล้ว หลังตำรวจพบว่าเขาไม่มีส่วนเกี่ยวข้องกับการฆาตกรรม (1) จับกุม (2) ปล่อยตัว (3) แจ้ง (4) ปฏิบัติ"},{"n":95,"q":"After the accident, the truck driver left the ______ immediately.","o":["scene","fair","surrounding","structure"],"a":1,"e":"หลังเกิดอุบัติเหตุคนขับรถบรรทุกออกจาก_________ทันที (1) ที่เกิดเหตุ (2) ยุติธรรม (3) บริเวณโดยรอบ (4) โครงสร้าง"},{"n":96,"q":"Bob and his family were forced to ________ their home because they couldn’t pay the mortgage.","o":["explore","prove","determine","give up"],"a":4,"e":"บ๊อบและครอบครัวของเขาถูกบังคับให้ _________ บ้านเพราะพวกเขาไม่สามารถชำระค่าจำนองได้ (1) สำรวจ (2) พิสูจน์ (3) ตัดสินใจ (4) ยอมแพ้ / สละ / ละทิ้ง"},{"n":97,"q":"The ______ price of gasoline hasn’t affected auto sales at all.","o":["soaring","amazing","breathtaking","relaxing"],"a":1,"e":"ราคาน ้ามันเบนซินที่ ________ ขึ้นไม่ส่งผลกระทบต่อยอดขายรถยนต์แต่อย่างใด (1) ทะยาน / พุ่งขึ้น (2) น่าทึ่ง (3) ตื่นตาตื่นใจ (4) ผ่อนคลาย"},{"n":98,"q":"They spend the morning _________ around the old part of Phuket.","o":["rolling","spotting","howling","wandering"],"a":4,"e":"พวกเขาใช้เวลาช่วงเช้า _________ ในย่านเก่าแก่ของภูเก็ต (1) กลิ้ง (2) จุด / สถานที่ (3) หอน (4) เดินเที่ยว / เตร่"},{"n":99,"q":"She’s proud that both her children have a _______ for music.","o":["talent","meaning","language","pattern"],"a":1,"e":"เธอภูมิใจที่ลูก ๆ ของเธอทั้งคู่มี _________ ด้านดนตรี (1) พรสวรรค์ (2) ความหมาย (3) ภาษา (4) รูปแบบ"},{"n":100,"q":"Take a few minutes to _______ your application to make sure that it is accurate.","o":["repeat","reread","drive","cease"],"a":2,"e":"ใช้เวลาสักครู่เพื่อ _______ ใบสมัครของคุณ เพื่อให้แน่ใจว่าถูกต้อง (1) ทำซ ้า (2) อ่านซ ้า (3) ขับ (4) หยุด"},{"n":101,"q":"Get a relative to _______ the children.","o":["feel","put down","look after","bore"],"a":3,"e":"หาญาติมาช่วย _______ ลูกๆ (1) สัมผัส (2) วางลง (3) ดูแล (4) เบื่อ"},{"n":102,"q":"Jane’s father had a ________ heart attack while he was on holiday.","o":["disappearing","phenomenal","spherical","sudden"],"a":4,"e":"พ่อของเจนมีอาการหัวใจวาย ________ ขณะที่เขากำลังไปเที่ยวพักผ่อน (1) หายไป (2) มหัศจรรย์ (3) ทรงกลม (4) ฉับพลัน"},{"n":103,"q":"A lot of businesses are being _______ by the current high interest rate.","o":["intended","shrunk","hurt","curled up"],"a":2,"e":"ธุรกิจจำนวนมากกำลังถูก _______ เนื่องมาจากอัตราดอกเบี้ยที่สูงในปัจจุบัน (1) ตั้งใจ (2) หดตัว (3) เสียหาย (4) หดตัวลง"},{"n":104,"q":"Repairing damaged _______ is a very delicate operation.","o":["antennas","nerves","experience","see"],"a":2,"e":"การซ่อมแซม _______ ที่เสียหายเป็นการผ่าตัดที่ละเอียดอ่อนมาก (1) เสาอากาศ (2) เส้นประสาท (3) ประสบการณ์ (4) ดู"},{"n":105,"q":"We can’t _______ the future. Just roll with it, and it’ll be fine.","o":["support","afford","predict","mention"],"a":3,"e":"เราไม่สามารถ _______ อนาคตได้ แค่ปล่อยให้มันเป็นไป แล้วทุกอย่างจะดีเอง (1) สนับสนุน (2) จ่ายได้ (3) คาดการณ์ (4) กล่าวถึง"},{"n":106,"q":"It’s been a(n) _________ day. Let’s go home and get some rest.","o":["simple","wonderful","relaxing","exhausting"],"a":4,"e":"วันนี้เป็นวันที่ _________ จริงๆ กลับบ้านไปพักผ่อนกันเถอะ (1) เรียบง่าย (2) วิเศษ (3) ผ่อนคลาย (4) เหนื่อยล้า"},{"n":107,"q":"Drawing is my ________lesson.","o":["favorite","enjoy","usual","slow"],"a":1,"e":"การวาดรูปเป็นบทเรียนที่________ ของฉัน (1) ชื่นชอบ (2) สนุก (3) ปกติ (4) ช้า"},{"n":108,"q":"I thought the food was very ________.","o":["example","patient","tasty","meal"],"a":3,"e":"ฉันคิดว่าอาหารนั้น ________ มาก (1) ตัวอย่าง (2) อดทน (3) อร่อย (4) มื้ออาหาร"},{"n":109,"q":"The most __________part of Spiderman 2 is his ability to swing freely.","o":["talented","limited","unfortunate","enjoyable"],"a":4,"e":"ส่วนที่ _________ ที่สุดของ สไปเดอร์แมน 2 คือความสามารถในการแกว่งได้อย่างอิสระ (1) มีความสามารถ (2) มีข้อจำกัด (3) โชคร้าย (4) สนุก"},{"n":110,"q":"Local authorities should _______ householders to compost at home.","o":["encourage","follow","repeat","spin"],"a":1,"e":"หน่วยงานท้องถิ่นควร _________ ให้เจ้าของบ้านทำปุ๋ยหมักที่บ้าน (1) สนับสนุน (2) ปฏิบัติตาม (3) ทำซ ้า (4) ปั่น"},{"n":111,"q":"It’s _______ to tip waiter, guides and drivers.","o":["equal","impressive","usual","alternate"],"a":3,"e":"การให้ทิปพนักงานเสิร์ฟ ไกด์ และคนขับรถคือเรื่อง _______ (1) เท่ากัน (2) ประทับใจ (3) ปกติ (4) สลับกัน"},{"n":112,"q":"They’ve _______ of ideas.","o":["started","run out","enjoyed","come"],"a":2,"e":"พวกเขา _______ ความคิดแล้ว (1) เริ่มต้น (2) หมด (3) เพลิดเพลิน (4) มา"},{"n":113,"q":"With parents working today, ______ childcare is simply a necessary fact of life.","o":["furious","wreck","heavy","dependable"],"a":4,"e":"เนื่องจากพ่อแม่ต้องทำงาน ในปัจจุบันการดูแลเด็ที่________จึงเป็นเพียงความจริงที่จำเป็นของชีวิต (1) โกรธจัด (2) พังยับเยิน (3) หนัก (4) เชื่อถือได้"},{"n":114,"q":"It’s true that a(n) _______ person is pleasant and behaves in a friendly way.","o":["envious","daring","charming","valid"],"a":3,"e":"เป็นเรื่องจริงที่คน _______ เป็นคนน่ารักและประพฤติตนเป็นมิตร (1) อิจฉา (2) กล้าหาญ (3) มีเสน่ห์ (4) มีเหตุผล"},{"n":115,"q":"Could you_______ my pen for me? I left it on the desk in the meeting room.","o":["fetch","credit","spread","notice"],"a":1,"e":"คุณช่วย_______ปากกาให้ฉันหน่อยได้ไหม ฉันลืมมันไว้บนโต๊ะในห้องประชุม (1) ไปเอา (2) เครดิต (3) สเปรด (4) ประกาศ"},{"n":116,"q":"In geology, the crust is the outermost solid shell of a rocky planet, or natural satellite.","o":["destination","surface","stadium","conspiracy"],"a":2,"e":"ในทางธรณีวิทยา เปลือกโลกคือเปลือกแข็งชั้นนอกสุดของดาวเคราะห์หิน หรือดาวบริวารธรรมชาติ (1) จุดหมายปลายทาง (2) พื้นผิว (3) สนามกีฬา (4) การสมคบคิด"},{"n":117,"q":"Your sweater will shrink if you wash it at too high a temperature.","o":["become smaller","expand","acquire","roll over"],"a":1,"e":"เสื้อสเวตเตอร์ของคุณจะหดถ้าซักด้วยอุณหภูมิสูงเกินไป (1) เล็กลง (2) ขยายใหญ่ขึ้น (3) ได้รับ (4) ม้วน / กลิ้งไป"},{"n":118,"q":"Chiang Rai has some of the most awesome scenery in Thailand.","o":["picture","journey","landscape","spot"],"a":3,"e":"เชียงรายมีทิวทัศน์ที่งดงามที่สุดแห่งหนึ่งของประเทศไทย (1) รูปภาพ (2) การเดินทาง (3) ทิวทัศน์ (4) จุด"},{"n":119,"q":"He reluctantly took on the extra work without more pay.","o":["willingly","unwillingly","regretfully","surprisingly"],"a":2,"e":"เขารับงานพิเศษอย่างไม่เต็มใจโดยไม่ได้รับค่าตอบแทนเพิ่ม (1) เต็มใจ (2) ไม่เต็มใจ (3) เสียใจ (4) อย่างน่าประหลาดใจ"},{"n":120,"q":"It took us exactly ten hours to get to Chiang Mai.","o":["fairly","immediately","precisely","surprisingly"],"a":3,"e":"เราใช้เวลาเดินทางถึงเชียงใหม่ประมาณสิบชั่วโมงพอดี (1) ค่อนข้าง (2) ทันที (3) แม่นยำ (4) น่าแปลกใจ"}]}];
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let wrong=store.get('r1111wrong',{});
let S={view:'home',set:'all',count:20,shuffle:true,mode:'practice',msg:''};
let Q=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const all=()=>D.flatMap((e,ei)=>e.items.map(it=>({...it,k:ei+'-'+it.n,src:e.title})));
const wcount=()=>Object.keys(wrong).length;

function start(kind){
  let p=all();
  if(kind==='wrong')p=p.filter(x=>wrong[x.k]);
  else if(S.set!=='all')p=p.filter(x=>x.k.startsWith(S.set+'-'));
  if(!p.length){S.msg='ยังไม่มีข้อที่เคยตอบผิด';render();return}
  if(S.shuffle||kind==='wrong')p=shuf(p);
  if(S.count>0&&kind!=='wrong')p=p.slice(0,S.count);
  Q={list:p,pos:0,ans:{},kind};S.view='quiz';S.msg='';render();window.scrollTo(0,0);
}
function finish(){
  Q.list.forEach((x,i)=>{const c=Q.ans[i];if(c==null)return;if(c===x.a)delete wrong[x.k];else wrong[x.k]=1});
  store.set('r1111wrong',wrong);S.view='result';render();window.scrollTo(0,0);
}
function qhtml(x){
  const i=x.q.indexOf(' | ');
  return (i>0?'<div class="ctx">'+esc(x.q.slice(0,i))+'</div>':'')+'<div class="q">'+esc(i>0?x.q.slice(i+3):x.q)+'</div>';
}
function home(){
  const chips=(arr,cur,key)=>arr.map(([v,l])=>`<button class="chip ${cur===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
  return `<h1>ฝึกทำข้อสอบ RAM1111</h1><div class="mu">ภาษาอังกฤษในชีวิตประจำวัน · 4 ชุด รวม ${D.reduce((n,e)=>n+e.items.length,0)} ข้อ</div>
  <div class="card"><h2 style="margin-top:0">เลือกชุดข้อสอบ</h2><div class="row">${chips([['all','รวมทุกชุด'],...D.map((e,i)=>[String(i),e.title.replace('ปีการศึกษา','ปี')])],S.set,'set')}</div>
  <h2>จำนวนข้อ</h2><div class="row">${chips([[10,'10'],[20,'20'],[50,'50'],[0,'ทั้งหมด']],S.count,'count')}</div>
  <h2>รูปแบบ</h2><div class="row">${chips([['practice','ฝึกทำ (เฉลยทันที)'],['exam','จำลองสอบ (เฉลยตอนจบ)']],S.mode,'mode')}</div>
  <h2>ลำดับข้อ</h2><div class="row">${chips([[true,'สุ่ม'],[false,'เรียงตามต้นฉบับ']],S.shuffle,'shuffle')}</div>
  <div style="margin-top:18px"><button class="btn" data-act="start">เริ่มทำข้อสอบ</button></div></div>
  <div class="card"><b>ข้อที่เคยตอบผิด: ${wcount()} ข้อ</b><div class="mu">ระบบจำข้อที่ผิดไว้ในเบราว์เซอร์เครื่องนี้ และลบออกเมื่อทำถูก</div>
  <div class="row" style="margin-top:10px"><button class="btn alt" data-act="startwrong">ฝึกเฉพาะข้อที่เคยผิด</button>${wcount()?'<button class="btn alt" data-act="clear">ล้างรายการ</button>':''}</div>
  ${S.msg?`<div class="res bad" style="margin-top:8px">${S.msg}</div>`:''}</div>
  <footer class="mu">ใช้เพื่อการฝึกส่วนตัวเท่านั้น · ไฟล์ต้นฉบับระบุห้ามส่งต่อ/เผยแพร่</footer>`;
}
function quiz(){
  const x=Q.list[Q.pos],c=Q.ans[Q.pos],n=Q.list.length,prac=S.mode==='practice',locked=prac&&c!=null,last=Q.pos===n-1;
  const opts=x.o.map((t,i)=>{const v=i+1;let cl='';
    if(locked)cl=v===x.a?'ok':(v===c?'bad':'');else if(c===v)cl='sel';
    return `<button class="opt ${cl}" data-act="pick" data-v="${v}"><b>(${v})</b><span>${esc(t)}</span></button>`}).join('');
  const fb=locked?`<div class="res ${c===x.a?'ok':'bad'}">${c===x.a?'ถูกต้อง ✓':'ตอบผิด · เฉลยคือข้อ '+x.a}</div>${x.e?`<div class="ex">${esc(x.e)}</div>`:''}`:'';
  const un=n-Object.keys(Q.ans).length;
  const next=prac?`<button class="btn" data-act="${last?'finish':'next'}" ${c==null?'disabled':''}>${last?'ดูผลคะแนน':'ถัดไป'}</button>`
    :(last?`<button class="btn" data-act="finish">ส่งคำตอบ${un?` (ยังไม่ตอบ ${un})`:''}</button>`:`<button class="btn" data-act="next">ถัดไป</button>`);
  return `<div class="row" style="justify-content:space-between"><span class="mu">ข้อ ${Q.pos+1} / ${n} · ${esc(x.src)} ข้อ ${x.n}</span><button class="chip" data-act="home">ออก</button></div>
  <div class="bar"><i style="width:${(Q.pos+(locked?1:0))/n*100}%"></i></div>${qhtml(x)}${opts}${fb}
  <div class="nav">${prac?'<span></span>':`<button class="btn alt" data-act="prev" ${Q.pos?'':'disabled'}>ก่อนหน้า</button>`}${next}</div>`;
}
function result(){
  const n=Q.list.length;let ok=0;const bad=[];
  Q.list.forEach((x,i)=>{if(Q.ans[i]===x.a)ok++;else bad.push(i)});
  const pct=Math.round(ok/n*100);
  const items=bad.map(i=>{const x=Q.list[i],c=Q.ans[i];
    return `<div class="card">${qhtml(x)}<div class="res bad">${c==null?'ไม่ได้ตอบ':'คุณตอบ ('+c+') '+esc(x.o[c-1]||'')}</div><div class="res ok">เฉลย ('+x.a+') ${esc(x.o[x.a-1]||'')}</div>${x.e?`<details><summary>ดูคำอธิบาย</summary><div class="ex">${esc(x.e)}</div></details>`:''}<div class="mu">${esc(x.src)} ข้อ ${x.n}</div></div>`}).join('');
  return `<h1>ผลคะแนน</h1><div class="score">${ok} / ${n}</div><div class="mu" style="text-align:center">${pct}%</div>
  <div class="row" style="margin:16px 0;justify-content:center"><button class="btn" data-act="start">ทำชุดใหม่</button>${wcount()?'<button class="btn alt" data-act="startwrong">ฝึกข้อที่เคยผิด ('+wcount()+')</button>':''}<button class="btn alt" data-act="home">หน้าหลัก</button></div>
  ${bad.length?'<h2>ข้อที่ต้องทบทวน ('+bad.length+')</h2>'+items:'<div class="card res ok">ถูกทุกข้อ เยี่ยมมาก!</div>'}`;
}
function render(){$('#app').innerHTML=S.view==='home'?home():S.view==='quiz'?quiz():result()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k;
  if(k){const v=b.dataset.v;S[k]=k==='count'?+v:k==='shuffle'?v==='true':v;render();return}
  if(a==='start')start('normal');
  else if(a==='startwrong')start('wrong');
  else if(a==='clear'){wrong={};store.set('r1111wrong',wrong);render()}
  else if(a==='home'){S.view='home';render()}
  else if(a==='pick'){const v=+b.dataset.v;if(S.mode==='practice'&&Q.ans[Q.pos]!=null)return;Q.ans[Q.pos]=v;render()}
  else if(a==='next'){Q.pos++;render();window.scrollTo(0,0)}
  else if(a==='prev'){Q.pos--;render();window.scrollTo(0,0)}
  else if(a==='finish')finish();
});
render();
</script>
</body>
</html>
