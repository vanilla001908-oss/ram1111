im? (เธอรู้จักเขาหรือเปล่า) : Did he play games? (เขาเล่นเกมหรือเปล่า) ตัวอย่างประโยค คำถาม Yes-No Questions ที่ขึ้นต้นด้วยกริยาช่วย (Modal Verbs) อื่น ๆ : Can your son swim? (ลูกชายคุณว่ายน ้าได้ไหม) : Will your daughter go swimming? (ลูกสาวคุณจะไปว่ายน ้าไหม) : Should I use that one? (ฉันควรใช้อันนั้นเหรอ) : Would you believe me if I said something? (คุณจะเชื่อฉันไหมถ้าฉันพูดอะไรออกไป)"},{"n":67,"q":"If it had rained, the game _________ canceled.","o":["was","will be","would be","would have been"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ If S + had V3 , S + would have V3 ตัวอย่างประโยค : If they had taken the bus to school, they wouldn't have arrived in time. (ถ้าพวกเขาขึ้นรถเมล์ไปโรงเรียน พวกเขาคงมาไม่ทัน) : You would have arrived on time if you had left earlier. (ถ้าคุณออกเร็วกว่านี้ คุณคงมาถึงตรงเวลา)"},{"n":68,"q":"Let’s go inside __________ it’s getting dark now.","o":["because","since","while","Both 1 and 2 are correct"],"a":4,"e":"ใช้ since/as เป็นคำขึ้นต้น Adverb Clause of Reason (อนุประโยคแสดง-เหตุผล) มีความหมายว่า \"เพราะว่า เนื่องจาก\" เพื่อแสดงความสัมพันธ์เชิงเหตุและผลระหว่าง 2 ข้อความเหมือนกับ because ตามด้วยประธานและคำกริยา since as + S. + V. because ตัวอย่างประโยค : I left a message with his mother since he was not there. (ฉันฝากข้อความไว้กับแม่ของเขาเพราะว่าเขาไม่อยู่) : Since my dog is so hairy, I have to get its hair cut regularly. (เนื่องจากสุนัขของฉันมีขนดก ฉันจึงต้องตัดขนเป็นประจำ) : As it was raining hard, we couldn't play football. (เนื่องจากฝนตกหนักมาก เราจึงไม่สามารถเล่นฟุตบอลได้) : I can't run as my leg is injured. (ผมวิ่งไม่ได้ เพราะขาบาดเจ็บ)"},{"n":69,"q":"If Nancy ___________harder, she would get better grades","o":["studied","studying","would study","had studied"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ If S + V2 , S + would/could + V1"},{"n":70,"q":"If I _______ the sign, I would have stopped.","o":["see","will see","saw","had seen"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ If S + had V3 , S + would have V3"},{"n":71,"q":"_______ people will go to the concert at MBK Hall.","o":["A lot","Little","Many","Much"],"a":3,"e":"Quantitative Adjectives คือ คำคุณศัพท์ที่บอกปริมาณที่ไม่ได้เจาะจง - many มีความหมายว่า \"มาก\" ใช้ขยายคำนามพหูพจน์ (Plural Noun) - much มีความหมายว่า \"มาก\" ใช้ขยายคำนามนับไม่ได้ (Uncountable Noun) ตัวอย่างประโยค : Are there many employees in your office? (ในสำนักงานของคุณมีพนักงานจำนวนมากไหม) : There's not much time left before the deadline. (เหลือเวลาอีกไม่มากก่อนถึงกำหนดส่ง)"},{"n":72,"q":"Tom is three months __________ than my son.","o":["young","younger","most young","more young"],"a":2,"e":"เห็น than ตอบขั้นกว่าได้เลยจากคุณศัพท์ young เป็น younger"},{"n":73,"q":"Peter has _________ big house near the park.","o":["a","an","the","(Blank)"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 24. ประกอบ ใช้ “a” นำหน้าคำนามนับได้แสดงจำนวนหนึ่ง บ้านหลังหนึ่ง"},{"n":74,"q":"Jane has ________ sugar left.","o":["a little","a lot","a few","many"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 63. ประกอบ sugar (น ้าตาล) เป็นคำนามนับไม่ได้จึงตอบ a little"},{"n":75,"q":"_______ his son’s sickness, Jack cancelled the trip to Denmark.","o":["Due to","Therefore","As a result","Owing"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 45. ประกอบ ใช้ as a result of/as a consequence of เป็นคำบุพบท (Preposition) มีความหมาย ว่า \"อันเป็นผลมาจาก, เนื่องจาก\" ตามด้วยคำนาม (Noun) หรือกลุ่มคำนาม (Noun Phrase) ตัวอย่างประโยค : As a result of his carelessness, he made a serious blunder. (เนื่องจากความประมาท ทำให้เขาผิดพลาดอย่างร้ายแรง) : As a consequence of sleeping too late last night, today I feel so tired. (จากผลของการนอนดึกเมื่อคืน วันนี้ผมจึงรู้สึกเหนื่อยมาก)"},{"n":76,"q":"Gong is _________than his friend.","o":["tall","taller","the tallest","the tall"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 15. ประกอบ ขั้นกว่า เปรียบเทียบของ 2 อย่าง / คน / สิ่ง เช่น เจอคำว่า of the two หรือ ____than (ออกทุกเทอม) เห็น than ให้ ตอบข้างหน้าขั้นกว่า"},{"n":77,"q":"A: ________________. B: Not yet. I need a few more minutes.","o":["May I help you, sir?","It’s very nice today, isn’t it?","Are you ready to order, madam?","How’s everything with you today?"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 66. ประกอบ A :__________________. B : ยังไม่พร้อมค่ะ ฉันต้องการเวลาอีกสองสามนาที (1) มีอะไรให้ช่วยไหมคะคุณผู้ชาย (2) วันนี้อากาศดีมากเลยใช่ไหมคะ (3) วันนี้เป็นยังไงบ้างคะ (4) คุณพร้อมที่จะสั่งอาหารหรือยังคะคุณผู้หญิง"},{"n":78,"q":"A: ___________. B: It starts at 7:30 p.m. Let’s go now.","o":["Doesn’t it start this evening?","What time does the film start?","Where shall we go at 7:30 p.m.?","Let’s start the game at 7:30, shall we?"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 14. ประกอบ A :__________________. B : เริ่มเวลา 19.30 น. ไปกันเถอะ (1) หนังเริ่มฉายเย็นนี้ใช่ไหม (2) หนังเริ่มฉายตอนกี่โมง (3) ช่วงเวลา 19.30 น. ไปไหนกันดี (4) เริ่มเกมเวลา 19.00 น. เลยดีไหม"},{"n":79,"q":"A: How often do the buses come? B: ___________.","o":["10 miles per hour","Very convenient","They’re clean and nice","Every 15 minutes"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 14. ประกอบ A : รถบัสมาบ่อยแค่ไหน B :___________. (1) 10. ไมล์ต่อชั่วโมง (2) สะดวกมาก (3) สะอาดและดี (4) ทุกๆ 15 นาที ตัวอย่างประโยค Wh-questions ที่ใช้คำแสดงคำถาม How, How much, How many, How far, How long, How old อื่นๆ : How can you make money online? (คุณสามารถสร้างรายได้ทางออนไลน์ได้อย่างไร) : How often do you clean the room? (คุณทำความสะอาดห้องบ่อยแค่ไหน) : How long will you stay here? (คุณจะอยู่ที่นี่นานแค่ไหน) : How fast can you run? (คุณสามารถวิ่งได้เร็วแค่ไหน) : How tall are you? (คุณสูงเท่าไหร่) : How much milk is there in the bottle? (ในขวดมีนมอยู่มากแค่ไหน) : How many glasses of water do you drink a day? (คุณดื่มน ้าวันละกี่แก้ว)"},{"n":80,"q":"A: __________. B: Yes, that’s right. Do you have this shirt in blue?","o":["Is everything OK, Nick?","Do you prefer this blouse, miss?","Where is the kid’s apparel section?","You’re looking for a new outfit, aren’t you?"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 34. และ 66. ประกอบ A :__________________. B : ใช่ถูกต้อง คุณมีเสื้อสีน ้าเงินตัวนี้ไหมคะ (1) นิค ทุกอย่างเรียบร้อยดีไหม (2) แผนกเสื้อผ้าเด็กอยู่ที่ไหน (3) คุณชอบเสื้อตัวนี้ไหมคะคุณผู้หญิง (4) คุณกำลังมองหาชุดใหม่ใช่ไหมคะ"},{"n":81,"q":"The hikers managed to ________three days in the wilderness before being rescued.","o":["release","extract","prepare","survive"],"a":4,"e":"นักเดินป่า_________สามารถเอาชีวิตรอดในป่าได้ 3 วันก่อนที่จะได้รับการช่วยเหลือ (1) ปล่อย (2) สกัด (3) เตรียมพร้อม (4) เอาชีวิตรอด"},{"n":82,"q":"The _______ little cafe quickly became a favorite spot for locals and tourists alike.","o":["charming","limited","original","foreign"],"a":1,"e":"คาเฟ่เล็ก ๆ ________แห่งนี้กลายเป็นสถานที่โปรดของคนในท้องถิ่นและนักท่องเที่ยวอย่างรวดเร็ว (1) มีเสน่ห์ / ที่น่ารัก (2) ที่จำกัด (3) ดั้งเดิม (4) ต่างชาติ"},{"n":83,"q":"Her extensive _________in marketing made her an ideal candidate for the position.","o":["creature","experience","appearance","Hermit"],"a":2,"e":"_________ อันยาวนานของเธอในด้านการตลาดทำให้เธอเป็นผู้สมัครที่เหมาะสมสำหรับตำแหน่งนี้ (1) สิ่งมีชีวิต (2) ประสบการณ์ (3) รูปร่างหน้าตา (4) ฤๅษี"},{"n":84,"q":"The old stone _______ where we can pray, stood quietly at the edge of the village.","o":["bunch","chapel","Seclusion","inconvenience"],"a":2,"e":"_________ หินเก่า ๆ ที่เราสามารถเข้าไปสวดมนต์ได้ ตั้งอยู่อย่างสงบเงียบริมหมู่บ้าน (1) ฝูงชน (2) โบสถ์ (3) ความไม่สะดวก (4) ความสันโดษ"},{"n":85,"q":"After a(n) ________day of moving furniture, they collapsed on the coach.","o":["Surprising","refreshing","exhausting","immediate"],"a":3,"e":"หลังจากวัน_________จากการเคลื่อนย้ายเฟอร์นิเจอร์ พวกเขาก็ล้มตัวบนโซฟา (1) อันน่าแปลกใจ (2) อันสดชื่น (3) อันเหนื่อยล้า (4) ทันที"},{"n":86,"q":"Sunee looks very fresh this morning. She must have had a(n) ______ sleep.","o":["frightening","rolling","uninterrupted","protected"],"a":3,"e":"เช้านี้สุนีย์ดูสดชื่นมาก เมื่อคืนเธอคงนอนหลับ_________แน่ ๆ (1) อันน่ากลัว (2) พลิกตัว (3) อย่างต่อเนื่อง (4) ได้รับการปกป้อง"},{"n":87,"q":"They have found a well-preserved ancient painting, which is ________more than two million dollars.","o":["standing","incredible","surprising","worth"],"a":4,"e":"พวกเขาได้พบภาพวาดโบราณที่เก็บรักษาไว้อย่างดีซึ่ง___________มากกว่า 2 ล้านเหรียญสหรัฐ (1) ยืน (2) อันเหลือเชื่อ (3) ที่น่าประหลาดใจ (4) มีมูลค่า"},{"n":88,"q":"That movie had _________ subtitles.","o":["cause","foreign","ancient","drive"],"a":2,"e":"ภาพยนตร์เรื่องนั้นมีคำบรรยาย__________ (1) สาเหตุ (2) ภาษาต่างประเทศ (3) โบราณ (4) แรงผลักดัน"},{"n":89,"q":"Be careful when using a phone during a thunderstorm, for it can__________ the electricity from the lightning.","o":["conduct","occur","strike","lessen"],"a":1,"e":"ระวังการใช้โทรศัพท์ในช่วงที่มีพายุฝนคะนอง เพราะอาจ_________จากฟ้าผ่าได้ (1) นำไฟฟ้า (2) เกิดขึ้น (3) ฟ้าผ่า (4) ทำให้น้อยลง"},{"n":90,"q":"When the police arrived at the ________, the injured had already been went to the hospital.","o":["scene","fair","coincident","alteration"],"a":1,"e":"เมื่อตำรวจมาถึง________ผู้บาดเจ็บได้ถูกส่งตัวไปโรงพยาบาลเรียบร้อยแล้ว (1) สถานที่เกิดเหตุ (2) ยุติธรรม (3) ตรงกัน / บังเอิญ (4) การเปลี่ยนแปลง"},{"n":91,"q":"You need to practice a lot to become _________in a new language.","o":["limited","enormous","unfortunate","fluent"],"a":4,"e":"คุณต้องฝึกฝนมากเพื่อที่จะสามารถพูดภาษาใหม่ได้อย่าง__________ (1) มีข้อจำกัด (2) มากมาย (3) โชคร้าย (4) คล่องแคล่ว"},{"n":92,"q":"Although he did the major part of the project, he gave the ______ to his dad.","o":["benefit","credit","entrance","structure"],"a":2,"e":"แม้ว่าเขาจะเป็นผู้ทำส่วนใหญ่ของโครงการ แต่เขาก็มอบ________ในครั้งนี้ให้กับพ่อของเขา (1) ผลประโยชน์ (2) ชื่อเสียงเกียรติยศ (3) ทางเข้า (4) โครงสร้าง"},{"n":93,"q":"She’ll ________ her new song in the studio.","o":["encourage","spin","record","follow"],"a":3,"e":"เธอจะ__________เพลงใหม่ของเธอในสตูดิโอ (1) ให้กำลังใจ (2) หมุน (3) บันทึก (4) ทำตาม"},{"n":94,"q":"He tried to hide his _________ from his friends.","o":["heartbreak","activity","possibility","repair"],"a":1,"e":"เขาพยายามซ่อน_________ของเขาไว้ไม่ให้เพื่อน ๆ รู้ (1) ความอกหัก (2) กิจกรรม (3) ความเป็นไปได้ (4) การซ่อมแซม"},{"n":95,"q":"A good team needs ___________members.","o":["furious","flashy","reckless","dependable"],"a":4,"e":"ทีมที่ดีต้องมีสมาชิกที่___________ (1) โกรธจัด (2) ฉูดฉาด (3) หุนหันพลันแล่น (4) พึ่งพาได้ / ไว้วางใจได้"},{"n":96,"q":"The details were ________, so we had to guess.","o":["busy","vague","knowledgeable","furry"],"a":2,"e":"รายละเอียดนั้น_________ดังนั้นเราต้องเดา (1) ยุ่ง (2) คลุมเครือ (3) มีความรู้ (4) นุ่มฟู"},{"n":97,"q":"It’s _________ to start with the easy tasks first.","o":["equal","doubtful","logical","impressive"],"a":3,"e":"การเริ่มต้นจากงานที่ง่ายก่อนนั้นเป็นเรื่อง_________ (1) เท่ากัน (2) ไม่แน่ใจ (3) สมเหตุสมผล (4) น่าประทับใจ"},{"n":98,"q":"_________ can be a difficult struggle to overcome.","o":["Control","Attention","Addiction","Habit"],"a":3,"e":"___________อาจเป็นเรื่องยากที่จะเอาชนะได้ (1) การควบคุม (2) ความสนใจ (3) การติดยาเสพติด (4) นิสัย"},{"n":99,"q":"Bill started a new ________ to improve his health.","o":["post","mind","diet","spread"],"a":3,"e":"บิลเริ่มรับประทาน__________ใหม่ เพื่อทำให้สุขภาพของเขาดีขึ้น (1) โพสต์ (2) จิตใจ (3) อาหาร (4) การแพร่กระจาย"},{"n":100,"q":"They enjoyed a delicious __________ at the new restaurant.","o":["argue","meal","place","notice"],"a":2,"e":"พวกเขาเพลิดเพลินกับ_________อร่อย ๆ ที่ร้านอาหารใหม่แห่งนั้น (1) การโต้เถียง (2) มื้ออาหาร (3) สถานที่ (4) ประกาศ"},{"n":101,"q":"The children were _________ about the upcoming field trip.","o":["usual","tough","favorite","excited"],"a":4,"e":"เด็ก ๆ ต่าง_________กับทัศนศึกษาที่กำลังจะมีขึ้น (1) ธรรมดา (2) ยาก (3) ชื่นชอบ (4) รู้สึกตื่นเต้น"},{"n":102,"q":"We should _______at the airport two hours before the flight.","o":["arrive","tasty","complete","patient"],"a":1,"e":"เราควร__________ที่สนามบิน 2 ชั่วโมงก่อนเครื่องออก (1) มาถึง (2) อร่อย (3) เสร็จสรรพ (4) อดทน"},{"n":103,"q":"The company’s rapid ________ led to the opening of new offices across the country.","o":["vessel","conspiracy","expansion","proof"],"a":3,"e":"________รวดเร็วของบริษัทนำไปสู่การเปิดสำนักงานใหม่ทั่วประเทศ (1) เรือ (2) การสมคบคิด (3) การขยายตัว (4) หลักฐาน"},{"n":104,"q":"The weak radio ________ made it difficult to communicate with the remote research station.","o":["signal","development","performer","Energy"],"a":1,"e":"________วิทยุอ่อนทำให้การสื่อสารกับสถานีวิจัยระยะไกลทำได้ยาก (1) สัญญาณ (2) การพัฒนา (3) ผู้แสดง (4) พลังงาน"},{"n":105,"q":"Could you please _____________ my coat from the closet before we leave?","o":["bother","prepare","spread","fetch"],"a":4,"e":"คุณช่วย_________เสื้อโค้ทของฉันออกจากตู้เสื้อผ้าก่อนที่เราจะออกไปได้ไหม? (1) ทำให้รำคาญ (2) เตรียมพร้อม (3) การขยายตัว (4) ไปเอา"},{"n":106,"q":"His explanation didn’t _________ , so we asked him to explain.","o":["result in","mention","reply","make sense"],"a":4,"e":"คำอธิบายของเขาไม่_________ดังนั้นเราจึงขอให้เขาอธิบายอีกครั้ง (1) ก่อให้เกิดผล (2) กล่าวถึง (3) ตอบกลับ (4) สมเหตุสมผล"},{"n":107,"q":"Sara wanted to attend the concert; _________, she had to work late that night.","o":["consequently","so","however","and"],"a":2,"e":"ซาร่าต้องการเข้าชมคอนเสิร์ต________ เธอจึงต้องทำงานดึกในคืนนั้น (1) เพราะเหตุนี้ (2) ดังนั้น (3) อย่างไรก็ตาม (4) และ"},{"n":108,"q":"They discovered his _________for acting at a young age.","o":["talent","language","pattern","meaning"],"a":1,"e":"พวกเขาค้นพบ_________ด้านการแสดงของเธอตั้งแต่อายุยังน้อย (1) พรสวรรค์ (2) ภาษา (3) รูปแบบ (4) ความหมาย"},{"n":109,"q":"The teacher _________ that there would not be many students coming to her class due to the heavy rain.","o":["attracted","predicted","intended","curled up"],"a":2,"e":"คุณครู ________ ว่าจะไม่มีนักเรียนมาเข้าชั้นเรียนมากนักเนื่องจากฝนตกหนัก (1) ดึงดูด (2) ทำนาย / คาดการณ์ (3) ตั้งใจ (4) งอตัว / คดตัว"},{"n":110,"q":"Nancy’s _______ came quickly via text message.","o":["reply","vessel","effect","anxiety"],"a":1,"e":"________ของแนนซี่เกิดขึ้นอย่างรวดเร็วผ่านทางข้อความ (1) การตอบกลับ (2) เรือ (3) ผลกระทบ (4) ความวิตกกังวล"},{"n":111,"q":"They tried to restore the old houses to its ________ look.","o":["personal","popular","brief","original"],"a":4,"e":"พวกเขาพยายามที่จะบูรณะบ้านเก่าให้กลับไปมีสภาพเหมือน________อีกครั้ง (1) ส่วนตัว (2) เป็นที่นิยม (3) สรุป (4) ดั้งเดิม"},{"n":112,"q":"The proposal to paint the entire town pink screened ridiculous to most residents.","o":["fantastic","infinite","silly","breathtaking"],"a":3,"e":"ข้อเสนอให้ทาสีชมพูทั่วทั้งเมืองดูไร้สาระสำหรับผู้อยู่อาศัยส่วนใหญ่ (1) ยอดเยี่ยม (2) ไม่มีที่สิ้นสุด (3) เหลวไหล / ไร้เหตุผล (4) น่าทึ่ง"},{"n":113,"q":"Mary refused to give up on her dream of becoming an astronaut.","o":["abandon","determinate","depend on","shrink"],"a":1,"e":"แมรี่ปฏิเสธที่จะละทิ้งความฝันที่จะเป็นนักบินอวกาศของเธอ (1) ล้มเลิก / ละทิ้ง (2) มุ่งมั่น / ตั้งใจ (3) พึ่งพา / ขึ้นอยู่กับ (4) หดตัว"},{"n":114,"q":"The giant redwood trees in California can grow in over 300 feet tall.","o":["flat","huge","round","tiny"],"a":2,"e":"ต้นเรดวูดยักษ์ในแคลิฟอร์เนียสามารถเติบโตได้สูงกว่า 300 ฟุต (1) แบน (2) ใหญ่โต (3) กลม (4) เล็กจิ๋ว"},{"n":115,"q":"The procedure of making cheese requires patient and attention to detail.","o":["effects","logic","crust","process"],"a":4,"e":"ขั้นตอนการทำชีสต้องอาศัยความอดทนและใส่ใจในรายละเอียด (1) ผลกระทบ (2) ตรรกะ (3) เปลือกนอก (4) กระบวนการ"},{"n":116,"q":"After the floods, all the concerned people rushed to provide the victims with food and necessities.","o":["complete","establish","inform","support"],"a":4,"e":"หลังเกิดอุทกภัย ประชาชนต่างเร่งรุดไปช่วยเหลือผู้ประสบภัยด้วยอาหารแห้งและสิ่งของจำเป็น (1) สมบูรณ์ (2) จัดตั้งขึ้น (3) แจ้งให้ทราบ (4) ให้การช่วยเหลือ"},{"n":117,"q":"The medication had a positive effect on her symptoms.","o":["diet","outcome","form","gain"],"a":2,"e":"ยามีผลดีต่ออาการของเธอ (1) อาหาร (2) ผลลัพธ์ (3) รูปแบบ (4) ได้รับ"},{"n":118,"q":"It’s a normal to feel nervous before a big presentation.","o":["boring","small","usual","costly"],"a":3,"e":"เป็นเรื่องปกติที่จะรู้สึกประหม่าก่อนการนำเสนอครั้งใหญ่ (1) น่าเบื่อ (2) เล็ก (3) ปกติ (4) แพง"},{"n":119,"q":"Time is limited to make the most of every moment and focus on what truly matters.","o":["separate","fluent","addictive","restricted"],"a":4,"e":"เวลามีจำกัด ต้องใช้เวลาทุกนาทีให้คุ้มค่าที่สุดและมุ่งเน้นไปที่สิ่งที่สำคัญอย่างแท้จริง (1) แยกออก (2) คล่องแคล่ว (3) เสพติด (4) จำกัด"},{"n":120,"q":"The institute doubts whether these modern dinosaurs will be kept on reservations or not.","o":["repliers","suspects","crawls","intends"],"a":2,"e":"สถาบันสงสัยว่าไดโนเสาร์ยุคใหม่เหล่านี้จะถูกเก็บรักษาไว้ในเขตสงวนหรือไม่ (1) ตอบกลับ (2) สงสัย (3) คลาน (4) ตั้งใจ"}]},{"title":"ภาค S ปีการศึกษา 2566","items":[{"n":1,"q":"Adam often _______ out with friends after work.","o":["go","goes","is going","has gone"],"a":2,"e":"ใช้ Present Simple Tense (S. + V.1 ผันตาม 5.) กับเหตุการณ์หรือการ-กระทำที่เป็นปกติวิสัย หรือการ กระทำที่เกิดขึ้นเป็นประจำสม ่าเสมอ ซึ่งมักมีคำกริยาวิเศษณ์ (Adverb) ปรากฏอยู่ในประโยค เช่น always (เสมอ), often (บ่อย ๆ), usually (ตามปกติแล้ว), frequently (ตามปกติแล้ว), normally (ตามปกติแล้ว), regularly (ตามปกติ แล้ว), sometimes (บางครั้ง), every/on + วัน/เวลา, once/twice + a + เวลา ตัวอย่างประโยค : I wash my hair every other day. (ฉันสระผมวันเว้นวัน) : These littles girls are afraid of the big black dog. (สาวน้อยเหล่านี้กลัวสุนัขสีดำตัวใหญ่ตัวนั้น)"},{"n":2,"q":"Alan expects _______ all A’s this semester.","o":["get","gets","to get","getting"],"a":3,"e":"คำกริยาที่ตาม infinite with to คือ to + V1 aim attempt decide hope offer seem afford beg expect intend prepare swear agree care fail manage pretend try appear choose happen mean promise want arrange consent help need propose wish ask dare hesitate neglect refuse ตัวอย่างประโยค : My aunt agreed to give me a ride. (ป้าตกลงที่จะไปส่งฉัน) : We intended to leave early. (เราตั้งใจจะออกแต่เช้า) : He seemed to know the fact. (ดูเหมือนเขาจะรู้ความจริง)"},{"n":3,"q":"Peter _______ stop eating junk food and exercise more.","o":["must","might","could","would"],"a":1,"e":"ใช้ must + V.1 (ไม่ผัน) มีความหมายว่า \"ต้อง\" เพื่อการเน้นย ้าสิ่งหนึ่งสิ่งใดในปัจจุบันหรืออนาคต ตัวอย่างประโยค : I must do my homework now. (ฉันต้องทำการบ้านตอนนี้) : You must eat more vegetables and do some exercises. (คุณต้องกินผักให้มากขึ้นและออกกำลังกายบ้าง) ใช้ must + V.1 (ไม่ผัน) มีความหมายว่า \"ต้อง\" เพื่อแสดงถึงความสำคัญหรือความจำเป็น-ต้องกระทำ ตัวอย่างประโยค : You must wear your seat belt. (คุณต้องคาดเข็มขัดนิรภัย) : We must obey the rules. (เราต้องปฏิบัติตามกฎ) ใช้ could + V.1 (ไม่ผัน) เพื่อบอกความสามารถ (Ability) ในการกระทำสิ่งหนึ่งสิ่งใดได้ในอดีต ตัวอย่างประโยค : I could swim across the river. (ฉันเคยสามารถว่ายข้ามแม่น ้าได้) : I could understand Chinese very well when I was young. (ฉันสามารถเข้าใจภาษาจีนได้เป็นอย่างดีเมื่อตอนที่ฉันยังเด็ก) ใช้ could + V.1 (ไม่ผัน) เพื่อแสดงความน่าจะเป็นในปัจจุบันและอนาคต ตัวอย่างประโยค : It could rain today, You should take an umbrella with you. (วันนี้ฝนน่าจะตก เธอควรพกร่มติดตัวไปด้วย) : They could come here by bus. (พวกเข่าน่าจะมาที่นี่ด้วยรถประจำทาง) ใช้ may / might + V.1 (ไม่ผัน) มีความหมายว่า \"อาจจะ, น่าจะ, บางที\" เพื่อแสดงถึงความเป็นไปได้ (Possibility) ทั้งในปัจจุบันหรือในอนาคต (may มีโอกาสที่จะเป็นไปได้ แต่ might พอมีโอกาสเป็นไปได้บ้าง แต่น้อยมาก แสดงให้ เห็นว่าผู้พูดไม่มีความมั่นใจ) ตัวอย่างประโยค : She may come tomorrow. (เธออาจจะมาพรุ่งนี้) : He might get a job soon. (เขาน่าจะได้งานเร็วๆ นี้)"},{"n":4,"q":"I have five brothers; Andy is ______ one.","o":["young","a young","younger","the youngest"],"a":4,"e":"การเปรียบเทียบขั้นสุด (Superlative Degree of Comparison) เพื่อเปรียบเทียบคำนามที่มีจำนวนตั้งแต่ 3 คำขึ้น ไป โครงสร้างของคำจะเกิดจากการเติม \"-est\" ที่ท้ายคำคุณศัพท์ 1 หรือ 2 พยางค์ (แต่ถ้าคำนั้นลงท้ายด้วย \"-e\" จะเติม เพียง \"s!\" ท้ายคำ)หรือเดิม \"most\" หน้าคำคุณศัพท์ที่มีตั้งแต่ 3 พยางค์ขึ้นไป และต้องมี Article \"the\" นำหน้าคำคุณศัพท์ ขั้นสุดเสมอ the + Adj. + est หรือ most + Adj. ตัวอย่างประโยค : My house is the largest one in our neighborhood. (บ้านของฉันใหญ่ที่สุดในละแวกบ้านของเรา) : He is the most romantic guy I have ever met. (เขาคือผู้ชายที่โรแมนติกที่สุดเท่าที่ฉันเคยเจอมา)"},{"n":5,"q":"Jack won’t tell anyone about this, ________?","o":["may him","will he","isn’t Jack","does not Jack"],"a":2,"e":"เป็นเรื่อง tag ส่วนหาง มีหลักดังนี้ กำหนดว่าถ้าข้างหน้าเป็นประโยคบอกเล่าข้างหลังจะต้องเป็นรูปปฏิเสธรูปย่อ มี 2 จุด ที่ต้องดูนั่น คือเรื่องกริยากับเรื่องคำสรรพนาม เช่น won’t tell มาจาก will not tell แสดงว่า เป็นปฏิเสธ ส่วนท้าย ต้องเป็นบอกเล่าคือ will และ Jack เป็นคำนามเพศชาย (ชื่อแจ็ค) ส่วนท้ายต้องเป็นคำสรรพนามเพศชายคือ he ตัวอย่างประโยค : Her son can't drive, can he? (ลูกชายของเธอขับรถไม่ได้ใช่ไหม) : You don't need to finish this today, do you? (วันนี้คุณไม่ต้องทำให้เสร็จใช่ไหม) : They won't report us, will they? (พวกเขาจะไม่รายงานให้พวกเราทราบใช่ไหม)"},{"n":6,"q":"The man _______ with a BBA from Cambridge University in 2010.","o":["graduates","graduate","graduated","will graduate"],"a":3,"e":"ใช้ Past Simple Tense (S. + V.2) กับเหตุการณ์หรือการกระทำที่เกิดขึ้นและ สิ้นสุดลงแล้วในอดีตโดยไม่จำกัดเวลา หรือบอกความจริงที่เกิดขึ้นในอดีตมักจะมีคำกริยาวิเศษณ์บอกเวลา เช่น yesterday (เมื่อวานนี้), ago (ก่อนหน้านี้ ที่ผ่าน มา), once (ก่อนหน้านี้ ที่ผ่านมา), this morning (เมื่อเช้านี้), in + ค.ศ., last (night/week/month/year/term) หรือมีอนุ ประโยคบอกเวลาที่เกิดขึ้นและสิ้นสุดลงแล้วในอดีต ตัวอย่างประโยค : My parents called me yesterday. (พ่อแม่โทรหาฉันเมื่อวานนี้) : They were at her birthday party last night. (พวกเขาอยู่ที่งานเลี้ยงวันเกิดของเธอเมื่อคืนนี้) : When I was young, I walked to school every day. (ตอนเด็กฉันเดินไปโรงเรียนทุกวัน)"},{"n":7,"q":"I _______ like ice-cream and apple pie.","o":["have","shall","are","do"],"a":4,"e":"ใช้ Verb to do ร่วมกับกริยาหลัก (Main Verb) ในประโยคบอกเล่า เพื่อเน้นย ้าความ สำคัญเป็นพิเศษ Subj. + do/does/did + V.1 (ไม่ผัน) ตัวอย่างประโยค : They do go to school early. (พวกเขาไปโรงเรียนแต่เช้าเลย) : She does clean the floor every day. (เธอทำความสะอาดพื้นทุกวัน) : He did lock his car. (เขาล็อกรถแล้ว)"},{"n":8,"q":"What ________you do after the examination?","o":["will","could have","ought to","have to"],"a":1,"e":"ใช้ will + V.1 (ไม่ผัน) มีความหมายว่า \"จะ\" เพื่อแสดงถึงความตั้งใจหรือการตัดสินใจที่จะทำสิ่งหนึ่งสิ่งใดในอนาคต ตัวอย่างประโยค : I will send him an invitation to the party. (ฉันจะส่งบัตรเชิญไปงานเลี้ยงให้เขา) : Her family will go to China next weekend. (ครอบครัวของเธอจะไปประเทศจีนในสุดสัปดาห์หน้า)"},{"n":9,"q":"A bus to Omaha _________ every three hours.","o":["departs","departed","was departing","is departing"],"a":1,"e":"ใช้ Present Simple Tense (S. + V.1 ผันตาม S.) กับเหตุการณ์ที่ในอนาคตสำหรับ \"กำหนดการต่างๆ ตาม ตารางเวลา\" ที่กำหนดไว้แล้ว ตัวอย่างประโยค : My bus leaves at nine a.m. (รถบัสของฉันออกเวลา 9 โมงเช้า) : The plane arrives in Bangkok at 2 o'clock. (เครื่องบินจะมาถึงกรุงเทพฯ เวลา 2 นาฬิกา)"},{"n":10,"q":"When I arrived, I didn’t see _________ in the classroom.","o":["some","anybody","no one","none"],"a":2,"e":"คำสรรพนามเหล่านี้เมื่อทำหน้าที่เป็นประธาน ใช้คำกริยาเป็นเอกพจน์ คน สถานที่ สิ่งของ everyone everybody everywhere everything someone somebody somewhere something anyone anybody anywhere anything no one nobody nowhere nothing ตัวอย่างประโยค : Someone gave me this. book. (มีคนให้หนังสือเล่มนี้แก่ฉัน) : I wish somebody would clean this room. (ฉันหวังว่าใครสักคนจะทำความสะอาดห้องนี้) : I won't tell your secret to anyone. (ฉันจะไม่บอกความลับของคุณกับใคร) : Does anybody have a phone charger? (ใครมีสายชาร์จโทรศัพท์บ้าง) หมายเหตุ : ใช้ arybody มีความหมายว่า \"ใคร ๆ, ใครต่อใคร, คนใดก็ตาม\" มักจะใช้ใน รูปประโยคปฏิเสธและประโยค คำถาม และต้องใช้ในรูปเอกพจน์เท่านั้น ตัวอย่างประโยค : Does anybody remember this person? (มีใครจำคนคนนี้ได้บ้าง) : She doesn't like to talk to anybody. (เธอไม่ชอบที่จะคุยกับใครต่อใคร) : There wasn't anybody here. (ที่นี่ไม่มีใครอยู่เลยสักคน) ใช้ nobody / none / no one มีความหมายว่า \"ไม่มีใคร\" มีความหมายเป็นปฏิเสธเสมอ และต้องใช้ในรูปเอกพจน์เท่านั้น ตัวอย่างประโยค : Nobody knows where she is. (ไม่มีใครรู้ว่าเธออยู่ที่ไหน) : None has arrived. (ยังไม่มีใครมาถึงเลย) : No one likes her because she's selfish. (ไม่มีใครชอบเธอเพราะเธอใจจืดใจดำ)"},{"n":11,"q":"You __________ not eat in class!","o":["would","ought to","have to","shall"],"a":4,"e":"1. would เป็นรูปอดีตของ will แสดงอนาคต แต่โจทย์นี้จะใช้ในรูปปัจจุบันเป็นการแนะนำใช้ would ไม่ถูก 2. ought to not ผิด ในรูปปฏิเสธจะวาง not ไว้ตรงกลางเป็น ought not to 3. have to not ผิด ในรูปปฏิเสธจะใช้ verb to do จะเป็น do not have to 4. shall ในที่นี้เป็นการเสนอแนะนำว่า shall not eat = ไม่ควรกิน"},{"n":12,"q":"The woman ________ with Mr. Benson will be our new manager.","o":["talk","talks","talking","to talk"],"a":3,"e":"Present Participle (V.ing) ทำหน้าที่เป็นคุณศัพท์วางไว้หน้าคำนาม/หลังคำนามที่มันขยาย มีความหมายเป็นผู้กระทำเอง ตัวอย่างประโยค : The crying girl is Sue’s younger sister. (เด็กผู้หญิงที่ร้องไห้คือน้องสาวของซู) : The man standing in the field will be our new teacher. (ผู้ชายที่ยืนอยู่ในสนามจะเป็นครูคนใหม่ของเรา) : The woman talking with Mr. Benson will be our new manager. (ผู้หญิงที่คุยกับคุณเบ็นสันจะเป็นผู้จัดการคนใหม่ของเรา) Past Participle (V3) ทำหน้าที่เป็นคุณศัพท์วางไว้หน้าคำนามหรือหลังคำนามที่มันขยาย มีความหมายเป็น ผู้ถูกกระทำหรือบอกสภาพ ตัวอย่างประโยค : Beware of the fallen trees. (ระวังต้นไม้ล้ม) : The meeting canceled yesterday was about next year’s budget. (การประชุมที่ถูกยกเลิกเมื่อวานเป็นเรื่องเกี่ยวกับงบประมาณปีหน้า)"},{"n":13,"q":"Do you want ________ out tonight, Shawn?","o":["go","to go","gone","going"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 2. ประกอบ กริยา want เป็นกริยาที่มี to ตาม จึงตอบ want to go"},{"n":14,"q":"Joey _______ to see a doctor this afternoon.","o":["went","has gone","was going","is going"],"a":4,"e":"ใช้ Present Progressive Tense (S. + is/am/are + V.ing) กับเหตุการณ์ที่กำลังจะเกิดขึ้นในอนาคตอันใกล้และ ค่อนข้างแน่นอน มักจะมีคำกริยาวิเศษณ์ (Adverb) บอกเวลาที่แสดงอนาคตอันใกล้ เช่น tomorrow (พรุ่งนี้) soon เร็วๆ นี้, ในไม่ช้านี้), tonight (คืนนี้), next (week/month/year/term), on Friday, in a few hours/minutes/seconds ตัวอย่างประโยค : We're meeting our old friends at 10 o'clock tomorrow morning. (เราจะไปเจอเพื่อนเก่าของเราตอน 10 โมงเช้าวันพรุ่งนี้) : My mother is going to Paris next week. (แม่ผมจะไปกรุงปารีสสัปดาห์หน้า)"},{"n":15,"q":"We ________ have trusted them. They’re scammers!","o":["needn’t","won’t","shouldn’t","can’t"],"a":3,"e":"ใช้ should + have + V.3 และ 'shouldn't + have + V.3 - should + have + V.3 มีความหมายว่า \"ควรทำ\" (แต่ไม่ได้ทำในอดีต) - shoulcr't + have + V.3 มีความหมายว่า \"ไม่ควรทำ\" (แต่ทำไปแล้วในอดีต) ตัวอย่างประโยค : I should have called you last night. (ฉันควรจะโทรหาเธอเมื่อคืนนี้) : You shouldn't have told me beforehand. (คุณไม่ควรบอกฉันก่อนหน้านี้) ใช้ needn't + V.1 มีความหมายว่า \"ไม่จำเป็นต้อง\"สำหรับการใช้ need เป็นกริยาช่วยมักจะใช้ในรูปปฏิเสธ ตัวอย่างประโยค : You needn't finish your meal if you don't like it. (คุณไม่จำเป็นต้องทานอาหารให้หมดหรอกถ้าคุณไม่ชอบมัน) : You needn't drive so quickly because we have plenty of time. (คุณไม่จำเป็นต้องขับเร็วมากหรอกเรายังมีเวลาอีกเยอะ)"},{"n":16,"q":"Amanda is very busy with work. She doesn’t have ________ time to relax.","o":["a number of","much","many","many"],"a":2,"e":"Quantitative Adjectives คือ คำคุณศัพท์ที่บอกปริมาณที่ไม่ได้เจาะจง - many มีความหมายว่า \"มาก\" ใช้ขยายคำนามพหูพจน์ (Plural Noun) - much มีความหมายว่า \"มาก\" ใช้ขยายคำนามนับไม่ได้ (Uncountable Noun) ตัวอย่างประโยค : Are there many employees in your office? (ในสำนักงานของคุณมีพนักงานจำนวนมากไหม) : There's not much time left before the deadline. (เหลือเวลาอีกไม่มากก่อนถึงกำหนดส่ง)"},{"n":17,"q":"Elizabeth is _______ nurse at Mayo Clinic in Rochester.","o":["a","an","the","(Blank)"],"a":1,"e":"ใช้ “a/an” นำหน้าคำนามที่แสดงอาชีพ เช่น a singer (นักร้อง) , a lawyer (ทนายความ) , a doctor (หมอ) , a nurse (พยาบาล) , a student (นักเรียนนักศึกษา) , an engineer (วิศวกรกร) , a scientist (นักวิทยาศาสตร์) เป็นต้น"},{"n":18,"q":"Tim _______ at Yale for two years.","o":["studies","was studying","has studied","is studying"],"a":3,"e":"ใช้ Present Perfect Tense (S. + has/have + V.3) กับเหตุการณ์หรือการกระทำที่เกิดติดต่อกันตั้งแต่อดีตจนถึง ปัจจุบัน แต่ไม่ได้แสดงเจตนาแน่นอนว่าจะดำเนินต่อไปในอนาคตหรือไม่ มักจะมีคำบอกเวลา since (ตั้งแต่) + วันเวลา/ อนุประโยค, for (เป็นเวลา) + ระยะเวลา, so far (เรื่อยมาจนถึงตอนนี้), yet (ยัง), How long…. (นานแค่ไหน) ตัวอย่างประโยค : We have been at the hotel for a week. (เราอยู่ที่โรงแรมแห่งนี้มา 1 สัปดาห์แล้ว) : She has taught at this school since 2022. (เธอสอนที่โรงเรียนนี้ตั้งแต่ปี 2022)"},{"n":19,"q":"The car ________ by my dad next Saturday.","o":["fixes","has been fixed","is fixing","will be fixed"],"a":4,"e":"ใช้ Future Simple Tense (S. + will/shall/be going to + V.1 ไม่ผัน) กับเหตุการณ์หรือการกระทำที่จะเกิดขึ้นใน อนาคต อาจจะมีคำกริยาวิเศษณ์บอกเวลา เช่น tomorrow, soon, next (week/month/year), tonight, in (the future/a few minutes / half an hour), this afternoon/evening, at the end of this month, later เป็นต้น ตัวอย่างประโยค : We will travel around the world next year. (พวกเราจะไปเที่ยวรอบโลกปีหน้า) : Look at that dark cloud! It's going to rain. (ดูเมฆดำนั่นสิ! ฝนกำลังจะตก) ประโยค Passive voice คือ ประโยคที่ประธานเป็นผู้ถูกกระทำ โครงสร้าง Passive voice ใน Future Simple Tense คือ S. + will / shall be + V.3 ตัวอย่างประโยค : The meeting will be cancelled. (การประชุมจะถูกยกเล็ก) : The museum will be visited by millions of visitors. (พิพิธภัณฑ์จะมีผู้เข้าชมหลายล้านคน) S. + is/am/are + going to + be + V.3 ตัวอย่างประโยค : A cake is going to be made by my grandmother. (ยายของฉันจะทำเค้กสำหรับงานปาร์ตี้) : The online English learning systems are going to be developed. (ระบบการเรียนภาษาอังกฤษออนไลน์จะถูกพัฒนาขึ้นมา)"},{"n":20,"q":"Mom wants her bedroom __________.","o":["to be expanded","expands","be expanding","had expanded"],"a":1,"e":"โครงสร้าง Passive Voice ของกริยา want ซึ่งเราเห็น want + สิ่งของ (her bedroom) ใช้โครงสร้าง want + สิ่งของ+ to be V3 = want to be expanded ตัวอย่างประโยค : Mom wants the room to be cleaned. = แม่อยากให้ห้องสะอาด"},{"n":21,"q":"Uncooked food __________ harm your health.","o":["does","can","is","need"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 7. ประกอบ Subj. + do/does/did + V.1 (ไม่ผัน)"},{"n":22,"q":"______Janet ________ very busy with school lately?","o":["Is ; being","Was ; being","Will ; be","Has ; been"],"a":4,"e":"ใช้ Present Perfect Tense (S. + has/have + V.3) กับเหตุการณ์หรือการกระทำที่เพิ่งสิ้นสุดลงและยังเห็นผลของ การกระทำนั้นต่อเนื่องมาจนถึงปัจจุบัน โดยมักจะ มีคำกริยาวิเศษณ์บอกเวลา already (แล้ว, เรียบร้อยแล้ว), just (เพิ่ง, เพิ่งจะ), lately (เมื่อเร็วๆ นี้, หลังๆ มานี้, เมื่อไม่นานมานี้), recently (เมื่อเร็วๆ นี้, หลังๆ มานี้, เมื่อไม่นานมานี้) ตัวอย่างประโยค : I've already done my homework. (ฉันทำการบ้านเสร็จแล้ว) : We've just finished cooking. (เราเพิ่งทำอาหารเสร็จ) : I haven't eaten curry lately. (ช่วงนี้ฉันไม่ได้กินแกง) : Have you been to the cinema recently? (คุณเคยไปดูหนังเมื่อเร็วๆ นี้หรือไม่"},{"n":23,"q":"________ I take your message, sir?","o":["Should","Will","May","Need"],"a":3,"e":"กริยาช่วย May ใช้ในการขออนุญาตหรือขอร้อง - May I keep this pen? (ฉันขอเก็บปากกาด้ามนี้ไว้ได้ไหม?) - May I take your message, sir? (ผมขอรับข้อความของท่านได้ไหมครับ?) ส่วนกริยาช่วย Need แสดง “จำเป็น / ต้อง” , should “ควรจะ” แสดงการแนะนำ, will แสดงอนาคต"},{"n":24,"q":"Janet ________ born in a small town in Illinois.","o":["was","had","did","None is correct"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 6. ประกอบ หมายเหตุ : ตำแหน่งของคำคุณศัพท์ (Adjectives) 1. หน้าคำนามที่ขยาย ตัวอย่างประโยค : He stood next to the tall woman. (เขายืนอยู่ข้างผู้หญิงร่างสูง) : We played with the cute kittens (เราเล่นกับลูกแมวน่ารัก) 2. หลัง V. to be ตัวอย่างประโยค : The monkeys were very. loud. (ลิงเสียงดังมาก) : Her clothes are really expensive. (เสื้อผ้าของเธอแพงมาก)"},{"n":25,"q":"_______ you gone to Tokyo yet?","o":["Will","Do","Are","Have"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 18. ประกอบ ใช้ yet มีความหมายว่า \"ยัง\" แสดงเหตุการณ์หรือการกระทำที่คาดว่าจะเกิดขึ้นแต่ยังไม่เกิดจนกระทั่งขณะที่พูด มักใช้กับ Present Perfect Tense ในประโยคคำถามและประโยคปฏิเสธ และวางไว้ท้ายประโยค ตัวอย่างประโยค : Haven't you decided yet? (คุณยังไม่ได้ตัดสินใจหรือ) : I haven't found a job yet. (ฉันยังหางานไม่ได้เลย)"},{"n":26,"q":"Joe likes _______ games.","o":["excited","excites","exciting","excite"],"a":3,"e":"ปัจจัย \"ed\" และ \"-ing\" ที่เติมท้ายคำกริยา จะทำให้คำกริยาสามารถทำหน้าที่เป็นคำคุณศัพท์ (Adjectives) ได้ โดย มีความหมายที่แตกต่างกันออกไป Adjectives ที่ลงท้ายด้วย \"-ed\" มีความหมายว่า \"รู้สึก.....\" ซึ่งจะแสดงความรู้สึกของประธานของประโยค หรือถ้า วางหน้าคำนามใดๆ จะมีความหมายว่าคำนามนั้นรู้สึกอย่างไรเช่น รู้สึกสนใจ/รู้สึกเบื่อ/รู้สึกกลัว Adjectives ที่ลงท้ายด้วย \"-ing\" มีความหมายว่า \"น่า....\" ซึ่งจะแสดงว่าประธานของประโยคนั้นเป็นอย่างไร หรือ ถ้าวางหน้าคำนามใดๆ จะมีความหมายว่าคำนามนั้นมีลักษณะอย่างไร/เป็นอย่างไร เช่น น่าสนใจ/น่าเบื่อ/น่ากลัว boring (น่าเบื่อ) bored รู้สึกเชื่อ) exciting (น่าตื่นเต้น) excited (รู้สึกตื่นเต้น) interesting (น่าสนใจ) interested (รู้สึกสนใจ) surprising (น่าแปลกใจ) surprised (รู้สึกแปลกใจ)"},{"n":27,"q":"Nan lives on the _______ floor of the condo building.","o":["eleven","twelfth","high","(blank)"],"a":2,"e":"การใช้ตัวเลข (Numbers) - Cardinal Numbers คือ ตัวเลขสำหรับบอกจำนวนของสิ่งต่าง ๆ ตัวอย่างประโยค : There are 12 people in the line ahead of me. (มี 12 คนต่อแถวข้างหน้าฉัน) : There are just 6 days left for vacation. (เหลือเวลาวันหยุดอีกเพียง 6 วัน) - Ordinal Numbers คือ ตัวเลขที่ใช้บอกลำดับ อันดับ หรือตำแหน่ง ตัวอย่างประโยค : Her office is on the second floor. (ห้องทำงานของเธออยู่บนชั้นสอง) : My daughter was born on the fourth of February. (ลูกสาวของฉันเกิดเมื่อวันที่สี่เดือนกุมภาพันธ์)"},{"n":28,"q":"No one likes ________at.","o":["to laugh","laugh","laughing","to be laughed"],"a":3,"e":"คำกริยาที่ตามด้วย Gerunds และตามด้วย Ving ได้แก่ admit dread fancy practice risk allow dislike forgive postpone resent appreciate enjoy imagine prefer stop avoid endure involve prevent suggest consider encourage keep permit require delay escape like prevent hate defer excuse miss quit forgive deny finish mind resist advise"},{"n":29,"q":"_________ is very hot this summer!","o":["One","Each","It","This"],"a":3,"e":"คำสรรพนามที่ไม่ได้เจาะจงมักขึ้นต้นด้วย It is / It was เป็นประธานตามด้วย Verb to be ใช้กับการบอกอากาศ ปรากฏการณ์ธรรมชาติ ระยะทางและเวลา ตัวอย่างประโยค : It is hot. (อากาศร้อน) : It is cloudy. (เมฆครึ้ม) : It is Monday today. (วันนี้วันจันทร์) : It is half past six. (หกโมงครึ่งแล้ว) : It is about five miles from here to Lopburi. (ระยะทางประมาณ 5 ไมล์จากที่นี้ถึงลพบุรี)"},{"n":30,"q":"While we ________ the concert, this singer fainted.","o":["enjoy","have enjoyed","enjoyed","were enjoying"],"a":4,"e":"ใช้ Past Progressive Tense (S. + was/were + V.ing) คู่กับ Past Simple Tense (S. + V.2) แสดงความสัมพันธ์ของเหตุ การณ์ 2 เหตุการณ์ที่เกิดขึ้นคาบเกี่ยวกันในอดีตโดยมีเหตุการณ์หนึ่งกำลังดำเนินอยู่ก่อนแล้ว (Past Progressive Tense) และมีอีกเหตุการณ์หนึ่งเกิดข้อนขึ้นมา (Past Simple Tense) มักมีคำเชื่อมบอกเวลา when, while, as ปรากฏอยู่ด้วย ตัวอย่างประโยค : As I was jogging, I saw my girlfriend driving by. (ขณะที่ผมกำลังวิ่งอยู่ ผมเห็นแฟนของผมกำลังขับรถผ่านไป) : My mother was cooking when I arrived. (แม่ของฉันกำลังทำกับข้าวตอนที่ฉันมาถึง)"},{"n":31,"q":"We haven’t heard about Teera ________ he left the Line group.","o":["for","so","consequently","because"],"a":4,"e":"ให้เติมคำเชื่อมความ ดูแต่ละคา เชื่อมว่าเข้ากับประโยคที่ให้มาตัวไหน for = because = เพราะว่าแต่ต้องตามด้วยประโยค คือ มีประธาน + กริยาหลักและถ้าใช้คำเชื่อม for จะต้องมีเครื่อง หมายคอมม่า (,) คั่นก่อนหน้า for เช่น We haven’t heard about Teera, for he left the Line group. จึงตอบ because ที่ เชื่อมได้เลยไม่ต้องมีเครื่องหมายอะไรคั่นเข้ากับ ประโยคว่า “เราไม่ได้ยินข่าวเกี่ยวกับเทียร่าเพราะเขาออกจากกลุ่มไลน์ แล้ว” consequently = as a result of = ผลที่ตามมาและ so = ดังนั้น ไม่เข้ากับประโยคที่ให้มา"},{"n":32,"q":"_________ tradition, the cathedral offered the full range of services every day.","o":["For","In accordance with","Since","Therefore"],"a":2,"e":"ใช้ in accordance with เป็นวลี (Phrase) มีความหมายว่า \"ตาม, ตามที่\" ตามด้วยคำนาม (Noun) หรือกลุ่มคำนาม (Noun Phrase) + Ving ตัวอย่างประโยค : They stored these weapons in accordance with her will. (พวกเค้าเก็บอาวุธพวกนี้ไว้ตามคำสั่งเธอ) : You may return a product to us in accordance with our return policy. (คุณสามารถคืนสินค้าให้เราได้ตามนโยบายการคืนสินค้าของเรา)"},{"n":33,"q":"Brad’s office is in that _______ building.","o":["taller","tall","tallest","tallness"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 4. ประกอบ เมื่อเห็นคำว่า in + สถานที่แสดงถึงที่สุดในนั้น ให้ตอบขั้นสุด"},{"n":34,"q":"_______you _______ me up at 5 pm, tomorrow?","o":["Do ; pick","Have; picked","Will ; pick","Were ; picking"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 19. ประกอบ เมื่อเห็นคำบอกเวลา tomorrow (พรุ่งนี้) แสดงถึงอนาคต ตอบ will + V1 = will pick ทำเป็นคำถาม ยก Will ไว้ หน้า you จึงตอบตัวเลือกข้อ 3"},{"n":35,"q":"Brian gets used to _______ out at the city’s recreation center.","o":["work","works","worked","working"],"a":4,"e":"สำนวนต่อไปนี้ให้ตามด้วย Ving ได้แก่ be accustomed to can’t bear It’s no good be opposed to can’t help It’s no use be subjected to can’t resist It’s worth be / get used to can’t stand Do / Would you mind..? ตัวอย่างประโยค : My mother is used to getting up early. (แม่ฉันเคยชินกับการตื่นแต่เช้า) : I can't help falling in love with him. (ช่วยไม่ได้ที่ฉันตกหลุมรักเขา) : It's worth investing in gold. (มันคุ้มค่าที่จะลงทุนในทองคำ) : Would you mind turning that ventilator on, please? (คุณจะรังเกียจไหมที่จะเปิดเครื่องระบายอากาศนั้น)"},{"n":36,"q":"Dinner is as _________ as breakfast.","o":["importance","important","importancy","importantly"],"a":2,"e":"เมื่อเห็น as________as เป็นการเปรียบเทียบเท่ากัน ตรงกลางระหว่าง as________as ต้องตอบเป็นคุณศัพท์ ธรรมดา นั่น คือ important (ในกรณีที่ไม่รู้ว่าตัวไหนเป็นคำคุณศัพท์ (adj.) ให้ดูคำวิเศษณ์ (adv.) ที่มักลงท้ายด้วย - ly คือ importantly เมื่อตัด - ly ทิ้งก็เป็น important คือคำคุณศัพท์"},{"n":37,"q":"The plants would die if we _______them.","o":["don’t water","hadn’t watered","didn’t water","haven’t watered"],"a":3,"e":"สูตรการใช้ If มี 4 แบบ ข้อนี้ใช้สูตรที่ 3 คือ If + S. + V.2/were, S. + would/could/should/might + V.1 (ไม่ผัน) แบบที่ 1 - ข้อเท็จจริง / ปกติวิสัย / เป็นไปได้ในปัจจุบัน If + S. + V.1 (ผันตาม S.) , S. + V.1 (ผันตาม S.) ตัวอย่างประโยค : If you mix red and blue, you get purple. (ถ้าคุณผสมสีแดงกับสีน ้าเงิน คุณจะได้สีม่วง) : Your muscle mass decreases if you don't exercise. (ถ้าคุณไม่ออกกำลังกาย มวลกล้ามเนื้อของคุณจะลดลง) แบบที่ 2 - เป็นไปได้ในอนาคต If + S. + V.1 (ฝันตาม S.), S. + will/shall/can/may/must + V.1 (ไม่ฝัน) ตัวอย่างประโยค : If I have enough time, I will go shopping. (ถ้าฉันมีเวลาเพียงพอ ฉันจะไปซื้อของ) : We will go camping if the weather is nice this afternoon. (ถ้าบ่ายนี้อากาศดี เราจะไปตั้งแคมป์กัน) แบบที่ 3 - เป็นไปไม่ได้ในปัจจุบัน (ตรงข้ามกับความเป็นจริงในปัจจุบัน) If + S. + V.2/were, S. + would/could/should/might + V.1 (ไม่ผัน) ตัวอย่างประโยค : If I had her phone number, I would call her. (ถ้าผมมีเบอร์โทรของเธอ ผมจะโทรหาเธอ) : Pat would fly to Phuket every winter if he were a bird. (ถ้าแพทเป็นนก เขาจะบินไปภูเก็ตทุกฤดูหนาว) แบบที่ 4 - เป็นไปไม่ได้ในอดีต (ตรงข้ามกับความเป็นจริงในอดีต) If + S. + had + V.3, S. + would/could/should/might + have + V.3 ตัวอย่างประโยค : If they had taken the bus to school, they wouldn't have arrived in time. (ถ้าพวกเขาขึ้นรถเมล์ไปโรงเรียน พวกเขาคงมาไม่ทัน) : You would have arrived on time if you had left earlier. (ถ้าคุณออกเร็วกว่านี้ คุณคงมาถึงตรงเวลา)"},{"n":38,"q":"My parents let me ________ overnight at Cindy’s house.","o":["stay","to stay","staying","stayed"],"a":1,"e":"คำกริยาที่ตามด้วย Infinitive ที่ไม่มี to นำหน้า (Infinitive without to) let make + Object (กรรม) + Infinitive without to have ตัวอย่างประโยค : His mother made him promise to well behave. (แม่ของเขาให้เขาสัญญาว่าจะประพฤติตัวดี) : My boss let me leave early. (เจ้านายให้ฉันกลับบ้านเร็ว)"},{"n":39,"q":"________ able to pass this course, one has to study hard.","o":["Being","Be","To be","1 and 2 are correct"],"a":4,"e":"รูป Participle ทำหน้าที่เป็นคำกริยาวิเศษณ์สามารถขึ้นต้นประโยคได้สองอย่าง คือ ขึ้นต้นเป็น Ving หรือ To + V1 แล้วตามด้วยประโยคหลักที่มีประธานเป็นผู้กระทำอาการของกริยาที่อยู่ต้นประโยค ตัวอย่างประโยค : Walking to class, I saw traffic accident. (กำลังเดินไปเรียนเจออุบัติเหตุจราจร) : To be able to pass this course, one has to study hard. (การจะผ่านวิชานี้ได้ต้องตั้งใจเรียนหนัก) : Being able to pass this course, one has to study hard. (การที่จะผ่านวิชานี้ได้ต้องอาศัยความขยันเรียน)"},{"n":40,"q":"Do you like the play ________ by Samuel Beckett?","o":["write","to write","written","writing"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 12. ประกอบ เป็น past participle ที่ลดรูปโดยใช้กริยาช่องที่ 3 ถูกกระทำขยายคำนาม the play (ละคร) ที่ถูกเขียนโดย.... (by) ใช้ V3 คือ written"},{"n":41,"q":"Doris and Tom have known each other for a long time. ________ were classmates in ________ college years.","o":["We ; our","They ; their","They ; their","We ; their"],"a":2,"e":"Possessive Adjectives คือคำคุณศัพท์ (Adjectives) ใช้บอกความเป็นเจ้าของของคำนาม (Noun) เป็นการบอกให้รู้ ว่าสิ่งๆ นั้นใครเป็นเจ้าของ โดย Possessive Adjectives จะต้องมีคำนามที่ต้องการแสดงความเป็นเจ้าของตามหลังเสมอ บุรุษสรรพนาม (Personal Pronoun) รูปประธาน รูปกรรม Possessive adjective Possessive Pronoun สะท้อนตัวเอง I you he she they we it me you him her them us it my your his her มีคำนามตามหลัง their our its mine yours his hers ไม่มีคำนามตามหลัง theirs ours its myself yourself himself herself themselves ourselves itself"},{"n":42,"q":"Russians are perhaps ________ than Mexicans.","o":["optimistic","the most optimistic","the least optimistic","less optimistic"],"a":4,"e":"เมื่อเห็นคำว่า than ให้ตอบขั้นกว่า คุณศัพท์ธรรมดาให้มาคือ optimistic ทำเป็นขั้นกว่า ใช้ more optimistic หรือ less optimistic (less มาจาก little less least น้อย น้อยกว่า น้อยที่สุด) จึงตอบ less optimistic"},{"n":43,"q":"Look at the supercars over there! I really like _______ one in yellow.","o":["these","this","that","None is correct"],"a":3,"e":"Demonstrative Pronouns (คำสรรพนามชี้เฉพาะ) หมายถึง คำสรรพนาม (Pronoun) ใช้แทนคำนาม (Noun) เพื่อ แสดงการชี้เฉพาะว่าเป็นสิ่งไหน อันไหน หรือคนไหน ทั้งนี้ Demonstrative Pronouns สามารถเป็นได้ทั้งประธานและ กรรมของประโยคโดยคำสรรพนามในกลุ่มนี้ได้แก่ this, that, these, those this แทนคำนามเอกพจน์ที่ใกล้ผู้พูด เมื่อเป็นประธานใช้กับ คำกริยาเอกพจน์ that แทนคำนามเอกพจน์ที่ไกลผู้พูด these แทนคำนามพหูพจน์ที่ใกล้ผู้พูด เมื่อเป็นประธานใช้กับ คำกริยาพหูพจน์ those แทนคำนามพหูพจน์ที่ไกลผู้พูด ตัวอย่างประโยค : Don't forget to turn this off when you leave. (อย่าลืมปิดสิ่งนี้เมื่อคุณออกไป) : I brought that from home. (ฉันนำสิ่งนั้นมาจากบ้าน) : I don't want any of these. (ฉันไม่ต้องการสิ่งเหล่านี้) : I forgot those at home. (ฉันลืมของพวกนั้นไว้ที่บ้าน)"},{"n":44,"q":"Andy and Tim never liked __________.","o":["each other","others","another","None is correct"],"a":1,"e":"Reciprocal Pronouns (สัมพันธสรรพนาม) คือ คำสรรพนาม (Pronoun) ที่แสดงความสัมพันธ์ต่อกันและกัน หมายความว่าคำนามมีความรู้สึกหรือกระทำต่อกันอย่างไร each other ซึ่งกันและกัน ระหว่างคน 2 คนหรือสัตว์ 2 ตัว one another ซึ่งกันและกัน ระหว่างคนหรือสัตว์ที่มีจำนวน 2 ขึ้นไป ตัวอย่างประโยค : They kept looking at each other and smiling. (พวกเขามองหน้ากันแล้วยิ้ม) : They are highly suspicious of one another. (พวกเขามีความสงสัยซึ่งกันและกันอย่างมาก)"},{"n":45,"q":"Bribery _________ insecurity in the economy.","o":["strikes","mentions","produces","conducts"],"a":3,"e":"คำกริยาแสดงสาเหตุเช่น cause / produce / bring about / result in (ก่อให้เกิด) ตามด้วยคำนามหรือกลุ่มคำนามวลี ตัวอย่างประโยค : Exposure to fine particles can cause short-term health effects. (การสัมผัสกับอนุภาคขนาดเล็กอาจก่อให้เกิดผลต่อสุขภาพในระยะสั้นได้) : The man’s speech produced an angry response from parents. (คำพุดของชายคนนั้นก่อให้เกิดปฏิกิริยาโกรธจากพ่อแม่)"},{"n":46,"q":"Cleo _______ by the experience of living alone in Thailand.","o":["will be transforming","was transformed","has transformed","is transforming"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 6. ประกอบ ประโยค Passive voice คือ ประโยคที่ประธานเป็นผู้ถูกกระทำโครงสร้าง Passive voice ใน Past Simple Tense คือ S. + was/were + V.3 ตัวอย่างประโยค : The prize was won by the great competitor. (ผู้เข้าแข่งขันยอดเยี่ยมคว้ารางวัลไปครอง) : Their beds were made neatly by the maid. (สาวใช้จัดเตียงของพวกเขาอย่างเรียบร้อย)"},{"n":47,"q":"We _______ Warren Buffett if we _______ to the campus today.","o":["are seeing ; will go","would see ; had gone","will see ; go","have seen ; are going"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ S + will V1 if / unless S + V1"},{"n":48,"q":"Bill got his housemaid _________ his room every other day.","o":["to make","making","make","made"],"a":1,"e":"ใช้ get เมื่อเน้นว่าให้ใครบางคนทำบางสิ่งบางอย่างให้ get + someone + to do + something ตัวอย่างประโยค : We couldn't get the client to sign the contract. (เราไม่สามารถโน้มน้าวให้ลูกค้าเซ็นสัญญาได้) : The president got his assistant to conduct the meeting. (ประธานให้ผู้ช่วยของเขาควบคุมการประชุม) หมายเหตุ : ใช้ get เมื่อประธานของประโยคไม่ได้ทำสิ่งใดสิ่งหนึ่งด้วยตัวเอง แต่ให้คนอื่นทำให้ คือ ต้องการเส้นว่าสิ่งใด สิ่งหนึ่งถูกกระทำ (Passive Voice) โดยคนใดคนหนึ่งที่ไม่ใช่ประธานของประโยค get + something + V.3 ตัวอย่างประโยค : She will get her hair cut next Sunday. (เธอจะตัดผมในวันอาทิตย์หน้า) : I got the carpets cleaned yesterday. (อันทำความสะอาดพรมแล้วเมื่อวานนี้)"},{"n":49,"q":"Tipping less than 20 percent ________ not proper nowadays.","o":["will consider","is considered","is considering","were considered"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 1. ประกอบ ใช้ในรูป passive voice ( S + is/am/are + V3) = is considered ประธานเป็นผู้กระทำใช้ is เพราะท้ายประโยคมี nowadays (ปัจจุบัน ) ตัวเลือกที่ 4 ไม่ถูกเพราะประธานเป็นเอกพจน์ใช้ were ไม่ได้อยู่แล้ว ตัวอย่างประโยค : Money is collected by my daughter. (ลูกสาวของฉันเก็บเงิน) : A lot of money is paid by her. (เธอจ่ายเงินเป็นจำนวนมาก) : The letter is not written by you. (คุณไม่ได้เขียนจดหมาย)"},{"n":50,"q":"I would travel around the world if I _________ a millionaire.","o":["am","were","was","have been"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ S + would V1 if/unless S + V2"},{"n":51,"q":"Teera can recall the day _________ he went to see his advisor.","o":["that","how","which","when"],"a":4,"e":"Relative Pronouns (คำสรรพนามเชื่อมความ) คือ คำสรรพนาม (Pronoun) ที่ขยายคำนามหรือคำสรรพนามที่ทำ หน้าที่เป็นประธานหรือกรรมในประโยคใช้ Relative Pronouns ขึ้นต้น Adjective Clause (ประโยคย่อยที่ทำหน้าที่เป็น Adjective ขยายคำนามหรือคำสรรพนามที่อยู่ข้างหน้า) ปรากฏอยู่หลังคำนามหรือคำสรรพนามที่ขยายนั้น who ขยายคำนามที่เป็นคน ทำหน้าที่เป็นประธานของ Adjective Clause whom ขยายคำนามที่เป็นคน ทำหน้าที่เป็นกรรมของ Adjective Clause whose ขยายความเป็นเจ้าของทั้งคน สัตว์และสิ่งของ which ขยายคำนามที่เป็นสัตว์หรือสิ่งของ ทำหน้าที่เป็นประธานหรือกรรมของ Adjective Clause that ขยายคำนามที่เป็นคน สัตว์หรือสิ่งของ ทำหน้าที่เป็นประธานหรือกรรมของ Adjective Clause (แทน who, which) when ขยายคำนามที่บอกเวลา (แทน on which) where ขยายคำนามที่บอกสถานที่ (แทน at which, in which) why ขยายคำนามที่บอกเหตุผลว่าทำไม (แทน for which)"},{"n":52,"q":"Poor time management can _______ failure.","o":["do","lead to","relate","make"],"a":2,"e":"กริยาที่เข้ากับประโยคได้คือ lead to (นำไปสู่ , ก่อให้เกิด) การจัดการเวลาที่ไม่ดีอาจ______ความล้มเหลวได้ (1) ทำ (2) นำไปสู่ (3) เกี่ยวข้อง (4) ทำให้"},{"n":53,"q":"New York is much _______ than Boston.","o":["big","biggest","bigger","more big"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 42. ประกอบ เมื่อเห็น than ตอบขั้นกว่า จากคุณศัพท์ big เป็น bigger จึงตอบข้อ 3"},{"n":54,"q":"Jim is the person ________ won the award.","o":["whose","who","which","whom"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 51. ประกอบ the person เป็นคน และส่วนหลังติดกัน มี won เป็นคำกริยามาจาก win won won (ชนะ) ตอบ who ได้เลยเพราะ who + กริยาเสมอ / ถ้า whom + S + Verb / ส่วน whose + คำนาม เสมอ ตัวอย่างประโยค : You're the most beautiful person who I've ever seen. (คุณเป็นคนที่สวยที่สุดที่ผมเคยเห็น) : The parents whom we interviewed were involved in education. (ผู้ปกครองที่เราสัมภาษณ์เกี่ยวข้องกับการศึกษา) : He's marrying a girl whose family don't seem to like him. (เขาจะแต่งงานกับหญิงสาวที่ครอบครัวของเธอดูเหมือนุจะไม่ชอบเขา) : I want a mobile phone which can take good photos. (ผมอยากได้โทรศัพท์มือถือที่ถ่ายรูปสวย"},{"n":55,"q":"_________ I couldn’t attend the meeting yesterday was that I had a family emergency.","o":["The reason why","As a result of","In accordance with","Because"],"a":1,"e":"The reason why = “เหตุผลว่า....., เหตุผลที่ ....” เป็นคำเชื่อมตามด้วยประธานและคำกริยา ตัวอย่างประโยค : The reason why he left the job was that he got a better offer. (เหตุผลที่ทำไมเขาลาออกจากงานก็คือเขาได้รับข้อเสนอที่ดีกว่า) : There are many reasons why Jack failed the test. (มีสาเหตุหลายประการว่าทำไมแจ็คไม่ผ่านการทดสอบ)"},{"n":56,"q":"If Peter ________ the facts, he would have made a better decision.","o":["knew","knows","has been knowing","had known"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ If S + had V3 , S + would / could have V3 ตัวอย่างประโยค : We wouldn't have asked him to fix the printer if we had known he was ill. (เราคงไม่ขอให้เขาซ่อมเครื่องพริ้นเตอร์ หากเรารู้ว่าเขาป่วย) : If I had known it was your birthday, I would have got you a present. (หากฉันรู้ว่าเป็นวันเกิดของคุณ ฉันคงให้ของขวัญคุณไปแล้ว)"},{"n":57,"q":"Ice cream can _______ the blood vessels in the roof of your mouth to shrink.","o":["cause","reason","owe to","show"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 45. ประกอบ ตัวอย่างประโยค : Ice cream can cause the blood vessels in the roof of your mouth to shrink. (ไอศกรีมอาจทำให้หลอดเลือดบนเพดานปากหดตัวได้)"},{"n":58,"q":"________ I to get a raise, I would renovate my parents’ house.","o":["Am","Were","Did","Will"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ เป็นเรื่อง If แต่ตัด if ออกไป สังเกตจากส่วนหลังมี would V1 3. Were S + ส่วนขยาย , S + would V1 4. Had S + V3 , S + would have V3 ตัวอย่างประโยค : If I were a bird, I would fly to New York. (ถ้าฉันเป็นนก ฉันจะบินไปนิวยอร์ก) = Were I a bird, I would fly to New York. : If I were to study science, I would study hard. (ถ้าฉันจะเรียนวิทยาศาสตร์ ฉันคงเรียนหนัก) = Were I to study science, I would study hard. หมายเหตุ : ตัด If ออกแล้วยก Were ไว้หน้าประธานส่วนหลังเหมือนเดิม"},{"n":59,"q":"That lady is our new manager. We enjoy working with _______.","o":["hers","she","her","herself"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 41. ประกอบ บุพบท (with) จะตามด้วยรูปกรรมเสมอ ดังนั้นจากประธาน she รูปกรรมจะเป็น her"},{"n":60,"q":"Nick is _______guitarist; he can play ________guitar very well.","o":["the ; a","a ; the","an ; a","a ; an"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 17. ประกอบ ใช้ “a/an” นำหน้าคำนามแสดงอาชีพ และส่วนหลังเป็นเครื่องดนตรีใช้ “the” นำหน้า the guitar the piano the saxophone the flute the violin the trumpet the xylophone the organ ตัวอย่างประโยค : I have the piano at home. (ผมมีเปียโนที่บ้าน) : We need space to play the trombone. (เราต้องการพื้นที่ในการเล่นทรอมโบน) : Mastering the violin takes years of study. (การจะเชี่ยวชาญไวโอลินต้องใช้เวลาเรียนหลายปี)"},{"n":61,"q":"The ________man is a professional basketball player.","o":["six feet","six-feet","six foot","six-foot"],"a":4,"e":"คุณศัพท์ประสม (Compound Adjectives) เป็นโครงสร้างของคำจำนวน 2 คำ ขึ้นไปมารวมกันโดยมีเครื่องหมาย hyphen (-) คั่นระหว่างคำ five-star second-hand one-way seven-foot ten-page old-fashioned 50-baht white-collar three-hour round-the-clock well-known brand-new up-to-date cold-blooded well-built 25-year-old ตัวอย่างประโยค : My office is in a twenty-storey building. (สำนักงานผมอยู่ในอาคารสูง 20 ชั้น) : I have just finished reading a 300-page book. (ฉันเพิ่งอ่านหนังสือ 300 หน้าจบ) : He works as a part-time trainer. (เขาทำงานเป็นเทรนเนอร์พาร์ทไทม์)"},{"n":62,"q":"________ coffee in this cup is too cold to drink.","o":["A","An","The","(Blank)"],"a":3,"e":"ใช้ “the” นำหน้าคำนาม ที่มีส่วนขยายหลังคำนามที่บอกตำแหน่งว่าอยู่ในหรือที่ นั่นคือ the + คำนาม + มีบุพบท ตามหลัง เช่น in ....... at...... on....... เป็นต้น เป็นการชี้เฉพาะ"},{"n":63,"q":"Nancy is as _________ as Mark.","o":["nice","nicest","the nicest","nicer"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 36. ประกอบ ถ้าเห็น as_____as เปรียบเทียบเท่ากัน ตรงกลางใส่เป็นคุณศัพท์ธรรมดา คือ nice ไม่ต้องมี- er -est เลยจึงตอบ ตัวเลือก nice"},{"n":64,"q":"The tornado in Missouri was ________ storm I’ve ever seen.","o":["worse","bad","the worst","None is correct"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 42. ประกอบ เห็นคำว่า I’ve ever seen (เท่าที่ฉันเคยเห็นมา) แสดงว่าให้ตอบขั้นสุด จากตัวเลือกคุณศัพท์ธรรมดาคือ bad เมื่อทำ เป็นขั้นกว่า ขั้นสุด จะเปลี่ยนรูปเป็น worse worst"},{"n":65,"q":"Let’s study harder this semester, ________?","o":["can you","does he","will they","shall we"],"a":4,"e":"ในประโยค Question-tags ถ้าส่วนหน้าเป็นประโยคชักชวนที่ขึ้นต้นด้วย Let's ส่วนต่อท้ายประโยคต้องเป็น shall we? ตัวอย่างประโยค : Let's go to the cinema tonight, shall we? (คืนนี้เราไปดูหนังกันไหม) : Let's go to the cinema tonight, shall we? (มาทานอาหารเย็นด้วยกันไหม)"},{"n":66,"q":"_________ is your hometown like, Lisa?","o":["What","Which","Where","Whose"],"a":1,"e":"เป็นประโยคคำถาม Wh - questions 1. Who/What/Which + (คำนาม) + กริยา ตัวอย่างประโยค : Who saw him? (ใครเห็นเขา?) : What happened to you last night? (เมื่อคืนเกิดอะไรขึ้นกับคุณ? : Which bus goes to town? (รถบัสสายไหนไปเมือง?) 2. Whom/What/Which ใช้เป็นกรรมของประโยค + (คำนาม) + กริยาช่วย + ประธาน + กริยา ตัวอย่างประโยค : What did he buy yesterday? (เมื่อวานเขาซื้ออะไร?) : Which job have you applied for? (คุณได้สมัครงานอะไรมา?) 3. Whose + คำนามเสมอ ส่วน When, Why, Where ใช้ตามแบบที่ 2 ตัวอย่างประโยค : Whose book are you reading? - When will you do? (คุณกำลังอ่านหนังสือของใครอยู่? - คุณจะอ่านเมื่อไหร่?) : Why did he go home? - Where do you come from? (เขากลับบ้านทำไม? - คุณมาจากไหน?) How + adj. ใช้ถามเกี่ยวกับระดับต่าง ๆ เช่น : How old is she? (เธออายุเท่าไหร่?)"},{"n":67,"q":"Sue bought me _________ blouse from Thailand.","o":["beautiful a pink silk","silk beautiful a pink","pink silk a beautiful","a beautiful pink silk"],"a":4,"e":"ในกรณีที่ใช้คำคุณศัพท์ (Adjective) หลายตัวหน้าคำนามที่ต้องการขยายจะมีการเรียงลำดับคำคุณศัพท์ก่อนหลังดังนี้ คำนำหน้านาม - ลักษณะ - ขนาด - รูปร่าง - อายุ - สี - แหล่งที่มา ~ วัสดุ - นามขยาย - นามหลัก ตัวอย่างประโยค : My grandmother lives in the little blue house on the corner. (คุณยายของฉันอาศัยอยู่ในบ้านหลังเล็กตรงหัวมุม) : It was made of a strange, green, metallic material. (มันทำจากวัสดุโลหะสีเขียวแปลกตา) : My younger brother loves that big old green antique car. (น้องชายของฉันขอบรถโบราณสีเขียวคันใหญ่คันนั้น) : She is a beautiful, tall, thin, young, black-haired, Thai woman. (เธอเป็นหญิงสาวชาวไทยผมดำ สวย สูง ผอม)"},{"n":68,"q":"Henry ate tons of junk food, ________ now he feels sick.","o":["therefore","consequently","so","thus"],"a":3,"e":"การใช้คำเชื่อมในประโยคความรวม (Compound Sentence) ความหมาย ใช้เครื่องหมาย , ________ ใช้เครื่องหมาย ; ________ 1. แสดงความคล้อยตามกัน and, nor moreover, furthermore, also, meanwhile, besides, similarly 2. แสดงความขัดแย้ง but, yet, or however, instead, otherwise, nevertheless, indeed, still 3. แสดงผลหรือสรุปความ so accordingly, finally, thus, consequently, therefore 4. แสดงเหตุ (เพราะ) for - ใช้ so เป็นคำเชื่อม มีความหมายว่า \"ดังนั้น\" ตามด้วยประธานและคำกริยาหน้า so ต้องมีเครื่องหมาย Comma (,) เสมอ"},{"n":69,"q":"If you add 3 to 5, you _________ 8.","o":["get","got","have gotten","are getting"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ If S + V1 , S + V1"},{"n":70,"q":"________ a lack of exercise, weight gain and health issues arose.","o":["Because","Through","As a result","Due to"],"a":4,"e":"คำเชื่อม due to / owing to มีความหมายว่า “เนื่องจากเพราะว่า ” ตามด้วยคำนามหรือกลุ่มคำนาม ตัวอย่างประโยค : My daughter didn't go to school yesterday due to a fever. (ลูกสาวผมไม่ได้ไปโรงเรียนเมื่อวานนี้เนื่องจากเป็นไข้) : We have cancelled the trip owing to the heavy storm. (พวกเรายกเลิกทริปเพราะมีพายุอย่างหนัก)"},{"n":71,"q":"________ you cleaned the house, you could have gone to the movies.","o":["Did","Are","Had","Have"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ Had S + V3 , S + would / could have V3"},{"n":72,"q":"________ you brush your teeth, you get cavities.","o":["If","Unless","Whether","When"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 37. ประกอบ ใช้ unless เป็นคำเชื่อมในประโยค Conditional Sentences มีความหมายว่า \"ถ้า...ไม่\" เช่นเดียวกับ if...…not ตัวอย่างประโยค : If you don't pay now, we can't guarantee you a ticket. = Unless you pay now, we can't guarantee you a ticket. (ถ้าคุณไม่จ่ายเงินตอนนี้ พวกเราไม่รับประกันว่าคุณจะได้ตั๋ว) : She would be here by now if she wasn't stuck in traffic. = She would be here by now unless she was stuck in traffic. (เธอคงมาถึงแล้ว ถ้าเธอไม่ติดอยู่ในสภาพการจราจร)"},{"n":73,"q":"A : ______________. B : Not yet. She’s graduating next semester, I believe.","o":["What has Sue been doing in LA?","Will Sue finish it in the future?","Is Sue back to her post?","Has Sue graduated yet?"],"a":4,"e":"ใช้ yet มีความหมายว่า \"ยัง\" แสดงเหตุการณ์หรือการกระทำที่คาดว่าจะเกิดขึ้นแต่ยังไม่เกิดจนกระหังขณะที่พูด มักจะใช้กับ Present Perfect Tense ในประโยคคำถามและประโยคปฏิเสธ และวางไว้ท้ายประโยค ส่วนคำว่า not yet ใช้ ในการตอบคำถาม มีความหมายว่า \"ยัง หรือ ยังไม่ได้ทำ\" A : __________________. B : ยังไม่ค่ะ เทอมหน้าเธอน่าจะเรียนจบค่ะ (1) ซูทำอะไรอยู่ที่แอลเอ? (2) ซูจะเรียนจบในอนาคตไหม? (3) ซูกลับมาทำงานแล้วหรือยัง? (4) ซูเรียนจบหรือยัง?"},{"n":74,"q":"Alex _________ in a motorcycle accident last night.","o":["to injure","injured","was injured","had injured"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 6. และ 46. ประกอบ ใช้รูป passive voice (was/were + V3) ข้อนี้เป็นอดีตเพราะมี last night จึงตอบ was injured (ได้รับบาดเจ็บ) ใน รูปของ was + V3 หลังประธาน"},{"n":75,"q":"Doug had his hair ________ by a professional barber last week.","o":["cut","to cut","cuts","cutting"],"a":1,"e":"เป็นเรื่องของ has/have/had Has/have/had + คน + V1 (ตามด้วยคน ตอบ V1) S + have + something + V3 ( have + สิ่งของ + V3) ข้อนี้ hair (ผม) ไม่ใช่คน ใช้ V3 คือ กริยาตัวนี้ใช้รูปเดิม cut cut cut ตอบ cut ได้เลย"},{"n":76,"q":"Anita is trying to get her work _________ before leaving the office.","o":["do","doing","did","done"],"a":4,"e":"get + something + V3 ข้อนี้ her work (งานของเธอ) เป็นสิ่งของ ใช้ V3 คือ do (ช่อง 1), did (ช่อง 2), และ done (ช่อง 3) จึงตอบ done"},{"n":77,"q":"A : _________________. B : I love it because there’re many things to do in the city.","o":["Don’t you like Jim?","Do you like things here?","How do you like living in a big city?","You like the countryside, don’t you?"],"a":3,"e":"มีคำว่า because (เพราะ...) สังเกตดูว่า ตัวเลือก 1,2 และ 4 เป็นรูปแบบการถาม Yes/No question ถ้าถาม Don’t you, Do you like หรือลงท้าย don’t you จะตอบเป็น Yes หรือ No ก่อน ดังนั้นข้อนี้จึงตอบ 3"},{"n":78,"q":"The Indian bride wore ________ on her wedding day.","o":["red elegant her sari","her elegant red sari","elegant sari her red","sari her red elegant"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 67. ประกอบ การเรียงคุณศัพท์จะคาดเดาได้ว่า คำนำหน้าคำนาม คือ her ขึ้นก่อน และคำที่อยู่หลังสุดต้องเป็นคำนามหลัก เพราะคำนำหน้านาม + คุณศัพท์ + คำนาม เสมอ จึงตอบข้อ 2."},{"n":79,"q":"A : ______________. B : No, there are only three of us: my parents and I.","o":["Do you have a big family?","Have you been living with your parents?","How many are there in your family?","What qualities do you value?"],"a":1,"e":"B ตอบ No, คือการตอบ Yes/No แสดงว่าเป็นการถามแบบ Yes/No Question นั่น คือ ยกกริยาไว้หน้าประธานเป็น การถามให้ตอบ Yes/No ถ้าถามแบบ How many? What....When...Where..... Why... เป็นการตอบรายละเอียด ดังนั้น Do you have……? จะต้องตอบเป็น Yes/No"},{"n":80,"q":"A: ________________. B: Twice a week.","o":["When did you do your laundry?","How often do you play sports?","Have you eaten out lately?","What skill would you like to master?"],"a":2,"e":"Twice a week (สัปดาห์ละสองครั้ง) แสดงว่าถามเป็นความถี่ How often...? (บ่อยแค่ไหน) ถ้าถาม When จะตอบเป็นเวลา"},{"n":81,"q":"Michael prefers to ________by train because it’s faster than driving.","o":["bother","negotiate","promote","commute"],"a":4,"e":"ไมเคิลชอบ ________ โดยรถไฟเพราะเร็วกว่าการขับรถ (1) รบกวน (2) เจรจา (3) ส่งเสริม (4) เดินทาง"},{"n":82,"q":"Siripha is ___________ in English and Spanish.","o":["fluent","diligent","brave","compassionate"],"a":1,"e":"สิริภา ________ ในภาษาอังกฤษและภาษาสเปน (1) คล่องแคล่ว (2) ขยัน (3) กล้าหาญ (4) มีเมตตา"},{"n":83,"q":"The ________ plan was to have the eve
